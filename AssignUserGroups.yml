# Archivo: AssignUserGroups.yml

trigger: none

parameters:
  - name: userEmail
    displayName: 'User Email'
    type: string
    default: 'user@example.com'

  - name: group_Contributors
    displayName: 'Add to group: Contributors'
    type: boolean
    default: false

  - name: group_Readers
    displayName: 'Add to group: Readers'
    type: boolean
    default: false

  - name: group_ProjectAdmins
    displayName: 'Add to group: Project Administrators'
    type: boolean
    default: false

variables:
  azureDevOpsOrg: 'https://dev.azure.com/YOUR_ORG'
  project: 'YOUR_PROJECT'

stages:
  - stage: AssignUserToGroups
    jobs:
      - job: Assign
        displayName: 'Assign user to selected groups'
        pool:
          vmImage: 'windows-latest'

        steps:
          - checkout: none

          - task: PowerShell@2
            name: AssignToGroups
            displayName: 'Assign user to groups'
            inputs:
              targetType: inline
              script: |
                az devops configure --defaults organization='$(azureDevOpsOrg)' project='$(project)'

                $userEmail = '${{ parameters.userEmail }}'

                # Get user descriptor
                Write-Host "Fetching descriptor for user $userEmail..."
                $userDescriptor = az devops user show --user $userEmail --query "subjectDescriptor" -o tsv

                if (-not $userDescriptor) {
                  Write-Error "Cannot find user descriptor. Ensure the user exists."
                  exit 1
                }

                function AddUserToGroup($groupName) {
                  Write-Host "Processing group: $groupName"
                  $groupDescriptor = az devops security group list --query "graphGroups[?displayName=='$groupName'].descriptor" -o tsv

                  if (-not $groupDescriptor) {
                    Write-Error "Group $groupName not found."
                    return
                  }

                  Write-Host "Adding $userEmail to group $groupName..."
                  az devops security group membership add --group-id $groupDescriptor --member-id $userDescriptor
                }

                if (${{ parameters.group_Contributors }}) {
                  AddUserToGroup "Contributors"
                }

                if (${{ parameters.group_Readers }}) {
                  AddUserToGroup "Readers"
                }

                if (${{ parameters.group_ProjectAdmins }}) {
                  AddUserToGroup "Project Administrators"
                }
