
################## Import RDS ##################

cd $(Build.SourcesDirectory)/iac-terragrunt/invictus/initial-infrastructure/aws-service-rds/aws-service-rds
terragrunt init -reconfigure
terragrunt import aws_db_subnet_group.subnet_group vpc-invictus-develop-db-subnet-group
terragrunt import aws_rds_cluster.rds invictus-db
terragrunt import 'aws_rds_cluster_instance.rds_cluster_instances["0"]' invictus-instance-db
terragrunt import 'aws_rds_cluster_instance.rds_cluster_instances["1"]' invictus-instance-db-reader
terragrunt state list -no-color
terragrunt plan --all --non-interactive -no-color
terragrunt apply --all --non-interactive -no-color


################## Import Role ##################

terragrunt init -reconfigure
terragrunt import aws_iam_role.role SchedulerTask
terragrunt import 'aws_iam_role_policy.policy[0]' SchedulerTask:SchedulerTask
terragrunt plan --all --non-interactive --no-color

