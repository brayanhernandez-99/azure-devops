jobs:
  - job: "commit_tag_version"
    dependsOn:
      - "build_flutter"
    condition: in(dependencies.build_flutter.result, 'Succeeded', 'SucceededWithIssues')

    ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/develop') }}:
      displayName: "Commit and Tag Version Develop"
    ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/staging') }}:
      displayName: "Commit and Tag Version Staging"
    ${{ if and(or(in(variables['Build.SourceBranchName'], 'master'), startsWith(variables['Build.SourceBranch'], 'refs/tags/')), eq(parameters.redes, 'antioquia')) }}:
      displayName: "Commit and Tag Version Master"
    pool:
      name: Azure Pipelines
      vmImage: "ubuntu-22.04"

    steps:
      - checkout: self
        fetchDepth: 0
        persistCredentials: true

      - script: |
          echo "📌 Verificando si feature está actualizada con master y si hay cambios relevantes..."

          git fetch origin master

          # Encuentra el punto de bifurcación (base común)
          MERGE_BASE=$(git merge-base HEAD origin/master)

          # Verifica si la rama está actualizada
          if [ "$MERGE_BASE" = "$(git rev-parse origin/master)" ]; then
            echo "✅ La rama feature está actualizada con master."
          else
            echo "⚠️ La rama feature NO contiene todos los commits de master. Verificando cambios relevantes en master..."

            # Obtén los archivos cambiados en master desde el punto de bifurcación
            CHANGED_FILES=$(git diff --name-only "$MERGE_BASE".."origin/master")

            echo "🔍 Archivos nuevos en master desde el punto de bifurcación:"
            echo "$CHANGED_FILES"

            # Filtrar cambios relevantes (ignorar carpeta pipeline/)
            RELEVANT_CHANGES=$(echo "$CHANGED_FILES" | grep -vE '^pipeline/')

            if [[ -z "$RELEVANT_CHANGES" ]]; then
              echo "ℹ️ Solo hay cambios en archivos ignorados (pipeline/). Continuando..."
            else
              echo "❌ Cambios relevantes detectados en master y no están integrados. Debes actualizar tu rama."
              exit 1
            fi
          fi
        displayName: "Validar que feature esté actualizada y sin cambios relevantes ignorados"
        condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/heads/feature/'))

      - script: |
          REPO_ID=$(curl -s -u ":$AZURE_DEVOPS_CLI_PAT" \
            "https://dev.azure.com/ux-technology/Invictus/_apis/git/repositories?api-version=5.0" \
            | jq -r '.value[] | select(.name == "$(Build.Repository.Name)").id')
          echo "id del repositorio $(Build.Repository.Name) = $REPO_ID"
          echo "##vso[task.setvariable variable=repoID]$REPO_ID"
        env:
          AZURE_DEVOPS_CLI_PAT: $(PAT-AZ)
        displayName: "ID Repositorio"

      - script: |
          echo "id del repositorio $(Build.Repository.Name) = $(repoID)"

          CURRENT_BRANCH=$(echo $(Build.SourceBranch))

          if [[ "$CURRENT_BRANCH" == refs/heads/feature/* ]]; then
            CURRENT_BRANCH_PR=refs/heads/feature
          fi

          if [[ "$CURRENT_BRANCH" =~ ^refs/heads/(develop|staging|master)$ ]]; then
            CURRENT_BRANCH_PR=$(echo $(Build.SourceBranch))
          fi

          curl -s -u ":$AZURE_DEVOPS_CLI_PAT" \
            "https://dev.azure.com/ux-technology/Invictus/_apis/git/repositories/$(repoID)/pullrequests?searchCriteria.status=completed&searchCriteria.targetRefName=$CURRENT_BRANCH_PR&api-version=5.0" \
            | jq '.value[0]'

          PR_ID=$(curl -s -u ":$AZURE_DEVOPS_CLI_PAT" \
            "https://dev.azure.com/ux-technology/Invictus/_apis/git/repositories/$(repoID)/pullrequests?searchCriteria.status=completed&searchCriteria.targetRefName=$CURRENT_BRANCH_PR&api-version=5.0" \
            | jq '.value[0].pullRequestId')

          echo "id del pr $PR_ID"
          echo "##vso[task.setvariable variable=ultimoPR]$PR_ID"

          mkdir -p $(Build.ArtifactStagingDirectory)/idpr
          touch $(Build.ArtifactStagingDirectory)/idpr/idpr.json
          echo "{\"idpr\": \"$PR_ID\" }" > $(Build.ArtifactStagingDirectory)/idpr/idpr.json
        env:
          AZURE_DEVOPS_CLI_PAT: $(PAT-AZ)
        displayName: "ID Pull Request"
        condition: not(startsWith(variables['Build.SourceBranch'], 'refs/heads/feature/'))

      - script: |
          echo "Pull Request ID recuperado: $(ultimoPR)"
          echo "id del repositorio $(Build.Repository.Name) = $(repoID)" 
          COMMITS=$(curl -s -u ":$AZURE_DEVOPS_CLI_PAT" \
            "https://dev.azure.com/ux-technology/Invictus/_apis/git/repositories/$(repoID)/pullRequests/$(ultimoPR)/commits?api-version=7.0" \
            | jq -r '.value[].comment' | grep -E 'feat:|fix:|!')
          SAFE_COMMITS=$(echo "$COMMITS" | tr '\n' '|')
          echo $SAFE_COMMITS
          echo "##vso[task.setvariable variable=filteredCommits]$SAFE_COMMITS"
        env:
          AZURE_DEVOPS_CLI_PAT: $(PAT-AZ)
        displayName: "Detalles Commits Pull Request"
        condition: not(startsWith(variables['Build.SourceBranch'], 'refs/heads/feature/'))

      - script: |
          CURRENT_BRANCH=$(echo $(Build.SourceBranch))
          echo $CURRENT_BRANCH


          if [[ "$CURRENT_BRANCH" =~ ^refs/heads/(develop|master|staging|feature/.+)$ ]]; then

            if [[ "$CURRENT_BRANCH" == refs/heads/feature/* ]]; then
              clean_branch=develop
              echo $clean_branch
            fi

            if [[ "$CURRENT_BRANCH" =~ ^refs/heads/(develop|staging|master)$ ]]; then
              raw_branch=$(Build.SourceBranch)
              clean_branch=$(echo "$raw_branch" | sed 's#refs/heads/##')
            fi

            if [[ "$CURRENT_BRANCH" == refs/heads/feature/* ]]; then
              BASE=$(git merge-base HEAD origin/master)
              COMMITS=$(git log --pretty=format:"%s" $BASE..HEAD | grep -vi "Auto-generated pipeline config")
              echo "Commits de la rama feature"
              echo $COMMITS
            fi

            if [[ "$CURRENT_BRANCH" == refs/heads/develop ]]; then
              COMMITS=$(echo "$(filteredCommits)" | tr '|' '\n')
              echo "Commits de la rama feature a develop:"
              echo $COMMITS
            fi

            if [[ "$CURRENT_BRANCH" == refs/heads/staging ]]; then
              COMMITS=$(echo "$(filteredCommits)" | tr '|' '\n')
              echo "Commits de la rama pre/staging a staging:"
              echo $COMMITS
            fi

            if [[ "$CURRENT_BRANCH" == refs/heads/master ]]; then
              COMMITS=$(echo "$(filteredCommits)" | tr '|' '\n')
              echo "Commits de la rama staging a master:"
              echo $COMMITS
            fi

            IS_MAJOR=0
            IS_MINOR=0
            IS_PATCH=0

            while read -r COMMIT; do
              if [[ "$COMMIT" == *"!"* ]]; then
                IS_MAJOR=1
              elif [[ "$COMMIT" == feat:* ]]; then
                IS_MINOR=1
              elif [[ "$COMMIT" == fix:* ]]; then
                IS_PATCH=1
              fi
            done <<< "$COMMITS"

            if [[ $IS_MAJOR -eq 1 ]]; then
              RELEASE_TYPE="major"
            elif [[ $IS_MINOR -eq 1 ]]; then
              RELEASE_TYPE="minor"
            elif [[ $IS_PATCH -eq 1 ]]; then
              RELEASE_TYPE="patch"
            else
              RELEASE_TYPE="patch" 
            fi
            echo $RELEASE_TYPE

            bump_version() {
              IFS='.' read -r MAJOR MINOR PATCH <<< "$1"
              case "$2" in
                major) echo "$((MAJOR + 1)).0.0" ;;
                minor) echo "$MAJOR.$((MINOR + 1)).0" ;;
                patch) echo "$MAJOR.$MINOR.$((PATCH + 1))" ;;
              esac
            }
            version_gt() {
              # returns 0 (true) if $1 > $2
              [ "$(printf '%s\n' "$1" "$2" | sort -V | head -n1)" != "$1" ]
            }

            if [[ "$CURRENT_BRANCH" =~ ^refs/heads/(develop|staging|feature/.+)$ ]]; then
              git checkout version/$clean_branch
              VERSION_ACTUAL=$(jq -r .VERSION  env.json)
              BASE_VERSION_BRANCH=$(echo "$VERSION_ACTUAL" | sed -E "s/-${clean_branch}\.[0-9]+//")
              echo "versión base actual: $BASE_VERSION_BRANCH"

              CURRENT_PRERELEASE=$(echo "$VERSION_ACTUAL" | sed -n "s/.*-${clean_branch}\.\([0-9]\+\)/\1/p")

              git checkout version/master
              VERSION_ACTUAL_MASTER=$(jq -r .VERSION env.json)
              echo "versión base master: $VERSION_ACTUAL_MASTER"

              git checkout version/$clean_branch

              if [[ "$BASE_VERSION_BRANCH" == "$VERSION_ACTUAL_MASTER" ]]; then
                # Las versiones base son iguales, calcular nueva base y resetear prerelease 
                NEXT_BASE_VERSION=$(bump_version "$VERSION_ACTUAL_MASTER" "$RELEASE_TYPE")
                NEXT_VERSION="$NEXT_BASE_VERSION-$clean_branch.0"
              elif version_gt "$BASE_VERSION_BRANCH" "$VERSION_ACTUAL_MASTER"; then
                # Base ya es mayor que master, también incrementa el prerelease
                NEXT_VERSION="$BASE_VERSION_BRANCH-$clean_branch.$((CURRENT_PRERELEASE + 1))"
              elif version_gt "$VERSION_ACTUAL_MASTER" "$BASE_VERSION_BRANCH"; then
                # La base actual es menor que la de master, subir versión base y resetear prerelease
                NEXT_BASE_VERSION=$(bump_version "$VERSION_ACTUAL_MASTER" "$RELEASE_TYPE")
                NEXT_VERSION="$NEXT_BASE_VERSION-$clean_branch.0"
              else
                # Las bases son diferentes, solo incrementa el prerelease
                NEXT_VERSION="$BASE_VERSION_BRANCH-$clean_branch.$((CURRENT_PRERELEASE + 1))"
              fi
              echo "📌 Anterior versión : $VERSION_ACTUAL"
              echo "🚀 Próxima versión : $NEXT_VERSION"
            fi

            if [[ "$CURRENT_BRANCH" == refs/heads/master ]]; then
              git checkout version/$clean_branch
              VERSION_ACTUAL_MASTER=$(jq -r .VERSION env.json)

              NEXT_BASE_VERSION=$(bump_version "$VERSION_ACTUAL_MASTER" "$RELEASE_TYPE")
              NEXT_VERSION="$NEXT_BASE_VERSION"
              echo "📌 Anterior versión : $VERSION_ACTUAL_MASTER"
              echo "🚀 Próxima versión : $NEXT_VERSION"
            fi

            mkdir -p $(Build.ArtifactStagingDirectory)/version-apk
            touch $(Build.ArtifactStagingDirectory)/version-apk/version-apk.json
            echo "{ \"ms\": \"apk\", \"version\": \"$NEXT_VERSION\" }" > $(Build.ArtifactStagingDirectory)/version-apk/version-apk.json

            echo "##vso[task.setvariable variable=cleanNEXT_VERSION]$NEXT_VERSION"
          fi
        displayName: Detect next version
        name: SemanticJob

      - script: |
          CURRENT_BRANCH=$(echo $(Build.SourceBranch))
          echo $CURRENT_BRANCH

          if [[ "$CURRENT_BRANCH" =~ ^refs/heads/(develop|master|staging|feature/.+)$ ]]; then

            if [[ "$CURRENT_BRANCH" == refs/heads/feature/* ]]; then
              clean_branch=develop
              echo $clean_branch
            fi

            if [[ "$CURRENT_BRANCH" =~ ^refs/heads/(develop|staging|master)$ ]]; then
              raw_branch=$(Build.SourceBranch)
              clean_branch=$(echo "$raw_branch" | sed 's#refs/heads/##')
            fi

            if [[ "$CURRENT_BRANCH" =~ ^refs/heads/(develop|staging|feature/.+)$ ]]; then
              git checkout version/$clean_branch
              VERSION_ACTUAL=$(grep '^version:' pubspec.yaml | cut -d ' ' -f2)
              echo "versión base actual: $VERSION_ACTUAL"

              git checkout version/master
              VERSION_ACTUAL_MASTER=$(grep '^version:' pubspec.yaml | cut -d ' ' -f2)
              echo "versión base master: $VERSION_ACTUAL_MASTER"

              git checkout version/$clean_branch

              BUILD_NUMBER_VERSION_ACTUAL="${VERSION_ACTUAL#*+}"
              BUILD_NUMBER_VERSION_MASTER="${VERSION_ACTUAL_MASTER#*+}"

              echo "Actual: $BUILD_NUMBER_VERSION_ACTUAL"
              echo "Master: $BUILD_NUMBER_VERSION_MASTER"

              if [[ $BUILD_NUMBER_VERSION_ACTUAL == $BUILD_NUMBER_VERSION_MASTER ]]; then 
                NEW_BUILD_NUMBER=$((BUILD_NUMBER_VERSION_ACTUAL + 1))
              elif [[ $BUILD_NUMBER_VERSION_ACTUAL > $BUILD_NUMBER_VERSION_MASTER ]]; then 
                NEW_BUILD_NUMBER=$BUILD_NUMBER_VERSION_ACTUAL
              elif [[ $BUILD_NUMBER_VERSION_ACTUAL < $BUILD_NUMBER_VERSION_MASTER ]]; then 
                NEW_BUILD_NUMBER=$((BUILD_NUMBER_VERSION_MASTER + 1))
              fi
              echo "Nuevo Build: +$NEW_BUILD_NUMBER"
            fi

            if [[ "$CURRENT_BRANCH" == refs/heads/master ]]; then
              git checkout version/$clean_branch
              VERSION_ACTUAL_MASTER=$(grep '^version:' pubspec.yaml | cut -d ' ' -f2)
              BUILD_NUMBER_VERSION_MASTER="${VERSION_ACTUAL_MASTER#*+}"
              NEW_BUILD_NUMBER=$((BUILD_NUMBER_VERSION_MASTER + 1))

              echo "📌 Anterior versión : +$BUILD_NUMBER_VERSION_MASTER"
              echo "🚀 Próxima versión : +$NEW_BUILD_NUMBER"
            fi

            mkdir -p $(Build.ArtifactStagingDirectory)/version-pubspec-apk
            touch $(Build.ArtifactStagingDirectory)/version-pubspec-apk/version-pubspec-apk.json
            echo "{ \"ms\": \"pubspec-apk\", \"version\": \"$NEW_BUILD_NUMBER\" }" > $(Build.ArtifactStagingDirectory)/version-pubspec-apk/version-pubspec-apk.json

            echo "##vso[task.setvariable variable=NEXT_VERSION_PUB]$NEW_BUILD_NUMBER"
          fi
        displayName: Detect next version pubspec
        name: SemanticJobPubspec

      - script: |
          raw_branch=$(Build.SourceBranch)
          clean_branch=$(echo "$raw_branch" | sed 's#refs/heads/##')

          git config user.name "pipeline"
          git config user.email "pipelineUX@ux.technology"

          git checkout version/$clean_branch

          echo "🔧 Actualizando versión $(cleanNEXT_VERSION) en el pubspec.yaml"
          sed -i "s/^version: .*/version: $(cleanNEXT_VERSION)+$(NEXT_VERSION_PUB)/" pubspec.yaml

          cat pubspec.yaml

          jq --arg version "$(cleanNEXT_VERSION)"  '.VERSION = $version' env.json > tmp.json && mv tmp.json env.json

          echo " "
          cat env.json

          git add env.json pubspec.yaml
          git commit -m "chore Flutter: bump version to $(cleanNEXT_VERSION)"
          git push origin version/$clean_branch

        displayName: "Actualizar versión y push "

  - ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/master') }}:
      - job: "create_publish_versioning"
        displayName: "Create and Publish Versioning"
        dependsOn: "commit_tag_version"
        pool:
          name: Azure Pipelines
          vmImage: "ubuntu-22.04"
        steps:
          - task: git-tag-on-release-task@9
            displayName: "Create and Publish Versioning Tag"
            continueOnError: true
