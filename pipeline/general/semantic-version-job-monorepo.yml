jobs:
- job: 'semantic_version'
  displayName: 'Semantic Version'
  pool:
    name: 'Azure Pipelines'
    VmImage: ubuntu-22.04
  steps:
    - checkout: self
      fetchDepth: 0
  
    - script: |
        cd $(Build.SourcesDirectory)/apps
        CHANGED_MS=$(git diff --name-only HEAD~1 HEAD | grep "^apps/" | cut -d '/' -f2 | sort | uniq)
        CHANGED_MS_LIST=$(echo "$CHANGED_MS" | jq -R . | jq -s .)
        echo $CHANGED_MS_LIST
        echo "##vso[task.setvariable variable=changedMs]$CHANGED_MS_LIST"
        echo "Microservicios detectados: $CHANGED_MS_LIST"
      name: DetectChangedMS

