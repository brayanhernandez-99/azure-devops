jobs:
- job: 'semantic_version'
  displayName: 'Semantic Version'
  pool:
    name: 'Azure Pipelines'
    VmImage: ubuntu-22.04
  steps:
    - checkout: self
      fetchDepth: 0

    - script: |
        echo $(DetectChangedMS.changedMs)
        echo ${{ parameters.apps }}
        CHANGED_MS_LIST=$(echo "$(DetectChangedMS.changedMs)" | xargs -n1 | jq -R . | jq -s .)
        echo $CHANGED_MS_LIST
        for ms in $(echo "$CHANGED_MS_LIST" | jq -r '.[]'); do
          echo "Procesando microservicio: $ms"
          VERSION=$(jq -r '.version' "$(Build.SourcesDirectory)/apps/$ms/package.json")
          echo "Versión de $ms: $VERSION"
          echo "##vso[task.setvariable variable=${ms}_version]$VERSION"
        done
      displayName: "Obtener versiones de los MS cambiados"