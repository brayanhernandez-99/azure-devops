jobs:
- job: 'semantic_version'
  displayName: 'Semantic Version'
  pool:
    name: 'Azure Pipelines'
    VmImage: ubuntu-22.04
  steps:
    - checkout: self
      fetchDepth: 0
  
    - script: |
        ls 
        cd $(Build.SourcesDirectory)/apps
        CHANGED_MS=$(git diff --name-only HEAD~1 HEAD | grep "^apps/" | cut -d '/' -f2 | sort | uniq | xargs)
        echo $CHANGED_MS
        echo "##vso[task.setvariable variable=changedMs]$CHANGED_MS"
        echo "Microservicios detectados: $CHANGED_MS"
      name: DetectChangedMS

    - script: |
        echo $(changedMs)
      displayName: "Obtener versiones de los MS cambiados"
            
