
jobs:
- job: 'semantic_version'
  displayName: 'Semantic Version'
  pool:
    name: 'Azure Pipelines'
    VmImage: ubuntu-22.04

  strategy:
      matrix:
        ${{ each ms in parameters.apps }}:
          ${{ ms }}:
            msName: ${{ ms }}
  steps:
    - checkout: self
      fetchDepth: 0
      persistCredentials: true

    - task: NodeTool@0
      inputs:
        versionSpec: "20.x"
        checkLatest: true

    - script: |
        npm install --no-save @commitlint/cli@latest @commitlint/config-conventional@latest conventional-changelog-conventionalcommits@latest
        ls -la
      displayName: Install commitlint

    - script: |
        cp $(System.DefaultWorkingDirectory)/apps/$(msName)/.commitlintrc.json $(System.DefaultWorkingDirectory)
        git fetch origin develop
        npx commitlint --from origin/develop --to HEAD --verbose
      condition: ne(variables['Build.Reason'], 'PullRequest')
      displayName: Validate current commit (last commit) with commitlint
      continueOnError: true

    - script: |
        echo "Simulando próximo versionado..."
        NEXT_VERSION=$(npx commit-and-tag-version --dry-run | grep "bumping version" | sed -E 's/.*to ([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
        echo "Versión detectada: $NEXT_VERSION"
        echo "##vso[task.setvariable variable=NextVersion]$NEXT_VERSION"
      displayName: Detect next version

    