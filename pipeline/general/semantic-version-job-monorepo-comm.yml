jobs:
- job: 'semantic_version'
  displayName: 'Semantic Version'
  pool:
    name: 'Azure Pipelines'
    VmImage: ubuntu-22.04
  
  variables:
  - template: ../variables/groups-transversal-variables.yml

  strategy:
      matrix:
        ${{ each ms in parameters.apps }}:
          ${{ ms }}:
            msName: ${{ ms }}
  steps:
    - checkout: self
      fetchDepth: 0
      persistCredentials: true

    - task: NodeTool@0
      inputs:
        versionSpec: "20.x"
        checkLatest: true

    - script: |
        npm install --no-save @commitlint/cli@latest @commitlint/config-conventional@latest conventional-changelog-conventionalcommits@latest commit-and-tag-version@^12.4.4 conventional-changelog-cli@latest
        ls -la
      displayName: Install commitlint

    # - script: |
    #     cp $(System.DefaultWorkingDirectory)/apps/$(msName)/.commitlintrc.js $(System.DefaultWorkingDirectory)
    #     npx commitlint --from origin/master --to HEAD --verbose
    #     # npx commitlint --last --verbose
    #   condition: ne(variables['Build.Reason'], 'PullRequest')
    #   displayName: Validate current commit (last commit) with commitlint
    #   continueOnError: true
    
    - script: |
        REPO_ID=$(curl -s -u ":$AZURE_DEVOPS_CLI_PAT" \
          "https://dev.azure.com/ux-technology/Invictus/_apis/git/repositories?api-version=5.0" \
          | jq -r '.value[] | select(.name == "$(Build.Repository.Name)").id')
        echo "id del repositorio $(Build.Repository.Name) = $REPO_ID"
        echo "##vso[task.setvariable variable=repoID]$REPO_ID"
      env:
        AZURE_DEVOPS_CLI_PAT: $(PAT-AZ)
      displayName: 'ID Repositorio'
    
    - script: |
          echo "id del repositorio $(Build.Repository.Name) = $(repoID)" 
          curl -s -u ":$AZURE_DEVOPS_CLI_PAT" \
            "https://dev.azure.com/ux-technology/Invictus/_apis/git/repositories/$(repoID)/pullrequests?searchCriteria.status=completed&searchCriteria.targetRefName=$(Build.SourceBranch)&api-version=5.0" \
            | jq '.value[0]'

          PR_ID=$(curl -s -u ":$AZURE_DEVOPS_CLI_PAT" \
            "https://dev.azure.com/ux-technology/Invictus/_apis/git/repositories/$(repoID)/pullrequests?searchCriteria.status=completed&searchCriteria.targetRefName=$(Build.SourceBranch)&api-version=5.0" \
            | jq '.value[0].pullRequestId')
          
          echo "id del pr $PR_ID"
          echo "##vso[task.setvariable variable=ultimoPR]$PR_ID"
      env:
        AZURE_DEVOPS_CLI_PAT: $(PAT-AZ)
      displayName: 'ID Pull Request'

    - script: |
          echo "Pull Request ID recuperado: $(ultimoPR)"
          echo "id del repositorio $(Build.Repository.Name) = $(repoID)" 
          COMMITS=$(curl -s -u ":$AZURE_DEVOPS_CLI_PAT" \
            "https://dev.azure.com/ux-technology/Invictus/_apis/git/repositories/$(repoID)/pullRequests/$(ultimoPR)/commits?api-version=7.0" \
            | jq -r '.value[].comment' | grep -E 'feat:|fix:|!')
          SAFE_COMMITS=$(echo "$COMMITS" | tr '\n' '|')
          echo $SAFE_COMMITS
          echo "##vso[task.setvariable variable=filteredCommits]$SAFE_COMMITS"
      env:
        AZURE_DEVOPS_CLI_PAT: $(PAT-AZ)
      displayName: 'Detalles Commits Pull Request'

    - script: |
        cd $(System.DefaultWorkingDirectory)/apps/$(msName)
        CURRENT_BRANCH=$(echo $(Build.SourceBranch))
        echo $CURRENT_BRANCH

        if [[ "$CURRENT_BRANCH" == refs/heads/feature/* ]]; then
          BASE=$(git merge-base HEAD origin/master)
          COMMITS=$(git log --pretty=format:"%s" $BASE..HEAD | grep -vi "Auto-generated pipeline config")
          echo $COMMITS

          IS_MAJOR=0
          IS_MINOR=0
          IS_PATCH=0

          while read -r COMMIT; do
            if [[ "$COMMIT" == *"!"* ]]; then
              IS_MAJOR=1
            elif [[ "$COMMIT" == feat:* ]]; then
              IS_MINOR=1
            elif [[ "$COMMIT" == fix:* ]]; then
              IS_PATCH=1
            fi
          done <<< "$COMMITS"

          if [[ $IS_MAJOR -eq 1 ]]; then
            RELEASE_TYPE="major"
          elif [[ $IS_MINOR -eq 1 ]]; then
            RELEASE_TYPE="minor"
          elif [[ $IS_PATCH -eq 1 ]]; then
            RELEASE_TYPE="patch"
          else
            RELEASE_TYPE="patch"  # default si no se detecta nada
          fi
          echo $RELEASE_TYPE
          BUMP_OUTPUT=$(npx commit-and-tag-version --dry-run --prerelease develop --release-as $RELEASE_TYPE )
          # BUMP_OUTPUT=$(npx commit-and-tag-version --dry-run --from "$BASE" )
          echo "$BUMP_OUTPUT"
          echo "----------------------------------------"
          
          CURRENT_VERSION=$(echo "$BUMP_OUTPUT" | grep "bumping version" | sed -E 's/.*from ([0-9]+\.[0-9]+\.[0-9]+) to.*/\1/')
          NEXT_VERSION=$(echo "$BUMP_OUTPUT" | grep "bumping version" | sed -E 's/.*to ([0-9]+\.[0-9]+\.[0-9]+).*/\1/')

          echo "📌 Versión actual detectada: $CURRENT_VERSION"
          echo "🚀 Próxima versión para la rama develop: $NEXT_VERSION"
        fi

        if [[ "$CURRENT_BRANCH" == refs/heads/develop ]]; then
          COMMITS=$(echo "$(filteredCommits)" | tr '|' '\n')
          echo "Commits de la rama feature a develop:"
          echo $COMMITS

          IS_MAJOR=0
          IS_MINOR=0
          IS_PATCH=0

          while read -r COMMIT; do
            if [[ "$COMMIT" == *"!"* ]]; then
              IS_MAJOR=1
            elif [[ "$COMMIT" == feat:* ]]; then
              IS_MINOR=1
            elif [[ "$COMMIT" == fix:* ]]; then
              IS_PATCH=1
            fi
          done <<< "$COMMITS"

          if [[ $IS_MAJOR -eq 1 ]]; then
            RELEASE_TYPE="major"
          elif [[ $IS_MINOR -eq 1 ]]; then
            RELEASE_TYPE="minor"
          elif [[ $IS_PATCH -eq 1 ]]; then
            RELEASE_TYPE="patch"
          else
            RELEASE_TYPE="patch"  # default si no se detecta nada
          fi
          echo $RELEASE_TYPE

          BUMP_OUTPUT=$(npx commit-and-tag-version --prerelease develop --dry-run --release-as $RELEASE_TYPE)
          echo "$BUMP_OUTPUT"
          echo "----------------------------------------"
          
          CURRENT_VERSION=$(echo "$BUMP_OUTPUT" | grep "bumping version" | sed -E 's/.*from ([0-9]+\.[0-9]+\.[0-9]+) to.*/\1/')
          NEXT_VERSION=$(echo "$BUMP_OUTPUT" | grep -oE 'to [0-9]+\.[0-9]+\.[0-9]+-[a-zA-Z]+\.[0-9]+' | awk '{print $2}')

          echo "📌 Versión actual detectada: $CURRENT_VERSION"
          echo "🚀 Próxima versión para Develop: $NEXT_VERSION"

          mkdir -p $(Build.ArtifactStagingDirectory)/$(msName)
          touch $(Build.ArtifactStagingDirectory)/$(msName)/version.json
          echo "{ \"ms\": \"$(msName)\", \"version\": \"$NEXT_VERSION\" }" > $(Build.ArtifactStagingDirectory)/$(msName)/version.json
        fi

        if [[ "$CURRENT_BRANCH" == refs/heads/staging ]]; then
          BUMP_OUTPUT=$(npx commit-and-tag-version --prerelease staging --dry-run )
          echo "$BUMP_OUTPUT"
          echo "----------------------------------------"
          
          CURRENT_VERSION=$(echo "$BUMP_OUTPUT" | grep "bumping version" | sed -E 's/.*from ([0-9]+\.[0-9]+\.[0-9]+) to.*/\1/')
          NEXT_VERSION=$(echo "$BUMP_OUTPUT" | grep -oE 'to [0-9]+\.[0-9]+\.[0-9]+-[a-zA-Z]+\.[0-9]+' | awk '{print $2}')

          echo "📌 Versión actual detectada: $CURRENT_VERSION"
          echo "🚀 Próxima versión para la rama de staging: $NEXT_VERSION"

          mkdir -p $(Build.ArtifactStagingDirectory)/$(msName)
          touch $(Build.ArtifactStagingDirectory)/$(msName)/version.json
          echo "{ \"ms\": \"$(msName)\", \"version\": \"$NEXT_VERSION\" }" > $(Build.ArtifactStagingDirectory)/$(msName)/version.json
        fi

        if [[ "$CURRENT_BRANCH" == refs/heads/master ]]; then
          BUMP_OUTPUT=$(npx commit-and-tag-version --dry-run )
          echo "$BUMP_OUTPUT"
          echo "----------------------------------------"
          
          CURRENT_VERSION=$(echo "$BUMP_OUTPUT" | grep "bumping version" | sed -E 's/.*from ([0-9]+\.[0-9]+\.[0-9]+) to.*/\1/')
          NEXT_VERSION=$(echo "$BUMP_OUTPUT" | sed -nE 's/.*to ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p')

          echo "📌 Versión actual detectada: $CURRENT_VERSION"
          echo "🚀 Próxima versión para la rama de master: $NEXT_VERSION"

          mkdir -p $(Build.ArtifactStagingDirectory)/$(msName)
          touch $(Build.ArtifactStagingDirectory)/$(msName)/version.json
          echo "{ \"ms\": \"$(msName)\", \"version\": \"$NEXT_VERSION\" }" > $(Build.ArtifactStagingDirectory)/$(msName)/version.json

        fi

      displayName: Detect next version
      name: SemanticJob
    
    - task: PublishBuildArtifacts@1
      condition: not(startsWith(variables['Build.SourceBranch'], 'refs/heads/feature/'))
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'versions'
        publishLocation: 'Container'
      displayName: '📦 Publicar artifact de versiones por MS'


    