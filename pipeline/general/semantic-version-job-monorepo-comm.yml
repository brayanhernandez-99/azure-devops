
jobs:
- job: 'semantic_version'
  displayName: 'Semantic Version'
  pool:
    name: 'Azure Pipelines'
    VmImage: ubuntu-22.04

  strategy:
      matrix:
        ${{ each ms in parameters.apps }}:
          ${{ ms }}:
            msName: ${{ ms }}
  steps:
    - checkout: self
      fetchDepth: 0
      persistCredentials: true

    - task: NodeTool@0
      inputs:
        versionSpec: "20.x"
        checkLatest: true

    - script: |
        cd $(System.DefaultWorkingDirectory)/apps/$(msName)
        npm install --no-save conventional-changelog-conventionalcommits
        npm install --no-save @commitlint@latest @commitlint/config-conventional@latest
      displayName: Install commitlint

    - script: |
        npx commitlint --last --verbose --config $(System.DefaultWorkingDirectory)/apps/$(msName)/.commitlintrc.json
      condition: ne(variables['Build.Reason'], 'PullRequest')
      displayName: Validate current commit (last commit) with commitlint

    