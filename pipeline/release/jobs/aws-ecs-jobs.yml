
jobs:
    ${{ each ms in parameters.apps }}:
      - deployment: Deploy_${{ ms }}
        displayName: "Desplegar ${{ ms }}"
        environment: 'Deploy Developer' 
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  fetchDepth: 1

                - script: |
                      echo "Original msName: $(msName)"
                      cleanName=$(echo $(msName) | sed 's/microservice-//')
                      echo "Nombre limpio: $cleanName"
                      echo "##vso[task.setvariable variable=cleanMsName]$cleanName"
                  displayName: "deploy $(msName)"






