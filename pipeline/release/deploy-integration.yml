stages:
  - stage: "deploy_integration_${{ parameters.red }}"
    ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/develop') }}:
      displayName: "Deploy Integration Develop"
    ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/staging') }}:
      displayName: "Deploy Integration Staging"
    ${{ if or(eq(variables['Build.SourceBranchName'], 'master'), startsWith(variables['Build.SourceBranch'], 'refs/tags/')) }}:
      displayName: "Deploy Integration Master ${{ parameters.red }}"

    ${{ if eq(parameters.release, 'aws-ecs') }}:
      dependsOn:
        - "artifacts_managment"
      condition: in(dependencies.artifacts_managment.result, 'Succeeded', 'SucceededWithIssues')

    ${{ if eq(parameters.release, 'aws-s3') }}:
      dependsOn:
        - "build_developmet_${{ parameters.red }}"
      condition: in(dependencies.build_developmet_${{ parameters.red }}.result, 'Succeeded', 'SucceededWithIssues')

    pool:
      name: "Azure Pipelines"
      VmImage: Ubuntu-20.04

    variables:
      - template: ../variables/groups-transversal-variables.yml
        parameters:
          red: ${{ parameters.red }}

    jobs:
      - ${{ if or(startsWith(variables['Build.SourceBranch'], 'refs/tags/'), in(variables['Build.SourceBranch'], 'refs/heads/develop', 'refs/heads/staging', 'refs/heads/master')) }}:
          - ${{ if in(parameters.release, 'aws-ecs') }}:
              - template: jobs/aws-ecs-jobs.yml
                parameters:
                  release: ${{ parameters.release }}
                  apps: ${{ parameters.apps }}
                  red: ${{ parameters.red }}

      - ${{ if or(startsWith(variables['Build.SourceBranch'], 'refs/tags/'), in(variables['Build.SourceBranch'], 'refs/heads/develop', 'refs/heads/staging', 'refs/heads/master')) }}:
          - ${{ if in(parameters.release, 'aws-s3') }}:
              - template: jobs/aws-s3-jobs.yml
                parameters:
                  release: ${{ parameters.release }}
                  apps: ${{ parameters.apps }}
                  red: ${{ parameters.red }}

      - ${{ if and(or(in(variables['Build.SourceBranchName'], 'master'), startsWith(variables['Build.SourceBranch'], 'refs/tags/')), eq(parameters.red, 'antioquia')) }}:
          - template: ../general/commit-tag-changeload.yml
            parameters:
              apps: ${{ parameters.apps }}
              red: ${{ parameters.red }}
              release: ${{ parameters.release }}
