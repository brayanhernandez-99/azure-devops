stages:
- stage: 'artifacts_managment'
  displayName: 'Artifacts Managment'
  # dependsOn:
  #   - 'build_developmet'
  # condition: in(dependencies.build_developmet.result, 'Succeeded', 'SucceededWithIssues')

  variables:
  - template: ../variables/groups-transversal-variables.yml

  jobs:
  - ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/develop')}}:
    - job: 'publish_image_dev'
      displayName: 'Publish Docker Image Development Environment'
      pool:
        name: 'Azure Pipelines'
        VmImage: 'ubuntu-22.04'

      strategy:
        matrix:
          ${{ each ms in parameters.apps }}:
            ${{ ms }}:
              msName: ${{ ms }}

      steps:
        - checkout: self

        - checkout: git://DevOps-templates-UX/pipelines-templates@feature/Inicio-templates
          fetchDepth: 1

        - script: |
            echo "build dev docker images"
            ls -la 
            cp pipelines-templates/pipeline/docker/Dockerfile $(Build.Repository.Name)/apps/$(msName)
            cd $(Build.Repository.Name)/apps/$(msName)
            ls -la
        
        - task: Bash@3
          name: AuthCodeArtifact
          inputs:
            targetType: 'inline'
            script: |
              export CODEARTIFACT_AUTH_TOKEN=$(aws codeartifact get-authorization-token \
                --domain matrixtech-npm-repository \
                --domain-owner 861262569826 \
                --region us-east-1 \
                --query authorizationToken \
                --output text )
              npm config set //matrixtech-npm-repository-861262569826.d.codeartifact.us-east-1.amazonaws.com/npm/matrixtech-npm-repository/:_authToken=$CODEARTIFACT_AUTH_TOKEN
              npm config set registry https://matrixtech-npm-repository-861262569826.d.codeartifact.us-east-1.amazonaws.com/npm/matrixtech-npm-repository/
              aws sts get-caller-identity

              echo "//matrixtech-npm-repository-861262569826.d.codeartifact.us-east-1.amazonaws.com/npm/matrixtech-npm-repository/:_authToken=$CODEARTIFACT_AUTH_TOKEN" > apps/$(msName)/.npmrc
              echo "registry=https://matrixtech-npm-repository-861262569826.d.codeartifact.us-east-1.amazonaws.com/npm/matrixtech-npm-repository/" >> apps/$(msName)/.npmrc
          env:
            AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID_DEPLOY)
            AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY_DEPLOY)
            AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)
        
        - script: |
            echo "Logging in to ECR..."
            aws ecr get-login-password --region $AWS_DEFAULT_REGION | \
            docker login --username AWS --password-stdin $ACCOUNT_ID_DEPLOY.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
          displayName: 'Login to AWS ECR'
          env:
            AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID_DEPLOY)
            AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY_DEPLOY)
            AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)
        
        - task: Docker@2
          displayName: 'Build image'
          inputs:
            command: 'build'
            repository: 'pruebas-pipeline-dev'
            Dockerfile: 'pipelines-templates/pipeline/docker/Dockerfile'
            tags: $(Build.BuildNumber)

  - ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/staging') }}:
    - job: 'publish_image_qa'
      displayName: 'Publish Docker Image Staging Environment'
      pool:
        name: 'Azure Pipelines'
        VmImage: 'ubuntu-22.04'
      steps:
        - script: |
            echo "build qa docker images"

  - ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/master') }}:
    - job: 'publish_image_pnd'
      displayName: 'Publish Docker Image master Environment'
      pool:
        name: 'Azure Pipelines'
        VmImage: 'ubuntu-22.04'
      steps:
        - script: |
            echo "build pdn docker images"

