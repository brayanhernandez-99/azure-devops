jobs:
  - job: "sonarqube_microfrontend"
    displayName: "🛡️ sonarqube microfrontend"
    pool:
      name: "Azure Pipelines"
      vmImage: ubuntu-latest

    variables:
      - template: ../../variables/groups-variables-frontend.yml
        parameters:
          region: ${{ parameters.region }}

    strategy:
      matrix:
        ${{ each ms in parameters.apps }}:
          ${{ ms }}:
            msName: ${{ ms }}

    steps:
      - checkout: self
        fetchDepth: 0
        persistCredentials: true
        fetchTags: false

      - checkout: git://DevOps-templates-UX/pipelines-templates
        fetchDepth: 1
        persistCredentials: true
        fetchTags: false

      - task: DownloadBuildArtifacts@0
        inputs:
          artifactName: "versions"
          downloadPath: "$(Pipeline.Workspace)/versions-downloaded"
        displayName: "📥 Download Version"
        condition: succeeded()

      - task: Bash@3
        inputs:
          targetType: inline
          script: |
            set -e
            VERSION_FILE="$(Pipeline.Workspace)/versions-downloaded/versions/$(msName)/version.json"
            echo -e "\n📁 File: version.json"
            ls -la "$VERSION_FILE"
            jq . "$VERSION_FILE"

            if [[ -f "$VERSION_FILE" ]]; then
              VERSION=$(jq -r '.version' $VERSION_FILE)
              echo -e "\n🚀 Versión detectada para $(msName): $VERSION"
              echo "##vso[task.setvariable variable=version]$VERSION"
            else
              echo -e "\n##vso[task.logissue type=error]⚠️ No se encontró archivo de versión para: $(msName)" 
              exit 99
            fi
        displayName: "📚 Read Version"
        condition: succeeded()

      - task: Bash@3
        inputs:
          targetType: inline
          script: |
            set -e
            if [[ "$(msName)" == "app-administration-vue2" || "$(msName)" == "app-sellers-vue2" ]]; then
              fileselect=app-legacy
              echo -e "\nℹ️ Ruta de archivo del micro frontend: $fileselect"
              echo "##vso[task.setvariable variable=file]$fileselect"
            else
              fileselect=apps
              echo -e "\nℹ️ Ruta de archivo del micro frontend: $fileselect"
              echo "##vso[task.setvariable variable=file]$fileselect"
            fi
        displayName: "📂 Select Directory"
        condition: succeeded()

      - task: Bash@3
        inputs:
          targetType: inline
          script: |
            set -e
            echo -e "\n🔐 Obteniendo tokens de AWS CodeArtifact..."

            token_matrix=$(aws codeartifact get-authorization-token \
              --domain matrixtech-npm-repository \
              --domain-owner "$ACCOUNT_ID_DEPLOY" \
              --region "$AWS_DEFAULT_REGION" \
              --query authorizationToken \
              --output text)

            token_ux=$(aws codeartifact get-authorization-token \
              --domain ux \
              --domain-owner "$ACCOUNT_ID_DEPLOY" \
              --region "$AWS_DEFAULT_REGION" \
              --query authorizationToken \
              --output text)

            REPO_DOMAIN_MATRIX="matrixtech-npm-repository-$ACCOUNT_ID_DEPLOY.d.codeartifact.$AWS_DEFAULT_REGION.amazonaws.com"
            REPO_PATH_MATRIX="npm/matrixtech-npm-repository"
            REPO_URL_MATRIX="https://$REPO_DOMAIN_MATRIX/$REPO_PATH_MATRIX"

            REPO_DOMAIN_UX="ux-$ACCOUNT_ID_DEPLOY.d.codeartifact.$AWS_DEFAULT_REGION.amazonaws.com"
            REPO_PATH_UX="npm/ux"
            REPO_URL_UX="https://$REPO_DOMAIN_UX/$REPO_PATH_UX"

            echo "⚙️ Configurando npm global..."
            npm config set registry "https://registry.npmjs.org/"

            echo "⚙️ Configurando npm MATRIX..."
            npm config set "//$REPO_DOMAIN_MATRIX/$REPO_PATH_MATRIX/:_authToken" "$token_matrix"
            npm config set "@matrixtech:registry" "$REPO_URL_MATRIX"

            echo "⚙️ Configurando npm UX..."
            npm config set "//$REPO_DOMAIN_UX/$REPO_PATH_UX/:_authToken" "$token_ux"
            npm config set "@ux:registry" "$REPO_URL_UX"

            echo -e "\n✅ ~/.npmrc generado"
            cat ~/.npmrc | sed -E 's#(:_authToken=).*#\1****#'

            echo -e "\n🔍 Verificando identidad AWS..."
            aws sts get-caller-identity
        displayName: "🔐 Setup CodeArtifact & npm config"
        condition: succeeded()
        env:
          AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)
          AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID_DEPLOY)
          AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY_DEPLOY)

      - task: UseNode@1
        inputs:
          version: "$(node-18.20)"
        displayName: "🔧 Install Nodejs $(node-18.20)"
        condition: succeeded()

      - task: Bash@3
        inputs:
          targetType: inline
          script: |
            set -e
            echo "Comentando app-legacy/*"
            cd $(Build.Repository.Name)
            sed -i '/app-legacy\//s/  -/  # -/' pnpm-workspace.yaml

            echo -e "\n📁 File:"
            cat pnpm-workspace.yaml
        displayName: "💬 Comment app-legacy/*"
        condition: and(succeeded(),
          ne(variables['msName'], 'app-administration-vue2'),
          ne(variables['msName'], 'app-sellers-vue2'))

      - task: Bash@3
        inputs:
          targetType: inline
          script: |
            set -e
            echo -e "\n📁 Files:"
            ls -la $(Build.Repository.Name)/$(file)/$(msName)

            rm -f "$(Build.Repository.Name)/$(file)/$(msName)/vitest.config.mts"
            echo -e "\n✅ Eliminación archivo vitest.config.mts ..."

            cp pipelines-templates/pipeline/config/vitest.config.mts $(Build.Repository.Name)/$(file)/$(msName)
            echo "⚠️ Copiando archivo vitest.config.mts templates..."
            echo "✅ vitest.config.mts copiado exitosamente."

            echo -e "\n📁 File: vitest.config.mts"
            cat $(Build.Repository.Name)/$(file)/$(msName)/vitest.config.mts

            FILE="$(Build.Repository.Name)/$(file)/$(msName)/vitest.config.ts"
            if [[ -f "$FILE" ]]; then
              rm -f "$FILE"
              echo "❌ Eliminando el archivo vitest.config.ts"
            fi
        displayName: "♻️ Replace vitest.config"
        condition: and(succeeded(),
          ne(variables['msName'], 'app-administration-vue2'),
          ne(variables['msName'], 'app-sellers-vue2'))

      - task: Bash@3
        inputs:
          targetType: inline
          script: |
            set -e
            echo -e "\n📁 Generando archivo .pnpmrc en: $(Build.Repository.Name)/$(file)/$(msName)/.pnpmrc"
            cat <<EOF > "$(Build.Repository.Name)/$(file)/$(msName)/.pnpmrc"
            node-linker=hoisted
            shamefully-hoist=true
            ignore-scripts=false
            allow-build-script=true
            strict-peer-dependencies=false
            EOF
            ls -la $(Build.Repository.Name)/$(file)/$(msName)/.pnpmrc
            cat $(Build.Repository.Name)/$(file)/$(msName)/.pnpmrc

            echo -e "\n📌 Versiones:"
            npm install -g pnpm
            echo "Node version: $(node --version)"
            echo "PNPM version: $(pnpm --version)"

            cd $(Build.Repository.Name)
            echo -e "\n⚙️ Instalando dependencias node..."
            pnpm install

            OUTPUT=$(pnpm ls --depth=0 || true)
            if [[ -z "$OUTPUT" ]]; then
              echo -e "\n##vso[task.logissue type=error]⚠️ No se instalaron dependencias, esperar que se actualicen las dependencias a nivel global"
              exit 99
            else
              echo -e "\n✅ Dependencias Instaladas:"
              echo "$OUTPUT"
            fi
        displayName: "⚙️ Install Dependencies"
        condition: and(succeeded(),
          ne(variables['msName'], 'app-administration-vue2'),
          ne(variables['msName'], 'app-sellers-vue2'))

      - task: JavaToolInstaller@0
        inputs:
          versionSpec: "17"
          jdkArchitectureOption: "x64"
          jdkSourceOption: "PreInstalled"
        displayName: "🔧 Install JDK 17"
        condition: and(succeeded(),
          ne(variables['msName'], 'app-administration-vue2'),
          ne(variables['msName'], 'app-sellers-vue2'))

      - ${{ if ne(parameters.pr_id, 0) }}:
          - task: SonarQubePrepare@7
            inputs:
              SonarQube: "SonarQubeConection"
              scannerMode: "CLI"
              configMode: "manual"
              cliProjectKey: "microfrontend-$(msName)-invictus"
              cliProjectName: "microfrontend-$(msName)-invictus"
              cliSources: "$(System.DefaultWorkingDirectory)/$(Build.Repository.Name)/$(file)/$(msName)"
              extraProperties: |
                sonar.pullrequest.key=${{ parameters.pr_id }}
                sonar.pullrequest.branch=${{ parameters.pr_source_branch }}
                sonar.pullrequest.base=${{ parameters.pr_target_branch }}
                sonar.projectVersion=$(version)
                sonar.javascript.lcov.reportPaths=$(System.DefaultWorkingDirectory)/$(Build.Repository.Name)/$(file)/$(msName)/coverage/lcov.info
                sonar.exclusions=**/test/**,**/coverage/**,**/invictus/src/presentation/router/private/**,**/invictus/src/presentation/router/public/**,**/.nyc_output/**,**/reports/**,**/sured-plugin/**,**/reports_bck/**,**/node_modules/**,**/dist/**,**/*.cjs,**/*.mts,**/*.mjs,**/main.ts,**/config/**,**/config.*,**/*.config.*,**/*.d.ts
            displayName: "⚙️ Prepare SonarQube Analysis"
            condition: and(succeeded(),
              ne(variables['msName'], 'app-administration-vue2'),
              ne(variables['msName'], 'app-sellers-vue2'))

          - task: Bash@3
            inputs:
              targetType: inline
              script: |
                set -e
                echo -e "\n🔎 Eliminando sonar.branch.name de SONARQUBE_SCANNER_PARAMS..."
                CLEAN_PARAMS=$(echo "$SONARQUBE_SCANNER_PARAMS" | jq -c 'del(.["sonar.branch.name"])')

                echo -e "\n⚙️ Configuración SONARQUBE_SCANNER_PARAMS:"
                echo "$CLEAN_PARAMS" | jq '."sonar.token" = "***"'

                # Escapar caracteres especiales para Azure DevOps logging command
                CLEAN_PARAMS="${CLEAN_PARAMS//'%'/'%AZP25'}"
                CLEAN_PARAMS="${CLEAN_PARAMS//$'\n'/'%0A'}"
                CLEAN_PARAMS="${CLEAN_PARAMS//$'\r'/'%0D'}"

                echo "##vso[task.setvariable variable=SONARQUBE_SCANNER_PARAMS]$CLEAN_PARAMS"
                echo -e "\n✅ sonar.branch.name eliminado"
            displayName: "🧹 Remove sonar.branch.name"
            condition: and(succeeded(),
              ne(variables['msName'], 'app-administration-vue2'),
              ne(variables['msName'], 'app-sellers-vue2'))

      - ${{ if eq(parameters.pr_id, 0) }}:
          - task: SonarQubePrepare@7
            inputs:
              SonarQube: "SonarQubeConection"
              scannerMode: "CLI"
              configMode: "manual"
              cliProjectKey: "microfrontend-$(msName)-invictus"
              cliProjectName: "microfrontend-$(msName)-invictus"
              cliSources: "$(System.DefaultWorkingDirectory)/$(Build.Repository.Name)/$(file)/$(msName)"
              extraProperties: |
                sonar.projectVersion=$(version)
                sonar.javascript.lcov.reportPaths=$(System.DefaultWorkingDirectory)/$(Build.Repository.Name)/$(file)/$(msName)/coverage/lcov.info
                sonar.exclusions=**/test/**,**/coverage/**,**/invictus/src/presentation/router/private/**,**/invictus/src/presentation/router/public/**,**/.nyc_output/**,**/reports/**,**/sured-plugin/**,**/reports_bck/**,**/node_modules/**,**/dist/**,**/*.cjs,**/*.mts,**/*.mjs,**/main.ts,**/config/**,**/config.*,**/*.config.*,**/*.d.ts
            displayName: "⚙️ Prepare SonarQube Analysis"
            condition: and(succeeded(),
              ne(variables['msName'], 'app-administration-vue2'),
              ne(variables['msName'], 'app-sellers-vue2'))

      - task: Bash@3
        inputs:
          targetType: inline
          script: |
            set -e
            echo -e "\n🔎 Ejecutando coverage $(msName)..."
            cd $(System.DefaultWorkingDirectory)/$(Build.Repository.Name)
            pnpm coverage --filter=...$(msName)

            LCOV_PATH="$(System.DefaultWorkingDirectory)/$(Build.Repository.Name)/$(file)/$(msName)/coverage/lcov.info"
            if [[ -f "$LCOV_PATH" ]]; then
              LINES=$(wc -l < "$LCOV_PATH")
              echo -e "\n✅ lcov.info generado ($LINES líneas)"
              ls -la "$(System.DefaultWorkingDirectory)/$(Build.Repository.Name)/$(file)/$(msName)/coverage"
            else
              echo -e "\n##vso[task.logissue type=warning]⚠️ lcov.info no encontrado"
              exit 99
            fi
        displayName: "🔎 Coverage Analysis: $(msName)"
        continueOnError: true
        condition: and(succeeded(),
          ne(variables['msName'], 'app-administration-vue2'),
          ne(variables['msName'], 'app-sellers-vue2'))

      - task: Bash@3
        inputs:
          targetType: inline
          script: |
            echo "=== PR DIFF ==="
            git diff --name-status origin/develop...HEAD

            echo "=== MERGE BASE ==="
            git merge-base origin/develop HEAD

            echo "=== HEAD ==="
            git rev-parse HEAD

            echo "=== LCOV FILES ==="
            grep "^SF:" $(System.DefaultWorkingDirectory)/$(Build.Repository.Name)/apps/generic/coverage/lcov.info | sort -u
        displayName: "Debug Git and LCOV"
        condition: and(succeeded(),
          ne(variables['msName'], 'app-administration-vue2'),
          ne(variables['msName'], 'app-sellers-vue2'))

      - task: SonarQubeAnalyze@7
        displayName: "📡 Run Sonar Analysis"
        condition: and(succeeded(),
          ne(variables['msName'], 'app-administration-vue2'),
          ne(variables['msName'], 'app-sellers-vue2'))

      - task: SonarQubePublish@7
        inputs:
          pollingTimeoutSec: 400
        displayName: "📤 Publish Static Code Analysis Results"
        condition: and(succeeded(),
          ne(variables['msName'], 'app-administration-vue2'),
          ne(variables['msName'], 'app-sellers-vue2'))

      - template: sonarqube/job-sonarqube.yml@sonarqube
        parameters:
          projectKey: "microfrontend-$(msName)-invictus"
          prId: "${{ parameters.pr_id }}"
