jobs:
  - job: "sonarqube_micro_service"
    displayName: "🛡️ sonarqube microservice"
    pool:
      name: "Azure Pipelines"
      vmImage: "ubuntu-22.04"

    variables:
      - template: ../../variables/groups-transversal-variables-backend.yml

    steps:
      - checkout: self
        fetchDepth: 0
        persistCredentials: true

      - task: DownloadBuildArtifacts@0
        inputs:
          artifactName: "versions"
          downloadPath: "$(Pipeline.Workspace)/version-downloaded"
        displayName: "📥 Download Version"
        condition: succeeded()

      - script: |
          VERSION_FILE="$(Pipeline.Workspace)/version-downloaded/versions/microservice/version.json"

          echo -e "\n📁 Archivo version.json:"
          ls -la "$VERSION_FILE"
          cat "$VERSION_FILE"

          if [[ -f "$VERSION_FILE" ]]; then
            VERSION=$(jq -r '.version' $VERSION_FILE)
            echo -e "\n🚀 Versión detectada para $(Build.Repository.Name): $VERSION"
            echo "##vso[task.setvariable variable=version]$VERSION"
          else
            echo -e "\n##vso[task.logissue type=error]⚠️ No se encontro archivo de versión para $(Build.Repository.Name)"
            exit 99
          fi
        displayName: "📚 Read Version"
        condition: succeeded()

      - task: Bash@3
        name: AuthCodeArtifact
        inputs:
          targetType: "inline"
          script: |
            echo -e "\n🔐 Obteniendo token de AWS CodeArtifact..."
            token_matrix=$(aws codeartifact get-authorization-token \
              --domain matrixtech-npm-repository \
              --domain-owner "$ACCOUNT_ID_DEPLOY" \
              --region "$AWS_DEFAULT_REGION" \
              --query authorizationToken \
              --output text)

            token_ux=$(aws codeartifact get-authorization-token \
              --domain ux \
              --domain-owner "$ACCOUNT_ID_DEPLOY" \
              --region "$AWS_DEFAULT_REGION" \
              --query authorizationToken \
              --output text)

            REPO_DOMAIN_MATRIX="matrixtech-npm-repository-$ACCOUNT_ID_DEPLOY.d.codeartifact.$AWS_DEFAULT_REGION.amazonaws.com"
            REPO_PATH_MATRIX="npm/matrixtech-npm-repository"
            REPO_URL_MATRIX="https://$REPO_DOMAIN_MATRIX/$REPO_PATH_MATRIX"

            echo "Configurando npm..."
            npm config set "//$REPO_DOMAIN_MATRIX/$REPO_PATH_MATRIX/:_authToken" "$token_matrix"
            npm config set "@matrixtech:registry" "$REPO_URL_MATRIX"


            REPO_DOMAIN_UX="ux-$ACCOUNT_ID_DEPLOY.d.codeartifact.$AWS_DEFAULT_REGION.amazonaws.com"
            REPO_PATH_UX="npm/ux"
            REPO_URL_UX="https://$REPO_DOMAIN_UX/$REPO_PATH_UX"

            echo "Configurando npm..."
            npm config set "//$REPO_DOMAIN_UX/$REPO_PATH_UX/:_authToken" "$token_ux"
            npm config set "@ux:registry" "$REPO_URL_UX"


            echo "Verificando identidad de AWS..."
            aws sts get-caller-identity

            echo -e "\n📁 Generando archivo .npmrc con múltiples registries"

            cat <<EOF > ".npmrc"
            @matrixtech:registry=https://$REPO_DOMAIN_MATRIX/$REPO_PATH_MATRIX/
            //$REPO_DOMAIN_MATRIX/$REPO_PATH_MATRIX/:_authToken=$token_matrix
            
            @ux:registry=https://$REPO_DOMAIN_UX/$REPO_PATH_UX/
            //$REPO_DOMAIN_UX/$REPO_PATH_UX/:_authToken=$token_ux
            EOF

            ls -la .npmrc



            # echo -e "\n🔐 Obteniendo token de AWS CodeArtifact..."
            # token=$(aws codeartifact get-authorization-token \
            #   --domain matrixtech-npm-repository \
            #   --domain-owner "$ACCOUNT_ID_DEPLOY" \
            #   --region "$AWS_DEFAULT_REGION" \
            #   --query authorizationToken \
            #   --output text)

            # REPO_DOMAIN="matrixtech-npm-repository-$ACCOUNT_ID_DEPLOY.d.codeartifact.$AWS_DEFAULT_REGION.amazonaws.com"
            # REPO_PATH="npm/matrixtech-npm-repository"
            # REPO_URL="https://$REPO_DOMAIN/$REPO_PATH"

            # echo "Configurando npm..."
            # npm config set "//$REPO_DOMAIN/$REPO_PATH/:_authToken" "$token"
            # npm config set registry "$REPO_URL"

            # echo "Verificando identidad de AWS..."
            # aws sts get-caller-identity

            # echo -e "\n📁 Generando archivo .npmrc"
            # cat <<EOF > ".npmrc"
            # //$REPO_DOMAIN/$REPO_PATH/:_authToken=$token
            # EOF
            # ls -l .npmrc
        displayName: "🔐 Setup CodeArtifact & npm config"
        condition: succeeded()
        env:
          AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)
          AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID_DEPLOY)
          AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY_DEPLOY)

      - task: NodeTool@0
        displayName: "🔧 Install Nodejs $(nodeVersion)"
        inputs:
          versionSource: "spec"
          versionSpec: "$(nodeVersion)"
        condition: succeeded()

      - script: |
          echo -e "\n📁 Generando archivo .pnpmrc en: $(System.DefaultWorkingDirectory)/.pnpmrc"
          cat <<EOF > "$(System.DefaultWorkingDirectory)/.pnpmrc"
          node-linker=hoisted
          shamefully-hoist=true
          ignore-scripts=false
          allow-build-script=true
          strict-peer-dependencies=false
          EOF
          ls -l $(System.DefaultWorkingDirectory)/.pnpmrc
          cat $(System.DefaultWorkingDirectory)/.pnpmrc

          cat $(System.DefaultWorkingDirectory)/.pnpmrc >> $(System.DefaultWorkingDirectory)/.npmrc
          echo -e "\n✅ Contenido de .pnpmrc anexado a .npmrc correctamente."

          echo -e "\n⚙️ Instalando dependencias node..."
          npm install -g pnpm
          pnpm install
          pnpm ignored-builds

          OUTPUT=$(pnpm ls --depth=0 || true)
          if [[ -z "$OUTPUT" ]]; then
            echo -e "\n##vso[task.logissue type=error]⚠️ No se instalaron dependencias, esperar que se actualicen las dependencias a nivel global"
            exit 99
          else
            echo -e "\n✅ Dependencias Instaladas:"
            echo "$OUTPUT"
          fi
        displayName: "⚙️ Install Dependencies"
        condition: succeeded()

      - script: |
          echo "🔧 Actualizando versión en package.json: $(version)"
          jq --arg version "$(version)" '.version = $version' package.json > tmp.json && mv tmp.json package.json

          echo -e "\n📁 File package.json:"      
          cat $(System.DefaultWorkingDirectory)/package.json
        displayName: "📝 Update Version package.json"
        condition: succeeded()

      - task: JavaToolInstaller@0
        displayName: "🔧 Install JDK 17"
        inputs:
          versionSpec: "17"
          jdkArchitectureOption: "x64"
          jdkSourceOption: "PreInstalled"
        condition: succeeded()

      - task: SonarQubePrepare@7
        displayName: "⚙️ Prepare SonarQube Analysis"
        inputs:
          SonarQube: "SonarQubeConection"
          scannerMode: "CLI"
          configMode: "manual"
          cliProjectKey: "$(Build.Repository.Name)"
          cliProjectName: "$(Build.Repository.Name)"
          cliSources: "$(System.DefaultWorkingDirectory)"
          extraProperties: |
            sonar.projectVersion=$(version)
            sonar.javascript.lcov.reportPaths=$(System.DefaultWorkingDirectory)/coverage/lcov.info
            sonar.exclusions=**/*.java,**/test/**,**/android/**,**/ios/**,**/coverage/**,**/.nyc_output/**,**/reports/**,**/node_modules/**,**/migrations/**,**/config/**,**/Dockerfile
        condition: succeeded()

      - script: |
          response=$(echo $SONARQUBE_SCANNER_PARAMS | sed -E 's#"sonar\.branch\.name":"[^"]+",##g')
          json=$(echo "$response" | sed 's/"sonar.token":\*\*\*/"sonar.token":"***"/')
          echo "$json" | jq
          echo "##vso[task.setvariable variable=SONARQUBE_SCANNER_PARAMS]$response"
        displayName: "⚙️ Set Variable — SONARQUBE_SCANNER_PARAMS"
        condition: ne(variables['Build.Reason'], 'PullRequest')

      - script: |
          response=$(echo $SONARQUBE_SCANNER_PARAMS | sed -E 's#"sonar\.pullrequest\.[^"]+":"[^"]+",##g') 
          json=$(echo "$response" | sed 's/"sonar.token":\*\*\*/"sonar.token":"***"/')
          echo "$json" | jq
          echo "##vso[task.setvariable variable=SONARQUBE_SCANNER_PARAMS]$response"
        displayName: "⚙️ Set Variable — SONARQUBE_SCANNER_PARAMS"
        condition: and( eq(variables['Build.Reason'], 'PullRequest'), or(startsWith(variables['System.PullRequest.SourceBranch'], 'refs/heads/feature/'), startsWith(variables['System.PullRequest.SourceBranch'], 'refs/heads/hotfix/')))

      - script: |
          pnpm run test
        displayName: "🧪 Run Tests for: $(Build.Repository.Name)"
        condition: succeeded()
        # continueOnError: true
      
      - script: |
          PKG="$(System.DefaultWorkingDirectory)/package.json"

          if [[ ! -f "$PKG" ]]; then
            echo "❌ package.json not found"
            exit 1
          fi

          TEST_SCRIPT=$(jq -r '.scripts.test // empty' "$PKG")

          if [[ -z "$TEST_SCRIPT" ]]; then
            echo "❌ No test script defined in package.json"
            exit 1
          fi

          if echo "$TEST_SCRIPT" | grep -Eiq '(^|[[:space:]])jest([[:space:]]|$)'; then
            mkdir -p reports/junit
            mkdir -p reports/coverage
            echo "🧪 Running Jest Test and coverage (CI override)"
            pnpm add -D jest@29.7.0 jest-junit@16.0.0
            export JEST_JUNIT_OUTPUT_DIR=reports/junit
            export JEST_JUNIT_OUTPUT_NAME=test.xml
            pnpm dlx jest \
              --ci \
              --coverage \
              --coverageDirectory=reports/coverage \
              --coverageReporters=lcov \
              --coverageReporters=cobertura \
              --reporters=default \
              --reporters=jest-junit \

            echo "📁 Test files:"
            ls -la reports/junit

            echo "📁 Coverage files:"
            ls -la reports/coverage
          fi

          if echo "$TEST_SCRIPT" | grep -Eiq '(^|[[:space:]])mocha([[:space:]]|$)'; then
            echo "🧪 Running Mocha Test (CI override)"
            pnpm add -D mocha-junit-reporter
            pnpm exec mocha \
            --reporter mocha-junit-reporter \
            --reporter-options mochaFile=reports/junit/test.xml

            echo "📁 Test files:"
            ls -la reports/junit

            echo "🧪 Running Mocha coverage (CI override)"
            pnpm exec nyc \
              --report-dir reports/coverage \
              --reporter=lcov \
              --reporter=cobertura \
              --reporter=text \
              mocha

            echo "📁 Coverage files:"
            ls -la reports/coverage
          fi
        displayName: "📈 Run Tests, coverage report"
        condition: succeeded()

      - task: PublishTestResults@2
        displayName: "📊 Publish Test Results"
        inputs:
          testResultsFormat: "JUnit"
          testResultsFiles: "reports/junit/test.xml"
          mergeTestResults: true
          failTaskOnFailedTests: true
      
      - task: PublishCodeCoverageResults@2
        displayName: "📊 Publish Code Coverage"
        inputs:
          codeCoverageTool: "Cobertura"
          summaryFileLocation: "$(System.DefaultWorkingDirectory)/reports/coverage/cobertura-coverage.xml"
          reportDirectory: "$(System.DefaultWorkingDirectory)/reports/coverage"

      - script: |
          pnpm run coverage
          ls -la $(System.DefaultWorkingDirectory)/coverage
        displayName: "🔎 Coverage Analysis: $(Build.Repository.Name)"
        condition: succeeded()
        # continueOnError: true

      - task: SonarQubeAnalyze@7
        displayName: "📡 Run Sonar Analysis"
        condition: succeeded()

      - task: SonarQubePublish@7
        inputs:
          pollingTimeoutSec: 400
        displayName: "📤 Publish Static Code Analysis Results"
        condition: succeeded()

      - template: sonarqube/job-sonarqube.yml@sonarqube
        parameters:
          projectKey: $(Build.Repository.Name)
      
      - script: |
          set -e

          echo "🔍 Checking for outdated npm dependencies..."
          REPORT=$(npx npm-check-updates)

          echo "$REPORT"

          if echo "$REPORT" | grep -q "→"; then
            echo "❌ Outdated npm dependencies detected. Please update them."
            # exit 1
          else
            echo "✅ All npm dependencies are up to date"
          fi
        displayName: "🧪 Check outdated npm dependencies"
        condition: succeeded()
        
      