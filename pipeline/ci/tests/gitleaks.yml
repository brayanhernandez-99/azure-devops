jobs:
  - job: "gitleaks_micro_service"
    displayName: "🔐 gitleaks microservice"
    pool:
      name: "Azure Pipelines"
      vmImage: "ubuntu-22.04"

    variables:
      - template: ../../variables/groups-transversal-variables-backend.yml

    steps:
      - checkout: self
        fetchDepth: 0

      - checkout: git://DevOps-templates-UX/pipelines-templates
        fetchDepth: 1
        persistCredentials: true

      # - task: Gitleaks@3
      #   displayName: "🔍 Gitleaks (feature)"
      #   continueOnError: true
      #   inputs:
      #     scanType: repo
      #   condition: succeeded()

      - script: |
          docker run --rm \
            -v $(Build.SourcesDirectory):/repo \
            zricethezav/gitleaks:latest \
            detect \
            --source=/repo/$(Build.Repository.Name) \
            --config=/repo/pipelines-templates/gitleaks.toml \
            --log-opts="origin/master..HEAD" \
            --verbose \
            --redact \
            --report-format json
        displayName: "🔍 Gitleaks full repo scan"
        continueOnError: true
        condition: succeeded()
