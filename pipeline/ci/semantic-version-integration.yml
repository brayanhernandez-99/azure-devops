jobs:
  - ${{ if eq(parameters.release, 'aws-ecs') }}:
      - template: ./semantic/semantic-version-backend.yml

  - ${{ if eq(parameters.release, 'aws-s3') }}:
      - template: ./semantic/semantic-version-frontend.yml
        parameters:
          apps: ${{ parameters.apps }}

  - ${{ if eq(parameters.release, 'exe') }}:
      - template: ./semantic/semantic-version-electron.yml
        parameters:
          microFronted: ${{ parameters.microFronted }}

  - ${{ if eq(parameters.release, 'apk') }}:
      - template: ./semantic/semantic-version-flutter.yml
