jobs:
  - job: "test_nodejs"
    displayName: "🔧 Test Node.js Project"
    pool:
      name: "Azure Pipelines"
      vmImage: "ubuntu-22.04"
    variables:
      - template: ../../variables/groups-transversal-variables-backend.yml
        parameters:
          region: ${{ parameters.region }}

    steps:
      - task: DownloadBuildArtifacts@0
        inputs:
          artifactName: "versions"
          downloadPath: "$(Pipeline.Workspace)/version-downloaded"
        displayName: "📥 Download Version Artifact"
        condition: succeeded()

      - script: |
          ls -R $(Pipeline.Workspace)/version-downloaded/versions
          VERSION_FILE="$(Pipeline.Workspace)/version-downloaded/versions/version.json"
          if [[ -f "$VERSION_FILE" ]]; then
            VERSION=$(jq -r '.version' $VERSION_FILE)            
            echo -e "\n🚀 Versión detectada para $(Build.Repository.Name): $VERSION"
            echo "##vso[task.setvariable variable=msVersion]$VERSION"
          else
            echo "##vso[task.logissue type=error]❌ No se encontro archivo de versión para $(Build.Repository.Name)"
            exit 99
          fi
        displayName: "📖 Read Microservice Versions"
        condition: succeeded()

      - task: Bash@3
        name: AuthCodeArtifact
        inputs:
          targetType: "inline"
          script: |
            echo "🔐 Obteniendo token de AWS CodeArtifact..."
            token=$(aws codeartifact get-authorization-token \
              --domain matrixtech-npm-repository \
              --domain-owner "$ACCOUNT_ID_DEPLOY" \
              --region "$AWS_DEFAULT_REGION" \
              --query authorizationToken \
              --output text)

            REPO_DOMAIN="matrixtech-npm-repository-$ACCOUNT_ID_DEPLOY.d.codeartifact.$AWS_DEFAULT_REGION.amazonaws.com"
            REPO_PATH="npm/matrixtech-npm-repository"
            REPO_URL="https://$REPO_DOMAIN/$REPO_PATH"

            echo "Configurando npm..."
            npm config set "//$REPO_DOMAIN/$REPO_PATH/:_authToken" "$token"
            npm config set registry "$REPO_URL"

            echo "Verificando identidad de AWS..."
            aws sts get-caller-identity

            echo "Generando archivo .npmrc"
            cat <<EOF > ".npmrc"
            //$REPO_DOMAIN/$REPO_PATH/:_authToken=$token
            registry=$REPO_URL
            EOF
            ls -la .npmrc
        displayName: "🔐 Setup CodeArtifact & npm config"
        condition: succeeded()
        env:
          AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID_DEPLOY)
          AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY_DEPLOY)
          AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)

      - task: NodeTool@0
        inputs:
          versionSource: "spec"
          versionSpec: "$(nodeVersion)"
        displayName: "🔧 Install Nodejs $(nodeVersion)"
        condition: succeeded()

      - task: JavaToolInstaller@0
        inputs:
          versionSpec: "17"
          jdkArchitectureOption: "x64"
          jdkSourceOption: "PreInstalled"
        displayName: "🔧 Install JDK 17"
        condition: succeeded()

      - script: |
          echo -e "\n📁 Generando archivo .pnpmrc en: $(System.DefaultWorkingDirectory)/.pnpmrc"
          cat <<EOF > "$(System.DefaultWorkingDirectory)/.pnpmrc"
          node-linker=hoisted
          shamefully-hoist=true
          ignore-scripts=false
          allow-build-script=true
          strict-peer-dependencies=false
          EOF
          ls -l $(System.DefaultWorkingDirectory)/.pnpmrc
          cat $(System.DefaultWorkingDirectory)/.pnpmrc

          cat $(System.DefaultWorkingDirectory)/.pnpmrc >> $(System.DefaultWorkingDirectory)/.npmrc
          echo -e "\n✅ Contenido de .pnpmrc anexado a .npmrc correctamente."

          echo -e "\n⚙️ Instalando dependencias node..."
          npm install -g pnpm
          # pnpm install
          # pnpm ignored-builds

          OUTPUT=$(pnpm ls --depth=0 || true)
          if [[ -z "$OUTPUT" ]]; then
            echo -e "\n##vso[task.logissue type=error]⚠️ No se instalaron dependencias, esperar que se actualicen las dependencias a nivel global"
            exit 99
          else
            echo -e "\n✅ Dependencias Instaladas:"
            echo "$OUTPUT"
          fi
        displayName: "⚙️ Install Dependencies"
        condition: succeeded()

      - task: SonarQubePrepare@7
        inputs:
          SonarQube: "SonarQubeConection"
          scannerMode: "CLI"
          configMode: "manual"
          cliProjectKey: "$(Build.Repository.Name)"
          cliProjectName: "$(Build.Repository.Name)"
          cliSources: "$(System.DefaultWorkingDirectory)"
          extraProperties: |
            sonar.javascript.lcov.reportPaths=$(System.DefaultWorkingDirectory)/coverage/lcov.info
            sonar.exclusions=**/*.java,**/test/**,**/android/**,**/ios/**,**/coverage/**,**/.nyc_output/**,**/reports/**,**/node_modules/**,**/migrations/**,**/config/**
        displayName: "⚙️ Prepare SonarQube Analysis"
        condition: succeeded()

      - script: |
          response=$(echo $SONARQUBE_SCANNER_PARAMS | sed -E 's#"sonar\.branch\.name":"[^"]+",##g')
          json=$(echo "$response" | sed 's/"sonar.token":\*\*\*/"sonar.token":"***"/')
          echo "$json" | jq
          echo "##vso[task.setvariable variable=SONARQUBE_SCANNER_PARAMS]$response"
        displayName: "⚙️ Set Variable — SONARQUBE_SCANNER_PARAMS"
        condition: ne(variables['Build.Reason'], 'PullRequest')

      - script: |
          response=$(echo $SONARQUBE_SCANNER_PARAMS | sed -E 's#"sonar\.pullrequest\.[^"]+":"[^"]+",##g') 
          json=$(echo "$response" | sed 's/"sonar.token":\*\*\*/"sonar.token":"***"/')
          echo "$json" | jq
          echo "##vso[task.setvariable variable=SONARQUBE_SCANNER_PARAMS]$response"
        displayName: "⚙️ Set Variable — SONARQUBE_SCANNER_PARAMS"
        condition: and( eq(variables['Build.Reason'], 'PullRequest'), or(startsWith(variables['System.PullRequest.SourceBranch'], 'refs/heads/feature/'), startsWith(variables['System.PullRequest.SourceBranch'], 'refs/heads/hotfix/')))

      - script: |
          echo "🔧 Actualizando versión en package.json a $(msVersion)"
          jq --arg version "$(msVersion)" '.version = $version' package.json > tmp.json && mv tmp.json package.json
        displayName: "⚙️ Temporary version for build"
        condition: succeeded()

      - script: |
          pnpm run test
        displayName: "🧪 Run Tests for: $(Build.Repository.Name)"
        condition: succeeded()
        continueOnError: true

      - script: |
          pnpm run coverage
          ls -la $(System.DefaultWorkingDirectory)/coverage
        displayName: "🔎 Coverage Analysis: $(Build.Repository.Name)"
        condition: succeeded()
        continueOnError: true

      - task: SonarQubeAnalyze@7
        displayName: "📡 Run Sonar Analysis"
        condition: succeeded()

      - template: sonarqube/job-sonarqube.yml@sonarqube
        parameters:
          projectKey: $(Build.Repository.Name)

      - task: SonarQubePublish@7
        inputs:
          pollingTimeoutSec: 400
        displayName: "📤 Publish Static Code Analysis Results"
        condition: succeeded()
