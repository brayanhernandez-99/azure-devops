jobs:
  - job: changes_files_frontend
    displayName: "🔍 Filtrar apps"
    pool:
      name: "Azure Pipelines"
      vmImage: ubuntu-22.04

    steps:
      - checkout: self
        fetchDepth: 1

      - script: |
          # Lista inicial de apps
          apps='[
            "app-administration-vue2",
            "app-sellers-vue2",
            "users"
          ]'

          echo "📦 Apps originales:"
          echo "$apps" | jq

          # Filtrar apps que no quieres
          apps=$(echo "$apps" | jq -c '[.[] | select(. != "app-sellers-vue2")]')

          echo "📦 Apps después de filtrar:"
          echo "$apps"

          # Exportar como variable de salida del job
          echo "##vso[task.setvariable variable=apps;isOutput=true]$apps"
        name: SetApps
        displayName: "🔧 Filtrar apps (Bash)"
