jobs:
  - job: "semantic_version_playwright"
    displayName: "🏷️ version playwright"
    pool:
      name: "Azure Pipelines"
      vmImage: ubuntu-latest

    variables:
      - template: ../../variables/groups-variables-playwright.yml

    steps:
      - checkout: self
        fetchDepth: 1
        persistCredentials: false
        fetchTags: false

      - task: Bash@3
        inputs:
          targetType: inline
          script: |
            set -euo pipefail
            BRANCH="$(Build.SourceBranch)"
            BRANCH="${BRANCH#refs/heads/}"
            REGEX='^(feature/R-[0-9]+-[a-zA-Z0-9._-]+|hotfix/I-[0-9]+-[a-zA-Z0-9._-]+|develop|staging|master)$'

            echo "Validando rama: $BRANCH"
            if [[ ! "$BRANCH" =~ $REGEX ]]; then
              echo -e "\n##vso[task.logissue type=error]⚠️ El nombre de la rama '$BRANCH' no cumple el estándar."
              echo "##vso[task.logissue type=error]  feature/R-0000-nombre-rama"
              echo "##vso[task.logissue type=error]  hotfix/I-0000-nombre-rama"
              exit 99
            fi
            echo "✅ Nombre de la rama es valido"
        displayName: "🔎 Validate Branch Name"
        condition: succeeded()

      - task: Bash@3
        inputs:
          targetType: inline
          script: |
            set -euo pipefail
            mkdir -p "versions"
            aws s3 cp "s3://download-$(ACCOUNT_ID_INVICTUS)/app/linux/latest-linux.yml" "versions/latest-linux.yml"
            aws s3 cp "s3://download-$(ACCOUNT_ID_INVICTUS)/app/windows/latest.yml" "versions/latest.yml"

            VERSION_LINUX=$(sed -n 's/^version:[[:space:]]*//p' "versions/latest-linux.yml" | head -n 1)
            VERSION_WINDOWS=$(sed -n 's/^version:[[:space:]]*//p' "versions/latest.yml" | head -n 1)

            echo -e "\n🔎 Versiones Detectadas"
            echo "📌 Version Linux  : $VERSION_LINUX"
            echo "📌 Version Windows: $VERSION_WINDOWS"

            if [[ -z "$VERSION_LINUX" || -z "$VERSION_WINDOWS" || "$VERSION_LINUX" != "$VERSION_WINDOWS" ]]; then
              echo -e "\n##vso[task.logissue type=error]⚠️ Las versiones de Linux y Windows no coinciden."
              exit 99
            fi

            mkdir -p "$(Build.ArtifactStagingDirectory)/version"
            echo "{ \"release\": \"app\", \"version\": \"$VERSION_LINUX\" }" > "$(Build.ArtifactStagingDirectory)/version.json"
            echo "##vso[task.setvariable variable=version]$VERSION_LINUX"
        displayName: "🔎 Detect version"
        condition: succeeded()
        env:
          AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION_INVICTUS)
          AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID_INVICTUS)
          AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY_INVICTUS)

      - task: PublishBuildArtifacts@1
        inputs:
          PathtoPublish: "$(Build.ArtifactStagingDirectory)"
          ArtifactName: "version"
          publishLocation: "Container"
        displayName: "📤 Publish artifact version"
        condition: succeeded()
