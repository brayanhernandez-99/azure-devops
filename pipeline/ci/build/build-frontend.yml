      - script: |
          echo "🔎 Validando el estado del pipeline..."

          if [[ "$(Agent.JobStatus)" == "Succeeded" ]]; then
            STATE="succeeded"
            DESCRIPTION="Build completed successfully"
          else
            STATE="failed"
            DESCRIPTION="Build failed"
          fi

          echo -e "\n📡 Reportando resultado a Azure DevOps..."
          echo "Estado: $STATE"
          echo "Descripcion: $DESCRIPTION"
          echo "Pull Request Id: $PR_ID"

          ORGANIZATION=$(System.CollectionUri)
          PROJECT=$(System.TeamProject)
          API_URL="$ORGANIZATION/$PROJECT/_apis/git/repositories/$(Build.Repository.Name)/pullRequests/$PR_ID/statuses?api-version=7.1-preview.1"

          echo -e "\n🌐 Calling API: $API_URL"
          cat <<EOF > body.json
          {
            "state": "$STATE",
            "description": "$DESCRIPTION",
            "context": {
              "name": "build-check",
              "genre": "pipeline"
            }
          }
          EOF

          echo "📁 File: body.json"
          cat body.json

          curl -s \
            -X POST "$API_URL" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $SYSTEM_ACCESSTOKEN" \
            --data-binary "@body.json"
        displayName: "📡 Update PR Status"
        condition: and(always(), ne('${{ parameters.pr_id }}', '0'))        
        env:
          PR_ID: ${{ parameters.pr_id }}
          SYSTEM_ACCESSTOKEN: $(System.AccessToken)

      - task: PublishBuildArtifacts@1
        inputs:
          PathtoPublish: "$(Build.ArtifactStagingDirectory)/dists"
          ArtifactName: "dists"
          publishLocation: "Container"
        displayName: "📤 Publish Dist Files"
        condition: and(succeeded(),
          not(startsWith(variables['Build.SourceBranch'], 'refs/heads/feature/')),
          not(startsWith(variables['Build.SourceBranch'], 'refs/heads/hotfix/')))
