jobs:
  #
  # Electron Linux
  #
  - job: build_electron_linux
    displayName: "📦 build linux"
    pool:
      name: "Azure Pipelines"
      VmImage: ubuntu-22.04

    variables:
      - template: ../../variables/groups-transversal-variables-electron.yml
        parameters:
          region: ${{ parameters.region }}
          environment_staging: ${{ parameters.environment_staging }}

    steps:
      - task: DownloadBuildArtifacts@0
        inputs:
          artifactName: "versions"
          downloadPath: "$(Pipeline.Workspace)"
        displayName: "📥 Download Version"
        condition: succeeded()

      - task: Bash@3
        inputs:
          targetType: inline
          script: |
            set -e
            VERSION_FILE="$(Pipeline.Workspace)/versions/electron/version.json"
            echo -e "\n📁 Archivo version.json:"
            ls -la "$VERSION_FILE"
            jq . "$VERSION_FILE"

            if [[ -f "$VERSION_FILE" ]]; then
              VERSION=$(jq -r '.version' $VERSION_FILE)
              echo -e "\n🚀 Versión detectada para $(Build.Repository.Name): $VERSION"
              echo "##vso[task.setvariable variable=version]$VERSION"
            else
              echo -e "\n##vso[task.logissue type=error]⚠️ No se encontro archivo de versión para $(Build.Repository.Name)"
              exit 99
            fi
        displayName: "📚 Read Version"
        condition: succeeded()

      - task: Bash@3
        inputs:
          targetType: inline
          script: |
            set -e
            echo -e "\n🔐 Obteniendo token de AWS CodeArtifact..."
            token=$(aws codeartifact get-authorization-token \
              --domain matrixtech-npm-repository \
              --domain-owner "$ACCOUNT_ID_DEPLOY" \
              --region "$AWS_DEFAULT_REGION" \
              --query authorizationToken \
              --output text)

            REPO_DOMAIN="matrixtech-npm-repository-$ACCOUNT_ID_DEPLOY.d.codeartifact.$AWS_DEFAULT_REGION.amazonaws.com"
            REPO_PATH="npm/matrixtech-npm-repository"
            REPO_URL="https://$REPO_DOMAIN/$REPO_PATH"

            echo "Configurando npm..."
            npm config set "//$REPO_DOMAIN/$REPO_PATH/:_authToken" "$token"
            npm config set registry "$REPO_URL"

            echo "Verificando identidad de AWS..."
            aws sts get-caller-identity

            echo -e "\n📁 Generando archivo .npmrc"
            cat <<EOF > ".npmrc"
            //$REPO_DOMAIN/$REPO_PATH/:_authToken=$token
            registry=$REPO_URL
            EOF

            echo -e "\n✅ .npmrc generado"
            ls -l .npmrc
        displayName: "🔐 Setup CodeArtifact & npm config"
        condition: succeeded()
        env:
          AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)
          AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID_DEPLOY)
          AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY_DEPLOY)

      - task: Bash@3
        inputs:
          targetType: inline
          script: |
            set -e
            CURRENT_BRANCH="$(Build.SourceBranchName)"
            case "$CURRENT_BRANCH" in 
              staging) environment="$environment_staging" ;;
              master) environment="$region" ;;
              *) environment="develop" ;;
            esac

            cat <<EOF > .env
            VITE_DOMAIN="${VITE_DOMAIN}"
            URL_APP="${URL_APP}"
            TARGET="linux"
            CERT_FILE="./certs/invictus.pfx"
            WIN_CERT_PASS="${CERT_PASSWORD}"
            WIN_CERT_PUBLISHER="UX Technology"
            EOF

            echo "##vso[task.setvariable variable=environment]$environment"
            echo -e "\n📁 File: .env"
            ls -l .env
            cat .env
        displayName: "⚙️ Generate .env"
        condition: succeeded()
        env:
          CERT_PASSWORD: $(CERT_PASSWORD)
          region: ${{ parameters.region }}
          environment_staging: ${{ parameters.environment_staging }}

      - task: Bash@3
        inputs:
          targetType: inline
          script: |
            set -e
            echo "📥 Descargando certificados..."
            aws s3 cp s3://applications-$(ACCOUNT_ID_INVICTUS)/certs/ ./certs --recursive

            echo -e "\n📂 Directorio: certs"
            ls -la certs
        displayName: "📥 Download certificates for signing"
        condition: succeeded()
        env:
          AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)
          AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID_INVICTUS)
          AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY_INVICTUS)

      - task: UsePythonVersion@0
        inputs:
          versionSpec: "$(pythonVersion)"
          addToPath: true
        displayName: "🔧 Use Python $(pythonVersion)"
        condition: succeeded()

      - task: UseNode@1
        inputs:
          version: "$(nodeVersion)"
        displayName: "🔧 Install Nodejs $(nodeVersion)"
        condition: succeeded()

      - task: Bash@3
        inputs:
          targetType: inline
          script: |
            set -e
            echo -e "\n📦 Modificando versión en package.json: $(version)"
            PACKAGE_PATH="$(Build.SourcesDirectory)/package.json"

            if [[ -f "$PACKAGE_PATH" ]]; then
              jq --arg ver "$(version)" '.version = $ver' "$PACKAGE_PATH" > "$PACKAGE_PATH.tmp" && mv "$PACKAGE_PATH.tmp" "$PACKAGE_PATH"

              echo -e "\n✅ Versión en package.json actualizada correctamente."
              cat "$PACKAGE_PATH"
            else
              echo -e "\n##vso[task.logissue type=error]⚠️ No se encontró el archivo package.json en la ruta [$PACKAGE_PATH]"
              exit 99
            fi
        displayName: "📝 Update Version package.json"
        condition: succeeded()

      - task: Bash@3
        inputs:
          targetType: inline
          script: |
            set -e
            echo -e "\n📁 Generando archivo .pnpmrc en: $(System.DefaultWorkingDirectory)/.pnpmrc"
            cat <<EOF > "$(System.DefaultWorkingDirectory)/.pnpmrc"
            node-linker=hoisted
            shamefully-hoist=true
            ignore-scripts=false
            allow-build-script=true
            strict-peer-dependencies=false
            EOF
            ls -l $(System.DefaultWorkingDirectory)/.pnpmrc
            cat $(System.DefaultWorkingDirectory)/.pnpmrc

            cat $(System.DefaultWorkingDirectory)/.pnpmrc >> $(System.DefaultWorkingDirectory)/.npmrc
            echo -e "\n✅ Contenido de .pnpmrc anexado a .npmrc correctamente."

            echo -e "\n⚙️ Instalando dependencias ubuntu..."
            sudo apt-get update
            sudo apt-get install -y libcups2-dev build-essential python3 make g++ gcc

            echo -e "\n⚙️ Instalando dependencias node..."
            npm install -g pnpm
            pnpm install
            pnpm exec electron-builder install-app-deps
            pnpm ignored-builds

            OUTPUT=$(pnpm ls --depth=0 || true)
            if [[ -z "$OUTPUT" ]]; then
              echo -e "\n##vso[task.logissue type=error]⚠️ No se instalaron dependencias, esperar que se actualicen las dependencias a nivel global"
              exit 99
            else
              echo -e "\n✅ Dependencias Instaladas:"
              echo "$OUTPUT"
            fi
        displayName: "⚙️ Install Dependencies"
        condition: succeeded()

      - task: Bash@3
        inputs:
          targetType: inline
          script: |
            set -e
            echo -e "\n📦 Build Electron..."
            pnpm run build
        displayName: "📦 Build Electron Linux"
        condition: succeeded()

      - task: Bash@3
        inputs:
          targetType: inline
          script: |
            set -e
            echo -e "\n📝 Validando build electron..."
            BASE_PATH="$(Build.SourcesDirectory)/release/$(version)/linux"
            APP_DIR="$BASE_PATH/app"
            mkdir -p $APP_DIR
            all_found=true

            echo -e "\n📂 Directorio: $BASE_PATH"
            ls -lt $BASE_PATH
            echo ""

            FILES_TO_COPY=(
              "InvictusUX-$(version).AppImage"
              "latest-linux.yml"
            )

            for file in "${FILES_TO_COPY[@]}"; do
              source_path="$BASE_PATH/$file"
              destination_path="$APP_DIR/$file"

              if [[ -f "$source_path" ]]; then
                cp -f "$source_path" "$destination_path"
                echo "📂 Copiado: $file -> $destination_path"
              else
                echo "⚠️ Archivo no encontrado: $file"
                all_found=false
              fi
            done

            if ! $all_found; then
              echo -e "\n##vso[task.logissue type=error]⚠️ Error: archivos requeridos no encontrados."
              exit 99
            else
              mkdir -p "$(Build.ArtifactStagingDirectory)/release/$(environment)/linux"
              cp -R $APP_DIR/* "$(Build.ArtifactStagingDirectory)/release/$(environment)/linux"

              echo -e "\n📂 Directorio: $APP_DIR"
              ls -l $APP_DIR
            fi
        displayName: "🔎 Validate Build"
        condition: succeeded()

      - task: PublishBuildArtifacts@1
        inputs:
          PathtoPublish: "$(Build.ArtifactStagingDirectory)/release"
          ArtifactName: "release"
          publishLocation: "Container"
        displayName: "📤 Publish artifact electron"
        condition: succeeded()

  #
  # Electron Windows
  #
  - job: build_electron_windows
    displayName: "📦 build windows"
    pool:
      name: "Azure Pipelines"
      vmImage: "windows-latest"

    variables:
      - template: ../../variables/groups-transversal-variables-electron.yml
        parameters:
          region: ${{ parameters.region }}
          environment_staging: ${{ parameters.environment_staging }}

    steps:
      - task: DownloadBuildArtifacts@0
        displayName: "📥 Download Version"
        inputs:
          artifactName: "versions"
          downloadPath: "$(Pipeline.Workspace)"
        condition: succeeded()

      - task: PowerShell@2
        inputs:
          targetType: inline
          script: |
            $versionFile = "$(Pipeline.Workspace)\versions\electron\version.json"
            Write-Host "`n📁 Archivo version.json:"
            Get-ChildItem -Path $versionFile | Select-Object Mode, LastWriteTime, Length, Name | Format-Table
            Get-Content -Path $versionFile

            if (Test-Path $versionFile) {
              $json = Get-Content $versionFile | ConvertFrom-Json
              $version = $json.version
              Write-Host "`n🚀 Versión detectada para app: $version"
              Write-Host "##vso[task.setvariable variable=version]$version"
            } else {
              Write-Output "`n##vso[task.logissue type=error]⚠️ No se encontro archivo de versión para app"
              exit 99
            }
        displayName: "📚 Read Version"
        condition: succeeded()

      - task: PowerShell@2
        inputs:
          targetType: inline
          script: |
            Write-Host "🔐 Obteniendo token de AWS CodeArtifact..."

            $token = aws codeartifact get-authorization-token `
              --domain matrixtech-npm-repository `
              --domain-owner $env:ACCOUNT_ID_DEPLOY `
              --region $env:AWS_DEFAULT_REGION `
              --query authorizationToken `
              --output text

            if (-not $token) {
              Write-Output "`n##vso[task.logissue type=error]⚠️ No se pudo obtener el token de AWS CodeArtifact"
              exit 99
            }

            $repoDomain = "matrixtech-npm-repository-$($env:ACCOUNT_ID_DEPLOY).d.codeartifact.$($env:AWS_DEFAULT_REGION).amazonaws.com"
            $repoPath = "npm/matrixtech-npm-repository"
            $repoUrl = "https://$repoDomain/$repoPath"

            Write-Host "Configurando npm..."
            npm config set "//$repoDomain/$repoPath/:_authToken" $token
            npm config set registry $repoUrl

            Write-Host "Verificando identidad de AWS..."
            aws sts get-caller-identity

            Write-Host "`n📁 Generando archivo .npmrc"
            $npmrcPath = Join-Path "$(System.DefaultWorkingDirectory)" ".npmrc"
            @"
            //$repoDomain/$repoPath/:_authToken=$token
            registry=$repoUrl
            "@ | Set-Content -Encoding UTF8 -Path $npmrcPath
            Get-Item $npmrcPath | Select-Object Mode, LastWriteTime, Length, Name | Format-Table
        displayName: "🔐 Setup CodeArtifact & npm config"
        condition: succeeded()
        env:
          AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)
          AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID_DEPLOY)
          AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY_DEPLOY)

      - task: PowerShell@2
        inputs:
          targetType: inline
          script: |
            $CURRENT_BRANCH="$(Build.SourceBranchName)"
            switch -Wildcard ($CURRENT_BRANCH) {
                "staging" { $environment = $env:environment_staging }
                "master"  { $environment = $env:region }
                default   { $environment = "develop" }
            }

            @"
            VITE_DOMAIN="$(VITE_DOMAIN)"
            URL_APP="$(URL_APP)"
            TARGET="windows"
            CERT_FILE="./certs/invictus.pfx"
            WIN_CERT_PASS="$env:CERT_PASSWORD"
            WIN_CERT_PUBLISHER="UX Technology"
            "@ | Set-Content -Encoding UTF8 .env

            Write-Host "##vso[task.setvariable variable=environment]$environment"
            Write-Host "`n📁 File: .env"
            Get-Item .env | Select-Object Mode, LastWriteTime, Length, Name | Format-Table
            Get-Content .env
        displayName: "⚙️ Generate .env"
        condition: succeeded()
        env:
          CERT_PASSWORD: $(CERT_PASSWORD)
          region: ${{ parameters.region }}
          environment_staging: ${{ parameters.environment_staging }}

      - task: PowerShell@2
        inputs:
          targetType: inline
          script: |
            Write-Host "📥 Descargando certificados..."
            aws s3 cp s3://applications-$(ACCOUNT_ID_INVICTUS)/certs/ ./certs --recursive

            Write-Host "`n📂 Directorio: certs"
            Get-ChildItem -Force ./certs
        displayName: "📥 Download certificates for signing"
        condition: succeeded()
        env:
          AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)
          AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID_INVICTUS)
          AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY_INVICTUS)

      - task: UsePythonVersion@0
        inputs:
          versionSpec: "$(pythonVersion)"
          addToPath: true
        displayName: "🔧 Use Python $(pythonVersion)"
        condition: succeeded()

      - task: UseNode@1
        inputs:
          version: "$(nodeVersion)"
        displayName: "🔧 Install Nodejs $(nodeVersion)"
        condition: succeeded()

      - task: PowerShell@2
        inputs:
          targetType: inline
          script: |
            Write-Host "📦 Modificando versión en package.json: $env:version"
            $packagePath = "$(Build.SourcesDirectory)\package.json"

            if (Test-Path $packagePath) {
              $packageJson = Get-Content $packagePath -Raw | ConvertFrom-Json
              $packageJson.version = $env:version
              $packageJson | ConvertTo-Json -Depth 10 | Set-Content -Encoding UTF8 $packagePath

              Write-Host "`n✅ Version en package.json actualizada correctamente."
              Get-Content $packagePath | ForEach-Object { Write-Host $_ }
            } else {
              Write-Output "`n##vso[task.logissue type=error]⚠️ No se encontro el archivo package.json en la ruta [$packagePath]"
              exit 99
            }
        displayName: "📝 Update Version package.json"
        condition: succeeded()

      - task: PowerShell@2
        inputs:
          targetType: inline
          script: |
            $filePath = "$(Build.SourcesDirectory)\package.json"

            if (Test-Path $filePath) {
                $bytes = [System.IO.File]::ReadAllBytes($filePath)
                if ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF) {
                    [System.IO.File]::WriteAllBytes($filePath, $bytes[3..($bytes.Length-1)])
                    Write-Host "`n⚠️ BOM removed from package.json"
                } else {
                    Write-Host "`n✅ package.json no contiene BOM"
                }
            } else {
                Write-Output "`n##vso[task.logissue type=error]⚠️ Error: package.json no se encontró en $filePath"
                exit 99
            }
        displayName: "🧹 Remove BOM from package.json"
        condition: succeeded()

      - task: PowerShell@2
        inputs:
          targetType: inline
          script: |
            Write-Host "`n📁 Generando archivo .pnpmrc en: $(System.DefaultWorkingDirectory)\.pnpmrc"
            $filePath = "$(System.DefaultWorkingDirectory)\.pnpmrc"
            $fileContent = @"
            node-linker=hoisted
            shamefully-hoist=true
            ignore-scripts=false
            allow-build-script=true
            strict-peer-dependencies=false
            "@
            Set-Content -Path $filePath -Value $fileContent -Encoding UTF8
            Get-ChildItem -Path $filePath | Select-Object Mode, LastWriteTime, Length, Name | Format-Table
            Get-Content -Path $filePath

            Get-Content $filePath | Add-Content -Path $(System.DefaultWorkingDirectory)\.npmrc -Encoding UTF8
            Write-Host "`n✅ Contenido de .pnpmrc anexado a .npmrc correctamente."

            Write-Host "`n⚙️ Instalando dependencias node..."
            npm install -g pnpm
            pnpm install
            pnpm exec electron-builder install-app-deps
            pnpm ignored-builds

            $output = pnpm ls --depth=0
            if (-not $output) {
              Write-Output "`n##vso[task.logissue type=error]⚠️ No se instalaron dependencias, esperar que se actualicen las dependencias a nivel global"
              exit 99
            } else {
              Write-Host "`n✅ Dependencias Instaladas:"
              Write-Host $output
            }
        displayName: "⚙️ Install Dependencies"
        condition: succeeded()

      - task: PowerShell@2
        inputs:
          targetType: " inline"
          script: |
            $ErrorActionPreference = "Stop"
            Write-Host "`n📦 Build Electron..."
            pnpm run build
        displayName: "📦 Build Electron Windows"
        condition: succeeded()

      - task: PowerShell@2
        inputs:
          targetType: " inline"
          script: |
            Write-Host "📝 Validando build electron..."

            $BASE_PATH = "$(Build.SourcesDirectory)\release\$($env:version)\windows"
            $APP_DIR="$BASE_PATH\app"
            New-Item -ItemType Directory -Path $APP_DIR -Force | Out-Null
            $allFound = $true 

            Write-Host "`n📂 Directorio: $BASE_PATH"
            Get-ChildItem -Path $BASE_PATH -Force | Sort-Object LastWriteTime -Descending
            Write-Host ""

            $filesToCopy = @(
              "InvictusUX Setup $($env:version).exe",
              "InvictusUX Setup $($env:version).exe.blockmap",
              "latest.yml"
            )

            foreach ($file in $filesToCopy) {
              $sourcePath      = Join-Path "$BASE_PATH" $file
              $destinationPath = Join-Path "$APP_DIR" $file

              if (Test-Path $sourcePath) {
                Copy-Item -Path $sourcePath -Destination $destinationPath -Force | Out-Null
                Write-Host "📂 Copiado: $file -> $destinationPath"
              } else {
                Write-Host "⚠️ Archivo no encontrado $file"
                $allFound = $false
              }
            }

            if (-not $allFound) {
              Write-Output "`n##vso[task.logissue type=error]⚠️ Error: archivos requeridos no encontrados."
              exit 99
            } else {
              New-Item -ItemType Directory -Path "$(Build.ArtifactStagingDirectory)\release\$($env:environment)\windows" -Force | Out-Null
              Copy-Item -Path "$APP_DIR\*" -Destination "$(Build.ArtifactStagingDirectory)\release\$($env:environment)\windows" -Recurse -Force

              Write-Host "`n📂 Directorio: $APP_DIR"
              Get-ChildItem "$APP_DIR" | Select-Object Mode, LastWriteTime, Length, Name | Format-Table
            }
        displayName: "🔎 Validate Build"
        condition: succeeded()

      - task: PublishBuildArtifacts@1
        inputs:
          PathtoPublish: "$(Build.ArtifactStagingDirectory)/release"
          ArtifactName: "release"
          publishLocation: "Container"
        displayName: "📤 Publish Artifacts Electron"
        condition: succeeded()
