jobs:
  #
  # Electron Linux
  #
  - job: build_electron_linux
    displayName: "📦 build electron Linux"
    pool:
      name: "Azure Pipelines"
      VmImage: ubuntu-22.04

    variables:
      - template: ../../variables/groups-transversal-variables-electron.yml
        parameters:
          region: ${{ parameters.region }}

    steps:
      - checkout: electron
        fetchDepth: 0
        persistCredentials: true

      - script: |
          CURRENT_BRANCH="$(Build.SourceBranch)"
          electronBranch="unknown"

          case "$CURRENT_BRANCH" in
            refs/heads/feature/*) electronBranch="feature/security-vulnerability-refactor"; ;;
            refs/heads/hotfix/*)  electronBranch="feature/security-vulnerability-refactor"; ;;
            refs/heads/develop)   electronBranch="feature/security-vulnerability-refactor"; ;;
            refs/heads/staging)   electronBranch="staging"; ;;
            refs/heads/master)    electronBranch="master"; ;;
          esac

          if [[ "$electronBranch" == "unknown" ]]; then
            echo -e "\n⚠️ Electron Branch [$electronBranch] no reconocida"
            exit 99
          fi

          echo "##vso[task.setvariable variable=electronBranch]$electronBranch"
          echo ""
          echo "ℹ️ Branch Actual: $CURRENT_BRANCH"
          echo "ℹ️ Branch Checkout: $electronBranch"
        displayName: "📌 Set Electron Branch"
        condition: and(succeeded(), eq(${{ parameters.microFronted }}, true))

      - script: |
          echo -e "\n🔀 Cambiando a la rama: electron@$(electronBranch)"
          git fetch origin $(electronBranch)
          git checkout $(electronBranch)
          git pull origin $(electronBranch)
        displayName: "🔄 Checkout electron@$(electronBranch)"
        condition: and(succeeded(), eq(${{ parameters.microFronted }}, true))

      - task: DownloadBuildArtifacts@0
        inputs:
          artifactName: "versions"
          downloadPath: "$(Pipeline.Workspace)/downloaded-versions"
        displayName: "📥 Download Version"

      - script: |
          echo -e "\n📁 Archivo version.json:"
          ls -l $(Pipeline.Workspace)/downloaded-versions/versions/electron/
          VERSION_FILE="$(Pipeline.Workspace)/downloaded-versions/versions/electron/version.json"
          if [[ -f "$VERSION_FILE" ]]; then
            VERSION=$(jq -r '.version' $VERSION_FILE)
            echo -e "\n🚀 Versión detectada para $(Build.Repository.Name): $VERSION"
            echo "##vso[task.setvariable variable=msVersion]$VERSION"
          else
            echo -e "\n##vso[task.logissue type=error]❌ No se encontro archivo de versión para $(Build.Repository.Name)"
            exit 99
          fi
        displayName: "📚 Read Version"

      - task: DownloadPipelineArtifact@2
        inputs:
          artifact: dists
          path: $(Pipeline.Workspace)/downloaded-dists
        displayName: "📥 Download Dists"

      - script: |
          DISTS_PATH="$(Pipeline.Workspace)/downloaded-dists/${{ parameters.region }}"
          DISTS_COUNT=$(ls "$DISTS_PATH" | wc -l)

          if [[ "$DISTS_COUNT" == "1" ]]; then
            cp -R $DISTS_PATH $(System.DefaultWorkingDirectory)/apps

            echo -e "\n📁 Dists copiados en: $(System.DefaultWorkingDirectory)/apps"
            ls -l $(System.DefaultWorkingDirectory)
            echo -e "\n📁 Dists apps"
            ls -l $(System.DefaultWorkingDirectory)/apps
          else
            echo -e "\n⚠️ Error no tiene exactamente todos los dists en: $DISTS_PATH"
            exit 99
          fi
        displayName: "🔎 Validate and Copy Dists"

      - task: Bash@3
        name: AuthCodeArtifact
        inputs:
          targetType: "inline"
          script: |
            echo -e "\n🔐 Obteniendo token de AWS CodeArtifact..."
            token=$(aws codeartifact get-authorization-token \
              --domain matrixtech-npm-repository \
              --domain-owner "$ACCOUNT_ID_DEPLOY" \
              --region "$AWS_DEFAULT_REGION" \
              --query authorizationToken \
              --output text)

            REPO_DOMAIN="matrixtech-npm-repository-$ACCOUNT_ID_DEPLOY.d.codeartifact.$AWS_DEFAULT_REGION.amazonaws.com"
            REPO_PATH="npm/matrixtech-npm-repository"
            REPO_URL="https://$REPO_DOMAIN/$REPO_PATH"

            echo "Configurando npm..."
            npm config set "//$REPO_DOMAIN/$REPO_PATH/:_authToken" "$token"
            npm config set registry "$REPO_URL"

            echo "Verificando identidad de AWS..."
            aws sts get-caller-identity

            echo -e "\nGenerando archivo .npmrc"
            cat <<EOF > ".npmrc"
            //$REPO_DOMAIN/$REPO_PATH/:_authToken=$token
            registry=$REPO_URL
            EOF
            ls -l .npmrc
        displayName: "🔐 Setup CodeArtifact & npm config"
        env:
          AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID_DEPLOY)
          AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY_DEPLOY)
          AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)

      - script: |
          echo -e "\n📁 Generando .env"
          CURRENT_BRANCH="$(Build.SourceBranch)"
          region="unknown"
          environment="unknown"
          red=${{ parameters.region }}

          case "$CURRENT_BRANCH" in
            refs/heads/feature/*) environment="dev"; region="dev"; ;;
            refs/heads/hotfix/*)  environment="dev"; region="dev"; ;;
            refs/heads/develop)   environment="dev"; region="dev"; ;;
            refs/heads/staging)   environment="qa";  region="qa"; ;;
            refs/heads/master) 
              case "$red" in
                "antioquia") environment="production"; region="matrixtech"; ;;
                "cap")       environment="production"; region="cap"; ;;
                "tolima")    environment="production"; region="seapto"; ;;
                "huila")     environment="production"; region="suchance"; ;;
                "cauca")     environment="production"; region="acertemos"; ;;
                "boyaca")    environment="production"; region="jer"; ;;
              esac ;;
          esac

          if [ "$environment" = "unknown" ] || [ "$region" = "unknown" ]; then
            echo -e "\n⚠️ Environment o Region no reconocidos"
            echo "Environment: [$environment]"
            echo "Región: [$region]"
            exit 99
          fi

          # cat <<EOF > .env
          # DOMAIN_ADMIN="${BASE_URL_ELECTRON_ADMIN}"
          # DOMAIN_SELLER="${BASE_URL_ELECTRON_SELLERS}"
          # TARGET="linux"
          # TARGET_ENVIRONMENT="$environment"
          # EOF

          envPath="$(System.DefaultWorkingDirectory)/.env"
          cat <<EOF > $envPath
          DOMAIN_ADMIN="Administradores|mdiAccountChild|invictus-admin-api-dev.ux.technology/"
          DOMAIN_SELLER="Vendedores|mdiAccountChild|https://invictus-sellers-api-dev.ux.technology/"
          TARGET="linux"
          TARGET_ENVIRONMENT="$environment"
          EOF

          echo "##vso[task.setvariable variable=environment]$environment"
          echo "##vso[task.setvariable variable=region]$region"
          echo -e "\n✅ Archivo .env creado correctamente"
          ls -la $(System.DefaultWorkingDirectory)
          cat $envPath
        displayName: "⚙️ Generate .env"

      - task: UsePythonVersion@0
        displayName: "🔧 Use Python $(pythonVersion)"
        inputs:
          versionSpec: "$(pythonVersion)"
          addToPath: true

      - task: NodeTool@0
        displayName: "🔧 Install Nodejs $(nodeVersion)"
        inputs:
          versionSource: "spec"
          versionSpec: "$(nodeVersion)"

      - script: |
          echo -e "\n📦 Modificando versión en package.json: $(msVersion)"
          PACKAGE_PATH="$(Build.SourcesDirectory)/package.json"

          if [[ -f "$PACKAGE_PATH" ]]; then
            jq --arg ver "$(msVersion)" '.version = $ver' "$PACKAGE_PATH" > "$PACKAGE_PATH.tmp" && mv "$PACKAGE_PATH.tmp" "$PACKAGE_PATH"

            echo -e "\n✅ Versión en package.json actualizada correctamente."
            cat "$PACKAGE_PATH"
          else
            echo -e "\n❌ No se encontró el archivo package.json en la ruta [$PACKAGE_PATH]"
            exit 99
          fi
        displayName: "📝 Update version in package.json"

      - script: |
          echo -e "\n📦 Instalando dependencias ubuntu..."
          sudo apt-get update
          sudo apt-get install -y libcups2-dev

          echo -e "\n📦 Instalando dependencias node..."
          npm_config_legacy_peer_deps=true npm i

          echo -e "\n📦 Dependencias instaladas:"
          npm list --depth=0
        displayName: "⚙️ Install dependencies"

      - script: |
          echo -e "\n📦 Build electron"
          npm_config_legacy_peer_deps=true npm run build
        displayName: "📦 Build electron"

      - script: |
          echo -e "\n📝 Validando build electron..."

          BASE_PATH="$(Build.SourcesDirectory)/release/$(environment)/$(msVersion)"
          REGION_PATH="$BASE_PATH/$(region)"
          mkdir -p "$REGION_PATH"
          all_found=true

          FILES_TO_COPY=(
            "InvictusUX-$(msVersion).AppImage"
            "latest-linux.yml"
          )

          for file in "${FILES_TO_COPY[@]}"; do
            source_path="$BASE_PATH/$file"
            destination_path="$REGION_PATH/$file"

            if [ -f "$source_path" ]; then
              cp -f "$source_path" "$destination_path"
              echo "📂 Copiado: $file -> $destination_path"
            else
              echo "⚠️ Archivo no encontrado $file -> $source_path"
              all_found=false
            fi
          done

          if [ "$all_found" = false ]; then
            echo -e "\n❌ Error: archivos requeridos no encontrados."
            exit 99
          else
            echo -e "\n📂 Directorio: $REGION_PATH"
            ls -l "$REGION_PATH"
          fi
        displayName: "🔍 Validate Build"

      - script: |
          echo -e "\n📦 Cargando al Bucket S3..."
          BASE_PATH="$(Build.SourcesDirectory)/release/$(environment)/$(msVersion)/$(region)"

          echo -e "\n📂 Archivos a cargar: $BASE_PATH"
          ls -l "$BASE_PATH"

          #aws s3 cp "$BASE_PATH" "s3://e-remote/invictus-electron/linux/$(region)" --recursive --acl public-read
          aws s3 cp "$BASE_PATH" "s3://e-remote/invictus-electron/linux/dev-test/$(region)" --recursive --acl public-read

          echo -e "\n✅ Archivos subidos exitosamente."
          echo "🔗 APP: InvictusUX-$(msVersion).AppImage"
          #echo "🔗 URL: https://e-remote.s3.us-east-1.amazonaws.com/invictus-electron/linux/$(environment)/InvictusUX-$(msVersion).AppImage"
          echo "🔗 URL: https://e-remote.s3.us-east-1.amazonaws.com/invictus-electron/linux/dev-test/$(environment)/InvictusUX-$(msVersion).AppImage"

        displayName: "📤 Upload Bucket S3"
        #condition: not(startsWith(variables['Build.SourceBranch'], 'refs/heads/feature/'))
        env:
          AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID_DEPLOY)
          AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY_DEPLOY)
          AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)

  #
  # Electron Windows
  #
  - job: build_electron_windows
    displayName: "📦 build electron Windows"
    pool:
      name: "Azure Pipelines"
      vmImage: "windows-latest"

    variables:
      - template: ../../variables/groups-transversal-variables-electron.yml
        parameters:
          region: ${{ parameters.region }}

    steps:
      - checkout: electron
        fetchDepth: 0
        persistCredentials: true

      - task: PowerShell@2
        displayName: "📌 Set Electron Branch"
        inputs:
          targetType: "inline"
          script: |
            $CURRENT_BRANCH = "$(Build.SourceBranch)"
            $electronBranch = "unknown"

            switch -Wildcard ($CURRENT_BRANCH) {
              "refs/heads/feature/*" { $electronBranch = "feature/security-vulnerability-refactor" }
              "refs/heads/hotfix/*"  { $electronBranch = "feature/security-vulnerability-refactor" }
              "refs/heads/develop"   { $electronBranch = "feature/security-vulnerability-refactor" }
              "refs/heads/staging"   { $electronBranch = "staging" }
              "refs/heads/master"    { $electronBranch = "master" }
            }

            if ($electronBranch -eq "unknown") {
              Write-Host "`n⚠️ Electron Branch [$electronBranch] no reconocida"
              exit 99
            }

            Write-Host "##vso[task.setvariable variable=electronBranch]$electronBranch"
            Write-Host "ℹ️ Branch Actual: $CURRENT_BRANCH"
            Write-Host "ℹ️ Branch Checkout: $electronBranch"
        condition: and(succeeded(), eq(${{ parameters.microFronted }}, true))

      - task: PowerShell@2
        displayName: "🔄 Checkout electron@$(electronBranch)"
        inputs:
          targetType: "inline"
          script: |
            Write-Host "`n🔀 Cambiando a la rama: electron@$($env:electronBranch)"
            git fetch origin $($env:electronBranch)
            git checkout $($env:electronBranch)
            git pull origin $($env:electronBranch)
        condition: and(succeeded(), eq(${{ parameters.microFronted }}, true))

      - task: DownloadBuildArtifacts@0
        displayName: "📥 Download Version"
        inputs:
          artifactName: "versions"
          downloadPath: "$(Pipeline.Workspace)/downloaded-versions"

      - task: PowerShell@2
        displayName: "📚 Read version"
        inputs:
          targetType: "inline"
          script: |
            $ErrorActionPreference = "Stop"
            $versionFile = "$(Pipeline.Workspace)\downloaded-versions\versions\electron\version.json"
            if (Test-Path $versionFile) {
              $json = Get-Content $versionFile | ConvertFrom-Json
              $version = $json.version
              $baseVersion = $version.Split('-')[0]
              Write-Host "`n🚀 Versión detectada para .exe: $baseVersion"
              Write-Host "##vso[task.setvariable variable=version]$baseVersion"
            } else {
              Write-Host "`n❌ No se encontro archivo de versión para .exe"
              exit 99
            }

      - task: DownloadBuildArtifacts@0
        displayName: "📥 Download Dists"
        inputs:
          artifactName: "dists"
          downloadPath: "$(Pipeline.Workspace)/downloaded-dists"

      - task: PowerShell@2
        displayName: "🔎 Validate and Copy Dists"
        inputs:
          targetType: "inline"
          script: |
            $DISTS_PATH = "$(Pipeline.Workspace)\downloaded-dists\${{ parameters.region }}"
            $DEST_PATH = "$(System.DefaultWorkingDirectory)\apps"

            if (-Not (Test-Path $DISTS_PATH)) {
              Write-Host "`n❌ El directorio $DISTS_PATH no existe"
              exit 99
            }

            $DISTS_COUNT = (Get-ChildItem -Path $DISTS_PATH | Measure-Object).Count

            if ($DISTS_COUNT -eq 1) {
              Write-Host "`n✅ Se encontró 1 dist. Copiando a: $DEST_PATH"
              Copy-Item -Path "$DISTS_PATH\*" -Destination $DEST_PATH -Recurse -Force

              Write-Host "`n📁 Dists copiados en: $DEST_PATH"
              Get-ChildItem -Path "$(System.DefaultWorkingDirectory)" | Format-Table Mode, LastWriteTime, Length, Name
              Write-Host "`n📁 Dists apps"
              Get-ChildItem -Path "$DEST_PATH" | Format-Table Mode, LastWriteTime, Length, Name
            }
            else {
              Write-Host "`n⚠️ Error: Se esperaban exactamente 1 dist, pero se encontraron $DISTS_COUNT en: $DISTS_PATH"
              exit 99
            }

      - task: PowerShell@2
        displayName: "🔐 Setup CodeArtifact & npm config"
        inputs:
          targetType: "inline"
          script: |
            $ErrorActionPreference = "Stop"
            Write-Host "🔐 Obteniendo token de AWS CodeArtifact..."

            $token = aws codeartifact get-authorization-token `
              --domain matrixtech-npm-repository `
              --domain-owner $env:ACCOUNT_ID_DEPLOY `
              --region $env:AWS_DEFAULT_REGION `
              --query authorizationToken `
              --output text

            if (-not $token) {
              Write-Error "`n❌ No se pudo obtener el token de AWS CodeArtifact"
              exit 99
            }

            $repoDomain = "matrixtech-npm-repository-$($env:ACCOUNT_ID_DEPLOY).d.codeartifact.$($env:AWS_DEFAULT_REGION).amazonaws.com"
            $repoPath = "npm/matrixtech-npm-repository"
            $repoUrl = "https://$repoDomain/$repoPath"

            Write-Host "Configurando npm..."
            npm config set "//$repoDomain/$repoPath/:_authToken" $token
            npm config set registry $repoUrl

            Write-Host "Verificando identidad de AWS..."
            aws sts get-caller-identity

            $npmrcPath = Join-Path "$(System.DefaultWorkingDirectory)" ".npmrc"
            @"
            //$repoDomain/$repoPath/:_authToken=$token
            registry=$repoUrl
            "@ | Set-Content -Encoding UTF8 -Path $npmrcPath

            Write-Host "`n✅ Archivo .npmrc creado correctamente"
            Get-Item $npmrcPath | Select-Object Name, FullName, Length, LastWriteTime, Mode
        env:
          AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID_DEPLOY)
          AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY_DEPLOY)
          AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)

      - task: PowerShell@2
        displayName: "⚙️ Generate .env"
        inputs:
          targetType: "inline"
          script: |
            $ErrorActionPreference = "Stop"

            Write-Host "`n📁 Generando .env"
            $currentBranch="$(Build.SourceBranch)"
            $region = "unknown"
            $environment = "unknown"
            $red = "${{ parameters.region }}"


            switch -Wildcard ($currentBranch) {
              "refs/heads/feature/*" { $environment = "dev"; $region = "dev"; }
              "refs/heads/hotix/*"   { $environment = "dev"; $region = "dev"; }
              "refs/heads/develop"   { $environment = "dev"; $region = "dev"; }
              "refs/heads/staging"   { $environment = "qa";  $region = "qa"; }
              "refs/heads/master" {
                switch ($red) {
                  "antioquia" { $environment = "production"; $region = "matrixtech"; }
                  "cap"       { $environment = "production"; $region = "cap"; }
                  "tolima"    { $environment = "production"; $region = "seapto"; }
                  "huila"     { $environment = "production"; $region = "suchance"; }
                  "cauca"     { $environment = "production"; $region = "acertemos"; }
                  "boyaca"    { $environment = "production"; $region = "jer"; }
                }
              }
            }

            if ($environment -eq "unknown" -or $region -eq "unknown") {
              Write-Host "`n⚠️ Environment o Region no reconocidos"
              Write-Host "Environment: [$environment]"
              Write-Host "Región: [$region]"
              exit 99
            }

            # $envContent = @"
            # DOMAIN_ADMIN="$(BASE_URL_ELECTRON_ADMIN)"
            # DOMAIN_SELLER="$(BASE_URL_ELECTRON_SELLERS)"
            # TARGET="windows"
            # TARGET_ENVIRONMENT="$environment"
            # "@

            $envPath = "$(System.DefaultWorkingDirectory)/.env"
            $envContent = @"
            DOMAIN_ADMIN="Administradores|mdiAccountChild|invictus-admin-api-dev.ux.technology/"
            DOMAIN_SELLER="Vendedores|mdiAccountChild|https://invictus-sellers-api-dev.ux.technology/"
            TARGET="linux"
            TARGET_ENVIRONMENT="$environment"
            "@

            Set-Content -Path $envPath -Value $envContent -Encoding UTF8
            Write-Host "##vso[task.setvariable variable=environment]$environment"
            Write-Host "##vso[task.setvariable variable=region]$region"

            Write-Host "`n✅ Archivo .env creado correctamente"
            Get-ChildItem -Path "$(System.DefaultWorkingDirectory)" -Force | Format-Table Mode, LastWriteTime, Length, Name -AutoSize
            Get-ChildItem -Path $envPath | Format-Table Mode, LastWriteTime, Length, Name -AutoSize

      - task: UsePythonVersion@0
        displayName: "🔧 Use Python $(versionPython)"
        inputs:
          versionSpec: "$(versionPython)"
          addToPath: true

      - task: NodeTool@0
        displayName: "🔧 Install Nodejs $(versionNode)"
        inputs:
          versionSource: "spec"
          versionSpec: "$(versionNode)"

      - task: PowerShell@2
        displayName: "📝 Update version in package.json"
        inputs:
          targetType: "inline"
          script: |
            $ErrorActionPreference = "Stop"
            Write-Host "📦 Modificando versión en package.json: $env:version"
            $packagePath = "$(Build.SourcesDirectory)\package.json"

            if (Test-Path $packagePath) {
              $packageJson = Get-Content $packagePath -Raw | ConvertFrom-Json
              $packageJson.version = $env:version
              $packageJson | ConvertTo-Json -Depth 10 | Set-Content -Encoding UTF8 $packagePath

              Write-Host "`n✅ Version en package.json actualizada correctamente."
              Get-Content $packagePath | ForEach-Object { Write-Host $_ }
            } else {
              Write-Host "`n❌ No se encontro el archivo package.json en la ruta [$packagePath]"
              exit 99
            }

      - task: PowerShell@2
        displayName: "🧹 Remove BOM from package.json"
        inputs:
          targetType: "inline"
          script: |
            $ErrorActionPreference = "Stop"
            $filePath = "$(Build.SourcesDirectory)\package.json"

            if (Test-Path $filePath) {
                $bytes = [System.IO.File]::ReadAllBytes($filePath)
                if ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF) {
                    [System.IO.File]::WriteAllBytes($filePath, $bytes[3..($bytes.Length-1)])
                    Write-Host "`n⚠️ BOM removed from package.json"
                } else {
                    Write-Host "`n✅ package.json no contiene BOM"
                }
            } else {
                Write-Warning "`n❌ package.json no se encontró en $filePath"
                exit 99
            }

      - task: PowerShell@2
        displayName: "⚙️ Install dependencies"
        inputs:
          targetType: "inline"
          script: |
            Write-Host "📦 Instalando dependencias"
            npm install

            Write-Host "`n📦 Dependencias instaladas:"
            npm list --depth=0

      - task: PowerShell@2
        displayName: "📦 Build electron"
        inputs:
          targetType: " inline"
          script: |
            Write-Host "📦 Ejecutando build..."
            npm run build

      - task: PowerShell@2
        displayName: "🔍 Validate Build"
        inputs:
          targetType: " inline"
          script: |
            $ErrorActionPreference = "Stop"
            Write-Host "📝 Validando build electron..."

            $basePath = "$(Build.SourcesDirectory)\release\$($env:environment)\$($env:version)"
            New-Item -ItemType Directory -Path $basePath\$($env:region) -Force | Out-Null
            $allFound = $true 

            $filesToCopy = @(
              "InvictusUX Setup $($env:version).exe",
              "InvictusUX Setup $($env:version).exe.blockmap",
              "latest.yml"
            )

            foreach ($file in $filesToCopy) {
              $sourcePath      = Join-Path "$basePath" $file
              $destinationPath = Join-Path "$basePath\$($env:region)" $file

              if (Test-Path $sourcePath) {
                Copy-Item -Path $sourcePath -Destination $destinationPath -Force
                Write-Host "📂 Copiado: $file -> $destinationPath"
              } else {
                Write-Host "⚠️ Archivo no encontrado $file -> $sourcePath"
                $allFound = $false
              }
            }

            if (-not $allFound) {
              Write-Error "`n❌ Error: archivos requeridos no encontrados."
              exit 99
            } else {
              Write-Host "`n📂 Directorio: $basePath\$($env:region)"
              Get-ChildItem "$basePath\$($env:region)" -Force | Select-Object Mode, LastWriteTime, Length, Name | Format-Table -AutoSize
            }

      - task: PowerShell@2
        displayName: "📤 Upload Bucket S3"
        inputs:
          targetType: " inline"
          script: |
            $ErrorActionPreference = "Stop"
            Write-Host "📦 Cargando al Bucket S3..."

            $basePath = "$(Build.SourcesDirectory)\release\$($env:environment)\$($env:version)\$($env:region)"
            Write-Host "`n📂 Archivos a cargar: $basePath"
            Get-ChildItem "$basePath" -Force | Select-Object Mode, LastWriteTime, Length, Name | Format-Table -AutoSize

            #aws s3 cp "$basePath" "s3://e-remote/invictus-electron/windows/$($env:region)" --recursive --acl public-read
            aws s3 cp "$basePath" "s3://e-remote/invictus-electron/windows/dev-test/$($env:region)" --recursive --acl public-read

            Write-Host "`n✅ Archivos subidos exitosamente."
            Write-Host "🔗 APP: InvictusUX Setup $($env:version).exe"
            #Write-Host "🔗 URL: https://e-remote.s3.us-east-1.amazonaws.com/invictus-electron/windows/$($env:environment)/InvictusUX+Setup+$($env:version).exe"
            Write-Host "🔗 URL: https://e-remote.s3.us-east-1.amazonaws.com/invictus-electron/windows/dev-test/$($env:environment)/InvictusUX+Setup+$($env:version).exe"

        condition: not(startsWith(variables['Build.SourceBranch'], 'refs/heads/feature/'))
        env:
          AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID_DEPLOY)
          AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY_DEPLOY)
          AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)
