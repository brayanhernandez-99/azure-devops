jobs:
  #
  # Electron Linux
  #
  - job: build_electron_linux
    displayName: "📦 build linux"
    pool:
      name: "Azure Pipelines"
      VmImage: ubuntu-22.04

    variables:
      - template: ../../variables/groups-transversal-variables-electron.yml
        parameters:
          region: ${{ parameters.region }}

    steps:
      - checkout: electron
        fetchDepth: 0
        persistCredentials: true

      - script: |
          CURRENT_BRANCH="$(Build.SourceBranch)"
          electronBranch="unknown"
          environment="unknown"

          case "$CURRENT_BRANCH" in
            refs/heads/feature/*) electronBranch="feature/security-vulnerability-refactor"; environment="dev"; ;;
            refs/heads/hotfix/*)  electronBranch="feature/security-vulnerability-refactor"; environment="dev"; ;;
            refs/heads/develop)   electronBranch="feature/security-vulnerability-refactor"; environment="dev"; ;;
            refs/heads/staging)   electronBranch="feature/security-vulnerability-refactor"; environment="qa"; ;;
            refs/heads/master)    electronBranch="master"; environment="production"; ;;
          esac

          if [[ "$electronBranch" == "unknown" ]] || [[ "$environment" = "unknown" ]]; then
            echo -e "\n⚠️ ElectronBranch o Environment no reconocidos"
            echo "⚠️ Electron Branch: [$electronBranch]"
            echo "⚠️ Environment: [$environment]"
            exit 99
          fi

          echo "##vso[task.setvariable variable=electronBranch]$electronBranch"
          echo "##vso[task.setvariable variable=environment]$environment"
          echo ""
          echo "ℹ️ Branch Actual: $CURRENT_BRANCH"
          echo "ℹ️ Electron Environment: $environment"
          echo "ℹ️ Electron Branch Checkout: $electronBranch"
        displayName: "📌 Set Electron Branch"
        condition: succeeded()

      - script: |
          echo -e "\n🔀 Cambiando a la rama: electron@$(electronBranch)"
          git fetch origin $(electronBranch)
          git checkout $(electronBranch)
          git pull origin $(electronBranch)
        displayName: "🔄 Checkout electron@$(electronBranch)"
        condition: succeeded()

      - task: DownloadBuildArtifacts@0
        inputs:
          artifactName: "versions"
          downloadPath: "$(Pipeline.Workspace)/versions-downloaded"
        displayName: "📥 Download Version"
        condition: succeeded()

      - script: |
          VERSION_FILE="$(Pipeline.Workspace)/versions-downloaded/versions/electron/version.json"
          if [[ -f "$VERSION_FILE" ]]; then
            VERSION=$(jq -r '.version' $VERSION_FILE)
            echo -e "\n🚀 Versión detectada para $(Build.Repository.Name): $VERSION"
            echo "##vso[task.setvariable variable=msVersion]$VERSION"
          else
            echo -e "\n##vso[task.logissue type=error]❌ No se encontro archivo de versión para $(Build.Repository.Name)"
            exit 99
          fi
        displayName: "📚 Read Version"
        condition: succeeded()

      - task: DownloadPipelineArtifact@2
        inputs:
          artifact: dists
          path: $(Pipeline.Workspace)/downloaded-dists
        displayName: "📥 Download Dists"
        condition: succeeded()

      # - script: |
      #     DISTS_PATH="$(Pipeline.Workspace)/downloaded-dists/${{ parameters.region }}"
      #     DISTS_COUNT=$(ls "$DISTS_PATH" | wc -l)

      #     if [[ "$DISTS_COUNT" == "15" ]]; then
      #       cp -R $DISTS_PATH $(System.DefaultWorkingDirectory)/apps

      #       echo -e "\n📁 Dists copiados en: $(System.DefaultWorkingDirectory)/apps"
      #       ls -l $(System.DefaultWorkingDirectory)
      #       echo -e "\n📁 Dists apps"
      #       ls -l $(System.DefaultWorkingDirectory)/apps
      #     else
      #       echo -e "\n⚠️ Error no tiene exactamente todos los dists en: $DISTS_PATH"
      #       ls -l $(System.DefaultWorkingDirectory)/apps
      #       exit 99
      #     fi
      #   displayName: "🔎 Validate and Copy Dists"
      #   condition: succeeded()

      - task: Bash@3
        name: AuthCodeArtifact
        inputs:
          targetType: "inline"
          script: |
            echo -e "\n🔐 Obteniendo token de AWS CodeArtifact..."
            token=$(aws codeartifact get-authorization-token \
              --domain matrixtech-npm-repository \
              --domain-owner "$ACCOUNT_ID_DEPLOY" \
              --region "$AWS_DEFAULT_REGION" \
              --query authorizationToken \
              --output text)

            REPO_DOMAIN="matrixtech-npm-repository-$ACCOUNT_ID_DEPLOY.d.codeartifact.$AWS_DEFAULT_REGION.amazonaws.com"
            REPO_PATH="npm/matrixtech-npm-repository"
            REPO_URL="https://$REPO_DOMAIN/$REPO_PATH"

            echo "Configurando npm..."
            npm config set "//$REPO_DOMAIN/$REPO_PATH/:_authToken" "$token"
            npm config set registry "$REPO_URL"

            echo "Verificando identidad de AWS..."
            aws sts get-caller-identity

            echo -e "\nGenerando archivo .npmrc"
            cat <<EOF > ".npmrc"
            //$REPO_DOMAIN/$REPO_PATH/:_authToken=$token
            registry=$REPO_URL
            ignore-scripts=false
            enable-pre-post-scripts=true
            legacy-peer-deps=true
            EOF
            ls -l .npmrc
        displayName: "🔐 Setup CodeArtifact & npm config"
        condition: succeeded()
        env:
          AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID_DEPLOY)
          AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY_DEPLOY)
          AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)

      - script: |
          echo -e "\nℹ️ Creando archivo .env..." 
          echo "Electron Branch: $(electronBranch)"
          echo "Electron Environment: $(environment)"

          # envPath="$(System.DefaultWorkingDirectory)/.env"
          # cat <<EOF > $envPath
          # DOMAIN_ADMIN="${BASE_URL_ELECTRON_ADMIN}"
          # DOMAIN_SELLER="${BASE_URL_ELECTRON_SELLERS}"
          # TARGET="linux"
          # TARGET_ENVIRONMENT="$(environment)"
          # EOF

          envPath="$(System.DefaultWorkingDirectory)/.env"
          cat <<EOF > $envPath
          DOMAIN_ADMIN="Administradores|mdiAccountChild|invictus-admin-api-qa.ux.technology/"
          DOMAIN_SELLER="Vendedores|mdiAccountChild|https://invictus-sellers-api-qa.ux.technology/"
          TARGET="linux"
          TARGET_ENVIRONMENT="$(environment)"
          EOF

          echo -e "\n✅ Archivo .env creado correctamente"
          ls -la $(System.DefaultWorkingDirectory)

          echo -e "\n📁 Generando .env"
          cat $envPath
        displayName: "⚙️ Generate .env"
        condition: succeeded()

      - task: UsePythonVersion@0
        displayName: "🔧 Use Python $(pythonVersion)"
        inputs:
          versionSpec: "$(pythonVersion)"
          addToPath: true
        condition: succeeded()

      - task: NodeTool@0
        displayName: "🔧 Install Nodejs $(nodeVersion)"
        inputs:
          versionSource: "spec"
          versionSpec: "$(nodeVersion)"
        condition: succeeded()

      - script: |
          echo -e "\n📦 Modificando versión en package.json: $(msVersion)"
          PACKAGE_PATH="$(Build.SourcesDirectory)/package.json"

          if [[ -f "$PACKAGE_PATH" ]]; then
            jq --arg ver "$(msVersion)" '.version = $ver' "$PACKAGE_PATH" > "$PACKAGE_PATH.tmp" && mv "$PACKAGE_PATH.tmp" "$PACKAGE_PATH"

            echo -e "\n✅ Versión en package.json actualizada correctamente."
            cat "$PACKAGE_PATH"
          else
            echo -e "\n❌ No se encontró el archivo package.json en la ruta [$PACKAGE_PATH]"
            exit 99
          fi
        displayName: "📝 Update version in package.json"
        condition: succeeded()

      - script: |
          echo -e "\n📦 Instalando dependencias ubuntu..."
          sudo apt-get update
          sudo apt-get install -y libcups2-dev

          echo -e "\n📦 Instalando dependencias node..."
          #npm_config_legacy_peer_deps=true npm i
          npm install -g pnpm
          pnpm i

          echo -e "\n📦 Dependencias instaladas:"
          #npm list --depth=0
          pnpm list --depth=0
        displayName: "⚙️ Install dependencies"
        condition: succeeded()

      - script: |
          echo -e "\n📦 Build electron"
          #npm_config_legacy_peer_deps=true npm run build
          pnpm run build
        displayName: "📦 Build electron"
        condition: succeeded()

      - script: |
          echo -e "\n📝 Validando build electron..."
          BASE_PATH="$(Build.SourcesDirectory)/release/$(environment)/$(msVersion)"
          APP_DIR="$BASE_PATH/app"
          mkdir -p $APP_DIR
          all_found=true

          FILES_TO_COPY=(
            "InvictusUX-$(msVersion).AppImage"
            # "latest-linux.yml"
          )

          for file in "${FILES_TO_COPY[@]}"; do
            source_path="$BASE_PATH/$file"
            destination_path="$APP_DIR/$file"

            if [[ -f "$source_path" ]]; then
              cp -f "$source_path" "$destination_path"
              echo "📂 Copiado: $file -> $destination_path"
            else
              echo "⚠️ Archivo no encontrado: $file"
              all_found=false
            fi
          done

          if [[ "$all_found" == false ]]; then
            echo -e "\n❌ Error: archivos requeridos no encontrados."
            exit 99
          else
            mkdir -p "$(Build.ArtifactStagingDirectory)/electron-artifacts/linux"
            cp -R $APP_DIR/* "$(Build.ArtifactStagingDirectory)/electron-artifacts/linux/"

            echo -e "\n📂 Directorio: $APP_DIR"
            ls -l $APP_DIR
          fi
        displayName: "🔍 Validate Build"
        condition: succeeded()

      - task: PublishBuildArtifacts@1
        inputs:
          PathtoPublish: "$(Build.ArtifactStagingDirectory)/electron-artifacts"
          ArtifactName: "electron"
          publishLocation: "Container"
        displayName: "📤 Publish artifact electron"
        condition: succeeded()

  #
  # Electron Windows
  #
  - job: build_electron_windows
    displayName: "📦 build windows"
    pool:
      name: "Azure Pipelines"
      vmImage: "windows-latest"

    variables:
      - template: ../../variables/groups-transversal-variables-electron.yml
        parameters:
          region: ${{ parameters.region }}

    steps:
      - checkout: electron
        fetchDepth: 0
        persistCredentials: true

      - task: PowerShell@2
        displayName: "📌 Set Electron Branch"
        inputs:
          targetType: "inline"
          script: |
            $CURRENT_BRANCH = "$(Build.SourceBranch)"
            $electronBranch = "unknown"
            $environment = "unknown"

            switch -Wildcard ($CURRENT_BRANCH) {
              "refs/heads/feature/*" { $electronBranch = "feature/security-vulnerability-refactor"; $environment = "dev" }
              "refs/heads/hotfix/*"  { $electronBranch = "feature/security-vulnerability-refactor"; $environment = "dev" }
              "refs/heads/develop"   { $electronBranch = "feature/security-vulnerability-refactor"; $environment = "dev" }
              "refs/heads/staging"   { $electronBranch = "feature/security-vulnerability-refactor"; $environment = "qa" }
              "refs/heads/master"    { $electronBranch = "master"; $environment = "production" }
            }

            if ($electronBranch -eq "unknown" -or $environment -eq "unknown") {
              Write-Host "`n⚠️  ElectronBranch o Environment no reconocidos"
              Write-Host "⚠️ Electron Branch: [$electronBranch]"
              Write-Host "⚠️ Environment: [$environment]"
              exit 99
            }

            Write-Host "##vso[task.setvariable variable=electronBranch]$electronBranch"
            Write-Host "##vso[task.setvariable variable=environment]$environment"
            Write-Host ""
            Write-Host "ℹ️ Branch Actual: $CURRENT_BRANCH"
            Write-Host "ℹ️ Electron Environment: $environment"
            Write-Host "ℹ️ Electron Branch Checkout: $electronBranch"
        condition: succeeded()

      - task: PowerShell@2
        displayName: "🔄 Checkout electron@$(electronBranch)"
        inputs:
          targetType: "inline"
          script: |
            Write-Host "`n🔀 Cambiando a la rama: electron@$($env:electronBranch)"
            git fetch origin $($env:electronBranch)
            git checkout $($env:electronBranch)
            git pull origin $($env:electronBranch)
        condition: succeeded()

      - task: DownloadBuildArtifacts@0
        displayName: "📥 Download Version"
        inputs:
          artifactName: "versions"
          downloadPath: "$(Pipeline.Workspace)/versions-downloaded"
        condition: succeeded()

      - task: PowerShell@2
        displayName: "📚 Read version"
        inputs:
          targetType: "inline"
          script: |
            $versionFile = "$(Pipeline.Workspace)\versions-downloaded\versions\electron\version.json"
            if (Test-Path $versionFile) {
              $json = Get-Content $versionFile | ConvertFrom-Json
              $version = $json.version
              Write-Host "`n🚀 Versión detectada para .exe: $version"
              Write-Host "##vso[task.setvariable variable=version]$version"
            } else {
              Write-Host "`n❌ No se encontro archivo de versión para .exe"
              exit 99
            }
        condition: succeeded()

      - task: DownloadBuildArtifacts@0
        displayName: "📥 Download Dists"
        inputs:
          artifactName: "dists"
          downloadPath: "$(Pipeline.Workspace)/downloaded-dists"
        condition: succeeded()

      # - task: PowerShell@2
      #   displayName: "🔎 Validate and Copy Dists"
      #   inputs:
      #     targetType: "inline"
      #     script: |
      #       $DISTS_PATH = "$(Pipeline.Workspace)\downloaded-dists\dists\${{ parameters.region }}"
      #       $DISTS_COUNT = (Get-ChildItem -Path $DISTS_PATH).Count

      #       if ($DISTS_COUNT -eq 15) {
      #         New-Item -Path $(System.DefaultWorkingDirectory)\apps -ItemType Directory | Out-Null
      #         Copy-Item -Path "$DISTS_PATH\*" -Destination "$(System.DefaultWorkingDirectory)\apps" -Recurse -Force

      #         Write-Host "`n📁 Dists copiados en: $(System.DefaultWorkingDirectory)\apps"
      #         Get-ChildItem -Path "$(System.DefaultWorkingDirectory)" | Select-Object Mode, LastWriteTime, Length, Name | Format-Table
      #         Write-Host "`n📁 Dists apps"
      #         Get-ChildItem -Path "$(System.DefaultWorkingDirectory)\apps" | Select-Object Mode, LastWriteTime, Length, Name | Format-Table
      #       } else {
      #         Write-Host "`n⚠️ Error no tiene exactamente todos los dists en: $DISTS_PATH"
      #         Get-ChildItem -Path "$(System.DefaultWorkingDirectory)\apps" | Select-Object Mode, LastWriteTime, Length, Name | Format-Table
      #         exit 99
      #       }
      #   condition: succeeded()

      - task: PowerShell@2
        displayName: "🔐 Setup CodeArtifact & npm config"
        inputs:
          targetType: "inline"
          script: |
            Write-Host "🔐 Obteniendo token de AWS CodeArtifact..."

            $token = aws codeartifact get-authorization-token `
              --domain matrixtech-npm-repository `
              --domain-owner $env:ACCOUNT_ID_DEPLOY `
              --region $env:AWS_DEFAULT_REGION `
              --query authorizationToken `
              --output text

            if (-not $token) {
              Write-Error "`n❌ No se pudo obtener el token de AWS CodeArtifact"
              exit 99
            }

            $repoDomain = "matrixtech-npm-repository-$($env:ACCOUNT_ID_DEPLOY).d.codeartifact.$($env:AWS_DEFAULT_REGION).amazonaws.com"
            $repoPath = "npm/matrixtech-npm-repository"
            $repoUrl = "https://$repoDomain/$repoPath"

            Write-Host "Configurando npm..."
            npm config set "//$repoDomain/$repoPath/:_authToken" $token
            npm config set registry $repoUrl

            Write-Host "Verificando identidad de AWS..."
            aws sts get-caller-identity

            $npmrcPath = Join-Path "$(System.DefaultWorkingDirectory)" ".npmrc"
            @"
            //$repoDomain/$repoPath/:_authToken=$token
            registry=$repoUrl
            "@ | Set-Content -Encoding UTF8 -Path $npmrcPath

            Write-Host "`n✅ Archivo .npmrc creado correctamente"
            Get-Item $npmrcPath | Select-Object Mode, LastWriteTime, Length, Name | Format-Table
        condition: succeeded()
        env:
          AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID_DEPLOY)
          AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY_DEPLOY)
          AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)

      - task: PowerShell@2
        displayName: "⚙️ Generate .env"
        inputs:
          targetType: "inline"
          script: |
            Write-Host "`nℹ️ Creando archivo .env..."
            Write-Host "Electron Branch: $($env:electronBranch)" 
            Write-Host "Electron Environment: $($env:environment)"

            # $envPath = "$(System.DefaultWorkingDirectory)/.env"
            # $envContent = @"
            # DOMAIN_ADMIN="$(BASE_URL_ELECTRON_ADMIN)"
            # DOMAIN_SELLER="$(BASE_URL_ELECTRON_SELLERS)"
            # TARGET="windows"
            # TARGET_ENVIRONMENT="$($env:environment)"
            # "@

            $envPath = "$(System.DefaultWorkingDirectory)/.env"
            $envContent = @"
            DOMAIN_ADMIN="Administradores|mdiAccountChild|invictus-admin-api-qa.ux.technology/"
            DOMAIN_SELLER="Vendedores|mdiAccountChild|https://invictus-sellers-api-qa.ux.technology/"
            TARGET="windows"
            TARGET_ENVIRONMENT="$($env:environment)"
            "@
            Set-Content -Path $envPath -Value $envContent -Encoding UTF8

            Write-Host "`n✅ Archivo .env creado correctamente"
            Get-ChildItem -Path "$(System.DefaultWorkingDirectory)" | Select-Object Mode, LastWriteTime, Length, Name | Format-Table

            Write-Host "`n📁 Generando .env"
            Get-Content -Path $envPath
        condition: succeeded()

      - task: UsePythonVersion@0
        displayName: "🔧 Use Python $(pythonVersion)"
        inputs:
          versionSpec: "$(pythonVersion)"
          addToPath: true
        condition: succeeded()

      - task: NodeTool@0
        displayName: "🔧 Install Nodejs $(nodeVersion)"
        inputs:
          versionSource: "spec"
          versionSpec: "$(nodeVersion)"
        condition: succeeded()

      - task: PowerShell@2
        displayName: "📝 Update version in package.json"
        inputs:
          targetType: "inline"
          script: |
            Write-Host "📦 Modificando versión en package.json: $env:version"
            $packagePath = "$(Build.SourcesDirectory)\package.json"

            if (Test-Path $packagePath) {
              $packageJson = Get-Content $packagePath -Raw | ConvertFrom-Json
              $packageJson.version = $env:version
              $packageJson | ConvertTo-Json -Depth 10 | Set-Content -Encoding UTF8 $packagePath

              Write-Host "`n✅ Version en package.json actualizada correctamente."
              Get-Content $packagePath | ForEach-Object { Write-Host $_ }
            } else {
              Write-Host "`n❌ No se encontro el archivo package.json en la ruta [$packagePath]"
              exit 99
            }
        condition: succeeded()

      - task: PowerShell@2
        displayName: "🧹 Remove BOM from package.json"
        inputs:
          targetType: "inline"
          script: |
            $filePath = "$(Build.SourcesDirectory)\package.json"

            if (Test-Path $filePath) {
                $bytes = [System.IO.File]::ReadAllBytes($filePath)
                if ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF) {
                    [System.IO.File]::WriteAllBytes($filePath, $bytes[3..($bytes.Length-1)])
                    Write-Host "`n⚠️ BOM removed from package.json"
                } else {
                    Write-Host "`n✅ package.json no contiene BOM"
                }
            } else {
                Write-Warning "`n❌ package.json no se encontró en $filePath"
                exit 99
            }
        condition: succeeded()

      - task: PowerShell@2
        displayName: "⚙️ Install dependencies"
        inputs:
          targetType: "inline"
          script: |
            Write-Host "📦 Instalando dependencias"
            npm install

            Write-Host "`n📦 Dependencias instaladas:"
            npm list --depth=0
        condition: succeeded()

      - task: PowerShell@2
        displayName: "📦 Build electron"
        inputs:
          targetType: " inline"
          script: |
            Write-Host "📦 Ejecutando build..."
            npm run build
        condition: succeeded()

      - task: PowerShell@2
        displayName: "🔍 Validate Build"
        inputs:
          targetType: " inline"
          script: |
            Write-Host "📝 Validando build electron..."
            $BASE_PATH = "$(Build.SourcesDirectory)\release\$($env:environment)\$($env:version)"
            $APP_DIR="$BASE_PATH\app"
            New-Item -ItemType Directory -Path $APP_DIR -Force | Out-Null
            $allFound = $true 

            # Write-Host "***********"
            # Get-ChildItem -Path $BASE_PATH | Select-Object Mode, LastWriteTime, Length, Name | Format-Table
            # Write-Host "***********"

            $filesToCopy = @(
              "InvictusUX Setup $($env:version).exe",
              "InvictusUX Setup $($env:version).exe.blockmap"
              # "latest.yml"
            )

            foreach ($file in $filesToCopy) {
              $sourcePath      = Join-Path "$BASE_PATH" $file
              $destinationPath = Join-Path "$APP_DIR" $file

              if (Test-Path $sourcePath) {
                Copy-Item -Path $sourcePath -Destination $destinationPath -Force | Out-Null
                Write-Host "📂 Copiado: $file -> $destinationPath"
              } else {
                Write-Host "⚠️ Archivo no encontrado $file"
                $allFound = $false
              }
            }

            if (-not $allFound) {
              Write-Error "`n❌ Error: archivos requeridos no encontrados."
              exit 99
            } else {
              New-Item -ItemType Directory -Path "$(Build.ArtifactStagingDirectory)\electron-artifacts" | Out-Null
              New-Item -ItemType Directory -Path "$(Build.ArtifactStagingDirectory)\electron-artifacts\windows" | Out-Null
              Copy-Item -Path "$APP_DIR\*" -Destination "$(Build.ArtifactStagingDirectory)\electron-artifacts\windows" -Recurse -Force

              Write-Host "`n📂 Directorio: $APP_DIR"
              Get-ChildItem "$APP_DIR" | Select-Object Mode, LastWriteTime, Length, Name | Format-Table
            }
        condition: succeeded()

      - task: PublishBuildArtifacts@1
        inputs:
          PathtoPublish: "$(Build.ArtifactStagingDirectory)/electron-artifacts"
          ArtifactName: "electron"
          publishLocation: "Container"
        displayName: "📤 Publish artifact electron"
        condition: succeeded()
