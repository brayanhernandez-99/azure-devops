jobs:
  - job: build_electron
    displayName: "📦 build electron"
    pool:
      name: "Azure Pipelines"
      VmImage: ubuntu-22.04

    variables:
      - template: ../../variables/groups-transversal-variables-electron.yml
        parameters:
          region: ${{ parameters.region }}

    steps:
      - ${{ each msName in parameters.apps }}:
          - task: DownloadPipelineArtifact@2
            inputs:
              artifactName: "build-${{ msName }}"
              path: "$(Pipeline.Workspace)/frontend/${{ msName }}"
            displayName: "📥 Download Dist Files"

          - script: |
              echo "Archivos descargados:"
              ls -R $(Pipeline.Workspace)/frontend/${{ msName }}
            displayName: "👀 Verificar archivos descargados"
