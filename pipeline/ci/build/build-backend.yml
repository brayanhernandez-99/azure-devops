jobs:
  - job: "build_microservice"
    displayName: "🐳 build docker image"
    pool:
      name: "Azure Pipelines"
      vmImage: ubuntu-latest

    variables:
      - template: ../../variables/groups-variables-backend.yml

    steps:
      - checkout: self
        fetchDepth: 1
        persistCredentials: true

      - checkout: git://DevOps-templates-UX/pipelines-templates
        fetchDepth: 1
        persistCredentials: true

      - task: DownloadBuildArtifacts@0
        inputs:
          artifactName: "versions"
          downloadPath: "$(Pipeline.Workspace)"
        displayName: "📥 Download Version"
        condition: succeeded()

      - task: Bash@3
        inputs:
          targetType: inline
          script: |
            set -euo pipefail
            VERSION_FILE="$(Pipeline.Workspace)/versions/microservice/version.json"
            echo -e "\n📁 File: version.json"
            ls -la "$VERSION_FILE"
            jq . "$VERSION_FILE"

            if [[ -f "$VERSION_FILE" ]]; then
              VERSION=$(jq -r '.version' "$VERSION_FILE")
              echo -e "\n🚀 Versión detectada para $(Build.Repository.Name): $VERSION"
              echo "##vso[task.setvariable variable=version]$VERSION"
            else
              echo "##vso[task.logissue type=error]No se encontro archivo de versión"
              exit 99
            fi
        displayName: "📚 Read Version"
        condition: succeeded()

      - task: Bash@3
        inputs:
          targetType: inline
          script: |
            set -euo pipefail
            echo -e "\n🔐 Obteniendo tokens de AWS CodeArtifact..."

            token_matrix=$(aws codeartifact get-authorization-token \
              --domain matrixtech-npm-repository \
              --domain-owner "$ACCOUNT_ID_DEPLOY" \
              --region "$AWS_DEFAULT_REGION" \
              --query authorizationToken \
              --output text)

            token_ux=$(aws codeartifact get-authorization-token \
              --domain ux \
              --domain-owner "$ACCOUNT_ID_DEPLOY" \
              --region "$AWS_DEFAULT_REGION" \
              --query authorizationToken \
              --output text)

            REPO_DOMAIN_MATRIX="matrixtech-npm-repository-$ACCOUNT_ID_DEPLOY.d.codeartifact.$AWS_DEFAULT_REGION.amazonaws.com"
            REPO_PATH_MATRIX="npm/matrixtech-npm-repository"
            REPO_URL_MATRIX="https://$REPO_DOMAIN_MATRIX/$REPO_PATH_MATRIX"

            REPO_DOMAIN_UX="ux-$ACCOUNT_ID_DEPLOY.d.codeartifact.$AWS_DEFAULT_REGION.amazonaws.com"
            REPO_PATH_UX="npm/ux"
            REPO_URL_UX="https://$REPO_DOMAIN_UX/$REPO_PATH_UX"

            echo "⚙️ Configurando npm global..."
            npm config set registry "https://registry.npmjs.org/"

            echo "⚙️ Configurando npm MATRIX..."
            npm config set "//$REPO_DOMAIN_MATRIX/$REPO_PATH_MATRIX/:_authToken" "$token_matrix"
            npm config set "@matrixtech:registry" "$REPO_URL_MATRIX"

            echo "⚙️ Configurando npm UX..."
            npm config set "//$REPO_DOMAIN_UX/$REPO_PATH_UX/:_authToken" "$token_ux"
            npm config set "@ux:registry" "$REPO_URL_UX"

            echo "⚙️ Configurando npm INVICTUS..."
            npm config set "//$REPO_DOMAIN_MATRIX/$REPO_PATH_MATRIX/:_authToken" "$token_matrix"
            npm config set "@invictus:registry" "$REPO_URL_MATRIX"

            echo -e "\n✅ ~/.npmrc generado"
            cp ~/.npmrc "$(Build.Repository.Name)/.npmrc"
            cat "$(Build.Repository.Name)/.npmrc" | sed -E 's#(:_authToken=).*#\1****#'

            echo -e "\n🔍 Verificando identidad AWS..."
            aws sts get-caller-identity
        displayName: "🔐 Setup CodeArtifact & npm config"
        condition: and(succeeded(), ne(variables['Build.Repository.Name'], 'microservice-trino-invictus'))
        env:
          AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION_DEPLOY)
          AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID_DEPLOY)
          AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY_DEPLOY)

      - task: Bash@3
        inputs:
          targetType: inline
          script: |
            set -euo pipefail
            DOCKER_FILE="$(Build.Repository.Name)/Dockerfile"
            echo -e "\n🔎 Validando DockerFile en: $DOCKER_FILE"

            if [[ -f "$DOCKER_FILE" ]]; then
              echo "✅ Dockerfile existe"
            else
              echo "⚠️ Dockerfile no encontrado, copiando..."
              if [[ "$(Build.Repository.Name)" == *"conciliation"* ]]; then
                echo "📦 Repositorio conciliation detectado."
                cp pipelines-templates/pipeline/docker/Dockerfile-conciliation "$DOCKER_FILE"
              else
                echo "📦 Repositorio estandar detectado."
                cp pipelines-templates/pipeline/docker/Dockerfile "$DOCKER_FILE"
              fi
              echo "✅ Dockerfile copiado exitosamente"
            fi

            echo -e "\n📁 File: $DOCKER_FILE"
            cat $DOCKER_FILE
        displayName: "🔎 Validate Dockerfile"
        condition: and(succeeded(), ne(variables['Build.Repository.Name'], 'microservice-trino-invictus'))

      - task: Bash@3
        inputs:
          targetType: inline
          script: |
            set -euo pipefail
            if [[ "$(Build.Reason)" == "PullRequest" ]]; then
              CURRENT_BRANCH="$(System.PullRequest.SourceBranch)"
              CURRENT_BRANCH="${CURRENT_BRANCH/refs\/heads\//}"
            else
              CURRENT_BRANCH="${BUILD_SOURCEBRANCH/refs\/heads\//}"
            fi

            case "$CURRENT_BRANCH" in 
              staging) environment="qa" ;;
              master) environment="prd" ;;
              *) environment="develop" ;;
            esac

            msName=$(sed -E 's/^microservice-//; s/-invictus$//' <<< "$(Build.Repository.Name)")
            ECR_REPOSITORY="$(Build.Repository.Name)"
            ECR_REPOSITORY="${ECR_REPOSITORY%-invictus}-$environment"

            echo -e "\nℹ️ Configurando..."
            echo "Microservice: $msName"
            echo "Environment : $environment"
            echo "Repository  : $ECR_REPOSITORY"

            echo "##vso[task.setvariable variable=ecr_repository]$ECR_REPOSITORY"
        displayName: "📛 Set ECR Repository"
        condition: succeeded()

      - task: Bash@3
        inputs:
          targetType: inline
          script: |
            set -euo pipefail
            aws ecr get-login-password --region $AWS_DEFAULT_REGION | \
            docker login --username AWS --password-stdin $ACCOUNT_ID_DEPLOY.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
        displayName: "🔐 Login to AWS ECR"
        condition: succeeded()
        env:
          AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION_DEPLOY)
          AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID_DEPLOY)
          AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY_DEPLOY)

      - task: Docker@2
        inputs:
          command: "build"
          Dockerfile: "$(Build.Repository.Name)/Dockerfile"
          buildContext: "$(Build.Repository.Name)"
          repository: "$(ACCOUNT_ID_DEPLOY).dkr.ecr.$(AWS_DEFAULT_REGION).amazonaws.com/$(ecr_repository)"
          tags: |
            latest
            $(version)
        displayName: "📦 Build Docker Image: $(Build.Repository.Name)"
        condition: succeeded()

      # - task: Bash@3
      #   inputs:
      #     targetType: inline
      #     script: |
      #       set -euo pipefail
      #       docker run --rm \
      #         -v /var/run/docker.sock:/var/run/docker.sock \
      #         aquasec/trivy:latest \
      #         image \
      #         --severity CRITICAL,HIGH \
      #         --exit-code 1 \
      #         $(ACCOUNT_ID_DEPLOY).dkr.ecr.$(AWS_DEFAULT_REGION).amazonaws.com/$(ecr_repository):$(version)
      #   continueOnError: true
      #   displayName: "🛡️ Trivy scan Docker image"
      #   condition: and(succeeded(), ne(variables['Build.SourceBranchName'], 'master'))

      - task: Bash@3
        inputs:
          targetType: inline
          script: |
            set -euo pipefail
            echo -e "\nℹ️ Verificando..."
            echo "Id Cuenta  : $(ACCOUNT_ID_DEPLOY)"
            echo "Repositorio: $(ecr_repository)"

            if aws ecr describe-repositories --repository-names "$(ecr_repository)" > /dev/null 2>&1; then
              echo -e "\n✅ Repositorio $(ecr_repository) existe"
            else
              echo -e "\n##vso[task.logissue type=error]⚠️ Repositorio $(ecr_repository) no existe."
              exit 99
            fi
        displayName: "🔎 Verify ECR Repository Exists"
        condition: and(succeeded(), in(variables['Build.SourceBranchName'], 'develop', 'staging', 'master'))
        env:
          AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION_DEPLOY)
          AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID_DEPLOY)
          AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY_DEPLOY)

      - task: Docker@2
        inputs:
          command: "Push"
          repository: "$(ACCOUNT_ID_DEPLOY).dkr.ecr.$(AWS_DEFAULT_REGION).amazonaws.com/$(ecr_repository)"
          tags: |
            latest
            $(version)
        displayName: "🚀 Push Docker Image $(Build.Repository.Name)"
        condition: and(succeeded(), in(variables['Build.SourceBranchName'], 'develop', 'staging', 'master'))
