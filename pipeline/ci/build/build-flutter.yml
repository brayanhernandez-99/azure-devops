jobs:
  - job: build_flutter
    displayName: "📦 build flutter"
    pool:
      name: "Azure Pipelines"
      VmImage: ubuntu-22.04

    variables:
      - template: ../../variables/groups-transversal-variables-flutter.yml
        parameters:
          region: ${{ parameters.region }}

    steps:
      - task: DownloadBuildArtifacts@0
        inputs:
          artifactName: "versions"
          downloadPath: "$(Pipeline.Workspace)/versions-downloaded"
        displayName: "📥 Download Version"
        condition: succeeded()

      - script: |
          VERSION_FILE="$(Pipeline.Workspace)/versions-downloaded/versions/flutter/version.json"

          echo -e "\n📁 Archivo version.json:"
          ls -la "$VERSION_FILE"
          cat "$VERSION_FILE"

          if [[ -f "$VERSION_FILE" ]]; then
            VERSION=$(jq -r '.version' $VERSION_FILE)
            echo -e "\n🚀 Versión detectada para $(Build.Repository.Name): $VERSION"
            echo "##vso[task.setvariable variable=version]$VERSION"
          else
            echo -e "\n##vso[task.logissue type=error]⚠️ No se encontro archivo de versión para $(Build.Repository.Name)"
            exit 99
          fi
        displayName: "📚 Read Version"
        condition: succeeded()

      - script: |
          echo -e "\n📁 Archivo version.json:"
          ls -la $(Pipeline.Workspace)/downloaded-versions/versions/pubspec/version.json
          VERSION_FILE="$(Pipeline.Workspace)/downloaded-versions/versions/pubspec/version.json"
          if [[ -f "$VERSION_FILE" ]]; then
            VERSION=$(jq -r '.version' $VERSION_FILE)
            echo -e "\n🚀 Versión detectada para pubspec: +$VERSION"
            echo "##vso[task.setvariable variable=versionPubspec]$VERSION"
          else
            echo -e "\n##vso[task.logissue type=error]⚠️ No se encontro archivo de versión para pubspec"
            exit 99
          fi
        displayName: "📚 Read Version pubspec"
        condition: succeeded()

      - script: |
          CURRENT_BRANCH="$(Build.SourceBranch)"
          environment="unknown"
          appId="unknown"

          case "$CURRENT_BRANCH" in
            refs/heads/feature/*) environment="dev"; appId="dev"; ;;
            refs/heads/develop) environment="dev"; appId="dev"; ;;
            refs/heads/staging) environment="qa"; appId="qa"; ;;
            refs/heads/master) 
              case "$region" in
                "antioquia") environment="prd-gana"; appId="GANA"; ;;
                "cap")       environment="prd-cap";  appId="CAP"; ;;
                "tolima")    environment="prd-seapto"; appId="SEAPTO"; ;;
                "huila")     environment="prd-suchance"; appId="SUCHANCE"; ;;
                "cauca")     environment="prd-acertemos"; appId="ACERTEMOS"; ;;
                "boyaca")    environment="prd-jer"; appId="JER"; ;;
                "santander") environment="prd-laperla"; appId="LAPERLA"; ;;
              esac ;;
          esac

          if [ "$environment" = "unknown" ] || [ "$appId" = "unknown" ]; then
            echo "⚠️ Environment [$environment] no reconocido"
            echo "⚠️ Group Id [$appId] no reconocido"
            exit 99
          fi

          echo "##vso[task.setvariable variable=environment]$environment"
          echo "##vso[task.setvariable variable=appId]$appId"

          echo "Branch: $CURRENT_BRANCH"
          echo "Environment: $environment"
          echo "App Id: $appId"
        displayName: "📚 Configure Environment & Region"
        condition: succeeded()
        env:
          region: ${{ parameters.region }}

      - script: |
          echo -e "\nℹ️ Version a actualizar: $(msVersion)"
          sed -i '' "s/^version: .*/version: $(msVersion)+$(msVersionPubspec)/" pubspec.yaml
          
          echo -e "\n📁 Archivo pubspec.yaml:"
          cat pubspec.yaml
        displayName: "🔧 Change Version pubspec"
        condition: succeeded()

      - script: |
          CURRENT_BRANCH="$(Build.SourceBranch)"
          echo -e "\nℹ️ Version a actualizar:"
          echo "Version: $(version)"
          echo "Branch: $CURRENT_BRANCH"
          echo "App Id: $red"

          jq --arg version "$(msVersion)" \
            --arg environment "$(environment)" \
            --arg url "$(BASE_URL_FLUTTER)" \
            '.VERSION = $version | .ENVIRONMENT = $environment | .BASE_URL = $url' env.json > tmp.json && mv tmp.json env.json

          echo -e "\n📁 Archivo env.json:"
          cat env.json
        displayName: "🔧 Change version, environment, url file env.json"
        env:
          red: ${{ parameters.red }}

      - script: |
          echo "Branch: $(Build.SourceBranch)"
          echo "Red: $red"

          NEW_APP_ID="com.ux.mobile.$(appId)"
          echo "New app ID: $NEW_APP_ID"
          sed -i '' "s|applicationId *= *\"[^\"]*\"|applicationId = \"$NEW_APP_ID\"|" android/app/build.gradle

          echo -e "\n Archivo Build.gradle"
          cat android/app/build.gradle
        displayName: "🔧 Change file build.gradle"
        env:
          red: ${{ parameters.red }}



















      - task: Bash@3
        name: AuthCodeArtifact
        inputs:
          targetType: "inline"
          script: |
            echo -e "\n🔐 Obteniendo token de AWS CodeArtifact..."
            token=$(aws codeartifact get-authorization-token \
              --domain matrixtech-npm-repository \
              --domain-owner "$ACCOUNT_ID_DEPLOY" \
              --region "$AWS_DEFAULT_REGION" \
              --query authorizationToken \
              --output text)

            REPO_DOMAIN="matrixtech-npm-repository-$ACCOUNT_ID_DEPLOY.d.codeartifact.$AWS_DEFAULT_REGION.amazonaws.com"
            REPO_PATH="npm/matrixtech-npm-repository"
            REPO_URL="https://$REPO_DOMAIN/$REPO_PATH"

            echo "Configurando npm..."
            npm config set "//$REPO_DOMAIN/$REPO_PATH/:_authToken" "$token"
            npm config set registry "$REPO_URL"

            echo "Verificando identidad de AWS..."
            aws sts get-caller-identity

            echo -e "\n📁 Generando archivo .npmrc"
            cat <<EOF > ".npmrc"
            //$REPO_DOMAIN/$REPO_PATH/:_authToken=$token
            EOF
            ls -l .npmrc
        displayName: "🔐 Setup CodeArtifact & npm config"
        condition: succeeded()
        env:
          AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)
          AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID_DEPLOY)
          AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY_DEPLOY)

      - script: |
          CURRENT_BRANCH="$(Build.SourceBranch)"
          environment="unknown"

          case "$CURRENT_BRANCH" in
            refs/heads/feature/*) environment="dev"; ;;
            refs/heads/develop)   environment="dev"; ;;
            refs/heads/staging)   environment="qa"; ;;
            refs/heads/master) 
              case "$region" in
                "antioquia") environment="matrixtech"; ;;
                "cap")       environment="cap"; ;;
                "tolima")    environment="seapto"; ;;
                "huila")     environment="suchance"; ;;
                "cauca")     environment="acertemos"; ;;
                "boyaca")    environment="jer"; ;;
                "santander") environment="laperla"; ;;
              esac ;;
          esac

          if [[ "$environment" = "unknown" ]]; then
            echo -e "\n##vso[task.logissue type=error]⚠️ Environment [$environment] no reconocido"
            exit 99
          fi

          cat <<EOF > .env
          DOMAIN_ADMIN="${BASE_URL_ELECTRON_ADMIN}"
          DOMAIN_SELLER="${BASE_URL_ELECTRON_SELLERS}"
          TARGET="linux"
          TARGET_ENVIRONMENT="$environment"
          EOF

          echo "##vso[task.setvariable variable=environment]$environment"
          echo -e "\n📁 File: .env"
          ls -l .env
          cat .env
        displayName: "⚙️ Generate .env"
        condition: succeeded()
        env:
          region: ${{ parameters.region }}

      - task: UsePythonVersion@0
        displayName: "🔧 Use Python $(pythonVersion)"
        inputs:
          versionSpec: "$(pythonVersion)"
          addToPath: true
        condition: succeeded()

      - task: NodeTool@0
        displayName: "🔧 Install Nodejs $(nodeVersion)"
        inputs:
          versionSource: "spec"
          versionSpec: "$(nodeVersion)"
        condition: succeeded()

      - script: |
          echo -e "\n📦 Modificando versión en package.json: $(version)"
          PACKAGE_PATH="$(Build.SourcesDirectory)/package.json"

          if [[ -f "$PACKAGE_PATH" ]]; then
            jq --arg ver "$(version)" '.version = $ver' "$PACKAGE_PATH" > "$PACKAGE_PATH.tmp" && mv "$PACKAGE_PATH.tmp" "$PACKAGE_PATH"

            echo -e "\n✅ Versión en package.json actualizada correctamente."
            cat "$PACKAGE_PATH"
          else
            echo -e "\n##vso[task.logissue type=error]⚠️ No se encontró el archivo package.json en la ruta [$PACKAGE_PATH]"
            exit 99
          fi
        displayName: "📝 Update version in package.json"
        condition: succeeded()

      - script: |
          echo -e "\n📁 Generando archivo .pnpmrc en: $(System.DefaultWorkingDirectory)/.pnpmrc"
          cat <<EOF > "$(System.DefaultWorkingDirectory)/.pnpmrc"
          node-linker=hoisted
          shamefully-hoist=true
          ignore-scripts=false
          allow-build-script=true
          strict-peer-dependencies=false
          EOF
          ls -l $(System.DefaultWorkingDirectory)/.pnpmrc
          cat $(System.DefaultWorkingDirectory)/.pnpmrc

          cat $(System.DefaultWorkingDirectory)/.pnpmrc >> $(System.DefaultWorkingDirectory)/.npmrc
          echo -e "\n✅ Contenido de .pnpmrc anexado a .npmrc correctamente."

          echo -e "\n⚙️ Instalando dependencias ubuntu..."
          sudo apt-get update
          sudo apt-get install -y libcups2-dev

          echo -e "\n⚙️ Instalando dependencias node..."
          npm install -g pnpm
          pnpm install
          pnpm exec electron-builder install-app-deps
          pnpm ignoregion-builds

          OUTPUT=$(pnpm ls --depth=0 || true)
          if [[ -z "$OUTPUT" ]]; then
            echo -e "\n##vso[task.logissue type=error]⚠️ No se instalaron dependencias, esperar que se actualicen las dependencias a nivel global"
            exit 99
          else
            echo -e "\n✅ Dependencias Instaladas:"
            echo "$OUTPUT"
          fi
        displayName: "⚙️ Install dependencies"
        condition: succeeded()

      - script: |
          echo -e "\n📦 Build Electron..."
          pnpm run build
        displayName: "📦 Build electron"
        condition: succeeded()

      - script: |
          echo -e "\n📝 Validando build electron..."
          BASE_PATH="$(Build.SourcesDirectory)/release/$(environment)/$(version)"
          APP_DIR="$BASE_PATH/app"
          mkdir -p $APP_DIR
          all_found=true

          echo -e "\n📂 Directorio: $BASE_PATH"
          ls -lt $BASE_PATH
          echo ""

          FILES_TO_COPY=(
            "InvictusUX-$(version).AppImage"
            "latest-linux.yml"
          )

          for file in "${FILES_TO_COPY[@]}"; do
            source_path="$BASE_PATH/$file"
            destination_path="$APP_DIR/$file"

            if [[ -f "$source_path" ]]; then
              cp -f "$source_path" "$destination_path"
              echo "📂 Copiado: $file -> $destination_path"
            else
              echo "⚠️ Archivo no encontrado: $file"
              all_found=false
            fi
          done

          if [[ "$all_found" == false ]]; then
            echo -e "\n##vso[task.logissue type=error]⚠️ Error: archivos requeridos no encontrados."
            exit 99
          else
            mkdir -p "$(Build.ArtifactStagingDirectory)/electron-artifacts/linux"
            cp -R $APP_DIR/* "$(Build.ArtifactStagingDirectory)/electron-artifacts/linux/"

            echo -e "\n📂 Directorio: $APP_DIR"
            ls -l $APP_DIR
          fi
        displayName: "🔍 Validate Build"
        condition: succeeded()

      - task: PublishBuildArtifacts@1
        inputs:
          PathtoPublish: "$(Build.ArtifactStagingDirectory)/electron-artifacts"
          ArtifactName: "electron"
          publishLocation: "Container"
        displayName: "📤 Publish artifact electron"
        condition: succeeded()
