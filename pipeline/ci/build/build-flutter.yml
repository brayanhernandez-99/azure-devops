jobs:
  - job: build_flutter
    displayName: "📦 build flutter"
    pool:
      name: "Azure Pipelines"
      vmImage: "macos-latest"

    variables:
      - name: ANDROID_HOME
        value: /Users/runner/Library/Android/sdk

      - template: ../../variables/groups-variables-flutter.yml
        parameters:
          region: ${{ parameters.region }}
          environment_staging: ${{ parameters.environment_staging }}

    steps:
      - task: DownloadBuildArtifacts@0
        inputs:
          artifactName: "versions"
          downloadPath: "$(Pipeline.Workspace)"
        displayName: "📥 Download Version"
        condition: succeeded()

      - task: Bash@3
        inputs:
          targetType: inline
          script: |
            set -e
            VERSION_FILE="$(Pipeline.Workspace)/versions/flutter/version.json"
            echo -e "\n📁 File: version.json"
            ls -la "$VERSION_FILE"
            jq . "$VERSION_FILE"

            if [[ -f "$VERSION_FILE" ]]; then
              VERSION=$(jq -r '.version' $VERSION_FILE)
              echo -e "\n🚀 Versión detectada para $(Build.Repository.Name): $VERSION"
              echo "##vso[task.setvariable variable=version]$VERSION"
            else
              echo -e "\n##vso[task.logissue type=error]⚠️ No se encontro archivo de versión para $(Build.Repository.Name)"
              exit 99
            fi
        displayName: "📚 Read Version"
        condition: succeeded()

      - task: Bash@3
        inputs:
          targetType: inline
          script: |
            set -e
            VERSION_FILE="$(Pipeline.Workspace)/versions/pubspec/version.json"
            echo -e "\n📁 File: version.json"
            ls -la "$VERSION_FILE"
            jq . "$VERSION_FILE"

            if [[ -f "$VERSION_FILE" ]]; then
              VERSION=$(jq -r '.version' $VERSION_FILE)
              echo -e "\n🚀 Versión detectada para pubspec: +$VERSION"
              echo "##vso[task.setvariable variable=versionPubspec]$VERSION"
            else
              echo -e "\n##vso[task.logissue type=error]⚠️ No se encontro archivo de versión para pubspec"
              exit 99
            fi
        displayName: "📚 Read Version pubspec"
        condition: succeeded()

      - task: Bash@3
        inputs:
          targetType: inline
          script: |
            set -e
            CURRENT_BRANCH="$(Build.SourceBranchName)"
            case "$CURRENT_BRANCH" in 
              staging) environment="$environment_staging" ;;
              master) environment="$region" ;;
              *) environment="develop" ;;
            esac

            jq --arg version "$(version)" \
              --arg env "$environment" \
              --arg url "$(BASE_URL)" \
              --arg apk "$(APK_URL)" \
              '.VERSION = $version |
                .ENVIRONMENT = $env |
                .BASE_URL = $url |
                .APK_URL = $apk' \
              env.json > tmp.json && mv tmp.json env.json

            echo "##vso[task.setvariable variable=environment]$environment"
            echo -e "\n📁 File: env.json"
            ls -la env.json
            cat env.json
        displayName: "⚙️ Generate env.json"
        condition: succeeded()
        env:
          region: ${{ parameters.region }}
          environment_staging: ${{ parameters.environment_staging }}

      - task: Bash@3
        inputs:
          targetType: inline
          script: |
            set -e
            echo -e "\nℹ️ Actualizando version"
            echo "Version APK     : $(version)"
            echo "Version Pubspec : $(versionPubspec)"

            sed -i '' "s/^version: .*/version: $(version)+$(versionPubspec)/" pubspec.yaml

            echo -e "\n📁 File: pubspec.yaml"
            ls -la pubspec.yaml
            cat pubspec.yaml
        displayName: "🔁 Change pubspec version"
        condition: succeeded()

      - task: Bash@3
        inputs:
          targetType: inline
          script: |
            set -e
            echo -e "\nℹ️ Actualizando App ID"
            echo "APP ID: $(APP_ID)"

            sed -i '' "s|applicationId *= *\"[^\"]*\"|applicationId = \"$APP_ID\"|" android/app/build.gradle

            echo -e "\n📁 File: android/app/build.gradle"
            ls -la android/app/build.gradle
            cat android/app/build.gradle
        displayName: "🔁 Change build.gradle version"
        condition: succeeded()

      - task: FlutterInstall@0
        inputs:
          mode: "auto"
          channel: "stable"
          version: "custom"
          customVersion: $(flutterVersion)
        displayName: "🔧 Install Flutter $(flutterVersion)"
        condition: succeeded()

      - task: Bash@3
        inputs:
          targetType: inline
          script: |
            set -e
            echo "🔎 Verificando entorno Flutter y Android SDK..."
            echo -e "\n📦 ANDROID_HOME: $ANDROID_HOME" && ls -la "$ANDROID_HOME"
            echo -e "\n🌀 Flutter versión:" && flutter --version
            echo -e "\n📥 Ejecutando flutter pub get..."
            flutter pub get
        displayName: "🌀 Flutter: Get Dependencies"
        condition: succeeded()

      - task: Bash@3
        inputs:
          targetType: inline
          script: |
            set -e
            echo -e "\nℹ️ Verificando carpeta assets..."
            if [[ -d "assets" ]] && [[ "$(ls -A assets)" ]]; then
              echo -e "\n📁 Assets encontrados:"
              ls -la assets
            else
              echo -e "\n##vso[task.logissue type=error]⚠️ Error: No se encontraron assets"
              exit 99
            fi
        displayName: "🔎 Validate Assets"
        condition: succeeded()

      - task: Bash@3
        inputs:
          targetType: inline
          script: |
            set -e
            echo -e "\nℹ️ Descargando Keystore..."
            echo "Cuenta  : $(ACCOUNT_ID_DEPLOY)"
            echo "KeyAlias: $(KEY_ALIAS).jks"

            mkdir -p android/app/keystore
            aws s3 cp s3://keystore-$(ACCOUNT_ID_DEPLOY)/keystore/$(KEY_ALIAS).jks android/app/keystore/

            if [[ -d "android/app/keystore" ]] && [[ "$(ls -A android/app/keystore/$(KEY_ALIAS).jks)" ]]; then    
              echo -e "\n📁 Keystore descargado:"
              ls -la android/app/keystore/*
            else
              echo -e "\n##vso[task.logissue type=error]⚠️ Error: No se descargo el Keystore"
              exit 99
            fi
        displayName: "📥 Download Keystore"
        condition: succeeded()
        env:
          AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)
          AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID_DEPLOY)
          AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY_DEPLOY)

      - task: Bash@3
        inputs:
          targetType: inline
          script: |
            set -e
            escape_value() {
            local raw="$1"
            printf '%s' "$raw" | sed \
              -e 's/\\/\\\\/g' \
              -e 's/"/\\"/g' \
              -e "s/'/\\'/g" \
              -e 's/=/\\=/g' \
              -e 's/:/\\:/g' \
              -e 's/ /\\ /g' \
              -e 's/!/\!/g' \
              -e 's/#/\\#/g' \
              -e 's/\$/\\$/g' \
              -e 's/-/\\-/g'
            }
            ESCAPED_STORE_PASSWORD=$(escape_value "$STORE_PASSWORD")
            ESCAPED_KEY_PASSWORD=$(escape_value "$KEY_PASSWORD")

            touch android/key.properties
            echo "keyAlias=$KEY_ALIAS" >> android/key.properties
            echo "keyPassword=$ESCAPED_KEY_PASSWORD" >> android/key.properties
            echo "storePassword=$ESCAPED_STORE_PASSWORD" >> android/key.properties
            echo "storeFile=keystore/$KEY_ALIAS.jks" >> android/key.properties

            echo -e "\n📁 File: key.properties"
            ls -la android/key.properties
            cat android/key.properties | sed -E 's/^(keyPassword|storePassword)=.*/\1=*** /'
        displayName: "🔐 Assign Keystore"
        condition: succeeded()
        env:
          KEY_ALIAS: $(KEY_ALIAS)
          KEY_PASSWORD: $(KEY_PASSWORD)
          STORE_PASSWORD: $(STORE_PASSWORD)

      - task: Bash@3
        inputs:
          targetType: inline
          script: |
            set -e
            echo -e "\n☕ JAVA_HOME: $JAVA_HOME" && java -version
            echo -e "\n🌀 Flutter versión:" && flutter --version

            echo -e "\n🌀Ejecutando Build Flutter: flutter --no-color build apk --no-tree-shake-icons --profile"
            flutter --no-color build apk --no-tree-shake-icons --profile
        displayName: "📦 Flutter Build"
        condition: succeeded()

      - task: Bash@3
        inputs:
          targetType: inline
          script: |
            set +e
            echo -e "\nℹ️ Validando Build Apk..."

            if [[ -d "build/app/outputs/flutter-apk" ]] && [[ "$(ls -A build/app/outputs/flutter-apk)" ]]; then
              echo -e "\n✅ Apk encontrado"
              echo "📁 Files: build/app/outputs/flutter-apk"
              ls -la build/app/outputs/flutter-apk

              SHA1_APK=$(shasum -a 1 build/app/outputs/flutter-apk/app-profile.apk | awk '{print $1}')
              SHA1_FLUTTER=$(cut -d ' ' -f1 build/app/outputs/flutter-apk/app-profile.apk.sha1)
              APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)

              echo -e "\n🔐 SHA-1 Apk: $SHA1_APK"
              echo "🔐 SHA-1 Flutter: $SHA1_FLUTTER"
              echo "🔐 SHA-1 Certificado:"

              echo -e "\n\n\n\n"
              ls -ltra "$ANDROID_HOME/build-tools/37.0.0/apksigner"
              "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs build/app/outputs/flutter-apk/app-profile.apk | grep -A 5 "Signer #"

              echo -e "\n\n\n\n"
              echo "**** $APKSIGNER ****"
              ls -ltra "$APKSIGNER"
              "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-profile.apk

            else
              echo -e "\n##vso[task.logissue type=error]⚠️ Error: Apk no encontrado"
              exit 99
            fi
        displayName: "🔎 Validate Build"
        condition: succeeded()

      - task: Bash@3
        inputs:
          targetType: inline
          script: |
            set -e
            echo -e "\nℹ️ Renombrando APK..."

            mv build/app/outputs/flutter-apk/app-profile.apk build/app/outputs/flutter-apk/invictus-$(environment)-$(version).apk
            mv build/app/outputs/flutter-apk/app-profile.apk.sha1 build/app/outputs/flutter-apk/invictus-$(environment)-$(version).apk.sha1

            mkdir -p "$(Build.ArtifactStagingDirectory)/release/$(environment)"
            cp -R "build/app/outputs/flutter-apk/*" "$(Build.ArtifactStagingDirectory)/release/$(environment)/"

            echo -e "\n📁 Files: build/app/outputs/flutter-apk"
            ls -l build/app/outputs/flutter-apk
        displayName: "📝 Change Name File APK"
        condition: succeeded()

      - task: PublishBuildArtifacts@1
        inputs:
          PathtoPublish: "$(Build.ArtifactStagingDirectory)/release"
          ArtifactName: "release"
          publishLocation: "Container"
        displayName: "📤 Publish Artifact Flutter"
        condition: succeeded()
