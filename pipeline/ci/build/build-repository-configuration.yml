jobs:
  - job: build_repository_configuration
    displayName: "📦 build repository configuration"
    pool:
      name: "Azure Pipelines"
      vmImage: ubuntu-latest

    steps:
      - task: Bash@3
        inputs:
          targetType: inline
          script: |
            set -e
            echo -e "\n📦 Archivos a cargar a S3"
            echo "🌿 Rama : $(Build.SourceBranchName)"
            echo "📂 Files:"
            tree
        displayName: "📂 File Structure & Account ID"
        condition: succeeded()
