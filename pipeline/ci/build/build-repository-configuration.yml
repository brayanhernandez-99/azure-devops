jobs:
  - job: build_repository_configuration_${{ parameters.region }}
    displayName: "📦 build repository configuration"
    pool:
      name: "Azure Pipelines"
      VmImage: ubuntu-22.04

    variables:
      - template: ../../variables/groups-transversal-variables-rpc.yml
        parameters:
          region: ${{ parameters.region }}

    steps:
      - script: |
          echo -e "\nℹ️ Informacion:"
          echo "Id AWS: $(ACCOUNT_ID_INVICTUS)"
          echo "Branch: $(Build.SourceBranchName)"
          echo ""
          tree
        displayName: "📂 File Structure & Account ID"
        condition: succeeded()
