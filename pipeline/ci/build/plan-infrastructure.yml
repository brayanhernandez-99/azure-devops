jobs:
  - job: plan_infrastructure_${{ parameters.region }}
    displayName: "🧩 terragrunt plan"
    timeoutInMinutes: 120
    pool:
      name: "Azure Pipelines"
      # name: "Azure Pipelines Self-hosted"

    variables:
      - template: ../../variables/groups-transversal-variables-iac.yml
        parameters:
          region: ${{ parameters.region }}
          environment: ${{ parameters.environment }}

    steps:
      - script: |
          echo -e "\n📋 Variables disponibles:"
          printenv | sort | grep -i "aws_" || true

          echo -e "\n📋 Parametros disponibles:"
          printenv | sort | grep -i "parameter_" || true
        displayName: "📋 Environment variables"
        condition: succeeded()

      - script: |
          echo "📥 Descargando Terragrunt 0.84.1..."
          curl -L "https://github.com/gruntwork-io/terragrunt/releases/download/v0.84.1/terragrunt_linux_amd64" -o terragrunt

          chmod +x terragrunt
          sudo mv terragrunt /usr/local/bin/terragrunt

          echo "🚀 Terragrunt instalado:"
          terragrunt --version
        displayName: "🛠️ Install Terragrunt 0.84.1"
        condition: succeeded()
        env:
          AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)
          AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID_DEPLOY)
          AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY_DEPLOY)

      - script: |
          echo "📥 Descargando Terraform 1.12.0..."
          curl -L "https://releases.hashicorp.com/terraform/1.12.0/terraform_1.12.0_linux_amd64.zip" -o terraform.zip

          unzip terraform.zip
          chmod +x terraform
          sudo mv terraform /usr/local/bin/terraform
          rm -rf terraform.zip

          echo "🚀 Terraform instalado:"
          terraform --version
        displayName: "🛠️ Install Terraform 1.12.0"
        condition: succeeded()
        env:
          AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)
          AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID_DEPLOY)
          AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY_DEPLOY)

      - task: replacetokens@5
        inputs:
          targetFiles: |
            $(Build.SourcesDirectory)/iac-terragrunt/invictus/**/terragrunt.hcl
            $(Build.SourcesDirectory)/iac-terragrunt/invictus/root.hcl
            $(Build.SourcesDirectory)/iac-terragrunt/invictus/backend.tf
            $(Build.SourcesDirectory)/iac-terragrunt/invictus/provider.tf
          encoding: "auto"
          writeBOM: true
          actionOnMissing: "warn" # 'fail', 'warn' o 'ignore'
          keepToken: false
          tokenPrefix: "#{"
          tokenSuffix: "}#"
        displayName: "⚙️ Replace Tokens"
        condition: succeeded()

      - script: |
          echo "📦 Configuring Terragrunt & Terraform cache..."
          pwd
          echo "********"

          sudo mkdir -p /opt/terragrunt-cache
          sudo chmod -R 777 /opt/terragrunt-cache

          sudo mkdir -p /opt/terraform-plugin-cache
          sudo chmod -R 777 /opt/terraform-plugin-cache

          export TG_DOWNLOAD_DIR=/opt/terragrunt-cache
          export TF_PLUGIN_CACHE_DIR=/opt/terraform-plugin-cache

          echo "##vso[task.setvariable variable=TG_DOWNLOAD_DIR]/opt/terragrunt-cache"
          echo "##vso[task.setvariable variable=TF_PLUGIN_CACHE_DIR]/opt/terraform-plugin-cache"

          ls -ltra 

          echo "✅ TG_DOWNLOAD_DIR=$TG_DOWNLOAD_DIR"
          echo "✅ TF_PLUGIN_CACHE_DIR=$TF_PLUGIN_CACHE_DIR"
        displayName: "📦 Configure Cache"
        condition: succeeded()

      - script: |
          set -e

          cd $(Build.SourcesDirectory)/iac-terragrunt/invictus/initial-infrastructure/aws-service-rds/aws-service-iam-role
          terragrunt plan --all --non-interactive -no-color

          # cd $(Build.SourcesDirectory)/iac-terragrunt/invictus/initial-infrastructure/aws-service-rds/aws-service-proxy
          # terragrunt plan --all --non-interactive -no-color



          # cd $(Build.SourcesDirectory)/iac-terragrunt/invictus/initial-infrastructure/aws-service-apigateway-iam-rol
          # terragrunt destroy --all --non-interactive -no-color

          # cd $(Build.SourcesDirectory)/iac-terragrunt/invictus/initial-infrastructure/aws-service-apigateway-domain-names-metabase
          # terragrunt destroy --all --non-interactive -no-color
          # cd $(Build.SourcesDirectory)/iac-terragrunt/invictus/initial-infrastructure/aws-service-apigateway-metabase
          # terragrunt destroy --all --non-interactive -no-color
          # cd $(Build.SourcesDirectory)/iac-terragrunt/invictus/initial-infrastructure/aws-service-apigateway-domain-names-admin
          # terragrunt destroy --all --non-interactive -no-color
          # cd $(Build.SourcesDirectory)/iac-terragrunt/invictus/initial-infrastructure/aws-service-apigateway-administration
          # terragrunt destroy --all --non-interactive -no-color
          # cd $(Build.SourcesDirectory)/iac-terragrunt/invictus/initial-infrastructure/aws-service-apigateway-domain-names-seller
          # terragrunt destroy --all --non-interactive -no-color
          # cd $(Build.SourcesDirectory)/iac-terragrunt/invictus/initial-infrastructure/aws-service-apigateway-seller
          # terragrunt destroy --all --non-interactive -no-color
          # cd $(Build.SourcesDirectory)/iac-terragrunt/invictus/initial-infrastructure/aws-service-apigateway-domain-names-integration
          # terragrunt destroy --all --non-interactive -no-color
          # cd $(Build.SourcesDirectory)/iac-terragrunt/invictus/initial-infrastructure/aws-service-apigateway-integration
          # terragrunt destroy --all --non-interactive -no-color




          # cd $(Build.SourcesDirectory)/iac-terragrunt/invictus/apps/aws-service-cloudfront/cloudfront-assets
          # terragrunt plan --all --non-interactive -no-color
          # cd $(Build.SourcesDirectory)/iac-terragrunt/invictus/apps/aws-service-s3-policy/s3-assets-policy
          # terragrunt plan --all --non-interactive -no-color


          # find $(Build.SourcesDirectory) -type d -name ".terragrunt-cache" -exec rm -rf {} +
        displayName: "🧩 Plan Infrastructure"
        timeoutInMinutes: 120
        condition: succeeded()
        env:
          TG_DOWNLOAD_DIR: $(TG_DOWNLOAD_DIR)
          TF_PLUGIN_CACHE_DIR: $(TF_PLUGIN_CACHE_DIR)
          AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)
          AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID_INVICTUS)
          AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY_INVICTUS)
