jobs:
  - job: plan_infrastructure_${{ parameters.region }}
    displayName: "🧩 terragrunt plan"
    # timeoutInMinutes: 120
    pool:
      name: "Azure Pipelines"
      vmImage: ubuntu-latest

    variables:
      - template: ../../variables/groups-transversal-variables-iac.yml
        parameters:
          region: ${{ parameters.region }}
          environment: ${{ parameters.environment }}

      - name: terraformVersion
        value: "1.12.0"

      - name: terragruntVersion
        value: "0.84.1"

      - name: TF_PLUGIN_CACHE_DIR
        value: "$(Agent.TempDirectory)/terraform-plugin-cache"

      - name: TG_DOWNLOAD_DIR
        value: "$(Agent.TempDirectory)/terragrunt-cache"

    steps:
      - task: Bash@3
        inputs:
          targetType: "inline"
          script: |
            set -e
            echo -e "\n📋 Variables disponibles:"
            printenv | sort | grep -i "aws_" || true

            echo -e "\n📋 Parametros disponibles:"
            printenv | sort | grep -i "parameter_" || true
        displayName: "📋 Environment variables"
        condition: succeeded()

      - task: Bash@3
        inputs:
          targetType: "inline"
          script: |
            set -e
            echo "📦 Configurando Terraform/Terragrunt cache..."

            mkdir -p "$(TF_PLUGIN_CACHE_DIR)"
            mkdir -p "$(TG_DOWNLOAD_DIR)"
            chmod -R 775 "$(TF_PLUGIN_CACHE_DIR)"
            chmod -R 775 "$(TG_DOWNLOAD_DIR)"

            echo ""
            echo "✅ TF_PLUGIN_CACHE_DIR=$(TF_PLUGIN_CACHE_DIR)"
            echo "✅ TG_DOWNLOAD_DIR=$(TG_DOWNLOAD_DIR)"

            echo -e "\n📂 Terraform Plugin Cache:"
            ls -ltra "$(TF_PLUGIN_CACHE_DIR)" || true

            echo -e "\n📂 Terragrunt Cache:"
            ls -ltra "$(TG_DOWNLOAD_DIR)" || true
        displayName: "📦 Configure Cache"
        condition: succeeded()

      - task: Bash@3
        inputs:
          targetType: "inline"
          script: |
            set -e
            echo "🧹 Limpiando Terraform/Terragrunt cache..."

            rm -rf "$(TF_PLUGIN_CACHE_DIR)"/* || true
            rm -rf "$(TG_DOWNLOAD_DIR)"/* || true

            find . -type d -name ".terraform" -prune -exec rm -rf {} + || true
            find . -type d -name ".terragrunt-cache" -prune -exec rm -rf {} + || true

            echo "✅ Limpieza completa"
        displayName: "🧹 Clean Terraform/Terragrunt Cache"
        condition: succeeded()

      - task: Bash@3
        inputs:
          targetType: "inline"
          script: |
            set -e
            echo "📥 Descargando Terragrunt 0.84.1..."
            curl -L "https://github.com/gruntwork-io/terragrunt/releases/download/v$(terragruntVersion)/terragrunt_linux_amd64" -o terragrunt

            chmod +x terragrunt
            sudo mv terragrunt /usr/local/bin/terragrunt

            echo "🚀 Terragrunt instalado:"
            terragrunt --version
        displayName: "🛠️ Install Terragrunt 0.84.1"
        condition: succeeded()

      - task: Bash@3
        inputs:
          targetType: "inline"
          script: |
            set -e
            echo "📥 Descargando Terraform 1.12.0..."
            curl -L "https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip" -o terraform.zip

            unzip terraform.zip
            chmod +x terraform
            sudo mv terraform /usr/local/bin/terraform
            rm -rf terraform.zip

            echo "🚀 Terraform instalado:"
            terraform --version
        displayName: "🛠️ Install Terraform 1.12.0"
        condition: succeeded()

      - task: replacetokens@5
        inputs:
          targetFiles: |
            $(Build.SourcesDirectory)/iac-terragrunt/invictus/**/terragrunt.hcl
            $(Build.SourcesDirectory)/iac-terragrunt/invictus/root.hcl
            $(Build.SourcesDirectory)/iac-terragrunt/invictus/backend.tf
            $(Build.SourcesDirectory)/iac-terragrunt/invictus/provider.tf
          encoding: "auto"
          writeBOM: true
          actionOnMissing: "warn" # 'fail', 'warn' o 'ignore'
          keepToken: false
          tokenPrefix: "#{"
          tokenSuffix: "}#"
        displayName: "⚙️ Replace Tokens"
        condition: succeeded()

