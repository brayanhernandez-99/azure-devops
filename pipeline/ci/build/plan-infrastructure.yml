jobs:
  - job: plan_infrastructure_${{ parameters.region }}
    displayName: "🧩 terragrunt plan"
    timeoutInMinutes: 120
    pool:
      name: "Azure Pipelines"
      VmImage: ubuntu-22.04

    variables:
      - template: ../../variables/groups-transversal-variables-iac.yml
        parameters:
          region: ${{ parameters.region }}

    steps:
      - script: |
          echo -e "\n📋 Variables disponibles:"
          printenv | sort | grep -i "aws_" || true

          echo -e "\n📋 Parametros disponibles:"
          printenv | sort | grep -i "parameter_" || true
        displayName: "📋 Environment variables"
        condition: succeeded()

      - script: |
          echo "📥 Descargando Terragrunt $(terragruntVersion)..."
          aws s3 cp "s3://infrastructure-as-code-invictus/terragrunt/terragrunt-$(terragruntVersion)" "terragrunt"

          if [ ! -s terragrunt ]; then
            echo "##vso[task.logissue type=error]⚠️ Error: No se pudo descargar terragrunt $(terragruntVersion)"
            exit 99
          fi

          chmod +x terragrunt
          sudo mv terragrunt /usr/local/bin/terragrunt

          echo -e "\n🚀 Terragrunt instalado correctamente:"
          terragrunt --version
        displayName: "🛠️ Instalando Terragrunt $(terragruntVersion)"
        condition: succeeded()
        env:
          AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)
          AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID_DEPLOY)
          AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY_DEPLOY)

      - script: |
          echo "📥 Descargando Terraform..."
          aws s3 cp "s3://infrastructure-as-code-invictus/terraform/terraform-$(terraformVersion)" "terraform"

          if [ ! -s terraform ]; then
            echo "##vso[task.logissue type=error]⚠️ Error: No se pudo descargar terraform $(terraformVersion)"
            exit 99
          fi

          chmod +x terraform
          sudo mv terraform /usr/local/bin/terraform

          echo -e "\n🚀 Terraform instalado correctamente:"
          terraform --version
        displayName: "🛠️ Instalando Terraform $(terraformVersion)"
        condition: succeeded()
        env:
          AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)
          AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID_DEPLOY)
          AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY_DEPLOY)

      - task: replacetokens@5
        inputs:
          targetFiles: |
            $(Build.SourcesDirectory)/iac-terragrunt/invictus/**/terragrunt.hcl
            $(Build.SourcesDirectory)/iac-terragrunt/invictus/root.hcl
            $(Build.SourcesDirectory)/iac-terragrunt/invictus/backend.tf
            $(Build.SourcesDirectory)/iac-terragrunt/invictus/provider.tf
          encoding: "auto"
          writeBOM: true
          actionOnMissing: "warn" # 'fail', 'warn' o 'ignore'
          keepToken: false
          tokenPrefix: "#{"
          tokenSuffix: "}#"
        displayName: "⚙️ Replace Tokens"
        condition: succeeded()

      - script: |
          set -e

          # cd $(Build.SourcesDirectory)/iac-terragrunt/invictus/initial-infrastructure/aws-service-rds/aws-service-rds
          # terragrunt plan --all --non-interactive -no-color


          # cd $(Build.SourcesDirectory)/iac-terragrunt/invictus/initial-infrastructure/aws-service-rds/aws-service-sg
          # terragrunt init -reconfigure
          # terragrunt import aws_security_group.sg sg-06c7e4963937c6b78
          # terragrunt state list -no-color
          # terragrunt plan --non-interactive -no-color





          cd $(Build.SourcesDirectory)/iac-terragrunt/invictus/initial-infrastructure/aws-service-kinesis-cmk
          terragrunt init -reconfigure
          terragrunt import aws_kms_key.cmk 1ca16f22-8b69-47e5-9993-63ce9e95c329
          terragrunt import aws_kms_alias.cmk_alias alias/km-kinesis
          terragrunt plan --all --non-interactive -no-color

          cd $(Build.SourcesDirectory)/iac-terragrunt/invictus/initial-infrastructure/aws-service-dynamo-cmk
          terragrunt init -reconfigure
          terragrunt import aws_kms_key.cmk 229aa810-c6d4-43ff-b491-c880cc8ccffc
          terragrunt import aws_kms_alias.cmk_alias alias/km-dynamo
          terragrunt plan --all --non-interactive -no-color

          cd $(Build.SourcesDirectory)/iac-terragrunt/invictus/initial-infrastructure/aws-service-secrets-cmk
          terragrunt init -reconfigure
          terragrunt import aws_kms_key.cmk f623991b-142e-46e4-a56f-372a88e7ca83
          terragrunt import aws_kms_alias.cmk_alias alias/km-secrets
          terragrunt plan --all --non-interactive -no-color

          cd $(Build.SourcesDirectory)/iac-terragrunt/invictus/initial-infrastructure/aws-service-rds/aws-service-cmk
          terragrunt init -reconfigure
          terragrunt import aws_kms_key.cmk 0bc4a8bd-3466-4241-b340-4d8c81fd4f03
          terragrunt import aws_kms_alias.cmk_alias alias/km-rds
          terragrunt plan --all --non-interactive -no-color





          # cd $(Build.SourcesDirectory)
          # find . -type d -name ".terragrunt-cache" -exec rm -rf {} +
        displayName: "🧩 Plan Infrastructure"
        timeoutInMinutes: 120
        condition: succeeded()
        env:
          AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)
          AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID_INVICTUS)
          AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY_INVICTUS)
