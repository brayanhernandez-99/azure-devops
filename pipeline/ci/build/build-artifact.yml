jobs:
  - job: "build_artifact"
    displayName: "🐳 build artifact"
    pool:
      name: "Azure Pipelines"
      VmImage: "ubuntu-22.04"

    variables:
      - template: ../../variables/groups-transversal-variables-backend.yml

    steps:
      - checkout: self
        fetchDepth: 1
        persistCredentials: true


      - task: NodeTool@0
        displayName: "🔧 Install Nodejs $(nodeVersion)"
        inputs:
          versionSource: "spec"
          versionSpec: "$(nodeVersion)"
        condition: succeeded()

      - script: npm install
        displayName: install

      - script: npm run lint
        displayName: lint

      - script: npm test
        displayName: test

      # - task: npmAuthenticate@0
      #   inputs:
      #     workingFile: .npmrc

      # - script: npm publish
      #   displayName: publish