jobs:
  - job: "sonarqube_infrastructure"
    displayName: "🛡️ sonarqube"
    condition: or(startsWith(variables['Build.SourceBranch'], 'refs/heads/feature/'), eq(variables['Build.SourceBranchName'], 'develop'))
    pool:
      name: "Azure Pipelines"
      VmImage: ubuntu-22.04

    variables:
      - template: ../../variables/groups-transversal-variables-iac.yml
        parameters:
          region: ${{ parameters.region }}

    steps:
      - task: JavaToolInstaller@0
        displayName: "🔧 Install JDK 17"
        inputs:
          versionSpec: "17"
          jdkArchitectureOption: "x64"
          jdkSourceOption: "PreInstalled"
        condition: succeeded()

      - task: SonarQubePrepare@7
        displayName: "⚙️ Prepare SonarQube Analysis"
        inputs:
          SonarQube: "SonarQubeConection"
          scannerMode: "CLI"
          configMode: "manual"
          cliProjectKey: "$(Build.Repository.Name)"
          cliProjectName: "$(Build.Repository.Name)"
          cliSources: "$(System.DefaultWorkingDirectory)"
          extraProperties: |
            sonar.sources=iac-template-terraform,iac-terragrunt
            sonar.inclusions=**/*.tf,**/*.tfvars,**/*.hcl
            sonar.terraform.file.suffixes=tf,tfvars,hcl
            sonar.exclusions=**/.terraform/**,**/.terragrunt-cache/**,**/terraform.tfstate*,**/*tfplan*,**/terragrunt.hcl.lock*,**/*.lock.hcl,pipeline/**
        condition: succeeded()

      - task: SonarQubeAnalyze@7
        displayName: "📡 Run Sonar Analysis"
        condition: succeeded()

      - task: SonarQubePublish@7
        displayName: "📤 Publish Static Code Analysis Results"
        inputs:
          pollingTimeoutSec: 400
        condition: succeeded()
