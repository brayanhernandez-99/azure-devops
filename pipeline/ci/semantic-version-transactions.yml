jobs:
  - job: "semantic_version_transactions"
    displayName: "🏷️ version "
    pool:
      name: "Azure Pipelines"
      VmImage: ubuntu-22.04

    strategy:
      matrix:
        ${{ each ms in parameters.apps }}:
          ${{ ms }}:
            msName: ${{ ms }}
            msVersion: ${{ parameters.version }}

    steps:
      - checkout: self
        fetchDepth: 0
        persistCredentials: true

      - script: |
          echo "🚀 Procesando $(msName)..."
          echo "Version: $(msVersion)"

          mkdir -p $(Build.ArtifactStagingDirectory)/$(msName)
          touch $(Build.ArtifactStagingDirectory)/$(msName)/version.json

          echo "{ \"ms\": \"$(msName)\", \"version\": \"$(msVersion)\" }" > $(Build.ArtifactStagingDirectory)/$(msName)/version.json
          echo -e "\n📂 File ./$(msName)/version.json"
          jq . "$(Build.ArtifactStagingDirectory)/$(msName)/version.json"
        displayName: "⚙️ Create version file for: $(msName)"
        condition: succeeded()
