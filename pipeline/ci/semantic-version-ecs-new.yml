jobs:
  - job: "semantic_version_microservices"
    displayName: "🏷️ version microservices"
    pool:
      name: "Azure Pipelines"
      VmImage: ubuntu-22.04

    variables:
      - template: ../variables/groups-transversal-variables.yml
        parameters:
          release: ${{ parameters.release }}

    steps:
      - checkout: self
        fetchDepth: 0
        persistCredentials: true

      - script: |
          set -e
          echo "⚙️ Procesando microservices..."

          CURRENT_BRANCH="$(Build.SourceBranch)"
          ECR="861262569826.dkr.ecr.us-east-1.amazonaws.com"
          ENVIRONMENT="unknown"

          case "$CURRENT_BRANCH" in
            refs/heads/develop)   ENVIRONMENT="develop"; ;;
            refs/heads/staging)   ENVIRONMENT="qa"; ;;
            refs/heads/master)    ENVIRONMENT="prd"; ;;
          esac

          if [[ "$ENVIRONMENT" == "unknown" ]]; then
            echo -e "\n##vso[task.logissue type=error]⚠️ Error: ENVIRONMENT [$ENVIRONMENT] no reconocido."
            exit 99
          fi

          declare -A SERVICES=(
            #[raspa]="microservice-raspa-$ENVIRONMENT"
            #[scheduler]="microservice-scheduler-$ENVIRONMENT"

            [astro]="microservice-astro-$ENVIRONMENT"
            [awards]="microservice-awards-$ENVIRONMENT"
            [bff-administration]="microservice-bff-administration-$ENVIRONMENT"
            [bff-integration]="microservice-bff-integration-$ENVIRONMENT"
            [bff-sellers]="microservice-bff-sellers-$ENVIRONMENT"
            [biometrics]="microservice-biometrics-$ENVIRONMENT"
            [collected]="microservice-collected-$ENVIRONMENT"
            [conciliation]="microservice-conciliation-$ENVIRONMENT"
            [dynamic-storage]="microservice-dynamic-storage-$ENVIRONMENT"
            [external-wager]="microservice-external-wager-$ENVIRONMENT"
            [generic-services]="microservice-generic-services-$ENVIRONMENT"
            [hierarchies]="microservice-hierarchies-$ENVIRONMENT"
            [legacy]="microservice-legacy-$ENVIRONMENT"
            [lotteries]="microservice-lotteries-$ENVIRONMENT"
            [lotteries-games]="microservice-lotteries-games-$ENVIRONMENT"
            [millonario]="microservice-millonario-$ENVIRONMENT"
            [money-control]="microservice-money-control-$ENVIRONMENT"
            [notifications]="microservice-notifications-$ENVIRONMENT"
            [notifier]="microservice-notifier-$ENVIRONMENT"
            [online-games]="microservice-online-games-$ENVIRONMENT"
            [papelery]="microservice-papelery-$ENVIRONMENT"
            [payment-voucher]="microservice-payment-voucher-$ENVIRONMENT"
            [payments]="microservice-payments-$ENVIRONMENT"
            [products]="microservice-products-$ENVIRONMENT"
            [promotional]="microservice-promotional-$ENVIRONMENT"
            [raffles]="microservice-raffles-$ENVIRONMENT"
            [recharges]="microservice-recharges-$ENVIRONMENT"
            [remittances]="microservice-remittances-$ENVIRONMENT"
            [reports]="microservice-reports-$ENVIRONMENT"
            [security]="microservice-security-$ENVIRONMENT"
            [sellers]="microservice-sellers-$ENVIRONMENT"
            [shopping-cart]="microservice-shopping-cart-$ENVIRONMENT"
            [siga]="microservice-siga-$ENVIRONMENT"
            [transaction]="microservice-transaction-$ENVIRONMENT"
            [transaction-astro]="microservice-transaction-$ENVIRONMENT"
            [transaction-lotteries-games]="microservice-transaction-$ENVIRONMENT"
            [transaction-notifier]="microservice-transaction-notifier-$ENVIRONMENT"
            [transaction-recharges]="microservice-transaction-$ENVIRONMENT"
            [wiretransfer]="microservice-wiretransfer-$ENVIRONMENT"
          )

          for SERVICE in "${!SERVICES[@]}"; do
            REPO_NAME="${SERVICES[$SERVICE]}"
            echo -e "\n🔍 Consultando $SERVICE ..."

            VERSION=$(aws ecr describe-images --repository-name "$REPO_NAME" --region "$AWS_DEFAULT_REGION" --query "reverse(sort_by(imageDetails, &imagePushedAt))[0]" --output json | jq -r '.imageTags // [] | map(select(. != "latest")) | .[0]')
            if [[ -z "$VERSION" || "$VERSION" == "null" ]]; then
              echo -e "\n##vso[task.logissue type=error]⚠️ No se encontró versión para -> $REPO_NAME"
              exit 99
            fi

            FULL_IMAGE="$ECR/$REPO_NAME:$VERSION"
            SERVICES[$SERVICE]="$FULL_IMAGE"

            echo "Repo: $REPO_NAME → $VERSION"
            echo "Imagen: $FULL_IMAGE"
            echo "------------------------------------------------------------"
          done

          # Convertir array a JSON
          SERVICES_JSON=$(jq -n '{
            '"$(for k in "${!SERVICES[@]}"; do
                  echo "\"$k\": \"${SERVICES[$k]}\","
                done | sed '$s/,$//')"'
          }')
          echo "$SERVICES_JSON" > services.json

          mkdir -p $(Build.ArtifactStagingDirectory)/microservices
          cp services.json $(Build.ArtifactStagingDirectory)/microservices/version.json

          echo -e "\n📂 File : ./services.json"
          jq . "services.json"
        displayName: "🔎 Visualizando versiones"
        condition: succeeded()
        env:
          AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)
          AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID_DEPLOY)
          AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY_DEPLOY)

      - task: PublishBuildArtifacts@1
        inputs:
          PathtoPublish: "$(Build.ArtifactStagingDirectory)"
          ArtifactName: "versions"
          publishLocation: "Container"
        displayName: "📥 Publish artifact version"
        condition: succeeded()
