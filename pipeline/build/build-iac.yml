stages:
  - stage: "Plan_iac"
    ${{ if startsWith(variables['Build.SourceBranch'], 'refs/heads/feature/') }}:
      displayName: "📦 Plan iac Feature"
    ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/develop') }}:
      displayName: "📦 Plan iac Develop"
    ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/staging') }}:
      displayName: "📦 Plan iac Staging"
    ${{ if or(eq(variables['Build.SourceBranchName'], 'master'), startsWith(variables['Build.SourceBranch'], 'refs/tags/')) }}:
      displayName: "📦 Plan iac Master ${{ parameters.red }}"

    variables:
      - template: ../variables/groups-transversal-variables-iac.yml
        parameters:
          red: ${{ parameters.red }}

    jobs:
      - ${{ if eq(parameters.release, 'iac') }}:
          - template: jobs/job-iac.yml
