stages:
  - stage: "build_unit_${{ parameters.red }}"
    ${{ if startsWith(variables['Build.SourceBranch'], 'refs/heads/feature') }}:
      displayName: "📦 Build Repository Configuration Feature"
    ${{ if startsWith(variables['Build.SourceBranch'], 'refs/heads/hotfix') }}:
      displayName: "📦 Build Repository Configuration Hotfix"
    ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/develop') }}:
      displayName: "📦 Build Repository Configuration Develop"
    ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/staging') }}:
      displayName: "📦 Build Repository Configuration Staging"
    ${{ if or(eq(variables['Build.SourceBranchName'], 'master'), startsWith(variables['Build.SourceBranch'], 'refs/tags/')) }}:
      displayName: "📦 Build Repository Configuration Master ${{ parameters.red }}"

    dependsOn:
      - "semantic_version_integration"
    condition: in(dependencies.semantic_version_integration.result, 'Succeeded', 'SucceededWithIssues')
    
    variables:
      - template: ../variables/groups-transversal-variables-rpc.yml
        parameters:
          red: ${{ parameters.red }}

    jobs:
      - ${{ if eq(parameters.release, 'rpc') }}:
          - template: jobs/job-rpc.yml
            parameters:
              red: ${{ parameters.red }}
