stages:
  - stage: "microservices_development"
    displayName: "🧩 Semantic Version Microservices"
    dependsOn: []
    condition: and( eq(variables['Build.Reason'], 'PullRequest'), or(startsWith(variables['System.PullRequest.SourceBranch'], 'refs/heads/feature/'), startsWith(variables['System.PullRequest.SourceBranch'], 'refs/heads/hotfix/')))

    jobs:
      - ${{ if eq(parameters.release, 'aws-ecs') }}:
          - template: ../general/semantic-version-backend-pr.yml
            parameters:
              apps: ${{ parameters.apps }}

  - stage: "build_development_${{ parameters.red }}"
    displayName: "🛠️ Build Development Pull Request"

    dependsOn:
      - "microservices_development"
    condition: and(
      in(dependencies.microservices_development.result, 'Succeeded', 'SucceededWithIssues'),
      eq(variables['Build.Reason'], 'PullRequest'),or(startsWith(variables['System.PullRequest.SourceBranch'], 'refs/heads/feature/'),startsWith(variables['System.PullRequest.SourceBranch'], 'refs/heads/hotfix/')))

    variables:
      - template: ../variables/groups-transversal-variables-new.yml

    jobs:
      - ${{ if eq(parameters.release, 'aws-ecs') }}:
          - template: jobs/job-backend.yml
