stages:
- stage: 'microservices_developmet'
  displayName: 'microservices Developmet'
  dependsOn: []

  jobs:
  - template: ../general/semantic-version-job.yml


- stage: 'build_unit'
  displayName: 'Build Unit'

  variables:
  - template: ../variables/groups-transversal-variables.yml

  jobs:
  - ${{ if eq(parameters.language, 'flutter') }}:
    - template: jobs/flutter-jobs.yml
      parameters:
        red: ${{ parameters.red }}