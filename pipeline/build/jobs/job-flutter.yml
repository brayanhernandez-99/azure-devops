jobs:
  - ${{ if not(startsWith(variables['Build.SourceBranch'], 'refs/heads/feature/')) }}:
      - deployment: WaitForApproval
        displayName: "Esperar aprobación"
        pool:
          vmImage: "ubuntu-22.04"
          environment: ${{ variables.environmentName }}
        variables:
          ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/develop') }}:
            environmentName: "Build develop"
          ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/staging') }}:
            environmentName: "Build staging"
          ${{ if or(eq(variables['Build.SourceBranchName'], 'master'), startsWith(variables['Build.SourceBranch'], 'refs/tags/')) }}:
            environmentName: "Build master ${{ parameters.red }}"
        strategy:
          runOnce:
            deploy:
              steps:
                - script: echo "Aprobación recibida. Iniciando despliegues..."

  - job: "build_flutter"
    displayName: ${{ variables.jobDisplayName }}
    pool:
      vmImage: "macos-latest"
    variables:
      ANDROID_HOME: /Users/runner/Library/Android/sdk
      flutterCacheKey: $(Build.SourceVersion)
      versionFlutter: $[coalesce(variables.flutterVersion, '3.x.x')]
      ${{ if startsWith(variables['Build.SourceBranch'], 'refs/heads/feature/') }}:
        jobDisplayName: "Build Flutter Feature"
      ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/develop') }}:
        jobDisplayName: "Build Flutter Develop"
      ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/staging') }}:
        jobDisplayName: "Build Flutter Staging"
      ${{ if or(eq(variables['Build.SourceBranchName'], 'master'), startsWith(variables['Build.SourceBranch'], 'refs/tags/')) }}:
        jobDisplayName: "Build Flutter Master ${{ parameters.red }}"

    steps:
      - task: FlutterInstall@0
        displayName: "🔧 Install Flutter $(versionFlutter)"
        inputs:
          mode: "auto"
          channel: "stable"
          version: "custom"
          customVersion: $(versionFlutter)

      - task: DownloadBuildArtifacts@0
        displayName: "📥 Download Version Artifact"
        inputs:
          artifactName: "versions"
          downloadPath: "$(Pipeline.Workspace)/downloaded-versions"

      - script: |
          ls -R $(Pipeline.Workspace)/downloaded-versions/versions/version-apk
          VERSION_FILE="$(Pipeline.Workspace)/downloaded-versions/versions/version-apk/version.json"
          if [[ -f "$VERSION_FILE" ]]; then
            VERSION=$(jq -r '.version' $VERSION_FILE)
            BASE_VERSION=$(echo "$VERSION" | cut -d'-' -f1)
            echo "🚀 Versión detectada para apk: $BASE_VERSION"
            echo "##vso[task.setvariable variable=msVersion]$BASE_VERSION"
          else
            echo "❌ No se encontró archivo de versión para apk"
            exit 1
          fi
        displayName: "📚 Read apk versions"

      - script: |
          ls -R $(Pipeline.Workspace)/downloaded-versions/versions/version-pubspec-apk
          VERSION_FILE="$(Pipeline.Workspace)/downloaded-versions/versions/version-pubspec-apk/version.json"
          if [[ -f "$VERSION_FILE" ]]; then
            VERSION=$(jq -r '.version' $VERSION_FILE)
            echo "🚀 Versión detectada para apk pub: +$VERSION"
            echo "##vso[task.setvariable variable=msVersionPubspec]$VERSION"
          else
            echo "❌ No se encontró archivo de versión para apk pubspec"
            exit 1
          fi
        displayName: "📚 Read apk pubspec versions"

      - script: |
          echo "Version a actualizar: $(msVersion)"
          sed -i '' "s/^version: .*/version: $(msVersion)+$(msVersionPubspec)/" pubspec.yaml

          cat pubspec.yaml
        displayName: "Change version file pubspec"

      - script: |
          CURRENT_BRANCH=$(echo $(Build.SourceBranch))
          echo "Version a actualizar: $(msVersion)"
          echo "Branch: $CURRENT_BRANCH"
          echo "Red: $red"

          case "$CURRENT_BRANCH" in
            refs/heads/develop | refs/heads/feature/*)
              CURRENT_BRANCH_PR="dev"
              ;;
            refs/heads/staging)
              CURRENT_BRANCH_PR="qa"
              ;;
            refs/heads/master)
              case "$red" in
                "antioquia") CURRENT_BRANCH_PR="prd-gana" ;;
                "cap")       CURRENT_BRANCH_PR="prd-cap" ;;
                "tolima")    CURRENT_BRANCH_PR="prd-seapto" ;;
                "huila")     CURRENT_BRANCH_PR="prd-suchance" ;;
                "cauca")     CURRENT_BRANCH_PR="prd-acertemos" ;;
                "boyaca")    CURRENT_BRANCH_PR="prd-jer" ;;
                *) 
                  echo "⚠️ Región [$red] no reconocida para master"; 
                  exit 99 
                  ;;
              esac
              ;;
            *)
              echo "⚠️ Rama [$CURRENT_BRANCH] no reconocida"
              exit 99
              ;;
          esac

          echo -e "\nVERSION: $(msVersion)"
          echo "ENVIRONMENT: $CURRENT_BRANCH_PR"
          echo "URL: $(BASE_URL_FLUTTER)"

          jq --arg version "$(msVersion)" --arg environment "$CURRENT_BRANCH_PR" --arg url "$(BASE_URL_FLUTTER)" '.VERSION = $version | .ENVIRONMENT = $environment | .BASE_URL = $url' env.json > tmp.json && mv tmp.json env.json
          cat env.json
        displayName: "Change version, environment, url file env.json"
        env:
          red: ${{ parameters.red }}

      - script: |
          CURRENT_BRANCH=$(echo $(Build.SourceBranch))
          echo "Branch: $CURRENT_BRANCH"
          echo "Red: $red"

          case "$CURRENT_BRANCH" in
            refs/heads/develop | refs/heads/feature/*)
              CURRENT_BRANCH_PR="dev"
              ;;
            refs/heads/staging)
              CURRENT_BRANCH_PR="qa"
              ;;
            refs/heads/master)
              case "$red" in
                "antioquia") CURRENT_BRANCH_PR="gana" ;;
                "cap")       CURRENT_BRANCH_PR="cap" ;;
                "tolima")    CURRENT_BRANCH_PR="seapto" ;;
                "huila")     CURRENT_BRANCH_PR="suchance" ;;
                "cauca")     CURRENT_BRANCH_PR="acertemos" ;;
                "boyaca")    CURRENT_BRANCH_PR="jer" ;;
                *)           
                  echo "⚠️ Región [$red] no reconocida para master"; 
                  exit 99 
                  ;;
              esac
              ;;
            *)
              echo "⚠️ Rama [$CURRENT_BRANCH] no reconocida"
              exit 99 
              ;;
          esac

          NEW_APP_ID="com.ux.mobile.$CURRENT_BRANCH_PR"
          echo "New app ID: $NEW_APP_ID"
          sed -i '' "s|applicationId *= *\"[^\"]*\"|applicationId = \"$NEW_APP_ID\"|" android/app/build.gradle

          echo -e "\n Archivo Build.gradle"
          cat android/app/build.gradle
        displayName: "Change file build.gradle"
        env:
          red: ${{ parameters.red }}

      - script: |
          echo "✔️ Verificando entorno Flutter y Android SDK..."
          echo -e "\n📦 ANDROID_HOME: $ANDROID_HOME" && ls -la "$ANDROID_HOME"
          echo -e "\n🌀 Flutter versión:" && flutter --version
          echo -e "\n📥 Ejecutando flutter pub get..."
          flutter pub get
        displayName: "🌀 Flutter: Get Dependencies"

      - script: |
          echo "Verificando carpeta assets"
          if [ -d "assets" ] && [ "$(ls -A assets)" ]; then
            echo "✅ Assets encontrados"
            ls -la assets
          else
            echo "❌ Error: No se encontraron assets"
            exit 99
          fi
        displayName: "✔️ Verify assets"

      - script: |
          echo "Descargando Keystore"
          mkdir -p android/app/keystore

          aws s3 cp s3://repository-native/app-seller/android/keystore/$(KEY_ALIAS).jks android/app/keystore/            
          if [ -d "android/app/keystore" ] && [ "$(ls -A android/app/keystore/$(KEY_ALIAS).jks)" ]; then    
            echo "✅ Keystore descargado"
            ls -la android/app/keystore/*
          else
            echo "❌ Error: No se descargo el Keystore"
            exit 99
          fi
        displayName: "📥 Download Keystore"
        env:
          AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID_DEPLOY)
          AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY_DEPLOY)
          AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)

      - script: |
          escape_value() {
          local raw="$1"
          printf '%s' "$raw" | sed \
            -e 's/\\/\\\\/g' \
            -e 's/"/\\"/g' \
            -e "s/'/\\'/g" \
            -e 's/=/\\=/g' \
            -e 's/:/\\:/g' \
            -e 's/ /\\ /g' \
            -e 's/!/\!/g' \
            -e 's/#/\\#/g' \
            -e 's/\$/\\$/g' \
            -e 's/-/\\-/g'
          }
          ESCAPED_STORE_PASSWORD=$(escape_value "$STORE_PASSWORD")
          ESCAPED_KEY_PASSWORD=$(escape_value "$KEY_PASSWORD")

          touch android/key.properties
          echo "keyAlias=$KEY_ALIAS" >> android/key.properties
          echo "keyPassword=$ESCAPED_KEY_PASSWORD" >> android/key.properties
          echo "storePassword=$ESCAPED_STORE_PASSWORD" >> android/key.properties
          echo "storeFile=keystore/$KEY_ALIAS.jks" >> android/key.properties

          echo "✅ File key.properties creado"
          ls -la android/key.properties
          cat android/key.properties | sed -E 's/^(keyPassword|storePassword)=.*/\1=*** /'
        displayName: "🔐 Assign Keystore"
        env:
          KEY_ALIAS: $(KEY_ALIAS)
          KEY_PASSWORD: $(KEY_PASSWORD)
          STORE_PASSWORD: $(STORE_PASSWORD)

      - script: |
          echo -e "\n☕ JAVA_HOME: $JAVA_HOME" && java -version
          echo -e "\n🌀 Flutter versión:" && flutter --version

          echo -e "\n🌀Ejecutando Build Flutter: flutter --no-color build apk --no-tree-shake-icons --profile"
          flutter --no-color build apk --no-tree-shake-icons --profile
        displayName: "⚙️ Flutter Build APK"

      - script: |
          echo "Verificando Build Apk"
          if [ -d "build/app/outputs/flutter-apk" ] && [ "$(ls -A build/app/outputs/flutter-apk)" ]; then
            echo "✅ Apk encontrado"
            SHA1_APK=$(shasum -a 1 build/app/outputs/flutter-apk/app-profile.apk | awk '{print $1}')
            SHA1_FLUTTER=$(cut -d ' ' -f1 build/app/outputs/flutter-apk/app-profile.apk.sha1)
            ls -la build/app/outputs/flutter-apk

            echo -e "\n🔐 SHA-1 Apk: $SHA1_APK"
            echo "🔐 SHA-1 Flutter: $SHA1_FLUTTER"
            echo "🔐 SHA-1 Certificado:"
            $ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs build/app/outputs/flutter-apk/app-profile.apk | grep -A 5 "Signer #"
          else
            echo "❌ Error: Apk no encontrado"
            exit 99
          fi
        displayName: "✔️ Verify apk"

      - script: |
          CURRENT_BRANCH=$(echo $(Build.SourceBranch))
          echo "Renombrando APK..."
          echo "Branch: $CURRENT_BRANCH"
          echo "Red: $red"

          case "$CURRENT_BRANCH" in
            refs/heads/develop)
              CURRENT_BRANCH_PR="dev"
              echo "$CURRENT_BRANCH_PR"
              ;;
            refs/heads/staging)
              CURRENT_BRANCH_PR="qa"
              ;;
            refs/heads/master)
              case "$red" in
                "antioquia") CURRENT_BRANCH_PR="prd-gana" ;;
                "cap")       CURRENT_BRANCH_PR="cap" ;;
                "tolima")    CURRENT_BRANCH_PR="prd-seapto" ;;
                "huila")     CURRENT_BRANCH_PR="prd-suchance" ;;
                "cauca")     CURRENT_BRANCH_PR="prd-acertemos" ;;
                "boyaca")    CURRENT_BRANCH_PR="prd-jer" ;;
                *)           echo "⚠️ Región [$red] no reconocida para master"; exit 1 ;;
              esac
              ;;
            *)
              echo "⚠️ Rama [$CURRENT_BRANCH] no reconocida"; exit 1
              ;;
          esac

          mv build/app/outputs/flutter-apk/app-profile.apk build/app/outputs/flutter-apk/invictus-$CURRENT_BRANCH_PR-v$(msVersion).apk
          mv build/app/outputs/flutter-apk/app-profile.apk.sha1 build/app/outputs/flutter-apk/invictus-$CURRENT_BRANCH_PR-v$(msVersion).apk.sha1
          APKNAME="invictus-$CURRENT_BRANCH_PR-v$(msVersion).apk"
          echo "##vso[task.setvariable variable=apknameclean]$APKNAME"
          ls -l build/app/outputs/flutter-apk
        displayName: "Change name file Apk"
        condition: not(startsWith(variables['Build.SourceBranch'], 'refs/heads/feature/'))
        env:
          red: ${{ parameters.red }}

      - script: |
          CURRENT_BRANCH=$(echo $(Build.SourceBranch))
          echo "Branch: $CURRENT_BRANCH"
          echo "Red: $red"

          case "$CURRENT_BRANCH" in
            refs/heads/develop)
              CURRENT_BRANCH_PR="dev"
              ;;
            refs/heads/staging)
              CURRENT_BRANCH_PR="qa"
              ;;
            refs/heads/master)
              case "$red" in
                "antioquia") CURRENT_BRANCH_PR="prd-gana" ;;
                "cap")       CURRENT_BRANCH_PR="cap" ;;
                "tolima")    CURRENT_BRANCH_PR="prd-seapto" ;;
                "huila")     CURRENT_BRANCH_PR="prd-suchance" ;;
                "cauca")     CURRENT_BRANCH_PR="prd-acertemos" ;;
                "boyaca")    CURRENT_BRANCH_PR="prd-jer" ;;
                *)           echo "⚠️ Región [$red] no reconocida para master"; exit 1 ;;
              esac
              ;;
            *)
              echo "⚠️ Rama [$CURRENT_BRANCH] no reconocida"; exit 1
              ;;
          esac
          mkdir -p build/app/outputs/flutter-apk/$CURRENT_BRANCH_PR

          # Mover el archivo a la subcarpeta
          mv build/app/outputs/flutter-apk/$(apknameclean) build/app/outputs/flutter-apk/$CURRENT_BRANCH_PR/

          # Verifica que el archivo está donde debe
          ls -l build/app/outputs/flutter-apk/$CURRENT_BRANCH_PR/

          # Subir a S3 la carpeta completa
          aws s3 cp build/app/outputs/flutter-apk/$CURRENT_BRANCH_PR/ s3://repository-native/app-seller/android/$CURRENT_BRANCH_PR/ --recursive --acl public-read
        displayName: "Copy Apk Bucket S3"
        condition: not(startsWith(variables['Build.SourceBranch'], 'refs/heads/feature/'))
        env:
          AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID_DEPLOY)
          AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY_DEPLOY)
          AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)
          red: ${{ parameters.red }}
