jobs:
  - ${{ if not(startsWith(variables['Build.SourceBranch'], 'refs/heads/feature/')) }}:
      - deployment: WaitForApproval
        displayName: "Esperar aprobación"
        pool:
          vmImage: "ubuntu-22.04"
          environment: ${{ variables.environmentName }}
        variables:
          ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/develop') }}:
            environmentName: "Build develop"
          ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/staging') }}:
            environmentName: "Build staging"
          ${{ if or(eq(variables['Build.SourceBranchName'], 'master'), startsWith(variables['Build.SourceBranch'], 'refs/tags/')) }}:
            environmentName: "Build master ${{ parameters.red }}"
        strategy:
          runOnce:
            deploy:
              steps:
                - script: echo "Aprobación recibida. Iniciando despliegues..."

  - job: "build_electron_windows"
    displayName: ${{ variables.jobDisplayName }}
    pool:
      vmImage: "windows-latest"
    variables:
      versionNode: $[coalesce(variables.nodeVersion, '18.x')]
      versionPython: $[coalesce(variables.pythonVersion, '3.x')]
      ${{ if startsWith(variables['Build.SourceBranch'], 'refs/heads/feature/') }}:
        jobDisplayName: "Build Electron Feature"
      ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/develop') }}:
        jobDisplayName: "Build Electron Develop"
      ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/staging') }}:
        jobDisplayName: "Build Electron Staging"
      ${{ if or(eq(variables['Build.SourceBranchName'], 'master'), startsWith(variables['Build.SourceBranch'], 'refs/tags/')) }}:
        jobDisplayName: "Build Electron Master ${{ parameters.red }}"

    steps:
      - task: DownloadBuildArtifacts@0
        displayName: "📥 Download Version Artifact"
        inputs:
          artifactName: "versions"
          downloadPath: "$(Pipeline.Workspace)/downloaded-versions"

      - task: PowerShell@2
        displayName: "📚 Read exe versions"
        inputs:
          targetType: "inline"
          script: |
            $ErrorActionPreference = "Stop"
            $versionFile = "$(Pipeline.Workspace)\downloaded-versions\versions\version-electron\version.json"
            if (Test-Path $versionFile) {
              $json = Get-Content $versionFile | ConvertFrom-Json
              $version = $json.version
              $baseVersion = $version.Split('-')[0]
              Write-Host "🚀 Versión detectada para .exe: $baseVersion"
              Write-Host "##vso[task.setvariable variable=version]$baseVersion"
            } else {
              Write-Host "❌ No se encontró archivo de versión para .exe"
              exit 99
            }

      - task: PowerShell@2
        name: AuthCodeArtifact
        displayName: "🔐 Setup CodeArtifact & npm config"
        inputs:
          targetType: "inline"
          script: |
            $ErrorActionPreference = "Stop"
            Write-Host "🔐 Obteniendo token de AWS CodeArtifact..."

            $token = aws codeartifact get-authorization-token `
              --domain matrixtech-npm-repository `
              --domain-owner $env:ACCOUNT_ID_DEPLOY `
              --region $env:AWS_DEFAULT_REGION `
              --query authorizationToken `
              --output text

            if (-not $token) {
              Write-Error "❌ No se pudo obtener el token de AWS CodeArtifact"
              exit 99
            }

            $repoDomain = "matrixtech-npm-repository-$($env:ACCOUNT_ID_DEPLOY).d.codeartifact.$($env:AWS_DEFAULT_REGION).amazonaws.com"
            $repoPath = "npm/matrixtech-npm-repository"
            $repoUrl = "https://$repoDomain/$repoPath"

            Write-Host "Configurando npm..."
            npm config set "//$repoDomain/$repoPath/:_authToken" $token
            npm config set registry $repoUrl

            Write-Host "Verificando identidad de AWS..."
            aws sts get-caller-identity

            $npmrcPath = Join-Path "$(System.DefaultWorkingDirectory)" ".npmrc"
            @"
            //$repoDomain/$repoPath/:_authToken=$token
            registry=$repoUrl
            "@ | Set-Content -Encoding UTF8 -Path $npmrcPath

            Write-Host "📁 Contenido del archivo .npmrc:"
            Get-Item $npmrcPath | Select-Object Name, FullName, Length, LastWriteTime, Mode
        env:
          AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID_DEPLOY)
          AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY_DEPLOY)
          AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)

      - task: PowerShell@2
        displayName: "⚙️ Generate .env"
        inputs:
          targetType: "inline"
          script: |
            $ErrorActionPreference = "Stop"
            Write-Host "⚙️ Generando .env"
            $currentBranch="$(Build.SourceBranch)"

            $environment = "unknown"
            switch -Wildcard ($currentBranch) {
              "refs/heads/feature/*" { $environment = "dev"; break }
              "refs/heads/hotfix/*"  { $environment = "dev"; break }
              "refs/heads/develop"   { $environment = "dev"; break }
              "refs/heads/staging"   { $environment = "qa"; break }
              "refs/heads/master"    { $environment = "production"; break }
              default                { $environment = "unknown" }
            }
            if ($environment -ne "unknown") {
              @"
              DOMAIN_ADMIN=$BASE_URL_ELECTRON_ADMIN
              DOMAIN_SELLER=$BASE_URL_ELECTRON_SELLERS
              TARGET=windows
              TARGET_ENVIRONMENT=$environment
              "@ | Set-Content -Encoding UTF8 .env

              Write-Host "📁 Archivo .env"
              Get-Content .env
            } else {
              Write-Host "❌ No se encontró una rama valida, branch [$environment]."
              exit 99
            }

      - task: PowerShell@2
        displayName: "📝 Update version in package.json"
        inputs:
          targetType: "inline"
          script: |
            $ErrorActionPreference = "Stop"
            $packagePath = "$(Build.SourcesDirectory)\package.json"
            $newVersion = "$(version)"

            if (Test-Path $packagePath) {
              Write-Host "📦 Modificando versión en package.json: $newVersion"

              $packageJson = Get-Content $packagePath -Raw | ConvertFrom-Json
              $packageJson.version = $newVersion
              $packageJson | ConvertTo-Json -Depth 10 | Set-Content -Encoding UTF8 $packagePath

              Write-Host "✅ Versión actualizada correctamente."
              Get-Content $packagePath | ForEach-Object { Write-Host $_ }
            } else {
              Write-Host "❌ No se encontró el archivo package.json en la ruta [$packagePath]"
              exit 99
            }

      - task: UsePythonVersion@0
        displayName: '🔧 Install Python "$(versionPython)"'
        inputs:
          versionSpec: "$(versionPython)"
          addToPath: true

      - task: NodeTool@0
        displayName: "🔧 Install Nodejs $(versionNode)"
        inputs:
          versionSource: "spec"
          versionSpec: "$(versionNode)"

      - task: PowerShell@2
        displayName: "⚙️ Install pnpm"
        inputs:
          targetType: "inline"
          script: |
            npm install -g pnpm

      - task: PowerShell@2
        displayName: ⚙️ "Install dependencies"
        inputs:
          targetType: "inline"
          script: |
            Write-Host "📦 Instalando dependencias"
            pnpm i
  
            Write-Host "`n📦 Dependencias instaladas:"
            pnpm list --depth=0

