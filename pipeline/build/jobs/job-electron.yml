jobs:
  - ${{ if not(startsWith(variables['Build.SourceBranch'], 'refs/heads/feature/')) }}:
      - deployment: WaitForApproval
        displayName: "Esperar aprobación"
        pool:
          vmImage: "ubuntu-22.04"
        ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/develop') }}:
          environment: "Build develop"
        ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/staging') }}:
          environment: "Build staging"
        ${{ if or(eq(variables['Build.SourceBranchName'], 'master'), startsWith(variables['Build.SourceBranch'], 'refs/tags/')) }}:
          environment: "Build master ${{ parameters.red }}"
        strategy:
          runOnce:
            deploy:
              steps:
                - script: echo "Aprobación recibida. Iniciando despliegues..."

  - job: "build_electron_windows"
    ${{ if startsWith(variables['Build.SourceBranch'], 'refs/heads/feature/') }}:
      displayName: "Build Electron Feature"
    ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/develop') }}:
      displayName: "Build Electron Develop"
    ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/staging') }}:
      displayName: "Build Electron Staging"
    ${{ if or(eq(variables['Build.SourceBranchName'], 'master'), startsWith(variables['Build.SourceBranch'], 'refs/tags/')) }}:
      displayName: "Build Electron Master ${{ parameters.red }}"
    pool:
      vmImage: "windows-latest"
    variables:
      NODE_OPTIONS: "--max-old-space-size=4096"
      versionNode: $[coalesce(variables.nodeVersion, '18.20.7')]
      versionPython: $[coalesce(variables.pythonVersion, '3.24.0')]

    steps:
      # - task: Cache@2
      #   inputs:
      #     key: 'choco | "$(Agent.OS)"'
      #     path: 'C:\ProgramData\chocolatey\lib'
      #     cacheHitVar: CHOCO_CACHE_RESTORED

      # - task: PowerShell@2
      #   displayName: "⚙️ Install VS Build Tools + Windows SDK"
      #   inputs:
      #     targetType: "inline"
      #     script: |
      #       if (-not $env:CHOCO_CACHE_RESTORED) {
      #         Write-Host "`n⚙️ Instalando VS Build Tools y Windows SDK..."
      #         choco install visualstudio2022buildtools --package-parameters "--add Microsoft.VisualStudio.Workload.VCTools --add Microsoft.VisualStudio.Component.Windows10SDK.19041 --quiet --norestart --includeRecommended" -y
      #         choco install windows-sdk-10-version-2004-all -y --force
      #       } else {
      #         Write-Host "`n✅ Usando cache de Build Tools y SDK"
      #       }

      - task: DownloadBuildArtifacts@0
        displayName: "📥 Download Version Artifact"
        inputs:
          artifactName: "versions"
          downloadPath: "$(Pipeline.Workspace)/downloaded-versions"

      - task: PowerShell@2
        displayName: "📚 Read exe versions"
        inputs:
          targetType: "inline"
          script: |
            $ErrorActionPreference = "Stop"
            $versionFile = "$(Pipeline.Workspace)\downloaded-versions\versions\electron\version.json"
            if (Test-Path $versionFile) {
              $json = Get-Content $versionFile | ConvertFrom-Json
              $version = $json.version
              $baseVersion = $version.Split('-')[0]
              Write-Host "`n🚀 Versión detectada para .exe: $baseVersion"
              Write-Host "##vso[task.setvariable variable=version]$baseVersion"
            } else {
              Write-Host "`n❌ No se encontró archivo de versión para .exe"
              exit 99
            }

      - task: PowerShell@2
        name: AuthCodeArtifact
        displayName: "🔐 Setup CodeArtifact & npm config"
        inputs:
          targetType: "inline"
          script: |
            $ErrorActionPreference = "Stop"
            Write-Host "🔐 Obteniendo token de AWS CodeArtifact..."

            $token = aws codeartifact get-authorization-token `
              --domain matrixtech-npm-repository `
              --domain-owner $env:ACCOUNT_ID_DEPLOY `
              --region $env:AWS_DEFAULT_REGION `
              --query authorizationToken `
              --output text

            if (-not $token) {
              Write-Error "`n❌ No se pudo obtener el token de AWS CodeArtifact"
              exit 99
            }

            $repoDomain = "matrixtech-npm-repository-$($env:ACCOUNT_ID_DEPLOY).d.codeartifact.$($env:AWS_DEFAULT_REGION).amazonaws.com"
            $repoPath = "npm/matrixtech-npm-repository"
            $repoUrl = "https://$repoDomain/$repoPath"

            Write-Host "Configurando npm..."
            npm config set "//$repoDomain/$repoPath/:_authToken" $token
            npm config set registry $repoUrl

            Write-Host "Verificando identidad de AWS..."
            aws sts get-caller-identity

            $npmrcPath = Join-Path "$(System.DefaultWorkingDirectory)" ".npmrc"
            @"
            //$repoDomain/$repoPath/:_authToken=$token
            registry=$repoUrl
            "@ | Set-Content -Encoding UTF8 -Path $npmrcPath

            Write-Host "`n✅ Archivo .npmrc creado correctamente"
            Get-Item $npmrcPath | Select-Object Name, FullName, Length, LastWriteTime, Mode
        env:
          AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID_DEPLOY)
          AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY_DEPLOY)
          AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)

      - task: PowerShell@2
        displayName: "⚙️ Generate .env"
        inputs:
          targetType: "inline"
          script: |
            $ErrorActionPreference = "Stop"
            Write-Host "`n📁 Generando .env"
            $currentBranch="$(Build.SourceBranch)"

            $environment = "unknown"
            $region = "unknown"
            $target_branch = "unknown"

            switch -Wildcard ($currentBranch) {
              "refs/heads/feature/*" { $environment = "dev"; $region = "dev"; $target_branch = "develop"; }
              "refs/heads/develop"   { $environment = "dev"; $region = "dev"; $target_branch = "develop"; }
              "refs/heads/staging"   { $environment = "qa"; $region = "qa"; $target_branch = "staging"; }
              "refs/heads/master" {
                switch ($env:red) {
                  "antioquia" { $environment = "production"; $region = "matrixtech"; $target_branch = "master"; }
                  "cap"       { $environment = "production"; $region = "cap"; $target_branch = "master"; }
                  "tolima"    { $environment = "production"; $region = "seapto"; $target_branch = "master"; }
                  "huila"     { $environment = "production"; $region = "suchance"; $target_branch = "master"; }
                  "cauca"     { $environment = "production"; $region = "acertemos"; $target_branch = "master"; }
                  "boyaca"    { $environment = "production"; $region = "jer"; $target_branch = "master"; }
                }
              }
            }
            if ($environment -ne "unknown") {
            @"
            DOMAIN_ADMIN="$(BASE_URL_ELECTRON_ADMIN)"
            DOMAIN_SELLER="$(BASE_URL_ELECTRON_SELLERS)"
            TARGET="windows"
            TARGET_ENVIRONMENT="$environment"
            "@ | Set-Content -Encoding UTF8 .env
              
              Write-Host "##vso[task.setvariable variable=environment]$environment"
              Write-Host "##vso[task.setvariable variable=region]$region"
              Write-Host "##vso[task.setvariable variable=target_branch]$target_branch"
              Write-Host "`n✅ Archivo .env creado correctamente"
              Get-Content .env
            } else {
              Write-Host "`n❌ No se encontró una rama valida, branch [$environment]."
              exit 99
            }
        env:
          red: ${{ parameters.red }}

      - task: PowerShell@2
        displayName: "🔍 Check for 'console.log' in changes"        
        inputs:
          targetType: "inline"
          script: |
            $ErrorActionPreference = "Stop"
            git config --global credential.helper store

            $SOURCE_BRANCH = "$(Build.SourceBranch)".Replace("refs/heads/","")
            $TARGET_BRANCH = $env:target_branch   

            Write-Host "`n🔎 Verificando que no se hayan agregado nuevas sentencias console.log..."
            Write-Host "Branch actual: $SOURCE_BRANCH"
            Write-Host "Branch destino: $TARGET_BRANCH"

            git fetch origin $TARGET_BRANCH            
            $diff = git --no-pager diff origin/$TARGET_BRANCH..origin/$SOURCE_BRANCH

            if ($diff | Select-String -Pattern "^\+.*console\.log") {
                Write-Host "`n❌ Se encontró 'console.log' en los cambios"
                exit 99
            } else {
                Write-Host "`n✅ No se encontraron sentencias 'console.log' en los cambios"
            }
            
      - task: PowerShell@2
        displayName: "📝 Update version in package.json"
        inputs:
          targetType: "inline"
          script: |
            $ErrorActionPreference = "Stop"
            Write-Host "📦 Modificando versión en package.json: $env:version"
            $packagePath = "$(Build.SourcesDirectory)\package.json"

            if (Test-Path $packagePath) {
              $packageJson = Get-Content $packagePath -Raw | ConvertFrom-Json
              $packageJson.version = $env:version
              $packageJson | ConvertTo-Json -Depth 10 | Set-Content -Encoding UTF8 $packagePath

              Write-Host "`n✅ Version en package.json actualizada correctamente."
              Get-Content $packagePath | ForEach-Object { Write-Host $_ }
            } else {
              Write-Host "`n❌ No se encontró el archivo package.json en la ruta [$packagePath]"
              exit 99
            }

      - task: UsePythonVersion@0
        displayName: "🔧 Use Python $(versionPython)"
        inputs:
          versionSpec: "$(versionPython)"
          addToPath: true

      - task: NodeTool@0
        displayName: "🔧 Install Nodejs $(versionNode)"
        inputs:
          versionSource: "spec"
          versionSpec: "$(versionNode)"

      - task: PowerShell@2
        displayName: "⚙️ Install dependencies"
        inputs:
          targetType: "inline"
          script: |
            Write-Host "📦 Instalando dependencias"
            npm install -g pnpm
            pnpm install
            pnpm dlx electron-builder install-app-deps
  
            Write-Host "`n📦 Dependencias instaladas:"
            pnpm list --depth=0

      - task: PowerShell@2
        displayName: "📦 Build electron"
        inputs:
          targetType: " inline"
          script: |
            Write-Host "📦 Ejecutando build..."
            pnpm run build

      - task: PowerShell@2
        displayName: "🔍 Validate Build"
        inputs:
          targetType: " inline"
          script: |
            $ErrorActionPreference = "Stop"
            Write-Host "📝 Validando build electron..."

            $basePath = "$(Build.SourcesDirectory)\release\$($env:environment)\$($env:version)"
            New-Item -ItemType Directory -Path $basePath\$($env:region) -Force | Out-Null
            $allFound = $true 

            $filesToCopy = @(
              "InvictusUX Setup $($env:version).exe",
              "InvictusUX Setup $($env:version).exe.blockmap",
              "latest.yml"
            )

            foreach ($file in $filesToCopy) {
              $sourcePath      = Join-Path "$basePath" $file
              $destinationPath = Join-Path "$basePath\$($env:region)" $file

              if (Test-Path $sourcePath) {
                Copy-Item -Path $sourcePath -Destination $destinationPath -Force
                Write-Host "📂 Copiado: $file -> $destinationPath"
              } else {
                Write-Host "⚠️ Archivo no encontrado $file -> $sourcePath"
                $allFound = $false
              }
            }

            if (-not $allFound) {
              Write-Error "`n❌ Error: archivos requeridos no encontrados."
              exit 99
            } else {
              Write-Host "`n📂 Directorio: $basePath\$($env:region)"
              Get-ChildItem "$basePath\$($env:region)" -Force | Select-Object Mode, LastWriteTime, Length, Name | Format-Table -AutoSize
            }

      - task: PowerShell@2
        displayName: "📤 Upload Bucket S3"
        inputs:
          targetType: " inline"
          script: |
            $ErrorActionPreference = "Stop"
            Write-Host "📦 Cargando al Bucket S3..."

            $basePath = "$(Build.SourcesDirectory)\release\$($env:environment)\$($env:version)\$($env:region)"
            Write-Host "`n📂 Archivos a cargar: $basePath"
            Get-ChildItem "$basePath" -Force | Select-Object Mode, LastWriteTime, Length, Name | Format-Table -AutoSize

            aws s3 cp "$basePath" "s3://e-remote/invictus-electron/windows/$($env:region)" --recursive --acl public-read
        #condition: not(startsWith(variables['Build.SourceBranch'], 'refs/heads/feature/'))
        env:
          AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID_DEPLOY)
          AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY_DEPLOY)
          AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)