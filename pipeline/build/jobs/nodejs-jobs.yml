jobs:
  - job: 'build_nodejs'
    displayName: 'Build nodejs'    
    pool:
        name: 'Azure Pipelines'
        vmImage: 'ubuntu-22.04'
    variables:
      versionSpecification: $[coalesce(variables.nodejsVersion, '18.x')]

    strategy:
      matrix:
        ${{ each ms in parameters.apps }}:
          ${{ ms }}:
            msName: ${{ ms }}

    steps:
      - script: |
          echo "Compilando microservicio: $(msName)"
          ls -l
        displayName: "Build $(msName)"

      - task: NodeTool@0
        displayName: 'Use Nodejs $(versionSpecification)'
        inputs:
          versionSource: 'spec'
          versionSpec: '$(versionSpecification)'

      - task: Bash@3
        name: AuthCodeArtifact
        inputs:
          targetType: 'inline'
          script: |
            echo $AWS_ACCESS_KEY_ID
            export CODEARTIFACT_AUTH_TOKEN=$(aws codeartifact get-authorization-token \
              --domain matrixtech-npm-repository \
              --domain-owner 861262569826 \
              --region us-east-1 \
              --query authorizationToken \
              --output text )
            npm config set //matrixtech-npm-repository-861262569826.d.codeartifact.us-east-1.amazonaws.com/npm/matrixtech-npm-repository/:_authToken=$CODEARTIFACT_AUTH_TOKEN
            npm config set registry https://matrixtech-npm-repository-861262569826.d.codeartifact.us-east-1.amazonaws.com/npm/matrixtech-npm-repository/
            aws sts get-caller-identity

            echo "//matrixtech-npm-repository-861262569826.d.codeartifact.us-east-1.amazonaws.com/npm/matrixtech-npm-repository/:_authToken=$CODEARTIFACT_AUTH_TOKEN" > apps/$(msName)/.npmrc
            echo "registry=https://matrixtech-npm-repository-861262569826.d.codeartifact.us-east-1.amazonaws.com/npm/matrixtech-npm-repository/" >> apps/$(msName)/.npmrc
        env:
          AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID_DEPLOY)
          AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY_DEPLOY)
          AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)
      
      - script: |
          echo "Estás en la carpeta: $(System.DefaultWorkingDirectory)/apps/$(msName)"
          cd $(System.DefaultWorkingDirectory)/apps/$(msName)

          echo "Agregando control de CI para evitar que Husky se instale..."
          # Evitar que husky se instale en entornos CI
          sed -i 's#"prepare": "husky install"#"prepare": "test \\$CI = true || husky install"#' package.json || echo "No se pudo modificar prepare, puede que ya esté ajustado."

          echo "Instalando dependencias..."
          npm install
        displayName: 'Instalar dependencias del microservicio'

