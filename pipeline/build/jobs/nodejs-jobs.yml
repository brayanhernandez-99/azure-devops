jobs:
  - job: "build_nodejs"
    displayName: "Build nodejs"
    pool:
      name: "Azure Pipelines"
      vmImage: "ubuntu-22.04"
    variables:
      versionSpecification: $[coalesce(variables.nodejsVersion, '18.x')]

    strategy:
      matrix:
        ${{ each ms in parameters.apps }}:
          ${{ ms }}:
            msName: ${{ ms }}

    steps:
      - script: |
          echo "Compilando microservicio: $(msName)"
          ls -l
        displayName: "Build $(msName)"

      - task: DownloadBuildArtifacts@0
        inputs:
          artifactName: "versions"
          downloadPath: "$(Pipeline.Workspace)/downloaded-versions"
        displayName: "📥 Download Version Artifact"

      - script: |
          ls -R $(Pipeline.Workspace)/downloaded-versions/versions/$(msName)
          VERSION_FILE="$(Pipeline.Workspace)/downloaded-versions/versions/$(msName)/version.json"
          if [[ -f "$VERSION_FILE" ]]; then
            VERSION=$(jq -r '.version' $VERSION_FILE)
            echo "🚀 Versión detectada para $(msName): $VERSION"
            echo "##vso[task.setvariable variable=msVersion]$VERSION"
          else
            echo "❌ No se encontró archivo de versión para $(msName)"
            exit 1
          fi
        displayName: "📖 Read Microservice Versions"

      - task: NodeTool@0
        displayName: "🔧 Install Nodejs $(versionSpecification)"
        inputs:
          versionSource: "spec"
          versionSpec: "$(versionSpecification)"

      - script: |
          npm install -g pnpm
        displayName: "⚙️ Install pnpm"

      - task: Bash@3
        name: AuthCodeArtifact
        inputs:
          targetType: "inline"
          script: |
            export CODEARTIFACT_AUTH_TOKEN=$(aws codeartifact get-authorization-token \
              --domain matrixtech-npm-repository \
              --domain-owner $ACCOUNT_ID_DEPLOY \
              --region $AWS_DEFAULT_REGION \
              --query authorizationToken \
              --output text )
            npm config set //matrixtech-npm-repository-$ACCOUNT_ID_DEPLOY.d.codeartifact.$AWS_DEFAULT_REGION.amazonaws.com/npm/matrixtech-npm-repository/:_authToken=$CODEARTIFACT_AUTH_TOKEN
            npm config set registry https://matrixtech-npm-repository-861262569826.d.codeartifact.$AWS_DEFAULT_REGION.amazonaws.com/npm/matrixtech-npm-repository/
            aws sts get-caller-identity

            echo "//matrixtech-npm-repository-$ACCOUNT_ID_DEPLOY.d.codeartifact.$AWS_DEFAULT_REGION.amazonaws.com/npm/matrixtech-npm-repository/:_authToken=$CODEARTIFACT_AUTH_TOKEN" > apps/$(msName)/.npmrc
            echo "registry=https://matrixtech-npm-repository-$ACCOUNT_ID_DEPLOY.d.codeartifact.$AWS_DEFAULT_REGION.amazonaws.com/npm/matrixtech-npm-repository/" >> apps/$(msName)/.npmrc
        env:
          AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID_DEPLOY)
          AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY_DEPLOY)
          AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)

      - task: JavaToolInstaller@0
        inputs:
          versionSpec: "17"
          jdkArchitectureOption: "x64"
          jdkSourceOption: "PreInstalled"

      - task: SonarQubePrepare@7
        inputs:
          SonarQube: "SonarQubeConection"
          scannerMode: "CLI"
          configMode: "manual"
          cliProjectKey: "pruebas-$(msName)"
          cliProjectName: "pruebas-$(msName)"
          cliSources: "$(System.DefaultWorkingDirectory)/apps/$(msName)"
          extraProperties: |
            sonar.javascript.lcov.reportPaths=$(System.DefaultWorkingDirectory)/apps/$(msName)/coverage/lcov.info
            sonar.exclusions=**/*.java,**/test/**,**/android/**,**/ios/**,**/coverage/**,**/.nyc_output/**,**/reports/**,**/node_modules/**,**/migrations/**,**/config/**

      - script: |
          response=$(echo $SONARQUBE_SCANNER_PARAMS | sed -E 's#"sonar\.branch\.name":"[^"]+",##g')
          json=$(echo "$response" | sed 's/"sonar.token":\*\*\*/"sonar.token":"***"/')
          echo "$json" | jq
          echo "##vso[task.setvariable variable=SONARQUBE_SCANNER_PARAMS]$response"
        displayName: "Set-Variable SONARQUBE_SCANNER_PARAMS"

      - script: |
          cd $(System.DefaultWorkingDirectory)/apps/$(msName)
          echo "🔧 Actualizando versión en apps/$(msName)/package.json a $(msVersion)"
          jq --arg version "$(msVersion)" '.version = $version' package.json > tmp.json && mv tmp.json package.json
        displayName: "🧪 Temporary version for build"

      - script: |
          echo "Estás en la carpeta: $(System.DefaultWorkingDirectory)/apps/$(msName)"
          cd $(System.DefaultWorkingDirectory)/apps/$(msName)
          pnpm install --ignore-scripts
          
          echo -e "\n📋 Dependencias instaladas:"
          pnpm ls --depth=0 || true
        displayName: "Install microservice dependencies"

      - script: |
          cd $(System.DefaultWorkingDirectory)/apps/$(msName)
          pnpm run test
        displayName: "Test MS:$(msName)"
        continueOnError: true

      - script: |
          cd $(System.DefaultWorkingDirectory)/apps/$(msName)
          pnpm run coverage
        displayName: "Coverage MS:$(msName)"
        continueOnError: true

      - task: SonarQubeAnalyze@7
        displayName: "Sonar Analysis"

      - task: SonarQubePublish@7
        displayName: "Publish Result Static Code Analysis"
        inputs:
          pollingTimeoutSec: 400

      - script: |
          echo "Esperando Quality Gate..."

          status=$(curl -s -u "$SONAR_TOKEN:" "$SONAR_HOST_URL/api/qualitygates/project_status?projectKey=pruebas-$(msName)")
          metrics_response=$(curl -s -u "$SONAR_TOKEN:" "$SONAR_HOST_URL/api/measures/component?component=pruebas-$(msName)&metricKeys=coverage,duplicated_lines_density")

          coverage=$(echo "$metrics_response" | jq -r '.component.measures[] | select(.metric=="coverage") | .value')
          duplication=$(echo "$metrics_response" | jq -r '.component.measures[] | select(.metric=="duplicated_lines_density") | .value')

          status_code=$(echo "$status" | jq -r '.projectStatus.status')
          echo "🔹 Proyecto: pruebas-$(msName) | Coverage: $coverage | Lines Duplications: $duplication | Estado: $status_code"

          if [[ "$status_code" == "ERROR" ]]; then
            echo "❌ El proyecto falló su Quality Gate."
            exit 1
          else
            echo "✅ El proyecto pasó su Quality Gate."
          fi
        env:
          SONAR_TOKEN: $(SONAR_TOKEN)
          SONAR_HOST_URL: $(SONAR_HOST_URL)
        displayName: "🔍 Verify Quality Gate MS:$(msName)"
        continueOnError: true
        condition: and(succeeded(),
          ne(variables['msName'], 'app-administration-vue2'),
          ne(variables['msName'], 'app-sellers-vue2'),
          ne(variables['Build.SourceBranchName'], 'master'),
          ne(variables['Build.SourceBranchName'], 'staging'))
