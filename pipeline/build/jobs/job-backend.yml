jobs:
  - job: "build_nodejs"
    displayName: "🔧 Building Node.js Project"
    pool:
      name: "Azure Pipelines"
      vmImage: "ubuntu-22.04"
    variables:
      versionNode: $[coalesce(variables.nodeVersion, '18.20.7')]

    steps:
      - task: DownloadBuildArtifacts@0
        inputs:
          artifactName: "versions"
          downloadPath: "$(Pipeline.Workspace)/downloaded-versions"
        displayName: "📥 Download Version Artifact"

      - script: |
          ls -R $(Pipeline.Workspace)/downloaded-versions/versions
          VERSION_FILE="$(Pipeline.Workspace)/downloaded-versions/versions/version.json"
          if [[ -f "$VERSION_FILE" ]]; then
            VERSION=$(jq -r '.version' $VERSION_FILE)            
            echo -e "\n🚀 Versión detectada para $(Build.Repository.Name): $VERSION"
            echo "##vso[task.setvariable variable=msVersion]$VERSION"
          else
            echo "##vso[task.logissue type=error]❌ No se encontró archivo de versión para $(Build.Repository.Name)"
            exit 1
          fi
        displayName: "📖 Read Microservice Versions"

      - task: NodeTool@0
        displayName: "🔧 Install Nodejs $(versionNode)"
        inputs:
          versionSource: "spec"
          versionSpec: "$(versionNode)"

      - script: |
          npm install -g pnpm
        displayName: "⚙️ Install pnpm"

      - task: Bash@3
        name: AuthCodeArtifact
        inputs:
          targetType: "inline"
          script: |
            echo "🔐 Obteniendo token de AWS CodeArtifact..."
            token=$(aws codeartifact get-authorization-token \
              --domain matrixtech-npm-repository \
              --domain-owner "$ACCOUNT_ID_DEPLOY" \
              --region "$AWS_DEFAULT_REGION" \
              --query authorizationToken \
              --output text)

            REPO_DOMAIN="matrixtech-npm-repository-$ACCOUNT_ID_DEPLOY.d.codeartifact.$AWS_DEFAULT_REGION.amazonaws.com"
            REPO_PATH="npm/matrixtech-npm-repository"
            REPO_URL="https://$REPO_DOMAIN/$REPO_PATH"

            echo "Configurando npm..."
            npm config set "//$REPO_DOMAIN/$REPO_PATH/:_authToken" "$token"
            npm config set registry "$REPO_URL"

            echo "Verificando identidad de AWS..."
            aws sts get-caller-identity


            echo "Generando archivo .npmrc"
            cat <<EOF > ".npmrc"
            //$REPO_DOMAIN/$REPO_PATH/:_authToken=$token
            registry=$REPO_URL
            EOF
            ls -la .npmrc
        displayName: "🔐 Setup CodeArtifact & npm config"
        env:
          AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID_DEPLOY)
          AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY_DEPLOY)
          AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)

      - task: JavaToolInstaller@0
        displayName: "🔧 Install JDK 17"
        inputs:
          versionSpec: "17"
          jdkArchitectureOption: "x64"
          jdkSourceOption: "PreInstalled"

      - task: SonarQubePrepare@7
        displayName: "⚙️ Prepare SonarQube Analysis"
        inputs:
          SonarQube: "SonarQubeConection"
          scannerMode: "CLI"
          configMode: "manual"
          cliProjectKey: "pruebas-$(Build.Repository.Name)"
          cliProjectName: "pruebas-$(Build.Repository.Name)"
          cliSources: "$(System.DefaultWorkingDirectory)"
          extraProperties: |
            sonar.javascript.lcov.reportPaths=$(System.DefaultWorkingDirectory)/coverage/lcov.info
            sonar.exclusions=**/*.java,**/test/**,**/android/**,**/ios/**,**/coverage/**,**/.nyc_output/**,**/reports/**,**/node_modules/**,**/migrations/**,**/config/**

      - script: |
          response=$(echo $SONARQUBE_SCANNER_PARAMS | sed -E 's#"sonar\.branch\.name":"[^"]+",##g')
          json=$(echo "$response" | sed 's/"sonar.token":\*\*\*/"sonar.token":"***"/')
          echo "$json" | jq
          echo "##vso[task.setvariable variable=SONARQUBE_SCANNER_PARAMS]$response"
        displayName: "⚙️ Set Variable — SONARQUBE_SCANNER_PARAMS"
        condition: ne(variables['Build.Reason'], 'PullRequest')

      - script: |
          response=$(echo $SONARQUBE_SCANNER_PARAMS | sed -E 's#"sonar\.pullrequest\.[^"]+":"[^"]+",##g') 
          json=$(echo "$response" | sed 's/"sonar.token":\*\*\*/"sonar.token":"***"/')
          echo "$json" | jq
          echo "##vso[task.setvariable variable=SONARQUBE_SCANNER_PARAMS]$response"
        displayName: "⚙️ Set Variable — SONARQUBE_SCANNER_PARAMS"
        condition: and( eq(variables['Build.Reason'], 'PullRequest'), or(startsWith(variables['System.PullRequest.SourceBranch'], 'refs/heads/feature/'), startsWith(variables['System.PullRequest.SourceBranch'], 'refs/heads/hotfix/')))

      - script: |
          echo "🔧 Actualizando versión en package.json a $(msVersion)"
          jq --arg version "$(msVersion)" '.version = $version' package.json > tmp.json && mv tmp.json package.json
        displayName: "🧪 Temporary version for build"

      - script: |
          pnpm install --ignore-scripts
        
          OUTPUT=$(pnpm ls --depth=0 || true)
          if [[ -z "$OUTPUT" ]]; then
            echo "##vso[task.logissue type=error]❌ No se instalaron dependencias, esperar que se actualicen las dependencias a nivel global"
            exit 1  
          else
            echo "✅ Dependencias Instaladas:"
            echo "$OUTPUT"
          fi
        displayName: "📦 Install Microservice Dependencies"

      - script: |
          pnpm run test
        displayName: "🚀 Running Tests on $(Build.Repository.Name)"
        continueOnError: true

      - script: |
          pnpm run coverage
        displayName: "🔎 Coverage Analysis: $(Build.Repository.Name)"
        continueOnError: true

      - task: SonarQubeAnalyze@7
        displayName: "📡 Run Sonar Analysis"

      - task: SonarQubePublish@7
        displayName: "📤 Publish Static Code Analysis Results"
        inputs:
          pollingTimeoutSec: 400

      - script: |
          echo "Esperando Quality Gate..."

          status=$(curl -s -u "$SONAR_TOKEN:" "$SONAR_HOST_URL/api/qualitygates/project_status?projectKey=pruebas-$(Build.Repository.Name)")
          metrics_response=$(curl -s -u "$SONAR_TOKEN:" "$SONAR_HOST_URL/api/measures/component?component=pruebas-$(Build.Repository.Name)&metricKeys=coverage,duplicated_lines_density")

          coverage=$(echo "$metrics_response" | jq -r '.component.measures[] | select(.metric=="coverage") | .value')
          duplication=$(echo "$metrics_response" | jq -r '.component.measures[] | select(.metric=="duplicated_lines_density") | .value')

          status_code=$(echo "$status" | jq -r '.projectStatus.status')
          echo "🔹 Proyecto: pruebas-$(Build.Repository.Name) | Coverage: $coverage | Lines Duplications: $duplication | Estado: $status_code"

          if [[ "$status_code" == "ERROR" ]]; then
            echo "##vso[task.logissue type=error]❌ El proyecto falló su Quality Gate."
            exit 1
          else
            echo "✅ El proyecto pasó su Quality Gate."
          fi
        env:
          SONAR_TOKEN: $(SONAR_TOKEN)
          SONAR_HOST_URL: $(SONAR_HOST_URL)
        displayName: "🛡️ Quality Gate Check: $(Build.Repository.Name)"
        continueOnError: true
