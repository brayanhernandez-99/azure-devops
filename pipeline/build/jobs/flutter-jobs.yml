jobs:
  - job: 'build_flutter'
    displayName: 'Build flutter'
    pool:
        name: 'Azure Pipelines'
        vmImage: 'ubuntu-22.04'

    variables:
      versionSpecification: $[coalesce(variables.flutterVersion, '3.7.x')]

    steps:
      - script: |
          echo "compila flutter"
          ls -l
        displayName: "Build flutter"

      - task: JavaToolInstaller@0
        inputs:
          versionSpec: '17'
          jdkArchitectureOption: 'x64'
          jdkSourceOption: 'PreInstalled'
      
      - task: FlutterInstall@0
        inputs:
          mode: 'auto'
          channel: 'stable'
          version: 'custom'
          customVersion: $(versionSpecification)

      - script: |
          flutter --version
          flutter pub get
        displayName: 'Flutter Pub Get'

      - script: |
          ls -lah
          ls -lah assets/
        displayName: 'Verificar assets'

      - script: |
          flutter --no-color build apk --no-tree-shake-icons --profile
        displayName: 'Flutter Build APK (profile)'

      - script: |
          echo "acá queda el apk"
          ls -l build/app/outputs/flutter-apk/
          aws s3 cp ./build/app/outputs/flutter-apk s3://repository-native/app-seller/android/pruebas --recursive

        displayName: 'CP apk'
        env:
          AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID_DEPLOY)
          AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY_DEPLOY)
          AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)
