jobs:
  - job: 'build_flutter'
    displayName: 'Build flutter'
    pool:
        name: 'Azure Pipelines'
        vmImage: 'ubuntu-22.04'

    variables:
      versionSpecification: $[coalesce(variables.flutterVersion, '3.7.x')]
      flutterCacheKey: $(Build.SourceVersion)
      
    steps:
      - task: JavaToolInstaller@0
        inputs:
          versionSpec: '17'
          jdkArchitectureOption: 'x64'
          jdkSourceOption: 'PreInstalled'

      - task: Cache@0
        inputs:
          key: 'flutter-pub-$(Agent.OS)-$(Build.SourceVersion)'
          path: ~/.pub-cache
        displayName: 'Cache Flutter Pub Packages'

      - task: FlutterInstall@0
        inputs:
          mode: 'auto'
          channel: 'stable'
          version: 'custom'
          customVersion: $(versionSpecification)

      - script: |
          flutter --version
          flutter pub get
        displayName: 'Flutter Pub Get'

      - script: |
          echo "Verificando carpeta assets"
          if [ -d "assets" ] && [ "$(ls -A assets)" ]; then
            echo "✅ Assets encontrados"
          else
            echo "❌ Error: No se encontraron assets"
            exit 99
          fi
        displayName: 'Verificar assets'

      - script: |
          flutter --no-color build apk --no-tree-shake-icons --profile
        displayName: 'Flutter Build APK (profile)'

      - script: |
          echo "Verificando Build Appk"
          if [ -d "build/app/outputs/flutter-apk" ] && [ "$(ls -A build/app/outputs/flutter-apk)" ]; then
            echo "✅ Apk encontrado"
          else
            echo "❌ Error: Apk no encontrado"
            exit 99
          fi
        displayName: 'Verificar Apk'

      - script: |
          aws s3 cp ./build/app/outputs/flutter-apk s3://repository-native/app-seller/android/pruebas --recursive
        displayName: 'Copy Apk Bucket S3'

        env:
          AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID_DEPLOY)
          AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY_DEPLOY)
          AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)
