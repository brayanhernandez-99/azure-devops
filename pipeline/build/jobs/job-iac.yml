  - job: "build_iac"
    displayName: "Build iac"
    pool:
      name: "Azure Pipelines"
      vmImage: "ubuntu-22.04"
  
    variables:
      TerraformVersion: $[coalesce(variables.versionTerraform, '1.12.0')]

    steps:

      - task: TerraformInstaller@1
        inputs:
          terraformVersion: $(TerraformVersion)

      - script: |
          sudo apt-get update -y
          sudo apt-get install -y unzip
          curl -LO https://github.com/gruntwork-io/terragrunt/releases/download/v0.84.1/terragrunt_linux_amd64
          chmod +x terragrunt_linux_amd64
          sudo mv terragrunt_linux_amd64 /usr/local/bin/terragrunt
          terragrunt --version
        displayName: "Instalar Terragrunt"
      
      - task: replacetokens@5
        inputs:
          targetFiles: '$(Build.SourcesDirectory)/iac-terragrunt/project/invictus/devops/initial-infrastructure/aws-service-ssm-parameter/terragrunt.hcl'
          encoding: 'auto'
          writeBOM: true
          actionOnMissing: 'warn'      # 'fail', 'warn' o 'ignore'
          keepToken: false
          tokenPrefix: '#{'
          tokenSuffix: '}#'

      - script: |
          echo "Plan"
          terragrunt plan -all --terragrunt-non-interactive
        displayName: "Plan"
        workingDirectory: $(Build.SourcesDirectory)/iac-terragrunt/project/invictus/devops/apps/aws-service-cloudfront
        env:
          AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID_INVIC)
          AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY_INVIC)
          AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)
      
      - script: |
          echo "apply"
          terragrunt run-all apply --terragrunt-non-interactive
        displayName: "apply"
        workingDirectory: $(Build.SourcesDirectory)/iac-terragrunt/project/invictus/devops/apps/aws-service-cloudfront
        env:
          AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID_INVIC)
          AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY_INVIC)
          AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)
      
      - script: |
          echo "destroy"
          terragrunt run-all destroy --terragrunt-non-interactive
        displayName: "destroy"
        workingDirectory: $(Build.SourcesDirectory)/iac-terragrunt/project/invictus/devops/apps/aws-service-cloudfront
        env:
          AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID_INVIC)
          AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY_INVIC)
          AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)
