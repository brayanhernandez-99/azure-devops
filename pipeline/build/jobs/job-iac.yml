  - job: "build_iac"
    displayName: "Build iac"
    pool:
      name: "Azure Pipelines"
      vmImage: "ubuntu-22.04"
  
    variables:
      versionTerraform: $[coalesce(variables.versionTerraform, '1.6.0')]

    steps:

      - task: TerraformInstaller@0
        inputs:
          terraformVersion: $(versionTerraform)

      - script: |
          sudo apt-get update -y
          sudo apt-get install -y unzip
          curl -LO https://github.com/gruntwork-io/terragrunt/releases/latest/download/terragrunt_linux_amd64
          chmod +x terragrunt_linux_amd64
          sudo mv terragrunt_linux_amd64 /usr/local/bin/terragrunt
          terragrunt --version
        displayName: "Instalar Terragrunt"
