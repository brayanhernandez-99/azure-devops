  - job: "build_iac"
    displayName: "Build Infrastructure"
    pool:
      name: "Azure Pipelines"
      vmImage: "ubuntu-22.04"
  
    variables:
      versionTerraform: $[coalesce(variables.terraformVersion, '1.12.0')]
      versionTerragrunt: $[coalesce(variables.terragruntVersion, '0.84.1')]

    steps:

      - script: |
          echo -e "\n📋 Variables de entorno disponibles:"
          printenv | sort | grep -i "aws" || true
        displayName: "📋 Environment variables"

      - script: |
          echo "📥 Descargando Terragrunt..."
          aws s3 cp "s3://infrastructure-as-code-invictus/terragrunt/terragrunt-$(versionTerragrunt)" "terragrunt"

          if [ ! -s terragrunt ]; then
            echo "❌ Error: No se pudo descargar terragrunt: $(versionTerragrunt)"
            exit 99
          fi

          chmod +x terragrunt
          sudo mv terragrunt /usr/local/bin/terragrunt

          echo -e "\n🚀 Terragrunt instalado correctamente:"
          terragrunt --version
        displayName: "🛠️ Instalar Terragrunt"
        env:
          AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID_DEPLOY)
          AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY_DEPLOY)
          AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)

      - script: |
          echo "📥 Descargando Terraform..."
          aws s3 cp "s3://infrastructure-as-code-invictus/terraform/terraform-$(versionTerraform)" "terraform"

          if [ ! -s terraform ]; then
            echo "❌ Error: No se pudo descargar terraform: $(versionTerraform)"
            exit 99
          fi

          chmod +x terraform
          sudo mv terraform /usr/local/bin/terraform

          echo -e "\n🚀 Terraform instalado correctamente:"
          terraform --version
        displayName: "🛠️ Instalar terraform"
        env:
          AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID_DEPLOY)
          AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY_DEPLOY)
          AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)

      - task: replacetokens@5
        inputs:
          targetFiles: |
            $(Build.SourcesDirectory)/iac-terragrunt/invictus/**/terragrunt.hcl
            $(Build.SourcesDirectory)/iac-terragrunt/invictus/root.hcl
            $(Build.SourcesDirectory)/iac-terragrunt/invictus/backend.tf
            $(Build.SourcesDirectory)/iac-terragrunt/invictus/provider.tf
          encoding: 'auto'
          writeBOM: true
          actionOnMissing: 'warn'   # 'fail', 'warn' o 'ignore'
          keepToken: false
          tokenPrefix: '#{'
          tokenSuffix: '}#'
        displayName: "⚙️ Replace Tokens"

      - script: |
          echo -e "\n Ejecutando: terragrunt plan..."
        
          terragrunt run-all plan  --queue-include-dir=./apps/aws-service-s3 --non-interactive
          terragrunt run-all apply --queue-include-dir=./apps/aws-service-s3 --non-interactive

          terragrunt run-all plan  --queue-include-dir=./apps/aws-service-custom-cache-policy --non-interactive
          terragrunt run-all apply --queue-include-dir=./apps/aws-service-custom-cache-policy --non-interactive

          terragrunt run-all plan  --queue-include-dir=./apps/aws-service-cloudfront-function --non-interactive
          terragrunt run-all apply --queue-include-dir=./apps/aws-service-cloudfront-function --non-interactive

          # terragrunt run-all plan  --queue-include-dir=./apps/aws-service-cloudfront --non-interactive
          # terragrunt run-all apply --queue-include-dir=./apps/aws-service-cloudfront --non-interactive

          # terragrunt run-all plan  --queue-include-dir=./apps/aws-service-s3-policy --non-interactive
          # terragrunt run-all apply --queue-include-dir=./apps/aws-service-s3-policy --non-interactive

        displayName: "✔️ Plan"
        workingDirectory: $(Build.SourcesDirectory)/iac-terragrunt/invictus/
        env:
          AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID_STAGING)
          AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY_STAGING)
          AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)
      
