jobs:
  - job: 'build_nodejs'
    displayName: 'Build nodejs'    
    pool:
        name: 'Azure Pipelines'
        vmImage: 'ubuntu-22.04'
    variables:
      versionSpecification: $[coalesce(variables.nodejsVersion, '18.x')]

    # strategy:
    #   matrix:
    #     ${{ each ms in parameters.apps }}:
    #       ${{ ms }}:
    #         msName: ${{ ms }}

    steps:
      - script: | 
          ls -l
        displayName: "Build"

      - task: NodeTool@0
        displayName: 'Use Nodejs $(versionSpecification)'
        inputs:
          versionSource: 'spec'
          versionSpec: '$(versionSpecification)'
        
      - script: |
          npm install -g pnpm
        displayName: 'Instalar pnpm'

      - task: Bash@3
        name: AuthCodeArtifact
        inputs:
          targetType: 'inline'
          script: |
            export CODEARTIFACT_AUTH_TOKEN=$(aws codeartifact get-authorization-token \
              --domain matrixtech-npm-repository \
              --domain-owner $ACCOUNT_ID_DEPLOY \
              --region $AWS_DEFAULT_REGION \
              --query authorizationToken \
              --output text )
            npm config set //matrixtech-npm-repository-$ACCOUNT_ID_DEPLOY.d.codeartifact.$AWS_DEFAULT_REGION.amazonaws.com/npm/matrixtech-npm-repository/:_authToken=$CODEARTIFACT_AUTH_TOKEN
            npm config set registry https://matrixtech-npm-repository-861262569826.d.codeartifact.$AWS_DEFAULT_REGION.amazonaws.com/npm/matrixtech-npm-repository/
            aws sts get-caller-identity

            echo "//matrixtech-npm-repository-$ACCOUNT_ID_DEPLOY.d.codeartifact.$AWS_DEFAULT_REGION.amazonaws.com/npm/matrixtech-npm-repository/:_authToken=$CODEARTIFACT_AUTH_TOKEN" > apps/awards/.npmrc
            echo "registry=https://matrixtech-npm-repository-$ACCOUNT_ID_DEPLOY.d.codeartifact.$AWS_DEFAULT_REGION.amazonaws.com/npm/matrixtech-npm-repository/" >> apps/awards/.npmrc
        env:
          AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID_DEPLOY)
          AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY_DEPLOY)
          AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)

      - script: |
          echo "Estás en la carpeta: $(System.DefaultWorkingDirectory)/apps/awards"
          cd $(System.DefaultWorkingDirectory)/apps/awards
          # npm install --ignore-scripts
          pnpm install --ignore-scripts
          echo "Dependencias instaladas:"
          npm ls --depth=0 || true
        displayName: 'Instalar dependencias del microservicio'

      - script: |
          echo "🛠 Generando .env.local para Administración con variables ADMIN_"

          # ENV_FILE="./app-legacy/app-administration-vue2/.env.local"
          # mkdir -p "$(dirname "$ENV_FILE")"
          # > "$ENV_FILE"

          # # Recorre todas las variables del entorno que empiezan con ADMIN_
