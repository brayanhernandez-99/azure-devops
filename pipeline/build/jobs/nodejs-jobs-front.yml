jobs:
  - job: 'build_nodejs'
    displayName: 'Build nodejs'    
    pool:
        name: 'Azure Pipelines'
        vmImage: 'ubuntu-22.04'
    variables:
      versionSpecification: $[coalesce(variables.nodejsVersion, '18.x')]

    strategy:
      matrix:
        ${{ each ms in parameters.apps }}:
          ${{ ms }}:
            msName: ${{ ms }}

    steps:
      - script: | 
          if [[ "$(msName)" == "app-administration-vue2" || "$(msName)" == "app-sellers-vue2" ]]; then
            fileselect=app-legacy
            echo "ruta de archivo del mf: $fileselect"
            echo "##vso[task.setvariable variable=file]$fileselect"
          else
            fileselect=apps
            echo "ruta de archivo del mf: $fileselect"
            echo "##vso[task.setvariable variable=file]$fileselect"
          fi
        displayName: "Select file"

      - task: NodeTool@0
        displayName: 'Use Nodejs $(versionSpecification)'
        inputs:
          versionSource: 'spec'
          versionSpec: '$(versionSpecification)'
        
      - script: |
          npm install -g pnpm
        displayName: 'Instalar pnpm'

      - task: Bash@3
        name: AuthCodeArtifact
        inputs:
          targetType: 'inline'
          script: |
            export CODEARTIFACT_AUTH_TOKEN=$(aws codeartifact get-authorization-token \
              --domain matrixtech-npm-repository \
              --domain-owner $ACCOUNT_ID_DEPLOY \
              --region $AWS_DEFAULT_REGION \
              --query authorizationToken \
              --output text )
            npm config set //matrixtech-npm-repository-$ACCOUNT_ID_DEPLOY.d.codeartifact.$AWS_DEFAULT_REGION.amazonaws.com/npm/matrixtech-npm-repository/:_authToken=$CODEARTIFACT_AUTH_TOKEN
            npm config set registry https://matrixtech-npm-repository-861262569826.d.codeartifact.$AWS_DEFAULT_REGION.amazonaws.com/npm/matrixtech-npm-repository/
            aws sts get-caller-identity

            echo "//matrixtech-npm-repository-$ACCOUNT_ID_DEPLOY.d.codeartifact.$AWS_DEFAULT_REGION.amazonaws.com/npm/matrixtech-npm-repository/:_authToken=$CODEARTIFACT_AUTH_TOKEN" > $(file)/$(msName)/.npmrc
            echo "registry=https://matrixtech-npm-repository-$ACCOUNT_ID_DEPLOY.d.codeartifact.$AWS_DEFAULT_REGION.amazonaws.com/npm/matrixtech-npm-repository/" >> $(file)/$(msName)/.npmrc
        env:
          AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID_DEPLOY)
          AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY_DEPLOY)
          AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)

      - script: |
          echo "🛠 Generando .env.local para administration-vue2"
          printenv | grep '^ADMIN_' | sed 's/^ADMIN_//' > $(System.DefaultWorkingDirectory)/app-legacy/app-administration-vue2/.env.local
          cat $(System.DefaultWorkingDirectory)/app-legacy/app-administration-vue2/.env.local

          echo " "

          echo "🛠 Generando .env.local para sellers-vue2"
          printenv | grep '^SELLERS_' | sed 's/^SELLERS_//' > $(System.DefaultWorkingDirectory)/app-legacy/app-sellers-vue2/.env.local
          cat app-legacy/app-sellers-vue2/.env.local

          ls -la app-legacy/app-administration-vue2
          ls -la app-legacy/app-sellers-vue2
        displayName: 'Generación de .env admin y seller'


      - script: |
          CURRENT_BRANCH=$(echo $(Build.SourceBranch))
          if [[ "$CURRENT_BRANCH" == refs/heads/feature/* ]]; then
            CURRENT_BRANCH_PR=dev
          fi
          if [[ "$CURRENT_BRANCH" == refs/heads/develop ]]; then
            CURRENT_BRANCH_PR=dev
          fi
          if [[ "$CURRENT_BRANCH" == refs/heads/staging ]]; then
            CURRENT_BRANCH_PR=qa
          fi
          # if [[ "$CURRENT_BRANCH" == refs/heads/feature/* ]]; then
          #   CURRENT_BRANCH_PR=refs/heads/feature
          # fi
          # if [[ "$CURRENT_BRANCH" == refs/heads/feature/* ]]; then
          #   CURRENT_BRANCH_PR=refs/heads/feature
          # fi
          # if [[ "$CURRENT_BRANCH" == refs/heads/feature/* ]]; then
          #   CURRENT_BRANCH_PR=refs/heads/feature
          # fi
          # if [[ "$CURRENT_BRANCH" == refs/heads/feature/* ]]; then
          #   CURRENT_BRANCH_PR=refs/heads/feature
          # fi

          echo "🛠 Generando .env.local para invictus"
          echo $CURRENT_BRANCH_PR
          printenv | grep '^VITE_' > $(System.DefaultWorkingDirectory)/apps/invictus/.env.$CURRENT_BRANCH_PR
          # cat apps/invictus/.env.$CURRENT_BRANCH_PR

          cp -R apps/invictus/.env.$CURRENT_BRANCH_PR $(System.DefaultWorkingDirectory)/apps/invictus/.env
          cat $(System.DefaultWorkingDirectory)/apps/invictus/.env
        displayName: 'Generación de .env invictus'

      - script: |
            echo -e "VITE_APP_VERSION=\$npm_package_version\nVITE_BASE_URL=" > $(System.DefaultWorkingDirectory)/$(file)/$(msName)/.env
            cat $(System.DefaultWorkingDirectory)/$(file)/$(msName)/.env
        displayName: 'cp env'

      - script: |
          cd $(System.DefaultWorkingDirectory)/$(file)/$(msName)
          # npm install --ignore-scripts
          # pnpm i --ignore-scripts
          pnpm i 
          echo "Dependencias instaladas:"
          npm ls --depth=0 || true
        displayName: 'Instalar dependencias del microservicio'

      - script: |
          if [[ "$(msName)" == "app-administration-vue2" || "$(msName)" == "app-sellers-vue2" ]]; then
            msName=$(msName)
            msName=${msName%-vue2}
            echo $msName
            pnpm add -D dotenv-cli
            pnpm build --filter=...$msName
            ls -la $(System.DefaultWorkingDirectory)/$(file)/$(msName)/dist
          else
            pnpm add -D dotenv-cli
            pnpm build --filter=...$(msName)
            ls -la $(System.DefaultWorkingDirectory)/$(file)/$(msName)/dist
          fi
        displayName: 'compilar dependencias del microservicio'
      
      - task: JavaToolInstaller@0
        inputs:
          versionSpec: '17'
          jdkArchitectureOption: 'x64'
          jdkSourceOption: 'PreInstalled'

      - task: SonarQubePrepare@7
        inputs:
          SonarQube: 'SonarQubeConection'
          scannerMode: 'CLI'
          configMode: 'manual'
          cliProjectKey: 'pruebas-microfronted-$(msName)'
          cliProjectName: 'pruebas-microfronted-$(msName)'
          cliSources: '$(System.DefaultWorkingDirectory)/$(file)/$(msName)'
          extraProperties: |
            sonar.javascript.lcov.reportPaths=$(System.DefaultWorkingDirectory)/$(file)/$(msName)/coverage/lcov.info
            sonar.exclusions=/tests/**,/coverage/**,/.nyc_output/**,/reports/**,sured-plugin/**,/reports_bck/**,/node_modules/**,/dist/**

      - script: |
          variable=$(echo $SONARQUBE_SCANNER_PARAMS | sed -E 's#"sonar\.branch\.name":"[^"]+",##g')
          echo $variable
          echo "##vso[task.setvariable variable=SONARQUBE_SCANNER_PARAMS]$variable"
        displayName: 'set-variable'

      - script: |
          ls -l
          pwd
          cd $(System.DefaultWorkingDirectory)/$(file)/$(msName)
          npm run test
        displayName: 'Test MS $(msName)'
        continueOnError: true

      - script: |
          cd $(System.DefaultWorkingDirectory)/$(file)/$(msName)
          pwd
          npm run coverage
          #pnpm coverage

          tree
          ls -l $(System.DefaultWorkingDirectory)/$(file)/$(msName)/coverage
        displayName: 'Coverage MS $(msName)'
        continueOnError: true

      - task: SonarQubeAnalyze@7
        displayName: 'Sonar Analysis'

      - task: SonarQubePublish@7
        displayName: 'Publish Result Static Code Analysis'
        inputs:
          pollingTimeoutSec: 400
      
      - task: sonar-buildbreaker@8
        displayName: 'Quality Gate'
        inputs:
          SonarQube: 'SonarQubeConection'