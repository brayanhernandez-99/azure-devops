stages:
  - stage: "build_unit${{ parameters.red }}"
    ${{ if startsWith(variables['Build.SourceBranch'], 'refs/heads/feature/') }}:
      displayName: "Build Electron Feature"
    ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/develop') }}:
      displayName: "Build Electron Develop"
    ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/staging') }}:
      displayName: "Build Electron Staging"
    ${{ if or(eq(variables['Build.SourceBranchName'], 'master'), startsWith(variables['Build.SourceBranch'], 'refs/tags/')) }}:
      displayName: "Build Electron Master ${{ parameters.red }}"

    dependsOn:
      - "semantic_version_integration"
    condition: in(dependencies.semantic_version_integration.result, 'Succeeded', 'SucceededWithIssues')

    variables:
      - template: ../variables/groups-transversal-variables.yml
        parameters:
          red: ${{ parameters.red }}

    jobs:
      - ${{ if eq(parameters.release, 'exe') }}:
          - template: jobs/job-electron.yml
            parameters:
              red: ${{ parameters.red }}

      # - ${{ if and(or(startsWith(variables['Build.SourceBranch'], 'refs/tags/'), in(variables['Build.SourceBranch'], 'refs/heads/develop', 'refs/heads/staging','refs/heads/master' )), eq(parameters.red, 'antioquia')) }}:
