stages:
  - stage: "semantic_version_integration"
    displayName: "semantic-version-integration"
    dependsOn: []

    variables:
      - template: ../variables/groups-transversal-variables.yml

    jobs:
      - ${{ if eq(parameters.language, 'nodejsBackend') }}:
          - template: ../general/semantic-version-backend.yml
            parameters:
              apps: ${{ parameters.apps }}

      - ${{ if eq(parameters.language, 'nodejsFrontend') }}:
          - template: ../general/semantic-version-frontend.yml
            parameters:
              apps: ${{ parameters.apps }}

      - ${{ if eq(parameters.language, 'flutter') }}:
          - template: ../general/semantic-version-flutter.yml
