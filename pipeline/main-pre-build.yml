parameters:
  - name: release
    type: string
    values:
      - aws-s3
      - aws-ecs
      - apk
      - exe

resources:
  repositories:
    - repository: self
      name: $(System.TeamProject)/$(Build.Repository.Name)
      type: git
      ref: $(Build.SourceBranch)

stages:
  - template: pre-build/pre-build-developmet.yml
    parameters:
      type: ${{ parameters.type }}
