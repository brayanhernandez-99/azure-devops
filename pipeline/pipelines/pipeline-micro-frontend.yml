stages:
  - stage: change_files_micro_fronted
    displayName: "🔍 Change Files MicroFrontend"
    jobs:
      - template: ../ci/changes_files_frontend.yml

  - stage: semantic_version_micro_fronted
    displayName: "🏷️ Semantic Version MicroFrontend"
    dependsOn: change_files_micro_fronted
    jobs:
      - template: ../ci/semantic-version-integration.yml
        parameters:
          release: ${{ parameters.release }}
          apps: $[ dependencies.change_files_micro_fronted.outputs['changes_files_frontend.SetApps.apps'] ]

