stages:
  - stage: semantic_version_micro_fronted
    displayName: "🏷️ Semantic Version MicroFrontend"
    jobs:
      - template: ../ci/semantic-version-integration.yml
        parameters:
          apps: ${{ parameters.apps }}
          release: ${{ parameters.release }}

  - ${{ if or(startsWith(variables['Build.SourceBranch'], 'refs/heads/feature/'), startsWith(variables['Build.SourceBranch'], 'refs/heads/hotfix/'), eq(variables['Build.SourceBranch'], 'refs/heads/develop')) }}:
      - stage: scan_micro_frontend
        displayName: "🛡️ Scan Microfrontend"
        dependsOn: semantic_version_micro_fronted
        jobs:
          - template: ../ci/tests/sonarqube-microfrontend.yml
            parameters:
              apps: ${{ parameters.apps }}

  #####################################################################

  - ${{ if eq(variables['Build.SourceBranchName'], 'master') }}:
      - ${{ each region in parameters.red }}:
          - stage: build_micro_frontend_${{ region }}
            displayName: "📦 Build MicroFrontend ${{ region }}"
            dependsOn: semantic_version_micro_fronted
            jobs:
              - template: ../ci/build/build-frontend.yml
                parameters:
                  region: ${{ region }}
                  apps: ${{ parameters.apps }}
                  pr_id: ${{ parameters.pr_id }}

          - stage: deploy_micro_frontend_${{ region }}
            displayName: "🚀 Deploy MicroFrontend ${{ region }}"
            dependsOn: build_micro_frontend_${{ region }}
            jobs:
              - template: ../cd/deployment.yml
                parameters:
                  region: ${{ region }}
                  apps: ${{ parameters.apps }}
                  release: ${{ parameters.release }}

  # #####################################################################

  - ${{ if or(startsWith(variables['Build.SourceBranch'], 'refs/heads/feature/'), startsWith(variables['Build.SourceBranch'], 'refs/heads/hotfix/')) }}:
      - stage: build_micro_frontend
        displayName: "📦 Build MicroFrontend"
        dependsOn: scan_micro_frontend
        jobs:
          - template: ../ci/build/build-frontend.yml
            parameters:
              apps: ${{ parameters.apps }}

      - stage: check_build_micro_frontend
        displayName: "🛡️ Check Build MicroFrontend"
        dependsOn: build_micro_frontend
        condition: and(succeeded(), ne('${{ parameters.pr_id }}', '0'))
        jobs:
          - template: ../ci/pre-build/check-build-frontend.yml
            parameters:
              pr_id: ${{ parameters.pr_id }}

  - ${{ if eq(variables['Build.SourceBranchName'], 'develop') }}:
      - stage: build_micro_frontend_develop
        displayName: "📦 Build MicroFrontend develop"
        dependsOn: scan_micro_frontend
        jobs:
          - template: ../ci/build/build-frontend.yml
            parameters:
              environments: develop
              apps: ${{ parameters.apps }}

      - stage: deploy_micro_frontend_develop
        displayName: "🚀 Deploy MicroFrontend develop"
        dependsOn: build_micro_frontend_develop
        jobs:
          - template: ../cd/deployment.yml
            parameters:
              release: ${{ parameters.release }}
              environments: develop
              apps: ${{ parameters.apps }}

  - ${{ if eq(variables['Build.SourceBranchName'], 'staging') }}:
      - ${{ each environments in parameters.environments_new_staging }}:
          - stage: build_micro_frontend_${{ environments }}
            displayName: "📦 Build MicroFrontend ${{ environments }}"
            dependsOn: semantic_version_micro_fronted
            jobs:
              - template: ../ci/build/build-frontend.yml
                parameters:
                  environments: ${{ environments }}
                  apps: ${{ parameters.apps }}

          - stage: deploy_micro_frontend_${{ environments }}
            displayName: "🚀 Deploy MicroFrontend ${{ environments }}"
            dependsOn: build_micro_frontend_${{ environments }}
            jobs:
              - template: ../cd/deployment.yml
                parameters:
                  release: ${{ parameters.release }}
                  environments: ${{ environments }}
                  apps: ${{ parameters.apps }}

