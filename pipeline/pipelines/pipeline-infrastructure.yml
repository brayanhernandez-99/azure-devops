stages:
  - stage: scan_infrastructure
    displayName: "🛡️ Scan Infrastructure"
    jobs:
      - template: ../ci/scan/sonar-infrastructure.yml
      # - template: ../ci/scan/checkov-infrastructure.yml

  #####################################################################

  - ${{ if eq(variables['Build.SourceBranchName'], 'master') }}:
      - ${{ each region in parameters.red }}:
          - stage: plan_infrastructure_${{ region }}
            displayName: "🧩 Plan Infrastructure ${{ region }}"
            dependsOn: scan_infrastructure
            jobs:
              - template: ../ci/build/plan-infrastructure.yml
                parameters:
                  region: ${{ region }}

          - stage: apply_infrastructure_${{ region }}
            displayName: "🚀 Apply Infrastructure ${{ region }}"
            dependsOn: plan_infrastructure_${{ region }}
            jobs:
              - template: ../cd/deployment.yml
                parameters:
                  region: ${{ region }}
                  release: ${{ parameters.release }}

  #####################################################################

  - ${{ if eq(variables['Build.SourceBranchName'], 'develop') }}:
      - stage: plan_infrastructure
        displayName: "🧩 Plan Infrastructure"
        dependsOn: scan_infrastructure
        jobs:
          - template: ../ci/build/plan-infrastructure.yml

      - stage: apply_infrastructure
        displayName: "🚀 Apply Infrastructure"
        dependsOn: plan_infrastructure
        jobs:
          - template: ../cd/deployment.yml
            parameters:
              release: ${{ parameters.release }}

  - ${{ if eq(variables['Build.SourceBranchName'], 'staging') }}:
      - ${{ each environment in parameters.environments_staging }}:
          - stage: plan_infrastructure_${{ environment }}
            displayName: "🧩 Plan Infrastructure ${{ environment }}"
            dependsOn: scan_infrastructure
            jobs:
              - template: ../ci/build/plan-infrastructure.yml
                parameters:
                  environment: ${{ environment }}

          - stage: apply_infrastructure_${{ environment }}
            displayName: "🚀 Apply Infrastructure ${{ environment }}"
            dependsOn: plan_infrastructure_${{ environment }}
            jobs:
              - template: ../cd/deployment.yml
                parameters:
                  release: ${{ parameters.release }}
                  environment: ${{ environment }}
