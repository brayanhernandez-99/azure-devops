stages:
  - stage: semantic_version_micro_fronted
    displayName: "🏷️ Semantic Version MicroFrontend"
    jobs:
      - template: ../ci/semantic-version-integration.yml
        parameters:
          apps: ${{ parameters.apps }}
          release: ${{ parameters.release }}
  #
  #####################################################################
  #
  #- ${{ if eq(variables['Build.SourceBranchName'], 'master') }}:
  - ${{ each region in parameters.red }}:
      - stage: build_micro_frontend_${{ region }}
        displayName: "📦 Build MicroFrontend ${{ region }}"
        dependsOn: semantic_version_integration_electron
        jobs:
          - template: ../ci/build/build-fronted.yml
            parameters:
              region: ${{ region }}
              apps: ${{ parameters.apps }}

      - stage: build_electron_${{ region }}
        displayName: "📦 Build Electron ${{ region }}"
        dependsOn: build_micro_frontend_${{ region }}
        jobs:
          - template: ../ci/build/build-electron.yml
            parameters:
              region: ${{ region }}
              apps: ${{ parameters.apps }}

  - stage: semantic_version_integration_electron
    displayName: "🏷️ Semantic Version Electron"
    dependsOn: build_electron_cap
    jobs:
      - template: ../ci/semantic-version-integration.yml
        parameters:
          release: exe

  - ${{ each region in parameters.red }}:
      - stage: deploy_micro_frontend_${{ region }}
        displayName: "🚀 Deploy MicroFrontend ${{ region }}"
        dependsOn: build_electron_${{ region }}
        jobs:
          - job: jobY
            displayName: "Job Y"
            steps:
              - script: echo "Running Deployment Job Y"
