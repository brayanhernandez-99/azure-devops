stages:
  - stage: semantic_version_micro_fronted
    displayName: "🏷️ Semantic Version MicroFrontend"
    jobs:
      - template: ../ci/semantic-version-integration.yml
        parameters:
          apps: ${{ parameters.apps }}
          release: ${{ parameters.release }}
          electronBranch: ${{ parameters.electronBranch }}

  #####################################################################

  - ${{ if eq(variables['Build.SourceBranchName'], 'master') }}:
      - ${{ each region in parameters.red }}:
          - stage: build_micro_frontend_${{ region }}
            displayName: "📦 Build MicroFrontend ${{ region }}"
            dependsOn: semantic_version_micro_fronted
            jobs:
              - template: ../ci/build/build-fronted.yml
                parameters:
                  region: ${{ region }}
                  apps: ${{ parameters.apps }}

      - stage: semantic_version_electron
        displayName: "🏷️ Semantic Version Electron"
        #dependsOn: build_micro_frontend_${{ region }}
        dependsOn: build_micro_frontend_cap
        jobs:
          - template: ../ci/semantic-version-integration.yml
            parameters:
              release: exe

      - ${{ each region in parameters.red }}:
          - stage: build_electron_${{ region }}
            displayName: "📦 Build Electron ${{ region }}"
            dependsOn: semantic_version_electron
            jobs:
              - template: ../ci/build/build-electron.yml
                parameters:
                  region: ${{ region }}
                  red: ${{ parameters.red }}

          - stage: deploy_micro_frontend_${{ region }}
            displayName: "🚀 Deploy MicroFrontend ${{ region }}"
            dependsOn: build_electron_${{ region }}
            jobs:
              - job: jobY
                displayName: "Job Y"
                steps:
                  - script: echo "Running Deployment Job Y"

  #####################################################################

  - ${{ if ne(variables['Build.SourceBranchName'], 'master') }}:
      - stage: build_micro_frontend
        displayName: "📦 Build MicroFrontend"
        dependsOn: semantic_version_micro_fronted
        jobs:
          - template: ../ci/build/build-fronted.yml
            parameters:
              apps: ${{ parameters.apps }}

      - stage: semantic_version_electron
        displayName: "🏷️ Semantic Version Electron"
        dependsOn: build_micro_frontend
        jobs:
          - template: ../ci/semantic-version-integration.yml
            parameters:
              release: exe

      - stage: build_electron
        displayName: "📦 Build Electron"
        dependsOn: semantic_version_electron
        jobs:
          - template: ../ci/build/build-electron.yml

      - stage: deploy_micro_frontend
        displayName: "🚀 Deploy MicroFrontend"
        dependsOn: build_electron
        jobs:
          - job: jobY
            displayName: "Job Y"
            steps:
              - script: echo "Running Deployment Job Y"
