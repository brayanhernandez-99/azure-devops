parameters:
  - name: language
    type: string
    default: default
    values: 
      - nodejs

  - name: build
    type: string
    default: npm
    values:
    - npm
    - yarn
  
  - name: typerelease
    type: string
    default: aws
  
  - name: apps
    type: object
  
  - name: typepeline
    type: string

resources:
  repositories:
  - repository: self
    name: $(System.TeamProject)/$(Build.Repository.Name)
    type: git
    ref: $(Build.SourceBranch)


stages:
  - ${{ if eq(parameters.typepeline, 'prepipeline') }}:
    - template: pre-build/pre-build-developmet.yml

  - ${{ if or(startsWith(variables['Build.SourceBranch'], 'refs/heads/feature'), in(variables['Build.SourceBranch'], 'refs/heads/develop', 'refs/heads/release' )) }}:
    - template: build/build-developmet.yml
      parameters:
        language: ${{ parameters.language }}
        typerelease: ${{ parameters.typerelease }}
        apps: ${{ parameters.apps }}

