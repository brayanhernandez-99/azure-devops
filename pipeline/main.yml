parameters:
  - name: language
    type: string
    default: default
    values: 
      - nodejs
      - nodejsFront

  - name: build
    type: string
    default: npm
    values:
    - npm
    - yarn
  
  - name: typerelease
    type: string
    default: aws-ecs
  
  # - name: apps
  #   type: object

resources:
  repositories:
  - repository: self
    name: $(System.TeamProject)/$(Build.Repository.Name)
    type: git
    ref: $(Build.SourceBranch)


stages:
  - ${{ if or(startsWith(variables['Build.SourceBranch'], 'refs/heads/feature'), in(variables['Build.SourceBranch'], 'refs/heads/develop')) }}:
    - template: build/build-developmet.yml
      parameters:
        language: ${{ parameters.language }}
        typerelease: ${{ parameters.typerelease }}
        # apps: ${{ parameters.apps }}

  - ${{ if or(startsWith(variables['Build.SourceBranch'], 'refs/tags/'), in(variables['Build.SourceBranch'], 'refs/heads/staging','refs/heads/master' )) }}:
    - template: build/semantic-version-integration.yml
      parameters:
        language: ${{ parameters.language }}
        typerelease: ${{ parameters.typerelease }}
        apps: ${{ parameters.apps }}

  - ${{ if or(startsWith(variables['Build.SourceBranch'], 'refs/tags/'), in(variables['Build.SourceBranch'], 'refs/heads/develop','refs/heads/staging','refs/heads/master' )) }}:
    - template: release/artifacts-managment.yml
      parameters:
        language: ${{ parameters.language }}
        typerelease: ${{ parameters.typerelease }}
        apps: ${{ parameters.apps }}
  
  - ${{ if or(startsWith(variables['Build.SourceBranch'], 'refs/tags/'), in(variables['Build.SourceBranch'], 'refs/heads/develop', 'refs/heads/staging', 'refs/heads/master')) }}:
    - template: release/deploy-integration.yml
      parameters:
        language: ${{ parameters.language }}
        typerelease: ${{ parameters.typerelease }}
        apps: ${{ parameters.apps }}
        red: antioquia

  - ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/master') }}:
    - template: release/deploy-integration.yml
      parameters:
        language: ${{ parameters.language }}
        typerelease: ${{ parameters.typerelease }}
        apps: ${{ parameters.apps }}
        red: cap
  
  - ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/master') }}:
    - template: release/deploy-integration.yml
      parameters:
        language: ${{ parameters.language }}
        typerelease: ${{ parameters.typerelease }}
        apps: ${{ parameters.apps }}
        red: tolima

  - ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/master') }}:
    - template: release/deploy-integration.yml
      parameters:
        language: ${{ parameters.language }}
        typerelease: ${{ parameters.typerelease }}
        apps: ${{ parameters.apps }}
        red: huila

  - ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/master') }}:
    - template: release/deploy-integration.yml
      parameters:
        language: ${{ parameters.language }}
        typerelease: ${{ parameters.typerelease }}
        apps: ${{ parameters.apps }}
        red: cauca
  


