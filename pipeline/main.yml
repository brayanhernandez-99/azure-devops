parameters:
  - name: release
    type: string
    values:
      - ecs-redes

  - name: red
    type: object
    default:
      - antioquia
      - cap
      - tolima
      - huila
      - cauca
      - boyaca
      - santander

  - name: apps
    type: object
    default:
      microservice-payments: "3.4.3"
      microservice-lotteries-games: "4.13.9"
      microservice-siga: "3.2.11"


resources:
  repositories:
    - repository: self
      name: $(System.TeamProject)/$(Build.Repository.Name)
      type: git
      ref: $(Build.SourceBranch)

stages:

 #DEPLOY REDES MOMENTANEMENTE 
  - ${{ if and(eq(variables['Build.SourceBranch'], 'refs/heads/master'), eq(parameters.release, 'ecs-redes')) }}:
      - template: build/semantic-version-integration.yml
        parameters:
          release: ${{ parameters.release }}
          apps: ${{ parameters.apps }}

  # # Deploy integración si NO es Flutter, No es Electron y es tag, develop, staging
  - ${{ if and(eq(variables['Build.SourceBranch'], 'refs/heads/master'), eq(parameters.release, 'ecs-redes')) }}:
      - ${{ each region in parameters.red }}:
          - template: release/deploy-integration.yml
            parameters:
              release: ${{ parameters.release }}
              apps: ${{ parameters.apps }}
              red: ${{ region }}
