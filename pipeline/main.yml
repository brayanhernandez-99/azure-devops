parameters:
  - name: release
    type: string

  - name: services
    type: string
    default: |
      {
        "awards": false,
        "bff-administration": false,
        "bff-integration": false,
        "bff-sellers": false,
        "biometrics": false,
        "collected": false,
        "conciliation": false,
        "credits": false,
        "dynamic-storage": false,
        "external-wager": false,
        "generic-services": false,
        "hierarchies": false,
        "legacy": false,
        "lotteries": false,
        "lotteries-games": false,
        "metabase": false,
        "millonario": false,
        "money-control": false,
        "notifications": false,
        "notifier": false,
        "online-games": false,
        "papelery": false,
        "payment-voucher": false,
        "payments": false,
        "products": false,
        "promotional": false,
        "raffles": false,
        "raspa": false,
        "recharges": false,
        "remittances": false,
        "security": false,
        "sellers": false,
        "siga": false,
        "transaction": false,
        "transaction-astro": false,
        "transaction-lotteries-games": false,
        "transaction-notifier": false,
        "transaction-recharges": false,
        "trino": false,
        "wiretransfer": false
      }

resources:
  repositories:
    - repository: self
      name: $(System.TeamProject)/$(Build.Repository.Name)
      type: git
      ref: $(Build.SourceBranch)

stages:
  #
  # UPDATE VERSION ECS ACCOUNTS
  #
  - ${{ if and(eq(parameters.release, 'update'), in(variables['Build.SourceBranchName'], 'develop', 'staging', 'master')) }}:
      - template: pipelines/pipeline-update-ecs.yml
        parameters:
          release: ${{ parameters.release }}

  #
  # RELOAD MICROSERVICE ECS ACCOUNTS
  #
  - ${{ if and(eq(parameters.release, 'reload'), in(variables['Build.SourceBranchName'], 'develop', 'staging')) }}:
      - template: pipelines/pipeline-reload-ecs.yml
        parameters:
          release: ${{ parameters.release }}
          services: ${{ parameters.services }}
