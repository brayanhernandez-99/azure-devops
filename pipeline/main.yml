parameters:
  - name: release
    type: string
    values:
      - ecs-redes

  - name: red
    type: object
    default:
      - antioquia
      - cap
      - tolima
      - huila
      - cauca
      - boyaca
      - santander

  - name: apps
    type: object
    default:
      bff-administration: "3.1.11"
      bff-sellers: "3.0.10"
      bff-integration: "0.0.12"
      microservice-astro: "3.5.8"
      microservice-awards: "3.5.3"
      microservice-biometrics: "1.1.5"
      microservice-collected: "3.5.5"
      microservice-conciliation: "1.5.0"
      microservice-dynamic-storage: "1.8.0"
      microservice-external-wager: "2.4.9"
      microservice-generic-services: "2.4.5"
      microservice-hierarchies: "3.6.0"
      microservice-legacy: "3.1.4"
      microservice-lotteries: "2.4.5"
      microservice-lotteries-games: "4.13.11"
      microservice-millonario: "3.4.6"
      microservice-money-control: "1.2.4"
      microservice-online-games: "3.4.5"
      microservice-papelery: "3.3.9"
      microservice-payment-voucher: "3.2.0"
      microservice-payments: "3.4.4"
      microservice-products: "3.5.3"
      microservice-promotional: "1.1.5"
      microservice-raffle: "3.5.3"
      microservice-recharges: "3.4.8"
      microservice-remittances: "2.2.6"
      microservice-sellers: "3.6.0"
      microservice-security: "3.3.11"
      microservice-siga: "3.2.12"
      microservice-transaction: "4.5.7"
      microservice-wiretransfer: "3.1.2"

resources:
  repositories:
    - repository: self
      name: $(System.TeamProject)/$(Build.Repository.Name)
      type: git
      ref: $(Build.SourceBranch)

stages:
  #
  # DEPLOY REDES MOMENTANEMENTE 
  #
  - ${{ if and(eq(variables['Build.SourceBranch'], 'refs/heads/master'), eq(parameters.release, 'ecs-redes')) }}:
      - template: build/semantic-version-integration.yml
        parameters:
          apps: ${{ parameters.apps }}
          release: ${{ parameters.release }}

  - ${{ if and(eq(variables['Build.SourceBranch'], 'refs/heads/master'), eq(parameters.release, 'ecs-redes')) }}:
      - ${{ each region in parameters.red }}:
          - template: release/deploy-integration.yml
            parameters:
              red: ${{ region }}
              apps: ${{ parameters.apps }}
              release: ${{ parameters.release }}
