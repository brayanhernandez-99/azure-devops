parameters:
  - name: release
    type: string
    values:
      - ecs-transactions

  - name: red
    type: object
    default:
      - antioquia

  - name: apps
    type: object
    default:
      - "transaction-astro"
      - "transaction-lg"
      - "transaction-recharges"

  - name: version
    type: string
    default: "0.0.0"

resources:
  repositories:
    - repository: self
      name: $(System.TeamProject)/$(Build.Repository.Name)
      type: git
      ref: $(Build.SourceBranch)

stages:
  #
  # DEPLOY TRANSACTIONS MOMENTANEMENTE
  #
  - ${{ if and(eq(parameters.release, 'ecs-transactions'), eq(variables['Build.SourceBranchName'], 'master')) }}:
      - template: pipelines/pipeline-ecs-transactions.yml
        parameters:
          red: ${{ parameters.red }}
          apps: ${{ parameters.apps }}
          release: ${{ parameters.release }}
          version: ${{ parameters.version }}
