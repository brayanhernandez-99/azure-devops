parameters:
  - name: release
    type: string

  - name: pr_id
    type: number
    default: 0

  - name: environments_staging
    type: object
    default:
      - staging
      - staging_nacional

  - name: red
    type: object
    default:
      - antioquia
      - cap
      - tolima
      - huila
      - cauca
      - boyaca
      - santander
      - putumayo

  - name: apps
    type: object
    default:
      - "app-administration-vue2"
      - "app-sellers-vue2"
      - "astro"
      - "awards"
      - "biometrics"
      - "cashier"
      - "chance"
      - "commissions"
      - "conciliation"
      - "dashboard"
      - "dynamic-storage"
      - "external-wager"
      - "hierarchies"
      - "invictus"
      - "login"
      - "lotteries"
      - "millonario"
      - "money-control"
      - "notifications"
      - "papelery"
      - "promotional"
      - "raffles"
      - "recharges"
      - "users"

resources:
  repositories:
    - repository: self
      name: $(System.TeamProject)/$(Build.Repository.Name)
      type: git

    - repository: sonarqube
      name: Invictus/sonarqube-invictus
      type: git

stages:
  #
  # MicroFronted Pre-Build
  #
  - ${{ if and( contains('PullRequest,IndividualCI', variables['Build.Reason']), eq(variables['Build.Repository.Name'], 'apps-microfrontend-invictus')) }}:
      - template: ./pipelines/pipeline-pre-build.yml
        parameters:
          release: ${{ parameters.release }}

  #
  # MicroFronted
  #
  - ${{ if and(eq(parameters.release, 'aws-s3'), or(startsWith(variables['Build.SourceBranch'], 'refs/heads/feature/'), startsWith(variables['Build.SourceBranch'], 'refs/heads/hotfix/'), in(variables['Build.SourceBranchName'], 'develop', 'staging', 'master'))) }}:
      - template: ./pipelines/pipeline-microfrontend.yml
        parameters:
          red: ${{ parameters.red }}
          apps: ${{ parameters.apps }}
          pr_id: ${{ parameters.pr_id }}
          release: ${{ parameters.release }}
          environments_staging: ${{ parameters.environments_staging }}

  #
  # MicroServices
  #
  - ${{ if and(eq(parameters.release, 'aws-ecs'), or(eq(variables['Build.Reason'], 'PullRequest'), startsWith(variables['Build.SourceBranch'], 'refs/heads/feature/'), startsWith(variables['Build.SourceBranch'], 'refs/heads/hotfix/'), in(variables['Build.SourceBranchName'], 'develop', 'staging', 'master'))) }}:
      - template: ./pipelines/pipeline-microservices.yml
        parameters:
          red: ${{ parameters.red }}
          release: ${{ parameters.release }}
          environments_staging: ${{ parameters.environments_staging }}

  #
  # MicroServices
  #
  - ${{ if eq(parameters.build, 'test') }}:
      - template: ./pipelines/pipeline-microservices.yml
        parameters:
          red: ${{ parameters.red }}
          release: ${{ parameters.release }}
          environments_staging: ${{ parameters.environments_staging }}

  #
  # Flutter
  #
  - ${{ if and(eq(parameters.release, 'apk'), or(startsWith(variables['Build.SourceBranch'], 'refs/heads/feature/'), startsWith(variables['Build.SourceBranch'], 'refs/heads/hotfix/'), in(variables['Build.SourceBranchName'], 'develop', 'staging', 'master'))) }}:
      - template: ./pipelines/pipeline-flutter.yml
        parameters:
          red: ${{ parameters.red }}
          release: ${{ parameters.release }}
          environments_staging: ${{ parameters.environments_staging }}

  #
  # Electron
  #
  - ${{ if and(eq(parameters.release, 'app'), or(startsWith(variables['Build.SourceBranch'], 'refs/heads/feature/'), startsWith(variables['Build.SourceBranch'], 'refs/heads/hotfix/'), in(variables['Build.SourceBranchName'], 'develop', 'staging', 'master'))) }}:
      - template: ./pipelines/pipeline-electron.yml
        parameters:
          red: ${{ parameters.red }}
          release: ${{ parameters.release }}
          environments_staging: ${{ parameters.environments_staging }}

  #
  # Repository Configuration
  #
  - ${{ if and(eq(parameters.release, 'rpc'), or(startsWith(variables['Build.SourceBranch'], 'refs/heads/feature/'), startsWith(variables['Build.SourceBranch'], 'refs/heads/hotfix/'), in(variables['Build.SourceBranchName'], 'develop', 'staging', 'master'))) }}:
      - template: ./pipelines/pipeline-repository-configuration.yml
        parameters:
          red: ${{ parameters.red }}
          release: ${{ parameters.release }}
          environments_staging: ${{ parameters.environments_staging }}
