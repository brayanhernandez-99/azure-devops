parameters:
  - name: release
    type: string
    values:
      - ecs-redes

  - name: red
    type: object
    default:
      - antioquia
      - cap
      - tolima
      - huila
      - cauca
      - boyaca
      - santander

  - name: apps
    type: object
    default:
      bff-administration: "3.1.9"
      bff-integration: "0.0.11"
      bff-sellers: "3.0.8"
      microservice-astro: "3.5.7"
      microservice-awards: "3.5.2"
      microservice-biometrics: "1.1.4"
      microservice-collected: "3.5.4"
      microservice-conciliation: "1.4.4"
      microservice-dynamic-storage: "1.6.4"
      microservice-external-wager: "2.4.8"
      microservice-generic-services: "2.4.4"
      microservice-hierarchies: "3.5.5"
      microservice-legacy: "3.1.3"
      microservice-lotteries: "2.4.4"
      microservice-lotteries-games: "4.13.8"
      microservice-millonario: "3.4.5"
      microservice-money-control: "1.2.3"
      notifier: "1.0.18"
      microservice-online-games: "3.4.4"
      microservice-papelery: "3.3.8"
      microservice-payment-voucher: "3.1.9"
      microservice-payments: "3.4.2"
      microservice-products: "3.5.2"
      microservice-promotional: "1.1.4"
      microservice-raffle: "3.5.2"
      microservice-recharges: "3.4.7"
      microservice-remittances: "2.2.5"
      microservice-reports: "1.0.4"
      microservice-security: "3.3.10"
      microservice-sellers: "3.5.7"
      microservice-shopping-cart: "2.2.0"
      microservice-siga: "3.2.10"
      microservice-transaction: "4.5.6"
      microservice-transaction-notifier: "1.0.2"
      microservice-wiretransfer: "3.1.1"

resources:
  repositories:
    - repository: self
      name: $(System.TeamProject)/$(Build.Repository.Name)
      type: git
      ref: $(Build.SourceBranch)

stages:

 #DEPLOY REDES MOMENTANEMENTE 
  - ${{ if and(eq(variables['Build.SourceBranch'], 'refs/heads/master'), eq(parameters.release, 'ecs-redes')) }}:
      - template: build/semantic-version-integration.yml
        parameters:
          release: ${{ parameters.release }}
          apps: ${{ parameters.apps }}

  # # Deploy integración si NO es Flutter, No es Electron y es tag, develop, staging
  - ${{ if and(eq(variables['Build.SourceBranch'], 'refs/heads/master'), eq(parameters.release, 'ecs-redes')) }}:
      - ${{ each region in parameters.red }}:
          - template: release/deploy-integration.yml
            parameters:
              release: ${{ parameters.release }}
              apps: ${{ parameters.apps }}
              red: ${{ region }}
