parameters:
  - name: release
    type: string

resources:
  repositories:
    - repository: self
      name: $(System.TeamProject)/$(Build.Repository.Name)
      type: git
      ref: $(Build.SourceBranch)

stages:
  #
  # DEPLOY VERSION ECS ACCOUNTS NEWS
  #
  - ${{ if and(eq(parameters.release, 'ecs-new'), in(variables['Build.SourceBranchName'], 'develop', 'staging', 'master')) }}:
      - template: pipelines/pipeline-version-ecs-new.yml
        parameters:
          release: ${{ parameters.release }}

  #
  # DEPLOY VERSION ECS ACCOUNTS OLDS
  #
  - ${{ if and(eq(parameters.release, 'ecs-old'), in(variables['Build.SourceBranchName'], 'develop', 'staging')) }}:
      - template: pipelines/pipeline-version-ecs-old.yml
        parameters:
          release: ${{ parameters.release }}
