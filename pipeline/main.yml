parameters:
  - name: release
    type: string

  - name: services
    type: string
    default: "[]"

  - name: environments_staging
    type: object
    default:
      - staging
      - staging_nacional

  - name: red
    type: object
    default:
      - cap
      - tolima
      - huila
      - cauca
      - boyaca
      - santander
      - putumayo

resources:
  repositories:
    - repository: self
      name: $(System.TeamProject)/$(Build.Repository.Name)
      type: git
      ref: $(Build.SourceBranch)

stages:
  #
  # UPDATE VERSION ECS ACCOUNTS
  #
  - ${{ if and(eq(parameters.release, 'update'), in(variables['Build.SourceBranchName'], 'develop', 'staging', 'master')) }}:
      - template: pipelines/pipeline-update-ecs.yml
        parameters:
          red: ${{ parameters.red }}
          release: ${{ parameters.release }}
          environments_staging: ${{ parameters.environments_staging }}

  #
  # RELOAD MICROSERVICE ECS ACCOUNTS
  #
  - ${{ if and(eq(parameters.release, 'reload'), in(variables['Build.SourceBranchName'], 'develop', 'staging')) }}:
      - template: pipelines/pipeline-reload-ecs.yml
        parameters:
          release: ${{ parameters.release }}
          services: ${{ parameters.services }}
