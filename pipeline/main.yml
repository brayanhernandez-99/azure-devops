parameters:
  # Parameters of Build
  - name: language
    type: string
    values:
      - nodejs
      - nodejsFront
      - flutter

  - name: release
    type: string
    values:
      - aws-s3
      - aws-ecs
      - apk

  - name: red
    type: object
    values:
      - antioquia
      - cap
      - tolima
      - huila
      - cauca

  - name: apps
    type: object
    default: {}

resources:
  repositories:
    - repository: self
      name: $(System.TeamProject)/$(Build.Repository.Name)
      type: git
      ref: $(Build.SourceBranch)

variables:
  # Branch Flags
  isFeatureOrHotfix: ${{ or(startsWith(variables['Build.SourceBranch'], 'refs/heads/feature/'), startsWith(variables['Build.SourceBranch'], 'refs/heads/hotfix/')) }}
  isDevelop: ${{ eq(variables['Build.SourceBranch'], 'refs/heads/develop') }}
  isStaging: ${{ eq(variables['Build.SourceBranch'], 'refs/heads/staging') }}
  isMaster: ${{ eq(variables['Build.SourceBranch'], 'refs/heads/master') }}
  isTag: ${{ startsWith(variables['Build.SourceBranch'], 'refs/tags/') }}
  isFlutter: ${{ eq(parameters.language, 'flutter') }}
  isS3: ${{ eq(parameters.release, 'aws-s3') }}

stages:
  - stage: diagnostic
    displayName: Diagnostic
    jobs:
      - job: printVars
        steps:
          - script: |
              echo "Branch: $(Build.SourceBranch)"
              echo "language: ${{ parameters.language }}"
              echo "release:  ${{ parameters.release }}"
              echo "apps:     ${{ parameters.apps }}"
              echo "red:      ${{ parameters.red }}"

  - ${{ if and(or(startsWith(variables['Build.SourceBranch'], 'refs/heads/feature/'), startsWith(variables['Build.SourceBranch'], 'refs/heads/hotfix/'), eq(variables['Build.SourceBranch'], 'refs/heads/develop')), ne(parameters.language, 'flutter')) }}:
  #- ${{ if and(or(variables.isFeatureOrHotfix, variables.isDevelop), not(variables.isFlutter)) }}:
      - template: build/build-developmet.yml
        parameters:
          language: ${{ parameters.language }}
          release: ${{ parameters.release }}
          apps: ${{ parameters.apps }}
          red: antioquia

  - ${{ if and(eq(variables['Build.SourceBranch'], 'refs/heads/staging'), eq(parameters.release, 'aws-s3')) }}:
  #- ${{ if and(variables.isStaging, variables.isS3) }}:
      - template: build/build-developmet.yml
        parameters:
          language: ${{ parameters.language }}
          release: ${{ parameters.release }}
          apps: ${{ parameters.apps }}
          red: antioquia

  - ${{ if and(eq(variables['Build.SourceBranch'], 'refs/heads/master'), eq(parameters.release, 'aws-s3')) }}:
  #- ${{ if and(variables.isMaster, variables.isS3) }}:
      - ${{ each region in parameters.red }}:
          - template: build/build-master-front.yml
            parameters:
              language: ${{ parameters.language }}
              release: ${{ parameters.release }}
              apps: ${{ parameters.apps }}
              red: ${{ region }}

  - ${{ if and(or(startsWith(variables['Build.SourceBranch'], 'refs/heads/feature/'), startsWith(variables['Build.SourceBranch'], 'refs/heads/hotfix/'), eq(variables['Build.SourceBranch'], 'refs/heads/develop'), eq(variables['Build.SourceBranch'], 'refs/heads/staging')), eq(parameters.language, 'flutter')) }}:
  #- ${{ if and(or(variables.isFeatureOrHotfix, variables.isDevelop, variables.isStaging), variables.isFlutter) }}:
      - template: build/build-united.yml
        parameters:
          language: ${{ parameters.language }}
          release: ${{ parameters.release }}
          red: antioquia

  - ${{ if and(eq(variables['Build.SourceBranch'], 'refs/heads/master'), eq(parameters.language, 'flutter')) }}:
  #- ${{ if and(variables.isMaster, variables.isFlutter) }}:
      - ${{ each region in parameters.red }}:
          - template: build/build-united.yml
            parameters:
              language: ${{ parameters.language }}
              release: ${{ parameters.release }}
              red: ${{ region }}

  - ${{ if and(or(startsWith(variables['Build.SourceBranch'], 'refs/tags/'), eq(variables['Build.SourceBranch'], 'refs/heads/staging'), eq(variables['Build.SourceBranch'], 'refs/heads/master')), and(ne(parameters.release, 'aws-s3'), ne(parameters.language, 'flutter'))) }}:
  #- ${{ if and(or(variables.isTag, variables.isStaging, variables.isMaster), not(variables.isS3), not(variables.isFlutter)) }}:
      - template: build/semantic-version-integration.yml
        parameters:
          language: ${{ parameters.language }}
          release: ${{ parameters.release }}
          apps: ${{ parameters.apps }}

  - ${{ if and(or(startsWith(variables['Build.SourceBranch'], 'refs/heads/feature/'), startsWith(variables['Build.SourceBranch'], 'refs/heads/hotfix/'), eq(variables['Build.SourceBranch'], 'refs/heads/develop'), eq(variables['Build.SourceBranch'], 'refs/heads/staging'), eq(variables['Build.SourceBranch'], 'refs/heads/master')), eq(parameters.language, 'flutter')) }}:
  #- ${{ if and(or(variables.isFeatureOrHotfix, variables.isDevelop, variables.isStaging, variables.isMaster), variables.isFlutter) }}:
      - template: build/semantic-version-integration.yml
        parameters:
          language: ${{ parameters.language }}
          release: ${{ parameters.release }}

  - ${{ if and(or(startsWith(variables['Build.SourceBranch'], 'refs/tags/'), eq(variables['Build.SourceBranch'], 'refs/heads/master')), eq(parameters.release, 'aws-s3')) }}:
  #- ${{ if and(or(variables.isTag, variables.isMaster), variables.isS3) }}:
      - template: build/semantic-version-integration.yml
        parameters:
          language: ${{ parameters.language }}
          release: ${{ parameters.release }}
          apps: ${{ parameters.apps }}

  - ${{ if and(or(startsWith(variables['Build.SourceBranch'], 'refs/tags/'), eq(variables['Build.SourceBranch'], 'refs/heads/develop'), eq(variables['Build.SourceBranch'], 'refs/heads/staging'), eq(variables['Build.SourceBranch'], 'refs/heads/master')), and(ne(parameters.release, 'aws-s3'), ne(parameters.language, 'flutter'))) }}:
  #- ${{ if and(or(variables.isTag, variables.isDevelop, variables.isStaging, variables.isMaster), not(variables.isS3), not(variables.isFlutter)) }}:
      - template: release/artifacts-managment.yml
        parameters:
          language: ${{ parameters.language }}
          release: ${{ parameters.release }}
          apps: ${{ parameters.apps }}
          red: antioquia

  - ${{ if and(or(startsWith(variables['Build.SourceBranch'], 'refs/tags/'), eq(variables['Build.SourceBranch'], 'refs/heads/develop'), eq(variables['Build.SourceBranch'], 'refs/heads/staging')), ne(parameters.language, 'flutter')) }}:
  #- ${{ if and(or(variables.isTag, variables.isDevelop, variables.isStaging), not(variables.isFlutter)) }}:
      - template: release/deploy-integration.yml
        parameters:
          language: ${{ parameters.language }}
          release: ${{ parameters.release }}
          apps: ${{ parameters.apps }}
          red: antioquia

  - ${{ if and(eq(variables['Build.SourceBranch'], 'refs/heads/master'), ne(parameters.language, 'flutter')) }}:
  #- ${{ if and(variables.isMaster, not(variables.isFlutter)) }}:
      - ${{ each region in parameters.red }}:
          - template: release/deploy-integration.yml
            parameters:
              language: ${{ parameters.language }}
              release: ${{ parameters.release }}
              apps: ${{ parameters.apps }}
              red: ${{ region }}
