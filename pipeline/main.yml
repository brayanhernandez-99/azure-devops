parameters:
  - name: release
    type: string
    values:
      - ecs-redes

  - name: red
    type: object
    default:
      - antioquia
      - cap
      - tolima
      - huila
      - cauca
      - boyaca
      - santander

  - name: apps
    type: object
    default:
      bff-administration: "3.1.10"
      bff-sellers: "3.0.9"
      microservice-sellers: "3.5.5"
      microservice-hierarchies: "3.5.3"
      microservice-papelery: "3.3.6"
      microservice-dynamic-storage: "1.6.2"
      microservice-security: "3.3.7"
      microservice-transaction: "4.5.4"

resources:
  repositories:
    - repository: self
      name: $(System.TeamProject)/$(Build.Repository.Name)
      type: git
      ref: $(Build.SourceBranch)

stages:

 #DEPLOY REDES MOMENTANEMENTE 
  - ${{ if and(eq(variables['Build.SourceBranch'], 'refs/heads/master'), eq(parameters.release, 'ecs-redes')) }}:
      - template: build/semantic-version-integration.yml
        parameters:
          release: ${{ parameters.release }}
          apps: ${{ parameters.apps }}

  # # Deploy integración si NO es Flutter, No es Electron y es tag, develop, staging
  - ${{ if and(eq(variables['Build.SourceBranch'], 'refs/heads/master'), eq(parameters.release, 'ecs-redes')) }}:
      - ${{ each region in parameters.red }}:
          - template: release/deploy-integration.yml
            parameters:
              release: ${{ parameters.release }}
              apps: ${{ parameters.apps }}
              red: ${{ region }}
