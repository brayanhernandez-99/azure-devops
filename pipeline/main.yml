parameters:
  - name: release
    type: string

  - name: red
    type: object
    default:
      - antioquia
      - cap
      # - tolima
      # - huila
      # - cauca
      # - boyaca
      # - santander

  - name: apps
    type: object
    default:
      - "app-administration-vue2"
      - "app-sellers-vue2"
      - "awards"
      - "biometrics"
      - "commissions"
      - "conciliation"
      - "dashboard"
      - "dynamic-storage"
      - "external-wager"
      - "hierarchies"
      - "invictus"
      - "login"
      - "lotteries"
      - "money-control"
      - "users"

resources:
  repositories:
    - repository: self
      name: $(System.TeamProject)/$(Build.Repository.Name)
      type: git

    - repository: sonarqube
      name: Invictus/security-sonarqube-invictus
      type: git

    - repository: electron
      name: Invictus/electron-app-invictus-test
      type: git

stages:
  #
  # MicroFronted pipeline
  #
  - ${{ if and(eq(parameters.release, 'aws-s3'), or(startsWith(variables['Build.SourceBranch'], 'refs/heads/feature/'), startsWith(variables['Build.SourceBranch'], 'refs/heads/hotfix/'), in(variables['Build.SourceBranchName'], 'develop', 'staging', 'master'))) }}:
      - template: pipelines/pipeline-micro-fronted.yml
        parameters:
          red: ${{ parameters.red }}
          apps: ${{ parameters.apps }}
          release: ${{ parameters.release }}

  # #
  # # Electron pipeline
  # #
  # - ${{ if and(eq(parameters.release, 'exe'), or(startsWith(variables['Build.SourceBranch'], 'refs/heads/feature/'), startsWith(variables['Build.SourceBranch'], 'refs/heads/hotfix/'), in(variables['Build.SourceBranchName'], 'develop', 'staging', 'master'))) }}:
  #     - template: pipeline/pipeline-electron.yml
  #       parameters:
  #         red: ${{ parameters.red }}
  #         release: ${{ parameters.release }}

  #
  # Repository Configuration pipeline
  #
  - ${{ if and(eq(parameters.release, 'rpc'), or(startsWith(variables['Build.SourceBranch'], 'refs/heads/feature/'), in(variables['Build.SourceBranchName'], 'develop', 'staging', 'master'))) }}:
      - template: pipelines/pipeline-repository-configuration.yml
        parameters:
          red: ${{ parameters.red }}
          release: ${{ parameters.release }}
