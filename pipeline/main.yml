parameters:
  - name: release
    type: string

  - name: pr_id
    type: number
    default: 0

  - name: pr_source_branch
    type: string
    default: ""

  - name: pr_target_branch
    type: string
    default: ""

  - name: environments_staging
    type: object
    default:
      - staging
      - staging_nacional

  - name: red
    type: object
    default:
      # - antioquia-west
      # - cap-west
      - antioquia
      - cap
      - tolima
      - huila
      - cauca
      - boyaca
      - santander
      - putumayo

  - name: apps
    type: object
    default: []

resources:
  repositories:
    - repository: self
      name: $(System.TeamProject)/$(Build.Repository.Name)
      type: git

    - repository: sonarqube
      name: Invictus/sonarqube-invictus
      type: git

stages:
  #
  # Microfrontend Pre-Build
  #
  - ${{ if and( contains('PullRequest,IndividualCI', variables['Build.Reason']), eq(variables['Build.Repository.Name'], 'apps-microfrontend-invictus')) }}:
      - template: ./pipelines/pipeline-pre-build.yml
        parameters:
          release: ${{ parameters.release }}

  #
  # Microfrontend
  #
  - ${{ if and(eq(parameters.release, 'aws-s3'), or(startsWith(variables['Build.SourceBranch'], 'refs/heads/feature/'), startsWith(variables['Build.SourceBranch'], 'refs/heads/hotfix/'), in(variables['Build.SourceBranchName'], 'develop', 'staging', 'master'))) }}:
      - template: ./pipelines/pipeline-microfrontend.yml
        parameters:
          red: ${{ parameters.red }}
          apps: ${{ parameters.apps }}
          pr_id: ${{ parameters.pr_id }}
          pr_source_branch: ${{ parameters.pr_source_branch }}
          pr_target_branch: ${{ parameters.pr_target_branch }}
          release: ${{ parameters.release }}
          environments_staging: ${{ parameters.environments_staging }}

  #
  # MicroServices
  #
  - ${{ if and(eq(parameters.release, 'aws-ecs'), or(eq(variables['Build.Reason'], 'PullRequest'), startsWith(variables['Build.SourceBranch'], 'refs/heads/feature/'), startsWith(variables['Build.SourceBranch'], 'refs/heads/hotfix/'), in(variables['Build.SourceBranchName'], 'develop', 'staging', 'master'))) }}:
      - template: ./pipelines/pipeline-microservices.yml
        parameters:
          red: ${{ parameters.red }}
          release: ${{ parameters.release }}
          environments_staging: ${{ parameters.environments_staging }}

  #
  # Flutter
  #
  - ${{ if and(eq(parameters.release, 'apk'), or(eq(variables['Build.Reason'], 'PullRequest'), startsWith(variables['Build.SourceBranch'], 'refs/heads/feature/'), startsWith(variables['Build.SourceBranch'], 'refs/heads/hotfix/'), in(variables['Build.SourceBranchName'], 'develop', 'staging', 'master'))) }}:
      - template: ./pipelines/pipeline-flutter.yml
        parameters:
          red: ${{ parameters.red }}
          release: ${{ parameters.release }}
          environments_staging: ${{ parameters.environments_staging }}

  #
  # Electron
  #
  - ${{ if and(eq(parameters.release, 'app'), or(eq(variables['Build.Reason'], 'PullRequest'), startsWith(variables['Build.SourceBranch'], 'refs/heads/feature/'), startsWith(variables['Build.SourceBranch'], 'refs/heads/hotfix/'), in(variables['Build.SourceBranchName'], 'develop', 'staging', 'master'))) }}:
      - template: ./pipelines/pipeline-electron.yml
        parameters:
          red: ${{ parameters.red }}
          release: ${{ parameters.release }}
          environments_staging: ${{ parameters.environments_staging }}

  #
  # Repository Configuration
  #
  - ${{ if and(eq(parameters.release, 'rpc'), or(eq(variables['Build.Reason'], 'PullRequest'), startsWith(variables['Build.SourceBranch'], 'refs/heads/feature/'), startsWith(variables['Build.SourceBranch'], 'refs/heads/hotfix/'), in(variables['Build.SourceBranchName'], 'develop', 'staging', 'master'))) }}:
      - template: ./pipelines/pipeline-repository-configuration.yml
        parameters:
          red: ${{ parameters.red }}
          release: ${{ parameters.release }}
          environments_staging: ${{ parameters.environments_staging }}
