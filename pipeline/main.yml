parameters:
  - name: release
    type: string
    values:
      - ecs-redes

  - name: red
    type: object
    default:
      - antioquia
      - cap
      - tolima
      - huila
      - cauca
      - boyaca
      - santander

  - name: apps
    type: object
    default:
      microservice-sellers: "3.6.4"
      microservice-conciliation: "1.5.1"
      microservice-recharges: "3.4.9"
      microservice-siga: "3.2.18"
      microservice-transaction: "4.5.12"
      microservice-transaction-astro: "4.5.12"
      microservice-transaction-lotteries-games: "4.5.12"
      microservice-transaction-recharges: "4.5.12"

resources:
  repositories:
    - repository: self
      name: $(System.TeamProject)/$(Build.Repository.Name)
      type: git
      ref: $(Build.SourceBranch)

stages:
  #
  # DEPLOY REDES MOMENTANEMENTE 
  #
  - ${{ if and(eq(variables['Build.SourceBranch'], 'refs/heads/master'), eq(parameters.release, 'ecs-redes')) }}:
      - template: build/semantic-version-integration.yml
        parameters:
          apps: ${{ parameters.apps }}
          release: ${{ parameters.release }}

  - ${{ if and(eq(variables['Build.SourceBranch'], 'refs/heads/master'), eq(parameters.release, 'ecs-redes')) }}:
      - ${{ each region in parameters.red }}:
          - template: release/deploy-integration.yml
            parameters:
              red: ${{ region }}
              apps: ${{ parameters.apps }}
              release: ${{ parameters.release }}
