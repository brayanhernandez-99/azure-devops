parameters:
  - name: release
    type: string

  - name: red
    type: object
    default:
      - antioquia
      - cap
      - tolima
      - huila
      - cauca
      - boyaca
      - santander

resources:
  repositories:
    - repository: self
      name: $(System.TeamProject)/$(Build.Repository.Name)
      type: git

stages:
  #
  # Infrastructure pipeline
  #
  - ${{ if and(eq(parameters.release, 'iac'), in(variables['Build.SourceBranchName'], 'develop', 'staging', 'master')) }}:
      - template: ./pipelines/pipeline-infrastructure.yml
        parameters:
          red: ${{ parameters.red }}
          release: ${{ parameters.release }}
