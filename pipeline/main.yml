parameters:
  - name: release
    type: string

  - name: pr_id
    type: number
    default: 0

  - name: environments_new_develop
    type: object
    default:
      - develop
      - develop_new

  - name: environments_new_staging
    type: object
    default:
      - staging
      - staging_new

  - name: red
    type: object
    default:
      - antioquia
      - cap
      - tolima
      - huila
      - cauca
      - boyaca
      - santander

  - name: apps
    type: object
    default:
      - "app-administration-vue2"
      - "app-sellers-vue2"
      - "astro"
      - "awards"
      - "biometrics"
      - "cashier"
      - "chance"
      - "commissions"
      - "conciliation"
      - "dashboard"
      - "dynamic-storage"
      - "external-wager"
      - "hierarchies"
      - "invictus"
      - "login"
      - "lotteries"
      - "millonario"
      - "money-control"
      - "notifications"
      - "papelery"
      - "promotional"
      - "raffles"
      - "recharges"
      - "users"

resources:
  repositories:
    - repository: self
      name: $(System.TeamProject)/$(Build.Repository.Name)
      type: git

    # - repository: sonarqube
    #   name: Invictus/security-sonarqube-invictus
    #   type: git

    # - repository: electron
    #   name: Invictus/electron-app-invictus-test
    #   type: git

stages:
  #
  # MicroFronted Pre-Build
  #
  - ${{ if and( contains('PullRequest,IndividualCI', variables['Build.Reason']), eq(variables['Build.Repository.Name'], 'Pruebas-apps-microfrontend-azure')) }}:
      - template: ./pipelines/pipeline-pre-build.yml
        parameters:
          release: ${{ parameters.release }}

  #
  # MicroFronted
  #
  - ${{ if and(eq(parameters.release, 'aws-s3'), or(startsWith(variables['Build.SourceBranch'], 'refs/heads/feature/'), startsWith(variables['Build.SourceBranch'], 'refs/heads/hotfix/'), in(variables['Build.SourceBranchName'], 'develop', 'staging', 'master'))) }}:
      - template: ./pipelines/pipeline-micro-frontend.yml
        parameters:
          red: ${{ parameters.red }}
          apps: ${{ parameters.apps }}
          pr_id: ${{ parameters.pr_id }}
          release: ${{ parameters.release }}

  #
  # MicroServices
  #
  - ${{ if and(eq(parameters.release, 'aws-ecs'), or(startsWith(variables['Build.SourceBranch'], 'refs/heads/feature/'), startsWith(variables['Build.SourceBranch'], 'refs/heads/hotfix/'), in(variables['Build.SourceBranchName'], 'develop', 'staging', 'master'))) }}:
      - template: ./pipelines/pipeline-micro-services.yml
        parameters:
          red: ${{ parameters.red }}
          release: ${{ parameters.release }}

  #
  # Flutter
  #
  - ${{ if and(eq(parameters.release, 'apk'), or(startsWith(variables['Build.SourceBranch'], 'refs/heads/feature/'), startsWith(variables['Build.SourceBranch'], 'refs/heads/hotfix/'), in(variables['Build.SourceBranchName'], 'develop', 'staging', 'master'))) }}:
      - template: ./pipelines/pipeline-flutter.yml
        parameters:
          red: ${{ parameters.red }}
          release: ${{ parameters.release }}

  #
  # Electron
  #
  - ${{ if and(eq(parameters.release, 'exe'), or(startsWith(variables['Build.SourceBranch'], 'refs/heads/feature/'), startsWith(variables['Build.SourceBranch'], 'refs/heads/hotfix/'), in(variables['Build.SourceBranchName'], 'develop', 'staging', 'master'))) }}:
      - template: ./pipelines/pipeline-electron.yml
        parameters:
          red: ${{ parameters.red }}
          release: ${{ parameters.release }}

  #
  # Repository Configuration
  #
  - ${{ if and(eq(parameters.release, 'rpc'), or(startsWith(variables['Build.SourceBranch'], 'refs/heads/feature/'), startsWith(variables['Build.SourceBranch'], 'refs/heads/hotfix/'), in(variables['Build.SourceBranchName'], 'develop', 'staging', 'master'))) }}:
      - template: ./pipelines/pipeline-repository-configuration.yml
        parameters:
          red: ${{ parameters.red }}
          release: ${{ parameters.release }}
          environments_new_develop: ${{ parameters.environments_new_develop }}
          environments_new_staging: ${{ parameters.environments_new_staging }}


  #
  # MicroFronted - Electron
  #
  - ${{ if and(eq(parameters.release, 'electron'), or(startsWith(variables['Build.SourceBranch'], 'refs/heads/feature/'), startsWith(variables['Build.SourceBranch'], 'refs/heads/hotfix/'), in(variables['Build.SourceBranchName'], 'develop', 'staging', 'master'))) }}:
      - template: ./pipelines/pipeline-micro-frontend-electron.yml
        parameters:
          red: ${{ parameters.red }}
          apps: ${{ parameters.apps }}
          release: ${{ parameters.release }}
