jobs:
  - job: "create_tag_version_microservice"
    displayName: "🏷️ create tag version"
    pool:
      name: "Azure Pipelines"
      vmImage: ubuntu-latest

    steps:
      - checkout: self
        fetchDepth: 0
        persistCredentials: true

      - task: Bash@3
        inputs:
          targetType: inline
          script: |
            set -e
            git config user.name "pipeline"
            git config user.email "pipelineUX@ux.technology"
            git fetch --tags

            file="$(Pipeline.Workspace)/versions/microservice/version.json"
            VERSION=$(jq -r .version "$file")
            TAG="v${VERSION}"
            echo "🏷️ Tag a crear: ${TAG}"

            git fetch --tags
            if git rev-parse "${TAG}" >/dev/null 2>&1; then
              echo -e "\n##vso[task.logissue type=warning]⚠️ El tag ${TAG} ya existe"
            else
              git tag -a "${TAG}" -m "Release ${TAG}"
              git push origin "${TAG}"
              echo "✅ Tag publicado: ${TAG}"
            fi
        displayName: "🏷️ Create Tag Version"
        condition: succeeded()
