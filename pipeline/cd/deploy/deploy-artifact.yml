jobs:
  - job: deploy_artifact
    displayName: "🚀 deploy artifact"
    pool:
      name: "Azure Pipelines"
      VmImage: ubuntu-22.04

    variables:
      - template: ../../variables/groups-transversal-variables-backend.yml

    steps:
      - download: current
        artifact: npm-package
        condition: and(succeeded(), eq(variables['Build.SourceBranchName'], 'develop'))

      - task: NodeTool@0
        displayName: "Install Node"
        inputs:
          versionSpec: "18.x"

      - script: |
          cat <<EOF > $(Pipeline.Workspace)/npm-package/.npmrc
          registry=https://pkgs.dev.azure.com/ux-technology/Invictus/_packaging/$(FEED_INTER_LIBRARIES)/npm/registry/
          always-auth=true
          EOF

          cat $(Pipeline.Workspace)/npm-package/.npmrc
        displayName: "🔐 Configure npm registry"
        condition: and(succeeded(), eq(variables['Build.SourceBranchName'], 'develop'))

      - task: npmAuthenticate@0
        inputs:
          workingFile: $(Pipeline.Workspace)/npm-package/.npmrc
        condition: and(succeeded(), eq(variables['Build.SourceBranchName'], 'develop'))

      - script: |
          cd $(Pipeline.Workspace)/npm-package
          npm publish *.tgz --registry https://pkgs.dev.azure.com/ux-technology/Invictus/_packaging/$(FEED_INTER_LIBRARIES)/npm/registry/
        displayName: "Publish to Azure Artifacts"
        condition: and(succeeded(), eq(variables['Build.SourceBranchName'], 'develop'))

      - script: |
          FEED_ID=$(curl -s -u :$AZURE_DEVOPS_CLI_PAT \
          "https://feeds.dev.azure.com/ux-technology/Invictus/_apis/packaging/feeds?api-version=7.1-preview.1" \
          | jq -r '.value[] | select(.name=="$(FEED_INTER_LIBRARIES)") | .id')

          echo "##vso[task.setvariable variable=FEED_ID]$FEED_ID"

          echo "Feed ID: $FEED_ID"
        displayName: "Feed ID"
        env:
          AZURE_DEVOPS_CLI_PAT: $(PAT-AZ)

      - script: |
          PACKAGE=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")

          ENCODED_PACKAGE=$(printf '%s' "$PACKAGE" | jq -sRr @uri)

          CURRENT_BRANCH="$BUILD_SOURCEBRANCH"
          BRANCH="${CURRENT_BRANCH#refs/heads/}"

          case "$BRANCH" in
            staging)
              VIEW="Prerelease"
              ;;
            master)
              VIEW="Release"
              ;;
          esac

          echo "Package: $PACKAGE"
          echo "Encoded package: $ENCODED_PACKAGE"
          echo "Version: $VERSION"
          echo "View: $VIEW"

          # echo "Promoting package..."

          # ENCODED_PAT=$(echo -n ":$AZURE_DEVOPS_CLI_PAT" | base64 | tr -d '\n')

          # RESPONSE=$(curl -v -X PATCH "https://pkgs.dev.azure.com/ux-technology/Invictus/_apis/packaging/feeds/$(FEED_ID)/npm/$ENCODED_PACKAGE/versions/$VERSION?api-version=7.2-preview.1" \
          # -H "Content-Type: application/json" \
          # -H "Authorization: Basic $ENCODED_PAT" \
          # -d "{
          #     \"views\": {
          #       \"path\": \"/views/-\",
          #       \"op\": \"add\",
          #       \"value\": \"$VIEW\"
          #     }
          #   }")
          
          # echo "Respuesta de la API:"
          # echo "$RESPONSE"

        displayName: "Promote npm package"
        condition: and(succeeded(), ne(variables['Build.SourceBranchName'], 'develop'))
        env:
          AZURE_DEVOPS_CLI_PAT: $(PAT-AZ)

      - script: |

          LIBRARY=$(node -p "require('./package.json').name")

          echo "Searching for changes in repositories that consume $LIBRARY..."

          REPOS=$(curl -s -u :$AZURE_DEVOPS_PAT \
          "https://almsearch.dev.azure.com/ux-technology/Invictus/_apis/search/codesearchresults?api-version=7.1-preview.1" \
          -H "Content-Type: application/json" \
          -d "{
            \"searchText\": \"\\\"$LIBRARY\\\" package.json\",
            \"\$top\": 1000
          }" | jq -r '.results[]?.repository.name' | sort -u)

          echo "Repos afectados:"
          echo "$REPOS"

        displayName: "Find affected repositories"
        env:
          AZURE_DEVOPS_PAT: $(PAT-AZ)

      - script: |




          ORG="ux-technology"
          PROJECT="12c50c8c-87d3-485c-8176-eb25f6b918f5"
          FEED_ID="7b1af43c-e82e-4ce5-95cb-b02c749c668c"
          VIEW="Prerelease"

          ENCODED_PAT=$(echo -n ":$AZURE_DEVOPS_CLI_PAT" | base64 | tr -d '\n')

          CONTINUATION_TOKEN=""

          echo "🚀 Starting mass promotion to view: $VIEW"

          while : ; do

            if [ -z "$CONTINUATION_TOKEN" ]; then
              URL="https://feeds.dev.azure.com/$ORG/$PROJECT/_apis/packaging/feeds/$FEED_ID/packages?protocolType=npm&api-version=7.1-preview.1"
            else
              URL="https://feeds.dev.azure.com/$ORG/$PROJECT/_apis/packaging/feeds/$FEED_ID/packages?protocolType=npm&continuationToken=$CONTINUATION_TOKEN&api-version=7.1-preview.1"
            fi

            RESPONSE=$(curl -s -D headers_pkg.txt \
              -H "Authorization: Basic $ENCODED_PAT" \
              "$URL")

            while read pkg; do
              PACKAGE=$(echo "$pkg" | jq -r '.name')
              PACKAGE_ID=$(echo "$pkg" | jq -r '.id')

              echo "📦 Package: $PACKAGE"

              # 🔥 traer TODAS las versiones usando PACKAGE_ID
              VERSIONS_RESPONSE=$(curl -s \
                -H "Authorization: Basic $ENCODED_PAT" \
                "https://feeds.dev.azure.com/$ORG/$PROJECT/_apis/packaging/feeds/$FEED_ID/packages/$PACKAGE_ID/versions?api-version=7.1-preview.1")

              while read VERSION; do

                # 🔎 validar si ya tiene el view
                HAS_VIEW=$(echo "$VERSIONS_RESPONSE" | jq -r \
                  --arg VERSION "$VERSION" \
                  --arg VIEW "$VIEW" \
                  '.value[]
                  | select(.version==$VERSION)
                  | .views[]?.name' | grep -w "$VIEW")

                if [ -n "$HAS_VIEW" ]; then
                  echo "  ⏭ $PACKAGE@$VERSION ya está en $VIEW"
                  continue
                fi

                echo "  🔄 Promoting $PACKAGE@$VERSION → $VIEW"

                ENCODED_PACKAGE=$(printf '%s' "$PACKAGE" | jq -sRr @uri)

                RESPONSE_PATCH=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X PATCH \
                  -H "Authorization: Basic $ENCODED_PAT" \
                  -H "Content-Type: application/json" \
                  "https://pkgs.dev.azure.com/$ORG/$PROJECT/_apis/packaging/feeds/$FEED_ID/npm/$ENCODED_PACKAGE/versions/$VERSION?api-version=7.2-preview.1" \
                  -d "{
                    \"views\": {
                      \"op\": \"add\",
                      \"path\": \"/views/-\",
                      \"value\": \"$VIEW\"
                    }
                  }")

                STATUS=$(echo "$RESPONSE_PATCH" | grep HTTP_STATUS | cut -d':' -f2)

                if [ "$STATUS" != "200" ]; then
                  echo "  ✅  promoting $PACKAGE@$VERSION (HTTP $STATUS)"
                else
                  echo "  ✅ Promoted"
                fi

              done < <(echo "$VERSIONS_RESPONSE" | jq -r '.value[].version')

            done < <(echo "$RESPONSE" | jq -c '.value[]')

            CONTINUATION_TOKEN=$(grep -i x-ms-continuationtoken headers_pkg.txt | awk '{print $2}' | tr -d '\r')

            if [ -z "$CONTINUATION_TOKEN" ]; then
              break
            fi

          done

          echo "✅ Done 🚀"

        displayName: "Promote npm package"
        condition: and(succeeded(), ne(variables['Build.SourceBranchName'], 'develop'))
        env:
          AZURE_DEVOPS_CLI_PAT: $(PAT-AZ)
