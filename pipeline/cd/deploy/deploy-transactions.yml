jobs:
  - job: deploy_transactions
    displayName: "🚀 deploy "
    pool:
      name: "Azure Pipelines"
      VmImage: ubuntu-22.04

    variables:
      - template: ../../variables/groups-transversal-variables.yml
        parameters:
          red: ${{ parameters.red }}

    strategy:
      matrix:
        ${{ each pair in parameters.apps }}:
          ${{ pair.Key }}:
            msName: ${{ pair.Key }}
            msVersion: ${{ pair.Value }}

    steps:
      - script: |
          echo "📣 Original msName: $(msName)"
          cleanName=$(echo $(msName) | sed 's/microservice-//')
          echo "🧹 Nombre limpio: $cleanName"
          echo "##vso[task.setvariable variable=cleanMsName]$cleanName"
        displayName: "⚙️ Prepare deploy $(msName)"
        condition: succeeded()

      - script: |
          echo -e "\n🚀 Versión detectada para $(msName)..." 
          echo "Version: $(msVersion)"
        displayName: "🔍 Read Microservice Versions"
        condition: succeeded()

      - script: |
          echo "🔐 Iniciando login a AWS ECR..."
          aws ecr get-login-password --region $AWS_DEFAULT_REGION | \
          docker login --username AWS --password-stdin $ACCOUNT_ID_DEPLOY.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
        displayName: "🔐 Login to AWS ECR"
        condition: succeeded()
        env:
          AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)
          AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID_DEPLOY)
          AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY_DEPLOY)

      - task: Bash@3
        inputs:
          targetType: "inline"
          script: |
            CURRENT_BRANCH=$(echo $(Build.SourceBranch))

            if [[ "$CURRENT_BRANCH" == refs/heads/master ]]; then
              clean_branch=prd
            fi

            # Validar microservicios transactions
            if [[ "$(cleanMsName)" == "transaction-astro" || \
                  "$(cleanMsName)" == "transaction-lotteries-games" || \
                  "$(cleanMsName)" == "transaction-recharges" ]]; then
              REPO_NAME="microservice-transaction-$clean_branch"
              IMAGE_TAG="$(msVersion)"
            else
              REPO_NAME="$(msName)-$clean_branch"
              IMAGE_TAG="$(msVersion)"
            fi

            echo "🔍 Verificando si la imagen '$IMAGE_TAG' existe en '$REPO_NAME'..."

            if aws ecr describe-images \
                --repository-name "$REPO_NAME" \
                --image-ids imageTag=$IMAGE_TAG \
                --region "$AWS_DEFAULT_REGION" > /dev/null 2>&1; then
              echo "✅ Imagen encontrada en ECR."
            else
              echo "❌ Imagen no encontrada: $REPO_NAME:$IMAGE_TAG"
              exit 99
            fi
        displayName: "🔍 Verify image in ECR"
        condition: succeeded()
        env:
          AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)
          AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID_DEPLOY)
          AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY_DEPLOY)

      - script: |
          export AWS_REGION
          export AWS_ACCESS_KEY_ID
          export AWS_SECRET_ACCESS_KEY

          if [[ "$(cleanMsName)" == "raffle" ]]; then
              SERVICES=raffles
          fi
          echo $CLUSTER
          echo $SERVICES

          echo "🔍 Obteniendo task definition..."
          arn=$(aws ecs describe-services \
            --cluster $CLUSTER \
            --services $SERVICES \
            --query 'services[0].taskDefinition' \
            --output text \
            --region $(AWS_DEFAULT_REGION))
            
          echo "🆔 TaskDef ARN: $arn"
          echo "##vso[task.setvariable variable=taskDefinitionArn]$arn"
        displayName: "🔍 Get Task Definition ARN"
        condition: succeeded()
        env:
          AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)
          AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID_INVICTUS)
          AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY_INVICTUS)

      - script: |
          echo "🔎 Obteniendo *family* de Task Definition..."
          ARN='$(taskDefinitionArn)'
          echo "📄 ARN detectado: $ARN"

          FAMILY=$(echo $ARN | cut -d'/' -f2 | cut -d':' -f1)
          echo "🧩 Family extraída: $FAMILY"
          echo "##vso[task.setvariable variable=taskFamily]$FAMILY"
        displayName: "🧩 Extract family from Task Definition ARN"
        condition: succeeded()

      - script: |
          export AWS_ACCESS_KEY_ID
          export AWS_SECRET_ACCESS_KEY
          export AWS_REGION

          echo "📥 Obteniendo definición actual desde ECS..."
          aws ecs describe-task-definition \
            --task-definition $(taskDefinitionArn) \
            --query 'taskDefinition' \
            > taskdef.json

          echo "📄 taskdef.json generado:"
          cat taskdef.json
        displayName: "📦 Get Current Task Definition"
        condition: succeeded()
        env:
          AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)
          AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID_INVICTUS)
          AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY_INVICTUS)

      - script: |
          newTag="$(msVersion)"

          jq --arg newTag "$newTag" '
            .containerDefinitions |= map(
              .image |= (split(":")[0] + ":" + $newTag)
            )
          ' taskdef.json > new-taskdef-$(cleanMsName).json

          echo "🔄 Actualizando imagen con nuevo tag: $newTag"
          echo "📄 Nueva task definition generada:"
          cat new-taskdef-$(cleanMsName).json
        displayName: "📝 Update Image Tag in Task Definition"
        condition: succeeded()

      - script: |
          echo "🧹 Limpiando atributos innecesarios del task definition..."

          jq '{
            family,
            taskRoleArn,
            executionRoleArn,
            networkMode,
            containerDefinitions,
            volumes,
            placementConstraints,
            requiresCompatibilities,
            cpu,
            memory,
            tags,
            pidMode,
            ipcMode,
            proxyConfiguration,
            inferenceAccelerators,
            ephemeralStorage,
            runtimePlatform
          } | with_entries(select(.value != null))' new-taskdef-$(cleanMsName).json > new-taskdef-$(cleanMsName)-ecs.json

          echo -e "\n📄 Resultado final del task definition limpio:"
          cat new-taskdef-$(cleanMsName)-ecs.json
        displayName: "🧹 Clean Up Task Definition Attributes"
        condition: succeeded()

      - script: |
          export AWS_ACCESS_KEY_ID
          export AWS_SECRET_ACCESS_KEY
          export AWS_REGION

          echo "📝 Registrando la nueva Task Definition en ECS..."

          output=$(aws ecs register-task-definition \
            --cli-input-json file://new-taskdef-$(cleanMsName)-ecs.json \
            --region $AWS_DEFAULT_REGION)

          arn=$(echo $output | jq -r '.taskDefinition.taskDefinitionArn')

          echo "📌 Nueva Task Definition"
          echo "➡️ ARN: $arn"

          echo "##vso[task.setvariable variable=taskDefinitionArnNew]$arn"
        displayName: "📄 Register New Task Definition"
        condition: succeeded()
        env:
          AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)
          AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID_INVICTUS)
          AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY_INVICTUS)

      - script: |
          export AWS_ACCESS_KEY_ID
          export AWS_SECRET_ACCESS_KEY
          export AWS_REGION

          echo "🆕 Usando el nuevo ARN de la Task Definition:"
          echo "$(taskDefinitionArnNew)"

          if [[ "$(cleanMsName)" == "raffle" ]]; then
              SERVICES=raffles
          fi

          echo "📌 Cluster: $CLUSTER"
          echo "🔧 Service: $SERVICES"
          echo "🚀 Actualizando el servicio de ECS con la nueva Task Definition..."

          aws ecs update-service \
            --cluster $CLUSTER \
            --service $SERVICES \
            --task-definition $(taskDefinitionArnNew) \
            --region $AWS_DEFAULT_REGION

        displayName: "🔄 Update Service with New Task Definition"
        condition: succeeded()
        env:
          AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)
          AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID_INVICTUS)
          AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY_INVICTUS)
