jobs:
  - job: deploy_electron
    displayName: "🚀 deploy electron"
    pool:
      name: "Azure Pipelines"
      VmImage: ubuntu-22.04

    variables:
      - template: ../../variables/groups-transversal-variables-electron.yml
        parameters:
          region: ${{ parameters.region }}
          environment_staging: ${{ parameters.environment_staging }}

    steps:
      - task: DownloadBuildArtifacts@0
        inputs:
          artifactName: "release"
          downloadPath: "$(Pipeline.Workspace)"
        displayName: "📥 Download Electron Artifacts"
        condition: succeeded()

      - task: DownloadBuildArtifacts@0
        inputs:
          artifactName: "versions"
          downloadPath: "$(Pipeline.Workspace)"
        displayName: "📥 Download Version"
        condition: succeeded()

      - script: |
          VERSION_FILE="$(Pipeline.Workspace)/versions/electron/version.json"
          if [[ -f "$VERSION_FILE" ]]; then
            VERSION=$(jq -r '.version' $VERSION_FILE)
            echo -e "\n🚀 Versión detectada para $(Build.Repository.Name): $VERSION"
            echo "##vso[task.setvariable variable=version]$VERSION"
          else
            echo -e "\n##vso[task.logissue type=error]⚠️ No se encontro archivo de versión para $(Build.Repository.Name)"
            exit 99
          fi
        displayName: "📚 Read Version"
        condition: succeeded()

      - script: |
          CURRENT_BRANCH="$(Build.SourceBranch)"
          environment="unknown"

          case "$CURRENT_BRANCH" in 
            refs/heads/develop | refs/heads/feature/* | refs/heads/hotfix/*)
              environment="develop"
            ;;
            refs/heads/staging)
              if [[ "$environment_staging" == "staging" ]]; then
                environment="staging"
              elif [[ "$environment_staging" == "staging_nacional" ]]; then
                environment="staging_nacional"
              fi
            ;;
            refs/heads/master)
              environment="$region"
            ;;
          esac

          if [[ "$environment" == "unknown" ]]; then
            echo -e "\n##vso[task.logissue type=error]⚠️ Environment [$environment] no reconocido"
            exit 99
          fi

          echo "##vso[task.setvariable variable=environment]$environment"
          echo -e "\n✅ Environment asignado exitosamente"
          echo "Environment: $environment"
        displayName: "⚙️ Generate .env"
        condition: succeeded()
        env:
          region: ${{ parameters.region }}
          environment_staging: ${{ parameters.environment_staging }}

      - script: |
          set -e
          echo -e "\n📦 Cargando al Bucket S3..."

          BASE_PATH="$(Pipeline.Workspace)/release/$(environment)/linux"
          echo -e "\n📂 Archivos a cargar: $BASE_PATH"
          ls -l "$BASE_PATH"
          echo ""

          aws s3 cp "$BASE_PATH" "s3://mf-download-$(ACCOUNT_ID_INVICTUS)/app/linux/" --recursive

          echo -e "\n✅ Archivos subidos exitosamente."
          echo "🔗 APP: InvictusUX-$(version).AppImage"
          echo -e "\n##[command]🔗 URL: https://mf-download-$(ACCOUNT_ID_INVICTUS).s3.us-east-1.amazonaws.com/app/linux/InvictusUX-$(version).AppImage"
        displayName: "🐧 Upload Bucket S3 Linux"
        condition: succeeded()
        env:
          AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)
          AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID_DEPLOY)
          AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY_DEPLOY)

      - script: |
          set -e
          echo -e "\n📦 Cargando al Bucket S3..."

          BASE_PATH="$(Pipeline.Workspace)/release/$(environment)/windows"
          echo -e "\n📂 Archivos a cargar: $BASE_PATH"
          ls -l "$BASE_PATH"
          echo ""

          aws s3 cp "$BASE_PATH" "s3://mf-download-$(ACCOUNT_ID_INVICTUS)/app/windows/" --recursive

          echo -e "\n✅ Archivos subidos exitosamente."
          echo "🔗 APP: InvictusUX Setup $(version).exe"
          echo -e "\n##[command] URL: https://mf-download-$(ACCOUNT_ID_INVICTUS).s3.us-east-1.amazonaws.com/app/windows/InvictusUX+Setup+$(version).exe"
        displayName: "🖥️ Upload Bucket S3 Windows"
        condition: succeeded()
        env:
          AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)
          AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID_DEPLOY)
          AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY_DEPLOY)

      - script: |
          set -e
          echo -e "\nℹ️ Enviando Mensaje a SQS..."
          echo "Cuenta : $(ACCOUNT_ID_INVICTUS)"
          echo "Version: $(version)"

          aws sqs send-message \
            --queue-url https://sqs.us-east-1.amazonaws.com/$(ACCOUNT_ID_INVICTUS)/DynamicStorage \
            --message-body '{
              "model": {
                "parameterName": "VERSION",
                "parameterDescription": "Parámetro que indica la versión actual del sistema.",
                "parameterOrigin": "GLOBAL_PARAMETER",
                "parameterValue": "$(version)"
              },
              "event": "setParameter"
            }' \
            --delay-seconds 0
        displayName: "📩 Send Message SQS"
        condition: succeeded()
        env:
          AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)
          AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID_INVICTUS)
          AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY_INVICTUS)

      - script: |
          DEPLOY_TIME=$(date -d "$BUILD_FINISHTIME -5 hours" "+%Y-%m-%d %I:%M %p")

          echo -e "\n📢 Generando notificación para Teams..."
          echo "Pipeline   : $(Build.DefinitionName)"
          echo "Branch     : $(environment)"
          echo "Build      : $(Build.BuildNumber)"
          echo "User       : $(Build.RequestedFor)"
          echo "DeployTime : $DEPLOY_TIME"
          echo ""

          payload=$(cat <<EOF
          {
            "@type": "MessageCard",
            "@context": "http://schema.org/extensions",
            "summary": "Deployment successful",
            "themeColor": "00FF00",
            "title": "✅ Deployment exitoso $(Build.SourceBranchName)",
            "sections": [
              {
                "facts": [
                  { "name": "Pipeline", "value": "$(Build.DefinitionName)" },
                  { "name": "Branch", "value": "$(environment)" },
                  { "name": "Build", "value": "$(Build.BuildNumber)" },
                  { "name": "Merged by", "value": "$(Build.RequestedFor)" },
                  { "name": "Deploy time", "value": "$DEPLOY_TIME" }
                ],
                "markdown": true
              }
            ]
          }
          EOF
          )

          curl -H "Content-Type: application/json" \
               -d "$payload" \
               $(URL_WEBHOOK_TEAMS)
        displayName: "📢 Post message to Teams"
        condition: succeeded()
