jobs:
  - job: deploy_flutter
    displayName: "🚀 deploy flutter"
    pool:
      name: "Azure Pipelines"
      vmImage: ubuntu-latest

    variables:
      - template: ../../variables/groups-variables-flutter.yml
        parameters:
          region: ${{ parameters.region }}
          environment_staging: ${{ parameters.environment_staging }}

    steps:
      - task: DownloadBuildArtifacts@0
        inputs:
          artifactName: "release"
          downloadPath: "$(Pipeline.Workspace)"
        displayName: "📥 Download Flutter Artifact"
        condition: succeeded()

      - task: DownloadBuildArtifacts@0
        inputs:
          artifactName: "versions"
          downloadPath: "$(Pipeline.Workspace)"
        displayName: "📥 Download Version"
        condition: succeeded()

      - task: Bash@3
        inputs:
          targetType: inline
          script: |
            set -e
            VERSION_FILE="$(Pipeline.Workspace)/versions/flutter/version.json"
            echo -e "\n📁 File: version.json"
            ls -la "$VERSION_FILE"
            cat "$VERSION_FILE"

            if [[ -f "$VERSION_FILE" ]]; then
              VERSION=$(jq -r '.version' $VERSION_FILE)
              echo -e "\n🚀 Versión detectada para $(Build.Repository.Name): $VERSION"
              echo "##vso[task.setvariable variable=version]$VERSION"
            else
              echo -e "\n##vso[task.logissue type=error]⚠️ No se encontro archivo de versión para $(Build.Repository.Name)"
              exit 99
            fi
        displayName: "📚 Read Version"
        condition: succeeded()

      - task: Bash@3
        inputs:
          targetType: inline
          script: |
            set -e
            CURRENT_BRANCH="$(Build.SourceBranchName)"
            case "$CURRENT_BRANCH" in 
              staging) environment="$environment_staging" ;;
              master) environment="$region" ;;
              *) environment="develop" ;;
            esac

            echo "##vso[task.setvariable variable=environment]$environment"
            echo -e "\nℹ️ Environment: $environment"
        displayName: "⚙️ Generate Environment"
        condition: succeeded()
        env:
          region: ${{ parameters.region }}
          environment_staging: ${{ parameters.environment_staging }}

      - task: Bash@3
        inputs:
          targetType: inline
          script: |
            set -e
            echo -e "\n📦 Cargando al Bucket S3..."
            APK_NAME="invictus-$(environment)-$(version).apk"
            BASE_PATH="$(Pipeline.Workspace)/release"

            echo "APK        : $APK_NAME"
            echo "Environment: $(environment)"

            echo -e "\n📁 Archivos a cargar:"
            ls -la $BASE_PATH/*

            aws s3 cp "$BASE_PATH/$APK_NAME" "s3://download-$(ACCOUNT_ID_INVICTUS)/apk/$APK_NAME"

            echo -e "\n✅ Archivos subidos exitosamente."
            echo "🔗 APK: $APK_NAME"
            echo -e "\n##[command]🔗 URL: https://download-$(ACCOUNT_ID_INVICTUS).s3.us-east-1.amazonaws.com/apk/$APK_NAME"
        displayName: "📤 Upload Bucket S3"
        condition: succeeded()
        env:
          AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)
          AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID_INVICTUS)
          AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY_INVICTUS)

      - task: Bash@3
        inputs:
          targetType: inline
          script: |
            set -e
            echo -e "\nℹ️ Enviando Mensaje a SQS..."
            echo "Cuenta : $(ACCOUNT_ID_INVICTUS)"
            echo "Version: $(version)"

            aws sqs send-message \
              --queue-url https://sqs.us-east-1.amazonaws.com/$(ACCOUNT_ID_INVICTUS)/DynamicStorage \
              --message-body '{
                "model": {
                  "parameterName": "VERSION-ANDROID",
                  "parameterDescription": "Parámetro que indica la versión actual Android.",
                  "parameterOrigin": "GLOBAL_PARAMETER",
                  "parameterValue": "$(version)"
                },
                "event": "setParameter"
              }' \
              --delay-seconds 0
        displayName: "📩 Send Message SQS"
        env:
          AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)
          AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID_INVICTUS)
          AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY_INVICTUS)

      - task: Bash@3
        inputs:
          targetType: inline
          script: |
            set -e
            DEPLOY_TIME=$(date -d "$BUILD_FINISHTIME -5 hours" "+%Y-%m-%d %I:%M %p")

            echo -e "\n📢 Generando notificación para Teams..."
            echo "Pipeline    : $(Build.DefinitionName)"
            echo "Environment : $(environment)"
            echo "Build       : $(Build.BuildNumber)"
            echo "User        : $(Build.RequestedFor)"
            echo "Deployed    : $DEPLOY_TIME"
            echo ""

            payload=$(cat <<EOF
            {
              "type":"message",
              "attachments":[{
                "contentType":"application/vnd.microsoft.card.adaptive",
                "content":{
                  "\$schema":"http://adaptivecards.io/schemas/adaptive-card.json",
                  "type":"AdaptiveCard",
                  "version":"1.5",
                  "body":[
                    {"type":"TextBlock","text":"✅ Despliegue exitoso","weight":"Bolder","size":"Large","color":"Good"},
                    {"type":"FactSet","facts":[
                      {"title":"Pipeline","value":"$(Build.DefinitionName)"},
                      {"title":"Environment","value":"$(environment)"},
                      {"title":"Build","value":"$(Build.BuildNumber)"},
                      {"title":"Usuario","value":"$(Build.RequestedFor)"},
                      {"title":"Deployed","value":"$DEPLOY_TIME"}
                    ]}
                  ],
                  "actions":[
                    {"type":"Action.OpenUrl","title":"🔍 Ver Pipeline","url":"$(System.TeamFoundationCollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)"}
                  ]
                }
              }]
            }
            EOF
            )

            curl --fail-with-body \
              -H "Content-Type: application/json" \
              -d "$payload" \
              "$(URL_WEBHOOK_TEAMS)"
        displayName: "📢 Post message to Teams"
        condition: succeeded()
