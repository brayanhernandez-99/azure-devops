jobs:
  - job: deploy_repository_configuration
    displayName: "🚀 deploy repository configuration"
    pool:
      name: "Azure Pipelines"
      vmImage: ubuntu-latest

    variables:
      - template: ../../variables/groups-variables-rpc.yml
        parameters:
          region: ${{ parameters.region }}
          environment_staging: ${{ parameters.environment_staging }}

    steps:
      - checkout: self
        fetchDepth: 0
        persistCredentials: true

      - task: Bash@3
        inputs:
          targetType: inline
          script: |
            set -e
            echo -e "\n📦 Cargando al Bucket S3..."
            ls -la

            echo ""
            aws s3 sync . s3://configuration-$(ACCOUNT_ID_INVICTUS) \
              --exclude ".git/*" \
              --exclude ".gitignore" \
              --exclude "pipeline/*"

            echo -e "\n✅ Se finalizo la carga al Bucket S3"
        displayName: "📤 Upload Configuration to S3"
        condition: succeeded()
        env:
          AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)
          AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID_INVICTUS)
          AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY_INVICTUS)

      - task: Bash@3
        inputs:
          targetType: inline
          script: |
            set -e
            echo "🔎 Verificando cambios en carpeta reports/..."

            if git diff --name-only HEAD~1 HEAD | grep -q "^reports/"; then 
              echo -e "\n✅ Se detectaron cambios en reports/ y no es develop, enviando mensaje a SQS"; 

              sqs_message='{
                "event": "migration",
                "streamNotifier": "Notifier",
                "model": {
                  "method": "insert",
                  "reports": [
                    {
                      "name": "modelos_invictus",
                      "type_card": "model"
                    },
                    {
                      "name": "reportes_invictus",
                      "type_card": "question"
                    },
                    {
                      "name": "archivos_cem",
                      "type_card": "question"
                    }
                  ]
                }
              }'

              echo ""
              echo "Mensaje a enviar:"
              echo "$sqs_message"
              
              aws sqs send-message \
                --queue-url https://sqs.us-east-1.amazonaws.com/$(ACCOUNT_ID_INVICTUS)/Sellers \
                --message-body "$sqs_message" \
                --delay-seconds 0
            else 
              echo -e "\nℹ️ No se enviará mensaje a SQS: no hubo cambios en reports/"
            fi
        displayName: "🔎 Verify Changes in reports/"
        condition: and(succeeded(), ne(variables['Build.SourceBranchName'], 'develop'))
        env:
          AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)
          AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID_INVICTUS)
          AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY_INVICTUS)

      - task: Bash@3
        inputs:
          targetType: inline
          script: |
            set -e
            DEPLOY_TIME=$(date -d "$BUILD_FINISHTIME -5 hours" "+%Y-%m-%d %I:%M %p")
            CURRENT_BRANCH="$(Build.SourceBranchName)"

            case "$CURRENT_BRANCH" in 
              staging) environment="$environment_staging" ;;
              master) environment="$region" ;;
              *) environment="develop" ;;
            esac

            echo -e "\n📢 Generando notificación para Teams..."
            echo "Pipeline    : $(Build.DefinitionName)"
            echo "Environment : $environment"
            echo "Build       : $(Build.BuildNumber)"
            echo "User        : $(Build.RequestedFor)"
            echo "Deployed    : $DEPLOY_TIME"
            echo ""

            payload=$(cat <<EOF
            {
              "type":"message",
              "attachments":[{
                "contentType":"application/vnd.microsoft.card.adaptive",
                "content":{
                  "\$schema":"http://adaptivecards.io/schemas/adaptive-card.json",
                  "type":"AdaptiveCard",
                  "version":"1.5",
                  "body":[
                    {"type":"TextBlock","text":"✅ Despliegue exitoso","weight":"Bolder","size":"Large","color":"Good"},
                    {"type":"FactSet","facts":[
                      {"title":"Pipeline","value":"$(Build.DefinitionName)"},
                      {"title":"Environment","value":"$environment"},
                      {"title":"Build","value":"$(Build.BuildNumber)"},
                      {"title":"Usuario","value":"$(Build.RequestedFor)"},
                      {"title":"Deployed","value":"$DEPLOY_TIME"}
                    ]}
                  ],
                  "actions":[
                    {"type":"Action.OpenUrl","title":"🔍 Ver Pipeline","url":"$(System.TeamFoundationCollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)"}
                  ]
                }
              }]
            }
            EOF
            )

            curl --fail-with-body \
              -H "Content-Type: application/json" \
              -d "$payload" \
              "$(URL_WEBHOOK_TEAMS)"
        displayName: "📢 Post message to Teams"
        condition: succeeded()
        env:
          region: ${{ parameters.region }}
          environment_staging: ${{ parameters.environment_staging }}
