jobs:
  - job: deploy_micro_frontend
    displayName: "🚀 deploy microfrontend"
    pool:
      name: "Azure Pipelines"
      VmImage: ubuntu-22.04

    variables:
      - template: ../../variables/groups-transversal-variables-frontend.yml
        parameters:
          region: ${{ parameters.region }}

    steps:
      - checkout: self
        fetchDepth: 0
        persistCredentials: true

      - task: DownloadBuildArtifacts@0
        inputs:
          artifactName: "versions"
          downloadPath: "$(Pipeline.Workspace)/versions-downloaded"
        displayName: "📥 Download Version"
        condition: succeeded()

      - script: |
          VERSION_FILE="$(Pipeline.Workspace)/versions-downloaded/versions/electron/version.json"
          if [[ -f "$VERSION_FILE" ]]; then
            VERSION=$(jq -r '.version' $VERSION_FILE)
            echo -e "\n🚀 Versión detectada para $(Build.Repository.Name): $VERSION"
            echo "##vso[task.setvariable variable=msVersion]$VERSION"
          else
            echo -e "\n##vso[task.logissue type=error]❌ No se encontro archivo de versión para $(Build.Repository.Name)"
            exit 99
          fi
        displayName: "📚 Read Version"
        condition: succeeded()

      - task: DownloadPipelineArtifact@2
        inputs:
          artifact: dists
          path: $(Pipeline.Workspace)/downloaded-dists
        displayName: "📥 Download Dists"
        condition: succeeded()







      - script: |
          set -e
          echo -e "\n📦 Cargando al Bucket S3..."

          BASE_PATH="$(Pipeline.Workspace)/electron-artifacts/electron/linux"
          echo -e "\n📂 Archivos a cargar: $BASE_PATH"
          ls -l "$BASE_PATH"

          aws s3 cp "$BASE_PATH" "s3://electron-app-$(ACCOUNT_ID_INVIC)/linux/" --recursive

          echo -e "\n✅ Archivos subidos exitosamente."
          echo "🔗 APP: InvictusUX-$(msVersion).AppImage"
          echo "🔗 URL: https://electron-app-$(ACCOUNT_ID_INVIC).s3.us-east-1.amazonaws.com/InvictusUX-$(msVersion).AppImage"

        displayName: "🐧 Upload Bucket S3 Linux"
        condition: succeeded()
        env:
          AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)
          AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID_INVIC)
          AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY_INVIC)

      - script: |
          set -e
          echo -e "\n📦 Cargando al Bucket S3..."

          BASE_PATH="$(Pipeline.Workspace)/electron-artifacts/electron/windows"
          echo -e "\n📂 Archivos a cargar: $BASE_PATH"
          ls -l "$BASE_PATH"

          aws s3 cp "$BASE_PATH" "s3://electron-app-$(ACCOUNT_ID_INVIC)/windows/" --recursive

          echo -e "\n✅ Archivos subidos exitosamente."
          echo "🔗 APP: InvictusUX Setup $(msVersion).exe"
          echo "🔗 URL: https://electron-app-$(ACCOUNT_ID_INVIC).s3.us-east-1.amazonaws.com/InvictusUX+Setup+$(msVersion).exe"

        displayName: "🖥️ Upload Bucket S3 Windows"
        condition: succeeded()
        env:
          AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)
          AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID_INVIC)
          AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY_INVIC)
