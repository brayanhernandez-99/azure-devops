jobs:
  - job: deploy_micro_frontend
    displayName: "🚀 deploy microfrontend"
    pool:
      name: "Azure Pipelines"
      VmImage: ubuntu-22.04

    variables:
      - template: ../../variables/groups-transversal-variables-frontend.yml
        parameters:
          region: ${{ parameters.region }}

    strategy:
      matrix:
        ${{ each ms in parameters.apps }}:
          ${{ ms }}:
            msName: ${{ ms }}

    steps:
      - script: |
          VERSION_FILE="$(Pipeline.Workspace)/versions-downloaded/versions/$(msName)/version.json"
          if [[ -f "$VERSION_FILE" ]]; then
            VERSION=$(jq -r '.version' $VERSION_FILE)
            echo -e "\n🚀 Versión detectada para $(msName): $VERSION"
            echo "##vso[task.setvariable variable=msVersion]$VERSION"
          else
            echo -e "\n##vso[task.logissue type=error]⚠️ No se encontró archivo de versión para: $(msName)"
            exit 99
          fi
        displayName: "📚 Read Version"
        condition: succeeded()

      - script: |
          if [[ "$(msName)" == "app-administration-vue2" || "$(msName)" == "app-sellers-vue2" ]]; then
            fileselect=app-legacy
            echo -e "\nℹ️ Ruta de archivo del micro frontend: $fileselect"
            echo "##vso[task.setvariable variable=file]$fileselect"
          else
            fileselect=apps
            echo -e "\nℹ️ Ruta de archivo del micro frontend: $fileselect"
            echo "##vso[task.setvariable variable=file]$fileselect"
          fi
        displayName: "📂 Select Directory"
        condition: succeeded()

      - task: DownloadPipelineArtifact@2
        inputs:
          artifact: dists
          path: $(Pipeline.Workspace)/downloaded-dists
        displayName: "📥 Download Dists"
        condition: succeeded()

      - script: |
          set -e
          echo -e "\n📦 Cargando al Bucket S3..."

          BASE_PATH="$(Pipeline.Workspace)/downloaded-dists/dists/$(region)/$(msName)"
          echo -e "\n📂 Archivos a cargar: $BASE_PATH"
          ls -l "$BASE_PATH"

          if [[ "$(msName)" == "app-administration-vue2" || "$(msName)" == "app-sellers-vue2" ]]; then
            msName=$(msName)
            msName=${msName%-vue2}
          else 
            msName=$(msName)
          fi

          aws s3 cp $BASE_PATH s3://mf-$msName-$(ACCOUNT_ID_INVIC)/$(msVersion)/ --recursive
        displayName: "📤 Upload Bucket S3"
        condition: succeeded()
        env:
          region: ${{ parameters.region }}

      - script: |
          CLOUDFRONT_VAR_NAME=$(echo "$(msName)" | tr '[:lower:]' '[:upper:]' | tr '-' '_')
          CLOUDFRONT_VAR_NAME=CLOUDFRONT_ID_$CLOUDFRONT_VAR_NAME
          CLOUDFRONT_ID="${!CLOUDFRONT_VAR_NAME}"

          echo -e "\nℹ️ CLOUDFRONT: $(msName)"
          echo "CLOUDFRONT_ID: $CLOUDFRONT_ID"
          echo "CLOUDFRONT_VAR_NAME: $CLOUDFRONT_VAR_NAME"

          if [[ -z "$CLOUDFRONT_ID" ]] || [[ -z "$CLOUDFRONT_VAR_NAME" ]]; then
            echo -e "\n##vso[task.logissue type=error]⚠️ CLOUDFRONT_ID o CLOUDFRONT_VAR_NAME no reconocidos"
            echo -e "##vso[task.logissue type=error]⚠️ CLOUDFRONT_ID: $CLOUDFRONT_ID"
            echo -e "##vso[task.logissue type=error]⚠️ CLOUDFRONT_VAR_NAME: $CLOUDFRONT_VAR_NAME"
            exit 99
          else
            echo "##vso[task.setvariable variable=CLOUDFRONT_ID]$CLOUDFRONT_ID"
          fi
        displayName: "📌 Set CloudFront ID"
        condition: succeeded()

      - script: |
          echo -e "\nℹ️ Obteniendo CloudFront Distribution para: $(CLOUDFRONT_ID)..."
          aws cloudfront get-distribution-config --id $(CLOUDFRONT_ID) --region $(AWS_DEFAULT_REGION) > $(CLOUDFRONT_ID).json

          echo -e "\n📂 Archivo: $(CLOUDFRONT_ID).json"
          cat $(CLOUDFRONT_ID).json
        displayName: "📡 Get CloudFront Distribution"
        env:
          AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID_INVIC)
          AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY_INVIC)
          AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)

      - script: |
          echo -e "\nℹ️ Insertando nueva versión en CloudFront Distribution: $(CLOUDFRONT_ID)..."
          echo -e "\nVersion a actualizar: $(msVersion)"

          jq --arg v "/$(msVersion)" '.DistributionConfig.Origins.Items[0].OriginPath = $v' "$(CLOUDFRONT_ID).json" > "new-$(CLOUDFRONT_ID).json"

          echo -e "\n📂 Archivo: new-$(CLOUDFRONT_ID).json"
          cat new-$(CLOUDFRONT_ID).json
        displayName: "🔖 Insert New Version"

      - script: |
          echo -e "\nℹ️ Actualizando CloudFront Distribution: $(CLOUDFRONT_ID)..."
          ETAG=$(jq -r '.ETag' $(CLOUDFRONT_ID).json)
          echo -e "\nCloudFront ETag: \n$ETAG"

          jq '.DistributionConfig' "new-$(CLOUDFRONT_ID).json" > "new-$(CLOUDFRONT_ID).json"
          echo -e "\n📂 Archivo: new-$(CLOUDFRONT_ID).json"
          cat new-$(CLOUDFRONT_ID).json

          aws cloudfront update-distribution --id $(CLOUDFRONT_ID) --region $AWS_DEFAULT_REGION --if-match "$ETAG" --distribution-config file://new-$(CLOUDFRONT_ID).json
        displayName: "🔄 Update CloudFront Distribution"
        env:
          AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID_INVIC)
          AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY_INVIC)
          AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)

      - script: |
          echo -e "\n⏳ Esperando que CloudFront Distribution $(CLOUDFRONT_ID) se propague..."

          while true; do
            STATUS=$(aws cloudfront get-distribution --id $(CLOUDFRONT_ID) --region $AWS_DEFAULT_REGION | jq -r '.Distribution.Status')
            echo "🔄 Estado actual: $STATUS"
            if [ "$STATUS" == "Deployed" ]; then
              echo -e "\n✅ CloudFront Distribution $(CLOUDFRONT_ID) propagada correctamente."
              break
            fi
            sleep 10
          done
        displayName: "⏳ Waiting for CloudFront propagation"
        env:
          AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID_INVIC)
          AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY_INVIC)
          AWS_DEFAULT_REGION: $(AWS_DEFAULT_REGION)

      - script: |
          echo -e "\n⏳ Esperando que CloudFront Distribution $(CLOUDFRONT_ID) invalide..."

          RESULT=$(aws cloudfront create-invalidation --distribution-id $(CLOUDFRONT_ID) --paths '/*')
          INVALIDATION=$(echo "$RESULT" | jq -r '.Invalidation.Id')

          echo -e "\n🆔 ID de invalidación: $INVALIDATION"
          echo "$RESULT"

          while true; do
            STATUS=$(aws cloudfront get-invalidation --distribution-id $(CLOUDFRONT_ID) --id "$INVALIDATION" --region $AWS_DEFAULT_REGION | jq -r '.Invalidation.Status')
            echo "🔄 Estado actual de la invalidación: $STATUS"
            if [ "$STATUS" == "Completed" ]; then
              echo -e "\n✅ Invalidacion $INVALIDATION completada con éxito."
              break
            fi
            sleep 10
          done
        displayName: "⏳ Waiting for invalidation Cache"
        env:
          AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID_INVIC)
          AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY_INVIC)
