jobs:
  - ${{ if eq(variables['Build.SourceBranchName'], 'master') }}:
      - ${{ if eq(parameters.region, 'antioquia') }}:
          - deployment: WaitForApprovalGana
            displayName: "🛡️ waiting approval"
            environment: "Deploy gana"
            pool:
              name: "Azure Pipelines"
              vmImage: ubuntu-latest
            strategy:
              runOnce:
                deploy:
                  steps:
                    - script: echo "✅ Aprobación recibida. Iniciando el despliegue..."
                      displayName: "🔓 Awaiting Approval"

      - deployment: WaitForApproval
        displayName: "🛡️ waiting approval"
        ${{ if eq(parameters.region, 'antioquia') }}:
          dependsOn: WaitForApprovalGana
        environment: "Deploy master"
        pool:
          name: "Azure Pipelines"
          vmImage: ubuntu-latest
        strategy:
          runOnce:
            deploy:
              steps:
                - script: echo "✅ Aprobación recibida. Iniciando el despliegue..."
                  displayName: "🔓 Awaiting Approval"

  #####################################################################

  - ${{ if eq(parameters.release, 'aws-s3') }}:
      - template: ./deploy/deploy-frontend.yml
        parameters:
          apps: ${{ parameters.apps }}
          region: ${{ parameters.region }}
          environment_staging: ${{ parameters.environment_staging }}

      - ${{ if eq(parameters.region, 'antioquia') }}:
          - template: ./tags/tag-version-frontend.yml

  #####################################################################

  - ${{ if eq(parameters.release, 'aws-ecs') }}:
      - template: ./deploy/deploy-backend.yml
        parameters:
          region: ${{ parameters.region }}
          environment_staging: ${{ parameters.environment_staging }}

      - ${{ if eq(parameters.region, 'antioquia') }}:
          - template: ./tags/tag-version-backend.yml

  #####################################################################

  - ${{ if eq(parameters.release, 'apk') }}:
      - template: ./deploy/deploy-flutter.yml
        parameters:
          region: ${{ parameters.region }}
          environment_staging: ${{ parameters.environment_staging }}

      - ${{ if eq(parameters.region, 'antioquia') }}:
          - template: ./tags/tag-version-flutter.yml

  #####################################################################

  - ${{ if eq(parameters.release, 'app') }}:
      - template: ./deploy/deploy-electron.yml
        parameters:
          region: ${{ parameters.region }}
          environment_staging: ${{ parameters.environment_staging }}

      - ${{ if eq(parameters.region, 'antioquia') }}:
          - template: ./tags/tag-version-electron.yml

  #####################################################################

  - ${{ if eq(parameters.release, 'rpc') }}:
      - template: ./deploy/deploy-repository-configuration.yml
        parameters:
          region: ${{ parameters.region }}
          environment_staging: ${{ parameters.environment_staging }}
