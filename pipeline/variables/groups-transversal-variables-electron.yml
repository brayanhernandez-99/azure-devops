variables:
  - group: trasversal-azure-devops
  - group: trasversal-aws-deployment
  - group: trasversal-versions-invictus

  # Develop - Feature - Hotfix branch
  - ${{ if or(startsWith(variables['Build.SourceBranch'], 'refs/heads/feature/'), startsWith(variables['Build.SourceBranch'], 'refs/heads/hotfix/')) }}:
        - group: trasversal-aws-developer 
        - group: variables-electron-developer

  - ${{ if eq(variables['Build.SourceBranchName'], 'develop') }}:
      
      - ${{ if eq(parameters.environments, 'develop') }}:
        - group: trasversal-aws-developer 
        - group: variables-electron-developer

      - ${{ if eq(parameters.environments, 'develop_new') }}:
        - group: trasversal-aws-develop
        - group: variables-electron-develop

  # Staging branch
  - ${{ if eq(variables['Build.SourceBranchName'], 'staging') }}:

      - ${{ if eq(parameters.environments, 'staging') }}:
        - group: trasversal-aws-qa
        - group: variables-electron-qa

      - ${{ if eq(parameters.environments, 'staging_new') }}:
        - group: trasversal-aws-staging
        - group: variables-electron-staging

      - ${{ if eq(parameters.environments, 'staging_nacional') }}:
        - group: trasversal-aws-staging-nacional
        - group: variables-electron-staging-nacional

  # Master branch → por red
  - ${{ if and(eq(parameters.region, 'antioquia'), eq(variables['Build.SourceBranchName'], 'master')) }}:
      - group: trasversal-aws-master-antioquia
      - group: variables-electron-master-antioquia-old

#   - ${{ if and(eq(parameters.region, 'antioquia_new'), eq(variables['Build.SourceBranchName'], 'master')) }}:
#       - group: trasversal-aws-antioquia
#       - group: variables-electron-antioquia-old

  - ${{ if and(eq(parameters.region, 'cap'), eq(variables['Build.SourceBranchName'], 'master')) }}:
      - group: trasversal-aws-antioquia-cap
      - group: variables-electron-antioquia-cap-old

  - ${{ if and(eq(parameters.region, 'tolima'), eq(variables['Build.SourceBranchName'], 'master')) }}:
      - group: trasversal-aws-tolima
      - group: variables-electron-tolima

  - ${{ if and(eq(parameters.region, 'huila'), eq(variables['Build.SourceBranchName'], 'master')) }}:
      - group: trasversal-aws-huila
      - group: variables-electron-huila

  - ${{ if and(eq(parameters.region, 'cauca'), eq(variables['Build.SourceBranchName'], 'master')) }}:
      - group: trasversal-aws-cauca
      - group: variables-electron-cauca

  - ${{ if and(eq(parameters.region, 'boyaca'), eq(variables['Build.SourceBranchName'], 'master')) }}:
      - group: trasversal-aws-boyaca
      - group: variables-electron-boyaca

  - ${{ if and(eq(parameters.region, 'santander'), eq(variables['Build.SourceBranchName'], 'master')) }}:
      - group: trasversal-aws-santander
      - group: variables-electron-santander

  - ${{ if and(eq(parameters.region, 'putumayo'), eq(variables['Build.SourceBranchName'], 'master')) }}:
      - group: trasversal-aws-putumayo
      - group: variables-electron-putumayo
