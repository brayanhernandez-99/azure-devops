variables:
  - group: trasversal-azure-devops
  - group: trasversal-aws-deployment
  - group: trasversal-versions-invictus
  - group: trasversal-microfrontend-vue2-old
  - group: trasversal-microfrontend-old

  ########################################DEPLOY UNICO AMBIENTE#####################################
#   # Develop - Feature - Hotfix branch
#   - ${{ if or(eq(variables['Build.SourceBranchName'], 'develop'), startsWith(variables['Build.SourceBranch'], 'refs/heads/feature/'), startsWith(variables['Build.SourceBranch'], 'refs/heads/hotfix/')) }}:
#       - group: trasversal-aws-develop
#       - group: variables-cloudfront-develop
#       - group: variables-microfrontend-vue2-develop-old
#       - group: variables-microfrontend-develop-old

#   # Staging branch
#   - ${{ if eq(variables['Build.SourceBranchName'], 'staging') }}:
#       - group: trasversal-aws-staging
#       - group: variables-cloudfront-staging
#       - group: variables-microfrontend-vue2-staging-old
#       - group: variables-microfrontend-staging-old


  ######################DEPLOY MULTI AMBIENTES#########################
  - ${{ if or(startsWith(variables['Build.SourceBranch'], 'refs/heads/feature/'), startsWith(variables['Build.SourceBranch'], 'refs/heads/hotfix/')) }}:
      - group: trasversal-aws-develop
      - group: variables-cloudfront-develop
      - group: variables-microfrontend-vue2-develop-old
      - group: variables-microfrontend-develop-old

  - ${{ if eq(variables['Build.SourceBranchName'], 'develop') }}:
      - ${{ if eq(parameters.environments, 'develop') }}:
            - group: trasversal-aws-developer
            - group: variables-cloudfront-developer
            - group: variables-microfrontend-vue2-developer-old
            - group: variables-microfrontend-developer-old

      - ${{ if eq(parameters.environments, 'develop_new') }}:
            - group: trasversal-aws-develop
            - group: variables-cloudfront-develop
            - group: variables-microfrontend-vue2-develop-old
            - group: variables-microfrontend-develop-old

  - ${{ if eq(variables['Build.SourceBranchName'], 'staging') }}:
      - ${{ if eq(parameters.environments, 'staging') }}:
            - group: trasversal-aws-qa
            - group: variables-cloudfront-qa
            - group: variables-microfrontend-vue2-qa-old
            - group: variables-microfrontend-qa-old

      - ${{ if eq(parameters.environments, 'staging_new') }}:
            - group: trasversal-aws-staging
            - group: variables-cloudfront-staging
            - group: variables-microfrontend-vue2-staging-old
            - group: variables-microfrontend-staging-old

  # Master branch → por red
  - ${{ if and(eq(parameters.region, 'antioquia'), eq(variables['Build.SourceBranchName'], 'master')) }}:
      - group: trasversal-aws-antioquia
      - group: variables-cloudfront-antioquia
      - group: variables-microfrontend-vue2-antioquia-old
      - group: variables-microfrontend-antioquia-old

  - ${{ if and(eq(parameters.region, 'cap'), eq(variables['Build.SourceBranchName'], 'master')) }}:
      - group: trasversal-aws-antioquia-cap
      - group: variables-cloudfront-antioquia-cap
      - group: variables-microfrontend-vue2-antioquia-cap-old
      - group: variables-microfrontend-antioquia-cap-old

  - ${{ if and(eq(parameters.region, 'tolima'), eq(variables['Build.SourceBranchName'], 'master')) }}:
      - group: trasversal-aws-tolima
      - group: variables-cloudfront-tolima
      - group: variables-microfrontend-vue2-tolima-old
      - group: variables-microfrontend-tolima-old

  - ${{ if and(eq(parameters.region, 'huila'), eq(variables['Build.SourceBranchName'], 'master')) }}:
      - group: trasversal-aws-huila
      - group: variables-cloudfront-huila
      - group: variables-microfrontend-vue2-huila-old
      - group: variables-microfrontend-huila-old

  - ${{ if and(eq(parameters.region, 'cauca'), eq(variables['Build.SourceBranchName'], 'master')) }}:
      - group: trasversal-aws-cauca
      - group: variables-cloudfront-cauca
      - group: variables-microfrontend-vue2-cauca-old
      - group: variables-microfrontend-cauca-old

  - ${{ if and(eq(parameters.region, 'boyaca'), eq(variables['Build.SourceBranchName'], 'master')) }}:
      - group: trasversal-aws-boyaca
      - group: variables-cloudfront-boyaca
      - group: variables-microfrontend-vue2-boyaca-old
      - group: variables-microfrontend-boyaca-old

  - ${{ if and(eq(parameters.region, 'santander'), eq(variables['Build.SourceBranchName'], 'master')) }}:
      - group: trasversal-aws-santander
      - group: variables-cloudfront-santander
      - group: variables-microfrontend-vue2-santander-old
      - group: variables-microfrontend-santander-old

  - ${{ if and(eq(parameters.region, 'putumayo'), eq(variables['Build.SourceBranchName'], 'master')) }}:
      - group: trasversal-aws-putumayo
      - group: variables-cloudfront-putumayo
      - group: variables-microfrontend-vue2-putumayo-old
      - group: variables-microfrontend-putumayo-old