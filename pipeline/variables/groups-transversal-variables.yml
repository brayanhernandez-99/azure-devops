variables:
  - group: trasversal-aws-deployment
  - group: trasversal-azure-devops
  - group: trasversal-versions-invictus
  
  # Feature branch
  - ${{ if or( startsWith(variables['Build.SourceBranch'], 'refs/heads/feature'), startsWith(variables['Build.SourceBranch'], 'refs/heads/hotfix')) }}:
      - group: variables-flutter-develop
      - group: trasversal-electron-develop
      - group: transversal-app-administration-vue2-develop
      - group: transversal-app-sellers-vue2-develop
      - group: transversal-app-invictus-microfrontend-develop
      - group: trasversal-aws-devops
      - group: transversal-app-cloudFront-devops

  # Develop branch
  - ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/develop') }}:
      - group: trasversal-aws-developer
      - group: variables-flutter-develop
      - group: trasversal-electron-develop
    #   - group: trasversal-aws-devops
      - group: transversal-app-cloudFront-devops
      - group: transversal-app-administration-vue2-develop
      - group: transversal-app-sellers-vue2-develop
      - group: transversal-app-invictus-microfrontend-develop
      # - group: transversal-app-cloudFront-develop

  # Staging branch
  - ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/staging') }}:
      - group: trasversal-aws-qa
      - group: variables-flutter-qa
      - group: trasversal-electron-develop
    #   - group: trasversal-aws-devops
      - group: transversal-app-cloudFront-devops
      - group: transversal-app-administration-vue2-qa
      - group: transversal-app-sellers-vue2-qa
      - group: transversal-app-invictus-microfrontend-qa
      # - group: transversal-app-cloudFront-qa

  # Master or tags → por red
  - ${{ if and(or(in(variables['Build.SourceBranchName'], 'master'), startsWith(variables['Build.SourceBranch'], 'refs/tags/')), eq(parameters.red, 'antioquia')) }}:
      # - group: trasversal-aws-master-antioquia
      - group: variables-flutter-master-antioquia
      - group: trasversal-electron-develop
      - group: trasversal-aws-devops
      - group: transversal-app-cloudFront-devops
      - group: transversal-app-administration-vue2-master-antioquia
      - group: transversal-app-sellers-vue2-master-antioquia
      - group: transversal-app-invictus-microfrontend-master-antioquia
      # - group: transversal-app-cloudFront-master-antioquia

  - ${{ if and(or(in(variables['Build.SourceBranchName'], 'master'), startsWith(variables['Build.SourceBranch'], 'refs/tags/')), eq(parameters.red, 'cap')) }}:
      # - group: trasversal-aws-master-cap
      - group: variables-flutter-master-cap
      - group: trasversal-electron-develop
      - group: trasversal-aws-devops
      - group: transversal-app-cloudFront-devops
      - group: transversal-app-administration-vue2-master-cap
      - group: transversal-app-sellers-vue2-master-cap
      - group: transversal-app-invictus-microfrontend-master-cap
      # - group: transversal-app-cloudFront-master-cap

  - ${{ if and(or(in(variables['Build.SourceBranchName'], 'master'), startsWith(variables['Build.SourceBranch'], 'refs/tags/')), eq(parameters.red, 'tolima')) }}:
      # - group: trasversal-aws-master-tolima
      - group: variables-flutter-master-tolima
      - group: trasversal-electron-develop
      - group: trasversal-aws-devops
      - group: transversal-app-cloudFront-devops
      - group: transversal-app-sellers-vue2-master-tolima
      - group: transversal-app-administration-vue2-master-tolima
      - group: transversal-app-invictus-microfrontend-master-tolima
      # - group: transversal-app-cloudFront-master-tolima

  - ${{ if and(or(in(variables['Build.SourceBranchName'], 'master'), startsWith(variables['Build.SourceBranch'], 'refs/tags/')), eq(parameters.red, 'huila')) }}:
      # - group: trasversal-aws-master-huila
      - group: variables-flutter-master-huila
      - group: trasversal-electron-develop
      - group: trasversal-aws-devops
      - group: transversal-app-cloudFront-devops
      - group: transversal-app-administration-vue2-master-huila
      - group: transversal-app-sellers-vue2-master-huila
      - group: transversal-app-invictus-microfrontend-master-huila
      # - group: transversal-app-cloudFront-master-huila

  - ${{ if and(or(in(variables['Build.SourceBranchName'], 'master'), startsWith(variables['Build.SourceBranch'], 'refs/tags/')), eq(parameters.red, 'cauca')) }}:
      # - group: trasversal-aws-master-cauca
      - group: variables-flutter-master-cauca
      - group: trasversal-electron-develop
      - group: trasversal-aws-devops
      - group: transversal-app-cloudFront-devops
      - group: transversal-app-administration-vue2-master-cauca
      - group: transversal-app-sellers-vue2-master-cauca
      - group: transversal-app-invictus-microfrontend-master-cauca
      # - group: transversal-app-cloudFront-master-cauca

  - ${{ if and(or(in(variables['Build.SourceBranchName'], 'master'), startsWith(variables['Build.SourceBranch'], 'refs/tags/')), eq(parameters.red, 'boyaca')) }}:
      # - group: trasversal-aws-master-boyaca
      - group: variables-flutter-master-boyaca
      - group: trasversal-electron-develop
      - group: trasversal-aws-devops
      - group: transversal-app-cloudFront-devops
      - group: transversal-app-administration-vue2-master-boyaca
      - group: transversal-app-sellers-vue2-master-boyaca
      - group: transversal-app-invictus-microfrontend-master-boyaca
      # - group: transversal-app-cloudFront-master-boyaca

