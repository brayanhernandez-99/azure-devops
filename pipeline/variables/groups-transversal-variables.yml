variables:
  - group: trasversal-aws-deployment

  - ${{ if and(eq(parameters.release, 'ecs-new'), eq(variables['Build.SourceBranchName'], 'develop')) }}:
      - group: trasversal-aws-develop

  - ${{ if and(eq(parameters.release, 'ecs-new'), eq(variables['Build.SourceBranchName'], 'staging')) }}:
      - group: trasversal-aws-staging

  - ${{ if and(eq(parameters.release, 'ecs-new'), eq(variables['Build.SourceBranchName'], 'master')) }}:
      - group: trasversal-aws-antioquia-cap

  - ${{ if and(eq(parameters.release, 'ecs-old'), eq(variables['Build.SourceBranchName'], 'develop')) }}:
      - group: trasversal-aws-developer

  - ${{ if and(eq(parameters.release, 'ecs-old'), eq(variables['Build.SourceBranchName'], 'staging')) }}:
      - group: trasversal-aws-qa
