variables:
  - group: trasversal-aws-deployment
  - group: trasversal-azure-devops
  - group: trasversal-versions-invictus

  # Develop - Feature - Hotfix
  - ${{ if or(eq(variables['Build.SourceBranchName'], 'develop'), startsWith(variables['Build.SourceBranch'], 'refs/heads/feature/'), startsWith(variables['Build.SourceBranch'], 'refs/heads/hotfix/')) }}:
      - group: trasversal-aws-develop
      - group: variables-app-cloudFront-develop
      - group: variables-app-administration-vue2-develop
      - group: variables-app-sellers-vue2-develop
      - group: variables-app-invictus-microfrontend-develop
      - group: variables-app-invictus-microservices-develop

  # Staging
  - ${{ if eq(variables['Build.SourceBranchName'], 'staging') }}:
      - group: trasversal-aws-staging
      - group: variables-app-cloudFront-staging
      - group: variables-app-administration-vue2-staging
      - group: variables-app-sellers-vue2-staging
      - group: variables-app-invictus-microfrontend-staging
      - group: variables-app-invictus-microservices-staging

  # Master or tags → por red
  - ${{ if and(eq(parameters.red, 'antioquia'), eq(variables['Build.SourceBranchName'], 'master')) }}:
      - group: trasversal-aws-devops
    #   - group: trasversal-aws-master-antioquia
    #   - group: transversal-app-cloudFront-master-antioquia
    #   - group: transversal-app-administration-vue2-master-antioquia
    #   - group: transversal-app-sellers-vue2-master-antioquia
    #   - group: transversal-app-invictus-microfrontend-master-antioquia

  - ${{ if and(eq(parameters.red, 'cap'), eq(variables['Build.SourceBranchName'], 'master')) }}:
      - group: trasversal-aws-devops
