    #   - group: transversal-app-cloudFront-master-cap
    #   - group: transversal-app-administration-vue2-master-cap
    #   - group: transversal-app-sellers-vue2-master-cap
    #   - group: transversal-app-invictus-microfrontend-master-cap

  - ${{ if and(eq(parameters.red, 'tolima'), eq(variables['Build.SourceBranchName'], 'master')) }}:
      - group: trasversal-aws-devops
