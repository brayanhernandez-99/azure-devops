variables:
  - group: trasversal-aws-deployment
  - group: trasversal-azure-devops
  - group: trasversal-versions-invictus

  # Develop - Feature - Hotfix branch
  - ${{ if or(startsWith(variables['Build.SourceBranch'], 'refs/heads/develop'), startsWith(variables['Build.SourceBranch'], 'refs/heads/feature'), eq(variables['Build.SourceBranch'], 'refs/heads/hotfix')) }}:
      - group: trasversal-aws-develop
      - group: variables-app-cloudFront-develop
      - group: variables-app-administration-vue2-develop
      - group: variables-app-sellers-vue2-develop
      - group: variables-app-invictus-microfrontend-develop
      - group: variables-app-invictus-microservices-develop

  # Staging branch
  - ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/staging') }}:
      - group: trasversal-aws-staging
      - group: variables-app-cloudFront-staging
      - group: variables-app-administration-vue2-staging
      - group: variables-app-sellers-vue2-staging
      - group: variables-app-invictus-microfrontend-staging
      - group: variables-app-invictus-microservices-staging

  # Master or tags → por red
  - ${{ if and(or(in(variables['Build.SourceBranchName'], 'master'), startsWith(variables['Build.SourceBranch'], 'refs/tags/')), eq(parameters.red, 'antioquia')) }}:
      - group: trasversal-aws-devops
    #   - group: trasversal-aws-master-antioquia
    #   - group: transversal-app-cloudFront-master-antioquia
    #   - group: transversal-app-administration-vue2-master-antioquia
    #   - group: transversal-app-sellers-vue2-master-antioquia
    #   - group: transversal-app-invictus-microfrontend-master-antioquia

  - ${{ if and(or(in(variables['Build.SourceBranchName'], 'master'), startsWith(variables['Build.SourceBranch'], 'refs/tags/')), eq(parameters.red, 'cap')) }}:
      - group: trasversal-aws-devops
    #   - group: trasversal-aws-master-cap
    #   - group: transversal-app-cloudFront-master-cap
    #   - group: transversal-app-administration-vue2-master-cap
    #   - group: transversal-app-sellers-vue2-master-cap
    #   - group: transversal-app-invictus-microfrontend-master-cap

  - ${{ if and(or(in(variables['Build.SourceBranchName'], 'master'), startsWith(variables['Build.SourceBranch'], 'refs/tags/')), eq(parameters.red, 'tolima')) }}:
      - group: trasversal-aws-devops
    #   - group: trasversal-aws-master-tolima
    #   - group: transversal-app-cloudFront-master-tolima
    #   - group: transversal-app-administration-vue2-master-tolima
    #   - group: transversal-app-sellers-vue2-master-tolima
    #   - group: transversal-app-invictus-microfrontend-master-tolima

  - ${{ if and(or(in(variables['Build.SourceBranchName'], 'master'), startsWith(variables['Build.SourceBranch'], 'refs/tags/')), eq(parameters.red, 'huila')) }}:
      - group: trasversal-aws-devops
