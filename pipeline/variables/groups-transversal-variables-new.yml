    #   - group: transversal-app-cloudFront-master-huila
    #   - group: transversal-app-administration-vue2-master-huila
    #   - group: transversal-app-sellers-vue2-master-huila
    #   - group: transversal-app-invictus-microfrontend-master-huila

  - ${{ if and(or(in(variables['Build.SourceBranchName'], 'master'), startsWith(variables['Build.SourceBranch'], 'refs/tags/')), eq(parameters.red, 'cauca')) }}:
      - group: trasversal-aws-devops
