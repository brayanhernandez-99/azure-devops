variables:
  - group: trasversal-aws-deployment
  - group: trasversal-azure-devops
  - group: trasversal-versions-invictus
  - group: trasversal-flutter-keystore

  # Develop or Feature branch
  - ${{ if or( startsWith(variables['Build.SourceBranch'], 'refs/heads/feature'), startsWith(variables['Build.SourceBranch'], 'refs/heads/develop')) }}:
      - group: trasversal-aws-developer
      - group: variables-flutter-develop

  # Staging branch
  - ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/staging') }}:
      - group: trasversal-aws-qa
      - group: variables-flutter-staging

  # Master or tags → por red
  - ${{ if and(or(in(variables['Build.SourceBranchName'], 'master'), startsWith(variables['Build.SourceBranch'], 'refs/tags/')), eq(parameters.red, 'antioquia')) }}:
      - group: trasversal-aws-master-antioquia
      - group: variables-flutter-antioquia

  - ${{ if and(or(in(variables['Build.SourceBranchName'], 'master'), startsWith(variables['Build.SourceBranch'], 'refs/tags/')), eq(parameters.red, 'cap')) }}:
      - group: trasversal-aws-master-cap
      - group: variables-flutter-cap

  - ${{ if and(or(in(variables['Build.SourceBranchName'], 'master'), startsWith(variables['Build.SourceBranch'], 'refs/tags/')), eq(parameters.red, 'tolima')) }}:
      - group: trasversal-aws-master-tolima
      - group: variables-flutter-tolima

  - ${{ if and(or(in(variables['Build.SourceBranchName'], 'master'), startsWith(variables['Build.SourceBranch'], 'refs/tags/')), eq(parameters.red, 'huila')) }}:
      - group: trasversal-aws-master-huila
      - group: variables-flutter-huila

  - ${{ if and(or(in(variables['Build.SourceBranchName'], 'master'), startsWith(variables['Build.SourceBranch'], 'refs/tags/')), eq(parameters.red, 'cauca')) }}:
      - group: trasversal-aws-master-cauca
      - group: variables-flutter-cauca

  - ${{ if and(or(in(variables['Build.SourceBranchName'], 'master'), startsWith(variables['Build.SourceBranch'], 'refs/tags/')), eq(parameters.red, 'boyaca')) }}:
      - group: trasversal-aws-master-boyaca
      - group: variables-flutter-boyaca
