variables:
  - group: trasversal-azure-devops
  - group: trasversal-aws-deployment
  - group: trasversal-infrastructure-invictus

  # Feature branches
  - ${{ if or(eq(variables['Build.SourceBranchName'], 'develop'), startsWith(variables['Build.SourceBranch'], 'refs/heads/feature/')) }}:
    - group: trasversal-aws-develop
    - group: infrastructure-develop
    - group: cloudfront-infrastructure-develop
    - group: parameters-infrastructure-develop
    - group: secrets-infrastructure-develop
    - group: autoscaling-infrastructure-develop
    - group: ftp-infrastructure-develop

  - ${{ if eq(variables['Build.SourceBranchName'], 'staging') }}:
    - group: trasversal-aws-staging
    - group: infrastructure-staging
    - group: cloudfront-infrastructure-staging
    - group: parameters-infrastructure-staging
    - group: secrets-infrastructure-staging
    - group: autoscaling-infrastructure-staging
    - group: ftp-infrastructure-staging

  # Master branch → por región
  - ${{ if and(eq(parameters.region, 'antioquia'), eq(variables['Build.SourceBranchName'], 'master')) }}:
    - group: trasversal-aws-antioquia
    - group: infrastructure-antioquia
    - group: cloudfront-infrastructure-antioquia
    - group: parameters-infrastructure-antioquia
    - group: secrets-infrastructure-antioquia
    - group: autoscaling-infrastructure-antioquia

  - ${{ if and(eq(parameters.region, 'cap'), eq(variables['Build.SourceBranchName'], 'master')) }}:
    - group: trasversal-aws-antioquia-cap
    - group: infrastructure-antioquia-cap
    - group: cloudfront-infrastructure-antioquia-cap
    - group: parameters-infrastructure-antioquia-cap
    - group: secrets-infrastructure-antioquia-cap
    - group: autoscaling-infrastructure-antioquia-cap

  - ${{ if and(eq(parameters.region, 'tolima'), eq(variables['Build.SourceBranchName'], 'master')) }}:
    - group: trasversal-aws-tolima
    - group: infrastructure-tolima
    - group: cloudfront-infrastructure-tolima
    - group: parameters-infrastructure-tolima
    - group: secrets-infrastructure-tolima
    - group: autoscaling-infrastructure-tolima

  - ${{ if and(eq(parameters.region, 'huila'), eq(variables['Build.SourceBranchName'], 'master')) }}:
    - group: trasversal-aws-huila
    - group: infrastructure-huila
    - group: cloudfront-infrastructure-huila
    - group: parameters-infrastructure-huila
    - group: secrets-infrastructure-huila
    - group: autoscaling-infrastructure-huila

  - ${{ if and(eq(parameters.region, 'cauca'), eq(variables['Build.SourceBranchName'], 'master')) }}:
    - group: trasversal-aws-cauca
    - group: infrastructure-cauca
    - group: cloudfront-infrastructure-cauca
    - group: parameters-infrastructure-cauca
    - group: secrets-infrastructure-cauca
    - group: autoscaling-infrastructure-cauca

  - ${{ if and(eq(parameters.region, 'boyaca'), eq(variables['Build.SourceBranchName'], 'master')) }}:
    - group: trasversal-aws-boyaca
    - group: infrastructure-boyaca
    - group: cloudfront-infrastructure-boyaca
    - group: parameters-infrastructure-boyaca
    - group: secrets-infrastructure-boyaca
    - group: autoscaling-infrastructure-boyaca

  - ${{ if and(eq(parameters.region, 'santander'), eq(variables['Build.SourceBranchName'], 'master')) }}:
    - group: trasversal-aws-santander
    - group: infrastructure-santander
    - group: cloudfront-infrastructure-santander
    - group: parameters-infrastructure-santander
    - group: secrets-infrastructure-santander
    - group: autoscaling-infrastructure-santander
    
  - ${{ if and(eq(parameters.region, 'putumayo'), eq(variables['Build.SourceBranchName'], 'master')) }}:
    - group: trasversal-aws-putumayo
    - group: infrastructure-putumayo
    - group: cloudfront-infrastructure-putumayo
    - group: parameters-infrastructure-putumayo
    - group: secrets-infrastructure-putumayo
    - group: autoscaling-infrastructure-putumayo