variables:
  - group: trasversal-aws-deployment
  - group: trasversal-infrastructure-invictus

  - ${{ if or( startsWith(variables['Build.SourceBranch'], 'refs/heads/feature'), startsWith(variables['Build.SourceBranch'], 'refs/heads/develop')) }}:
      - group: trasversal-aws-develop
      - group: variables-infrastructure-develop
      - group: parameters-infrastructure-develop
      - group: secrets-infrastructure-develop

  - ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/feature/staging') }}:
      - group: trasversal-aws-staging
      - group: variables-infrastructure-staging
      - group: parameters-infrastructure-staging
      - group: secrets-infrastructure-staging
      
