variables:
  - group: trasversal-aws-deployment

  # ANTIOQUIA
  - ${{ if and(eq(parameters.red, 'antioquia'), in(variables['Build.SourceBranchName'], 'master')) }}:
      - group: trasversal-aws-antioquia

  # CAP
  - ${{ if and(eq(parameters.red, 'cap'), in(variables['Build.SourceBranchName'], 'master')) }}:
      - group: trasversal-aws-antioquia-cap

  # TOLIMA
  - ${{ if and(eq(parameters.red, 'tolima'), in(variables['Build.SourceBranchName'], 'master')) }}:
      - group: trasversal-aws-tolima

  # HUILA
  - ${{ if and(eq(parameters.red, 'huila'), in(variables['Build.SourceBranchName'], 'master')) }}:
      - group: trasversal-aws-huila

  # CAUCA
  - ${{ if and(eq(parameters.red, 'cauca'), in(variables['Build.SourceBranchName'], 'master')) }}:
      - group: trasversal-aws-cauca

  # BOYACÁ
  - ${{ if and(eq(parameters.red, 'boyaca'), in(variables['Build.SourceBranchName'], 'master')) }}:
      - group: trasversal-aws-boyaca

  # SANTANDER
  - ${{ if and(eq(parameters.red, 'santander'), in(variables['Build.SourceBranchName'], 'master')) }}:
      - group: trasversal-aws-santander
