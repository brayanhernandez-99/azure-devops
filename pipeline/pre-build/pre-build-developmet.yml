stages:
  - stage: "change_file_detected"
    displayName: "Change File Detected"
    dependsOn: []

    variables:
      - template: ../variables/groups-transversal-variables.yml

    jobs:
      - ${{ if eq(parameters.type, 'backend') }}:
          - template: jobs/changes-file-backend.yml
            parameters:
              language: nodejs
              release: aws-ecs

      - ${{ if eq(parameters.type, 'frontend') }}:
          - template: jobs/changes-file-frontend.yml
            parameters:
              language: nodejsFront
              release: aws-s3
