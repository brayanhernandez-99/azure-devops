stages:
  - stage: "change_file_detected"
    displayName: "Change File Detected"
    dependsOn: []

    variables:
      - template: ../variables/groups-transversal-variables.yml

    jobs:
      - ${{ if eq(parameters.type, 'back') }}:
          - template: jobs/changes-file.yml

      - ${{ if eq(parameters.type, 'front') }}:
          - template: jobs/changes-file-front.yml
