    - script: |
          # Variables iniciales
          cd $(Build.SourcesDirectory)
          raw_branch=$(Build.SourceBranch)
          clean_branch=$(echo "$raw_branch" | sed 's#refs/heads/##')

          # Configurar git (necesario para pipelines de Azure)
          git config user.name "pipeline"
          git config user.email "pipelineUX@ux.technology"

          # Asegurar última versión del branch con rebase
          git checkout $clean_branch
          git pull --rebase origin $clean_branch

          # Detectar cambios desde remoto (comparando con HEAD)
          changed_files=$(git diff --name-only origin/$clean_branch..HEAD)

          # Detectar si hubo cambios en packages
          packages_changed=$(echo "$changed_files" | grep "^packages/" || true)

          if [[ -n "$packages_changed" ]]; then
              echo "📦 Cambios en packages detectados. Incluyendo todas las apps."

              # Incluir todas las apps de apps/ y app-legacy/
              apps=$(find apps app-legacy -mindepth 1 -maxdepth 1 -type d | sed -E 's|^apps/||; s|^app-legacy/||' | sort -u)
          else
              echo "🔍 Detectando cambios en apps/ y app-legacy/..."

              apps=$(echo "$changed_files" | \
                  grep -E "^apps/|^app-legacy/" | \
                  cut -d '/' -f1,2 | \
                  sed -E 's|^apps/||; s|^app-legacy/||' | \
                  sort -u)
          fi

          echo "🧩 Apps detectadas modificadas:"
          echo "$apps"

          if [[ -z "$apps" ]]; then
              echo "❌ No se detectaron cambios en apps, app-legacy o packages. Cancelando ejecución."
              exit 1
          fi

          # Construir bloque YAML
          cd $(Build.SourcesDirectory)/pipeline

          apps_yaml="    apps:\n"
          for app in $apps; do
            apps_yaml+="      - $app\n"
          done

          # Reemplazar el bloque apps: en main-pipeline.yml
          awk -v newapps="$apps_yaml" '
            BEGIN {inside=0}
            /^    apps:/ {inside=1; print newapps; next}
            inside && /^[^ ]/ {inside=0}
            !inside
          ' main-pipeline.yml > main-pipeline-updated.yml

          mv main-pipeline-updated.yml main-pipeline.yml

          echo "📝 Contenido actualizado de main-pipeline.yml:"
          cat main-pipeline.yml

          # Commit y push de los cambios
          git add main-pipeline.yml
          git commit -m "Auto-generated pipeline config ${BUILD_BUILDID}"
          git push origin $clean_branch

          echo "✅ Cambios subidos correctamente"

      name: DetectChangedMS
    
    - script: az devops configure --defaults organization='$(System.TeamFoundationCollectionUri)' project='$(System.TeamProject)' --use-git-aliases true
      displayName: 'Set default Azure DevOps organization and project'

    - script: |
          echo ${AZURE_DEVOPS_CLI_PAT} | az devops login --organization https://dev.azure.com/ux-technology
          echo $(Build.SourceBranch)
          az pipelines run --name "$(Build.Repository.Name)" \
            --branch "$(Build.SourceBranch)" \
            --project "$(System.TeamProject)" \
            --org "https://dev.azure.com/ux-technology"
      env:
        AZURE_DEVOPS_CLI_PAT: $(PAT-AZ)
      displayName: 'Trigger pipeline'