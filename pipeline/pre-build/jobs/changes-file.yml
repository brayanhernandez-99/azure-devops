    #   name: DetectChangedMS

    - script: |
        CURRENT_BRANCH=$(echo $(Build.SourceBranch))
        
        if [[ "$CURRENT_BRANCH" == refs/heads/feature/* ]]; then

          cd $(Build.SourcesDirectory)
          last_real_commit=$(git log --no-merges --pretty=format:%H -n 2 | tail -n1)
          changed_files=$(git diff --name-only $last_real_commit HEAD)
          apps=$(echo "$changed_files" | grep "^apps/" | cut -d '/' -f2 | sort -u)
        
        else
          cd $(Build.SourcesDirectory)/apps
          apps=$(git diff --name-only HEAD~1 HEAD | grep "^apps/" | cut -d '/' -f2 | sort -u)
        if

        echo "🔍 Apps modificadas detectadas:"
        echo "$apps"

        if [ -z "$apps" ]; then
          echo "❌ No se detectaron cambios en apps. Cancelando ejecución del pipeline."
          exit 1
        fi
        
        cd $(Build.SourcesDirectory)/pipeline

        apps_yaml="    apps:\n"
        for app in $apps; do
          apps_yaml+="      - $app\n"
        done

        # Reemplazar el bloque `apps:` en main-pipeline.yml
        awk -v newapps="$apps_yaml" '
          BEGIN {inside=0}
          /^    apps:/ {inside=1; print newapps; next}
          inside && /^[^ ]/ {inside=0}
          !inside
        ' main-pipeline.yml > main-pipeline-updated.yml

        mv main-pipeline-updated.yml main-pipeline.yml

        cat main-pipeline.yml
        raw_branch=$(Build.SourceBranch)
        clean_branch=$(echo "$raw_branch" | sed 's#refs/heads/##')

        git checkout $clean_branch
        git config user.name "pipeline"
        git config user.email "pipelineUX@ux.technology"
        git add main-pipeline.yml
        git commit -m "Auto-generated pipeline config ${BUILD_BUILDID}"
        git push origin $clean_branch

      name: DetectChangedMS
    
    - script: az devops configure --defaults organization='$(System.TeamFoundationCollectionUri)' project='$(System.TeamProject)' --use-git-aliases true
      displayName: 'Set default Azure DevOps organization and project'

    - script: |
          echo ${AZURE_DEVOPS_CLI_PAT} | az devops login --organization https://dev.azure.com/ux-technology
          echo $(Build.SourceBranch)
          az pipelines run --name "$(Build.Repository.Name)" \
            --branch "$(Build.SourceBranch)" \
            --project "$(System.TeamProject)" \
            --org "https://dev.azure.com/ux-technology"
      env:
        AZURE_DEVOPS_CLI_PAT: $(PAT-AZ)
      displayName: 'Trigger pipeline'