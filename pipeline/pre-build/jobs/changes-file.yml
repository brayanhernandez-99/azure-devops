jobs:
- job: 'change_file'
  displayName: 'Change File'
  pool:
    name: 'Azure Pipelines'
    VmImage: ubuntu-22.04
  steps:
    - checkout: self
      fetchDepth: 0
  
    - script: |
        cd $(Build.SourcesDirectory)/apps
        last_commit=$(git log --pretty=format:"%H" -- apps/ | grep -v "$(git log -1 --pretty=format:%H -- main-pipeline.yml)" | head -1)
        # apps=$(git diff --name-only HEAD~1 HEAD | grep "^apps/" | cut -d '/' -f2 | sort -u)
        apps=$(git diff --name-only $last_commit HEAD | grep "^apps/" | cut -d '/' -f2 | sort -u)
        echo $apps

